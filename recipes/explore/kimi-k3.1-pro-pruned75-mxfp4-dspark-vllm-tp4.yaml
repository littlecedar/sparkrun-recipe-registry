recipe_version: "2"
model: vllm-project/Kimi-K3.1-Pro-pruned75
model_revision: fc72e5a1dd8819cf722fee249bb166c4cbc8ba38
runtime: vllm
# Same pinned nightly as the plain sibling; see that recipe's engine gate.
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly@sha256:98a2535b5fa227e529f25ed376751b41d8f707200c81fac82d327a9deee93b15
min_nodes: 4
max_nodes: 4

description: >-
  Second Kimi arm: the plain pruned75 body (see
  kimi-k3.1-pro-pruned75-mxfp4-vllm-tp4.yaml for sizing, engine gate and quality caveat)
  plus LithosAI/Kimi-K3.1-Pro-DSpark as a vLLM `dspark` speculator, pinned in
  `defaults.speculative_config` so sparkrun distributes the draft with its own
  revision. The draft is a 2.25 B BF16 head (4.50 GB), 5 dense GQA layers that read
  target hidden states of layers 7/23/67/83/91 and share the target's embedding and
  LM head; the card reports mean acceptance length 3.448 at verify width 8 over ten
  public suites. ATTEMPTED 2026-11-08: the 07:46 boot stopped in `SpeculativeConfig`
  with `Invalid repository ID or local directory specified: 'LithosAI/Kimi-K3.1-Pro-DSpark'`
  (HF_HUB_OFFLINE=1, drafter not then in the pool), which was staging rather than
  compatibility. The config bind is now proven without a serve: with the drafter
  staged, `SpeculativeConfig(method="dspark", num_speculative_tokens=4)` accepts the
  target's config.json (93 layers, hidden 7168, vocab 163840; draft num_target_layers
  93, block_size 5, target_layer_ids [7,23,67,83,91]) and Qwen3DSparkForCausalLM
  instantiates against it — 5 layers, DSparkMarkovHead + DSparkConfidenceHead, first
  layer `model.layers.93...`, 4,598,107,009 params (8.56 GiB BF16 module tree); the
  Omni-only `n == block_size` check does not run for a Kimi target. So the row's
  label is "config bind proven, acceptance counters pending", and the arm is a
  FIT REJECTION at TP=4, not a staging wait: the target body is present (442.87 GiB,
  hf cache verify rc=0), its shards are 110.71 GiB/rank, and the drafter loads at
  its own TP=1, so rank 0 carries 4.19 GiB more -> 114.90 GiB of weights before any
  overhead against 112.33-115.02 GiB free measured on this fleet. A no-KV boot needs
  118.37 GiB (util >=0.973), 3.35 GiB above the best reading, so it cannot boot here
  at any context. Feasible shapes: TP=8 (55.4 GiB/rank), a smaller pruned target, or
  a larger unified pool. The open
  question stays cross-checkpoint acceptance: the draft was trained against the
  unpruned base, so the card's 3.448 mean acceptance at width 8 is not transferable
  to this 75 %-pruned body and only a real serve measures it. A healthy serve would
  still be markerless: no chat template ships, so the chat instruments cannot score
  it (lane README has the acceptance contract).
  MEMORY: 110.71 GiB/rank of target + 4.19 GiB of drafter on rank 0 = 114.90 GiB;
  with the measured 3.05 GiB overhead and 0.42 GiB of KDA state the arm needs
  118.37 GiB, so no utilisation value makes it fit at TP=4.
metadata:
  model_url: https://huggingface.co/LithosAI/Kimi-K3.1-Pro-DSpark
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "737B"
  model_dtype: mxfp4
  model_mtp_dtype: bf16
  kv_dtype: bf16
  draft_model: LithosAI/Kimi-K3.1-Pro-DSpark
  tags: large_context, speculative-decode
  # Not instrumented: this engine pin is absent from the fleet in the 2026-11-08
  # metrics rollout, so its flags are unverified for this digest; an unknown flag
  # is an argparse boot failure. Instrument only after a per-pin --help read.
  instrumented: false
  caveats: >
    One verified link, one open, recorded not hidden. (1) ENGINE: verified against the
    pinned image itself (2026-11-08, arm64 pull + inspection): its config/speculative.py
    declares `DSparkModelTypes = Literal["dspark"]` with `use_dspark()` and
    `dspark_draft_topk`, and its registry maps `Qwen3DSparkModel` to qwen3_dspark. The
    same registry also carries a Kimi-NATIVE DSpark draft (`K3DSparkModel` ->
    vllm/models/kimi_k3/nvidia/dspark_mla), so if a Qwen3-shaped draft is refused on a
    Kimi target the native drafter route exists and needs its own checkpoint. (2)
    DRAFTER-BINDING CAUTION (do not skip): the LithosAI draft's `architectures` is
    `Qwen3DSparkModel` — vLLM's Qwen3-shaped DSpark skeleton — even though its config
    targets 93-layer Kimi layers [7,23,67,83,91] and Kimi's 163840 vocab. Until a boot
    shows that speculator initialising against this Kimi target *and* its acceptance
    counters moving, this arm has NOT measured a drafter; a refusal or zero counters is
    the finding "Qwen3-shaped draft is not bindable to a Kimi target", and the route
    then needs a Kimi-native `K3DSparkModel` checkpoint (vLLM ships the arch; no such
    checkpoint is identified yet). (2) CROSS-CHECKPOINT ACCEPTANCE: the draft was trained against
    moonshotai/Kimi-K3.1-Pro (the card states no base revision) while this target is
    its 75 %-expert-pruned derivative, so the hidden states it reads come from a
    different routing distribution; the card's 3.448 acceptance length is for the
    unpruned base and must not be assumed here. CHAT TEMPLATE: same as the plain sibling —
    the checkpoint ships none (`tokenizer_config.json` has no `chat_template` key;
    formatting is a Python `apply_chat_template`), so acceptance is measured through
    `/v1/completions` unless the chat endpoint settles otherwise. Both drafts' licenses: DSpark ships
    `other` / `kimi-k3.1-pro`, matching the base, not Apache-2.0.
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  served_model_name: vllm-project/Kimi-K3.1-Pro-pruned75
  # FIT REJECTION at TP=4: target 110.71 GiB/rank + drafter 4.19 GiB on rank 0 +
  # 3.05 GiB overhead + 0.42 GiB KDA state = 118.37 GiB, above the best free
  # memory this fleet measured (115.02 GiB). Kept at a placeholder; boot it only
  # after a TP=8 recut or a smaller target (lane README §fit).
  gpu_memory_utilization: 0.92
  max_model_len: 16384
  max_num_seqs: 4
  max_num_batched_tokens: 2048
  quantization: compressed-tensors
  # vLLM rejects `bf16` here (CacheConfig validation lists `bfloat16`)
  kv_cache_dtype: bfloat16
  tool_call_parser: kimi_k3
  reasoning_parser: kimi_k3
  # vLLM's speculative-config field is `model`, not `draft_model`; the JSON lives here so
  # sparkrun's draft detection binds and distributes the repo with this revision
  # (an inline literal in `command:` would reach the engine but never the config chain).
  # num_speculative_tokens is the trained draft shape: the exported config declares
  # block_size 5 (1 current + 4 drafts), so 4. vLLM's Omni-only `n == block_size`
  # validator does not run for a Kimi target (config bind proven, lane README). The
  # card's width-8 number needs the same weights at block 8 and is not reachable
  # from this config as exported.
  speculative_config: '{"method": "dspark", "model": "LithosAI/Kimi-K3.1-Pro-DSpark", "revision": "d791d217d1cc679e07877721761bfcc09d70d514", "num_speculative_tokens": 4}'
  extra_args: ""

command: >
  taskset -c 5-9,15-19 vllm serve {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --trust-remote-code
  --quantization {quantization}
  --kv-cache-dtype {kv_cache_dtype}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --gpu-memory-utilization {gpu_memory_utilization}
  --reasoning-parser {reasoning_parser}
  --tool-call-parser {tool_call_parser}
  --enable-auto-tool-choice
  --speculative-config '{speculative_config}'
  {extra_args}
