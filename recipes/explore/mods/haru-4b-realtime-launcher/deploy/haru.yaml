# Haru full-duplex serving: one stage, one resumable request per conversation.
#
# This is `haru_vllm/deploy/haru.yaml` as shipped inside haru-speech-vllm 0.1.1,
# carried here so the stage knobs are reviewable in this repository (the wheel's
# copy is only reachable through `python -m haru_vllm.deploy`). Two changes:
# `gpu_memory_utilization: 0.85` per stage (the lane's band on a GB10), and the
# comments. The plugin's `_check_supported` rejects async_scheduling, prefix
# caching, speculative decoding and TP/PP > 1 at load, so keep those as they are.
pipeline: haru
session_mode: duplex
duplex_session:
  max_sessions: 2
  # session.created echoes the voice reference (up to 180 s of audio).
  max_pending_output_bytes_per_session: 67108864
  # A short silent session at startup, before clients are admitted.
  warmup_frames: 8

async_chunk: false
dtype: bfloat16

stages:
  - stage_id: 0
    gpu_memory_utilization: 0.85
    max_num_seqs: 2
    # 60 minutes of conversation (7.5 frames per second) plus the prompt.
    max_model_len: 32768
    # Cache for max_num_seqs conversations of max_model_len positions. 8 full
    # attention layers x 4 kv heads x 256 head_dim x 2 (K,V) x 2 B = 32 KiB per
    # token, so 2 x 32,768 tokens is 2.0 GiB: this grant is ~4x the need.
    kv_cache_memory_bytes: 8589934592  # 8 GiB
    skip_tokenizer_init: true
    # Prompt ids are placeholders; the real inputs are per-conversation embeddings.
    enable_prefix_caching: false
    # Every conversation appends one frame per step; synchronous scheduling
    # keeps all waiting frames in the same step.
    async_scheduling: false
    max_num_batched_tokens: 2048
    default_sampling_params:
      temperature: 0.7
      top_k: 25
      repetition_penalty: 1.0
      max_tokens: 1
