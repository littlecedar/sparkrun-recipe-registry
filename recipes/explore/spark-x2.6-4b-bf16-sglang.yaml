recipe_version: "2"
model: XHToken/Spark-X2.6-4B
model_revision: 66e3ae7bee54e0a523d692cb8ef841f35409807b
  # Offline engine: --revision is required (a SHA-keyed download writes no refs/ entry).
# v0.5.22, not the ornith arms' v0.5.21@b1259f3e: it is the fleet-resident digest of the
# SGLang re-pin campaign (present on .30/.33/.35) and this recipe's arch module is verified
# INSIDE the image — /sgl-workspace/sglang/python/sglang/srt/models/spark2_5.py, 19,650 B.
# v0.5.21 is on no node, so pinning it would spend the boot on a ~20 GB pull.
container: lmsysorg/sglang:v0.5.22-cu130@sha256:e3a4f06001a29542fc4a8638536d9ffc5eb9c9942b08603c09b19a56eae4a1ae
runtime: sglang
min_nodes: 1
max_nodes: 1

description: >-
  XHToken/Spark-X2.6-4B (4.11B dense, hybrid sliding-window attention, Apache-2.0)
  on ONE DGX Spark, bf16, 131,072 context. The engine needs no work: SGLang ships
  srt/models/spark2_5.py (Spark2_5ForCausalLM) with per-layer sliding-window
  RadixAttention, per-type rope (full layers 5e6/partial 0.25, sliding 1e4/1.0) and the
  q_k_v_proj name the vendor's compressed-tensors quants target; the same release
  registers the card's --tool-call-parser spark25 and the qwen3 reasoning parser.
  Context is 131,072, not the card's 1,048,576: only 9 of the 36 layers are full-attention
  (36.0 KiB of KV per token there, the other 27 are sliding-window), and the pools SGLang
  actually allocates at mem-fraction 0.85 on one GB10 are 723,730 full tokens (24.84 GB)
  plus 578,984 sliding-window tokens (59.64 GB) — 84.48 GB of KV, i.e. 5.52x the 131k
  window. The vendor window is 8x that and a >1-node artifact.
  bf16 is the tier on purpose: the card's own SGLang example serves the bf16 checkpoint
  with no --quantization flag, and at 131k the FP8/INT8/INT4 tiers (4.45/4.45/3.41 GB)
  buy decode bandwidth (~61/61/80 t/s ceilings vs ~33 for 8.22 GB), not fit — so they
  belong in an A/B after the bf16 control exists, not in the first boot.
  Pre-registered, nothing measured yet: TTR to /v1/models, served id, the d0 ladder
  (pp 2048 / tg 128, c1/2/5/10, n=5, decode rows) and the 37-item house battery at
  --max-tokens 4096 in BOTH thinking modes. Falsifier: bf16 C1 < 25 t/s (under the
  bandwidth roofline at ~75 % efficiency) demotes bf16 to a control, and pooled house
  <= 34/37 kills the tier.
metadata:
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_url: https://huggingface.co/XHToken/Spark-X2.6-4B
  model_params: "4B"
  model_dtype: bf16
  kv_dtype: bf16
  tags: explore, reasoning, agent, tools, apache-2.0

env:
  PYTHONUNBUFFERED: '1'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: XHToken/Spark-X2.6-4B
  gpu_memory_utilization: 0.85
  max_model_len: 131072
  max_num_seqs: 32
  chunked_prefill_size: 8192

# No --attention-backend and no --kv-cache-dtype: the checkpoint's bf16 KV is the engine
# default, and a hybrid window stack is exactly where a forced backend is a guess — the
# card's own SGLang line forces neither. The chat template is in the snapshot
# (chat_template.jinja AND tokenizer_config), so no --chat-template.
command: >
  sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser spark25
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
