# ===========================================================================
# LICENSE — ERNIE 5.5 Flash Base Model License v1.0. Free non-commercial use;
# commercial use permitted only up to US$50 M annual revenue, with attribution
# and a one-time written notice (S4.2), otherwise separate authorization (S4.3).
# Owner ruled the class shippable 2026-11-11; the shipped arm is
# `ernie-5.5-flash-base-tp4-flashinfer-sparse-sglang.yaml`, and this control
# stays a PROBE for the engine reason only (FlashMLA has no SM12x sparse decode).
# ===========================================================================
recipe_version: "2"
model: baidu/ERNIE-5.5-Flash-Base
# Pinned to the staged body, never refs/main: the owner's cache-wide sweep
# moves refs/main, and a boot that resolves it can serve a half-present tree.
model_revision: 028544b2ffceea189b2d8768ed2b9d09b06f2343
# arm64 manifest of the 2026-11-10 nightly (upstream main 4a5c6b8f, past the
# ERNIE support commit ed61eca1 and its import fix 6d1ce5b8). No release image
# carries srt/models/ernie55.py: v0.5.22/v0.5.23 and dev-cu13 do not.
container: lmsysorg/sglang:nightly-dev-cu13-20261110-4a5c6b8f@sha256:59197db6ceaca76a7dba64fe10e45a067952ff97f63434c38df3ac149e50c193
builder: docker-pull
runtime: sglang
min_nodes: 4
max_nodes: 4

description: >-
  ERNIE-5.5-Flash-Base — 280B-total / ~14B-active MoE (43 layers, hidden 4096,
  top-10 of 512 experts, FP8 e4m3 block weights with ue8m0 scales) — on 4x DGX
  Spark, TP=4: 268.65 GiB of shards is 67.16 GiB per rank against 121.69 GiB
  unified. PROBE (`zz-`) for the engine reason: FlashMLA sparse decode has no
  SM12x build (the control's boot section below), while the licence class is now
  shipped on the FlashInfer arm. It ships no chat template, so /v1/completions is
  the answering endpoint until a template is staged. Window 131072 is upstream's only validated context: ~7.2 KiB of KV per
  token puts it at 0.90 GiB of the ~27.7 GiB a 0.78 static budget leaves, so the
  pool holds ~29 full windows. The checkpoint's 1M is unproven here.
metadata:
  model_url: https://huggingface.co/baidu/ERNIE-5.5-Flash-Base
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "280B"
  model_dtype: fp8
  kv_dtype: fp8
  tags: large_context
  caveats: >-
    ERNIE 5.5 Flash Base Model License v1.0: free non-commercial use; commercial
    use only up to US$50 M annual revenue with attribution and a one-time
    written notice, otherwise separate authorization. The owner ruled the class
    shippable 2026-11-11, so those obligations attach; this control stays a probe
    only because FlashMLA's sparse decode has no SM12x build. The tokenizer
    ships no chat_template (tokenizer_config.json carries none,
    chat_template.jinja 404), so /v1/chat/completions has no prompt contract;
    serve /v1/completions.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 131072
  max_num_seqs: 64
  gpu_memory_utilization: 0.78
  # The repo id, not {model}: on a real launch {model} renders to the prepared
  # snapshot path, which must never become the advertised model id.
  served_model_name: baidu/ERNIE-5.5-Flash-Base

command: >
  sglang serve
  --host {host}
  --port {port}
  --model-path {model}
  --revision {model_revision}
  --served-model-name {served_model_name}
  --context-length {max_model_len}
  --tp-size {tensor_parallel}
  --mem-fraction-static {gpu_memory_utilization}
  --max-running-requests {max_num_seqs}
  --enable-metrics
  --enable-cache-report

readiness:
  inference: true
  # 268.65 GiB body is read from the BeeGFS pool at boot: ~67 GiB per rank.
  port_timeout_s: 7200
  health_timeout_s: 3600
