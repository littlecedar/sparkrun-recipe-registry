recipe_version: "2"
model: poolside/Laguna-M.1-NVFP4
model_revision: e4f3ba80ca1d8d83443df18e03ecebd7ef55a066
# vLLM 0.32.0: the pin was bumped for the CVE reason (0.29.0 carried 23 OSV
# records), NOT because this arm was re-booted on it — no node pair was free on
# 2026-10-22, so this remains UNVERIFIED here and every number in the lane doc
# is still a v0.29.0 measurement. The XS sibling boot-verifies 0.32.0 on the
# same checkpoint family; that is not this 225B TP=2 load. 0.30.0 was never
# usable for the family (its LagunaConfig stub shadows the transformers 5.17
# class). Verify with `-H <free pair> --transfer-mode local` and assert
# /v1/models before quoting this arm on the new engine.
container: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
runtime: vllm
min_nodes: 2
max_nodes: 2

description: >-
  poolside/Laguna-M.1-NVFP4 — 225B total / 23B active agentic-coding MoE
  (70 layers, 256 experts top-16 + 1 shared, global attention 64Q/8KV with
  softplus output gating, 262,144 native) on TWO DGX Sparks (TP=2). 40 files
  / 139.3 GB / 129.8 GiB of NVFP4 weights, i.e. ~65 GiB per rank; util 0.85
  leaves ~36 GiB per rank for a ~18.8 GB/rank fp8 KV pool at the full window.
  Thinking is interleaved between tool calls and is designed for preserved
  reasoning across turns; the card does not turn it on server-side by
  default, so the serve line passes --default-chat-template-kwargs. Apache-2.0.
metadata:
  model_url: https://huggingface.co/poolside/Laguna-M.1-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "225B"
  model_dtype: nvfp4
  kv_dtype: fp8
  tags: explore, official, reasoning, tools, large_context
  caveats: >
    Engine pin is v0.32.0 and is NOT re-booted on this arm: the one measured
    boot is 2026-10-20 on v0.29.0 (/v1/models 200 at ~43 min, ladder and suite
    in the lane README), and the 2026-10-22 bump was made for the CVE reason
    only. The card's vLLM floor is 0.21 (Laguna support landed in
    vllm-project/vllm#41129) and this image's laguna.py matches the config, but
    a TP=2 boot on 0.32.0 is outstanding. Two rank-local costs are unmeasured
    at this size: ~65 GiB of weights per rank means the first boot is dominated
    by load, and MAX_JOBS=4 caps the cold FP4/cutlass JIT fan-out (an uncapped
    nvcc has exhausted the 128 GB pool on this class of arm). The card's SGLang
    route needs sglang main, which no resident image carries, hence vLLM.

executor_config:
  # vllm/vllm-openai declares ENTRYPOINT ["vllm","serve"]; clear it so the
  # recipe's own serve line runs instead of being parsed as the image's flags.
  entrypoint: ""

env:
  PYTHONUNBUFFERED: '1'
  MAX_JOBS: '4'

readiness:
  inference: false
  port_timeout_s: 3600
  health_timeout_s: 1800

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  served_model_name: poolside/Laguna-M.1-NVFP4
  max_model_len: 262144
  max_num_seqs: 8
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8

command: >
  vllm serve
  {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --gpu-memory-utilization {gpu_memory_utilization}
  --kv-cache-dtype {kv_cache_dtype}
  --enable-prefix-caching
  --reasoning-parser poolside_v1
  --tool-call-parser poolside_v1
  --enable-auto-tool-choice
  --default-chat-template-kwargs '{"enable_thinking": true}'
