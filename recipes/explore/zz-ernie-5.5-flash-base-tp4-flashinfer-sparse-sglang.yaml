# ===========================================================================
# Route arm for `zz-ernie-5.5-flash-base-tp4-sglang` (the blocked control,
# unchanged). Byte-identical image pin, checkpoint revision and command: the
# only difference is the mod, which moves the six MLA layers from FlashMLA's
# SM100-only sparse decode onto FlashInfer's SM120/121 sparse kernel with the
# top-k+window page set, the per-row length and the learnable sink intact.
# Sites, evidence, ladder and falsifier:
# recipes/explore/mods/ernie55-flashinfer-sparse-sglang/README.md
# Design note: mad-science/SM121-SPARSE-MLA-PORT.md section "Port B".
recipe_version: "2"
model: baidu/ERNIE-5.5-Flash-Base
# Pinned staged body, never refs/main: the owner's cache-wide sweep
# moves refs/main, and boot would resolve a serve on a half-present tree.
model_revision: 028544b2ffceea189b2d8768ed2b9d09b06f2343
# arm64 manifest of the 2026-11-10 nightly (upstream main 4a5c6b8f, past the
# ERNIE support commit ed61eca1 and import fix 6d1ce5b8). No release image
# carries srt/models/ernie55.py: v0.5.22/v0.5.23 and dev-cu13 do not.
container: lmsysorg/sglang:nightly-dev-cu13-20261110-4a5c6b8f@sha256:59197db6ceaca76a7dba64fe10e45a067952ff97f63434c38df3ac149e50c193
builder: docker-pull
runtime: sglang
min_nodes: 4
max_nodes: 4
mods:
  - "mods/ernie55-flashinfer-sparse-sglang"

description: >-
  ERNIE-5.5-Flash-Base TP=4 via FlashInfer's SM120/121 sparse-MLA kernel — the
  route arm for the FlashMLA-blocked control. Same 280B-total / ~14B-active MoE
  (43 layers, 6 MLA + 37 HCA, hidden 4096, top-10 of 512 experts, FP8 e4m3 block
  weights with ue8m0 scales), same image pin, same revision, same command; the
  lane mod patches five engine sites so the MLA layers select
  `flashinfer_sparse_mla` on SM121, build the appended `top-k + last window`
  page set with its per-row length, and pass the per-head learnable sink. The
  envelope is checked GPU-less at launch: 16 q-heads per rank at TP=4, topk
  2176 (2048 index_topk + 128 window, aligned), 656 B/token, page 64. Quality,
  not throughput, decides this arm: greedy GSM8K >= 0.93 plus the window
  falsifier. DRAFT probe (`zz-`), not shippable as-is: the checkpoint's license
  class has no owner ruling, and it ships no chat template, so
  /v1/completions is the answering endpoint. Window 131072 is upstream's only
  validated context.
metadata:
  model_url: https://huggingface.co/baidu/ERNIE-5.5-Flash-Base
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "280B"
  model_dtype: fp8
  kv_dtype: fp8
  tags: large_context
  caveats: >-
    ERNIE 5.5 Flash Base Model License v1.0: free non-commercial use; commercial
    use permitted only up to US$50 M annual revenue, with attribution and a
    one-time written notice (S4.2), otherwise separate authorization (S4.3).
    This class has no owner ruling yet, so the arm stays probe-only until one
    lands. The tokenizer ships no chat_template (tokenizer_config.json carries
    none, chat_template.jinja 404), so /v1/chat/completions has no prompt
    contract; serve /v1/completions. The route is unproven until the quality
    cell: a wrong-logits port passes boot and CUDA-graph capture.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 131072
  max_num_seqs: 64
  gpu_memory_utilization: 0.78
  # repo id, not {model}: on a real launch {model} renders the prepared
  # snapshot path, which must never become the advertised model id.
  served_model_name: baidu/ERNIE-5.5-Flash-Base

command: >
  sglang serve
  --host {host}
  --port {port}
  --model-path {model}
  --revision {model_revision}
  --served-model-name {served_model_name}
  --context-length {max_model_len}
  --tp-size {tensor_parallel}
  --mem-fraction-static {gpu_memory_utilization}
  --max-running-requests {max_num_seqs}
  --enable-metrics
  --enable-cache-report

readiness:
  inference: true
  # The 268.65 GiB body is read from the BeeGFS pool at boot: ~67 GiB per rank.
  port_timeout_s: 7200
  health_timeout_s: 3600
