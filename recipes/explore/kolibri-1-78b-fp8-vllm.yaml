recipe_version: "2"
model: Aleph-Alpha/Kolibri-1
model_revision: 35bc4d3be745502227a67247de77d70e691614ee
# Stock multi-arch vllm/vllm-openai:v0.29.0 (the plugin pins vLLM 0.29) with the
# pure-Python `aleph-alpha-inference` plugin installed by
# mods/install-kolibri-plugin — the vendor's own image is amd64-only, so it
# cannot run on arm64 GB10; the plugin itself installs with --no-deps per its
# README and never touches the image's vLLM/torch/transformers.
container: vllm/vllm-openai:v0.29.0@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
runtime: vllm
min_nodes: 1
max_nodes: 1
# Unpublished mod: bare `mods/NAME`, NOT `@littlecedar/mods/NAME` (the scoped
# form resolves against the published registry clone and fails on unpublished
# mods). Also requires `--transfer-mode local` on launches.
mods:
  - "mods/install-kolibri-plugin"

metadata:
  description: >-
    Aleph-Alpha/Kolibri-1 (78.1B total / 3.46B active MoE, 384 experts with 1
    shared + 6 routed, 4:1 SWA:GQA) FP8 on ONE DGX Spark (TP=1) — the explore
    lane's accuracy-champion candidate (AIME-25 96.9, GPQA-D 84.3, vendor
    blog), ranked next after Ling by the research doc. Native context 262,144
    (the card recommends <=262k for serving; 1M is validated by the vendor but
    is NOT probed/shipped here). Working point follows the measured GB10 boot
    (NVIDIA forum, 2026-10-04): util 0.78 — the weights alone are 73.5 GiB,
    ~0.60 of usable GPU memory — max_num_seqs 4, fp8 KV, prefix caching,
    reasoning + tool-call parsers `kolibri1` from the plugin. Thinking is ON by
    default; per-request `chat_template_kwargs: {reasoning_effort: "none"}`
    (or `enable_thinking: false`) turns it off. Cold start is long: weight load
    alone was 1087 s on GB10 and one-time Triton fused_moe JIT adds a delay on
    the first long request, hence the generous readiness timeouts. Vendor GB10
    reference: 20.4 t/s decode C1 on stock vLLM 0.29 (48 t/s on a non-pinnable
    sm121 build); 1.42-73.5 GiB class memory champion.
  model_url: https://huggingface.co/Aleph-Alpha/Kolibri-1
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "78.1B"
  model_dtype: fp8
  kv_dtype: fp8
  tags: explore, reasoning

executor_config:
  # vllm/vllm-openai declares ENTRYPOINT ["vllm","serve"]; clear it so the
  # recipe's own serve line runs instead of being parsed as the image's flags.
  entrypoint: ""

env:
  PYTHONUNBUFFERED: '1'
  # The measured GB10 boot set OMP_NUM_THREADS=4 (NVIDIA forum 2026-10-04);
  # PYTORCH_CUDA_ALLOC_CONF is supplied by the platform tier for vllm on GB10.
  OMP_NUM_THREADS: '4'

# Cold start includes the 73.5 GiB weight load (~1087 s measured on GB10)
# before the port opens; the /health gate plus generous timeouts absorb it.
readiness:
  inference: false
  port_timeout_s: 2400
  health_timeout_s: 1800

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  served_model_name: Aleph-Alpha/Kolibri-1
  max_model_len: 262144
  max_num_seqs: 4
  # Measured GB10 working point; weights alone are 0.60 of usable memory and
  # the AGENTS.md GB10 ceiling is 0.85. 0.78 leaves the headroom the forum
  # poster measured as necessary (CUDA ends up with ~11 GiB less than
  # MemAvailable suggests).
  gpu_memory_utilization: 0.78
  kv_cache_dtype: fp8

# Comments must live OUTSIDE the folded `command:` block: a `>` scalar keeps
# them as literal text, and sparkrun's shell-comment rule then eats every flag
# that follows the first `#`.
command: >
  vllm serve
  /cache/huggingface/hub/models--Aleph-Alpha--Kolibri-1/snapshots/35bc4d3be745502227a67247de77d70e691614ee
  --served-model-name {served_model_name}
  --revision=35bc4d3be745502227a67247de77d70e691614ee
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --gpu-memory-utilization {gpu_memory_utilization}
  --kv-cache-dtype {kv_cache_dtype}
  --enable-prefix-caching
  --reasoning-parser kolibri1
  --tool-call-parser kolibri1
  --enable-auto-tool-choice
