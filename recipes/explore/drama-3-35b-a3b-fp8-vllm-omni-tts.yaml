# v1.0 allows non-commercial and research use, and commercial use only below a
# USD 500,000 annual-revenue threshold; read LICENSE.md in the checkpoint before
# serving this to anyone. Weights stay in the HF cache, never in the image.
#
# Boot attempted on .NN 2026-10-22: the model LOADED on this pinned nightly
# (FishOmniForConditionalGeneration + FishSpeechDACDecoder, 37.69 GiB, 242.84 s) and
# then the stage-init deadline killed it 2 s after torch.compile finished, because
# vllm-omni defaults `--stage-init-timeout 300` and cold load+compile is ~298 s, so the
# recipe ships 1800 itself — boot it with no override. (For a pure TTR reading, pass
# `-o stage_init_timeout=300` and expect the same death.) A second boot reuses
# /cache/runtime/vllm/torch_compile_cache, so ~250 s is the floor, not ~10 min.
recipe_version: "2"
model: fishaudio/drama-3
model_revision: b2b5ee998034b2975720906c815e7fb0e9f007bd
container: vllm/vllm-omni:nightly-15bce345863c6e2db882534876b8977f5b1ae1e3@sha256:f3473cb3ee7577d4e2595aa6c33eebe6734f79df26cb76c1f03f35542cab5a45
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  fishaudio/drama-3 — 35B total / 3B active TTS with a 10-codebook audio
  decoder, served by vLLM-Omni (`vllm-omni serve --omni`) on ONE DGX Spark.
metadata:
  model_url: https://huggingface.co/fishaudio/drama-3
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "35B"
  model_dtype: fp8
  tags: explore, tts, audio, single_user, license-gated

executor_config:
  entrypoint: ""
env:
  PYTHONUNBUFFERED: '1'
  MAX_JOBS: '4'

readiness:
  inference: false
  port_timeout_s: 3600
  health_timeout_s: 1800

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: fishaudio/drama-3
  max_model_len: 3072
  max_num_seqs: 8
  mamba_ssm_cache_dtype: bfloat16
  stage_init_timeout: 1800  # vllm-omni's 300 s default is a deadline for the load+compile budget, not a load time: 242.84 s of weights + 34.66 s of torch.compile overshot it by 2 s on 2026-10-22
  stage_overrides: '{"0": {"gpu_memory_utilization": 0.55}, "1": {"gpu_memory_utilization": 0.06}}'

command: >
  vllm-omni serve
  {model}
  --omni
  --served-model-name {served_model_name}
  --revision {model_revision}
  --host {host}
  --port {port}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --mamba-ssm-cache-dtype {mamba_ssm_cache_dtype}
  --stage-init-timeout {stage_init_timeout}
  --stage-overrides '{stage_overrides}'
