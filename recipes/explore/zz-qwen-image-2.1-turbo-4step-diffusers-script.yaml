# ===========================================================================
# PROBE RECIPE — NOT SHIPPED, NO INDEX ROW.
#
# Same image and checkpoint as
# qwen-image-2.1-turbo-7b-bf16-diffusers-script.yaml (read its license banner:
# Qwen Research License, NON-COMMERCIAL ONLY), but the serve command runs the
# server generated by mods/qwen-image-sigmas, whose /generate accepts `sigmas`
# (and a `num_inference_steps` that resamples the checkpoint's grid) instead of
# silently ignoring the step count. Boot check and the falsifier are in that
# mod's README.
# ===========================================================================
recipe_version: "2"
model: Qwen/Qwen-Image-2.1-Turbo
model_revision: fc13ba1986fcb905854dc8de2f52eee395f49b5b
container: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  Probe of the Qwen-Image-2.1-Turbo media-gen arm with an expressible sampling
  schedule: 4 steps (or any explicit `sigmas` grid) via the qwen-image-sigmas
  mod. The checkpoint's saved 8-step `sample_sigmas` is the pipeline default and
  cannot be overridden by `num_inference_steps` alone, so the mod generates a
  server that forwards `sigmas` into `pipe(**call)`; the unpatched launcher
  stays untouched. Same diffusers `QwenImage21Pipeline` engine, same POST
  /generate contract, same non-commercial license (see the shipped entry's
  banner). Not a shipped arm.
metadata:
  model_url: https://huggingface.co/Qwen/Qwen-Image-2.1-Turbo
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "7B"
  model_dtype: bf16
  tags: explore, image, single_user, experimental

mods:
  - "mods/qwen-image-2.1-turbo-launcher"
  - "mods/qwen-image-sigmas"

executor_config:
  entrypoint: ""
readiness:
  inference: false
  port_timeout_s: 2400
  health_timeout_s: 1200

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: Qwen/Qwen-Image-2.1-Turbo

command: >
  /cache/runtime/qwen-image/venv/bin/python
  /cache/runtime/qwen-image/sigmas-server.py
  --model {model}
  --revision {model_revision}
  --served-model-name {served_model_name}
  --host {host}
  --port {port}
  --sample-dir /cache/runtime/qwen-image/samples