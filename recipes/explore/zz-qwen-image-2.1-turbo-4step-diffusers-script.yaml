# ===========================================================================
# PROBE RECIPE — NOT SHIPPED, NO INDEX ROW.
#
# Same image and checkpoint as
# qwen-image-2.1-turbo-7b-bf16-diffusers-script.yaml (read its license banner:
# Qwen Research License, NON-COMMERCIAL ONLY), but the serve command runs the
# server shipped by mods/qwen-image-2.1-turbo-launcher, whose /generate accepts
# `sigmas` (and a `num_inference_steps` that resamples the checkpoint's grid)
# instead of silently ignoring the step count. It used to run a second server
# generated by mods/qwen-image-sigmas; that mod's fail-closed patch anchors the
# pre-2026-10-21 step plumbing and refuses to launch against the launcher's
# `schedule_kwargs`, so the native path is the one source of the schedule now.
# ===========================================================================
recipe_version: "2"
model: Qwen/Qwen-Image-2.1-Turbo
model_revision: fc13ba1986fcb905854dc8de2f52eee395f49b5b
container: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  Probe of the Qwen-Image-2.1-Turbo media-gen arm with an expressible sampling
  schedule: 4 steps (or any explicit `sigmas` grid) through the launcher
  server's own `sigmas` field. The checkpoint's saved 8-step `sample_sigmas` is
  the pipeline default and cannot be overridden by `num_inference_steps` alone,
  so the launcher resamples the saved curve to the requested count and forwards
  it into `pipe(**call)`, reporting what it actually used as `sigmas_used`.
  Same diffusers `QwenImage21Pipeline` engine, same POST /generate contract,
  same non-commercial license (see the shipped entry's banner). Not a shipped
  arm.
metadata:
  model_url: https://huggingface.co/Qwen/Qwen-Image-2.1-Turbo
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "7B"
  model_dtype: bf16
  tags: explore, image, single_user, experimental

mods:
  - "mods/qwen-image-2.1-turbo-launcher"

executor_config:
  entrypoint: ""
readiness:
  inference: false
  port_timeout_s: 2400
  health_timeout_s: 1200

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: Qwen/Qwen-Image-2.1-Turbo

command: >
  /cache/runtime/qwen-image/venv/bin/python
  /workspace/mods/qwen-image-2.1-turbo-launcher/server.py
  --model {model}
  --revision {model_revision}
  --served-model-name {served_model_name}
  --host {host}
  --port {port}
  --sample-dir /cache/runtime/qwen-image/samples