recipe_version: "2"
model: JetBrains/Mellum2.1-12B-A2.5B-Thinking-GGUF:Q4_K_M
model_revision: 20b439426f1e997ba575eaccaf4856ac0f76f5d5
runtime: llama-cpp
# PROBE (not shippable) — the Mellum llama-cpp arm plus the checkpoint's own MTP
# draft head, on a stock-upstream llama.cpp build. The 2026-10-22 sweep measured
# the a37cc4610 tree; the 2026-10-25 retest (owner round-4 §7(c): retest when
# upstream changes) re-pins the current ref `d854d98bae` (86 commits later, 2026-10-25,
# touches llama-graph/speculative/ggml-cuda). Local build on .35 over
# recipes/explore/Dockerfile.llamacpp-upstream, both gates green (features + sm_121);
# image id sha256:47d3efa2b07636d01e99f77292f25492f630f3e76902f4f9abb1968a738b1d05 —
# local tag only, nothing pushed, so the pin is the tag and the id is the provenance.
container: littlecedar/dgx-spark-llama-cpp:upstream-d854d98-cu130
min_nodes: 1
max_nodes: 1

description: >-
  PROBE (not shippable) - the Mellum2.1-12B-A2.5B-Thinking Q4_K_M arm with its
  own MTP (multi-token-prediction) draft head enabled, on the stock-upstream
  llama.cpp `d854d98bae` build (2026-10-25 HEAD; the 2026-10-22 sweep ran a37cc4610). The main GGUF (8,071,295,264 B) is the shipped
  file at the shipped pin; the head is a second GGUF in the same repo
  (`mtp/Mellum2.1-12B-A2.5B-Thinking-MTP-Q8_0.gguf`, 13,381,030,880 B — a FULL draft model, not a
  small head; RE-PINNED 2026-10-26 to the quantized head per owner survey answer 8: the Q8_0 draft
  reaches fork-parity decode at n=1 (120.37 ± 1.92 control-cache route, 105-110 pool-snapshot route
  — window-dependent, same-window pair proved the routes equivalent) but never beats the shipped
  fork's 121.27 class, and the drafter-alternatives search is verified null) which exists only at
  revision 4159d684 and is served straight from the pool snapshot (the dedup-era hand-staged
  `/cache/huggingface/hub/mellum-mtp-head/` path is gone). `--spec-draft-n-max` is the draft-length
  knob under test. Apache-2.0.
metadata:
  model_url: https://huggingface.co/JetBrains/Mellum2.1-12B-A2.5B-Thinking-GGUF
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "12B"
  model_dtype: q4_k_m
  kv_dtype: fp16
  tags: explore, reasoning, tools, fast

# entrypoint: "" — this image keeps llama-server as ENTRYPOINT, which would eat the launcher command (the decision-lane precedent).
executor_config:
  entrypoint: ""

defaults:
  port: 8000
  host: 0.0.0.0
  # Never {model}: on a real launch sparkrun rebinds it to the staged GGUF
  # file, so the served id would be the cache path (-n hides this).
  served_model_name: JetBrains/Mellum2.1-12B-A2.5B-Thinking-GGUF
  ctx_size: 131072
  parallel: 8
  n_gpu_layers: 999
  flash_attn: auto
  reasoning_format: deepseek
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  # The knob under test: tokens the MTP head may draft per step (>= 1).
  spec_draft_n_max: 1

# Four literals, not defaults: a `defaults:` key in the llama.cpp flag map is
# only consumed on the command-less path (`runtimes/llama_cpp.py::_build_command`),
# so `jinja:` / `webui:` / `mmap:` here would be silent drops. `--no-mmap`
# matches the GB10 platform default (which the template path never injects);
# this build removed that spelling in favour of `--load-mode`.
command: >
  llama-server -hf {model}
  --alias {served_model_name}
  --host {host}
  --port {port}
  --ctx-size {ctx_size}
  --parallel {parallel}
  --kv-unified
  --n-gpu-layers {n_gpu_layers}
  --temp {temperature}
  --top-p {top_p}
  --top-k {top_k}
  --flash-attn {flash_attn}
  --reasoning-format {reasoning_format}
  --jinja
  -md /cache/huggingface/hub/models--JetBrains--Mellum2.1-12B-A2.5B-Thinking-GGUF/snapshots/4159d684ffdb09ba89dc2a58feb3e75c54eef036/mtp/Mellum2.1-12B-A2.5B-Thinking-MTP-Q8_0.gguf
  --spec-type draft-mtp
  --spec-draft-n-max {spec_draft_n_max}
  --no-webui
  --load-mode none
  --cont-batching
