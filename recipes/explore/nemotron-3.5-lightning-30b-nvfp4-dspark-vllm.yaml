recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
model_revision: bee7596271d1495f6992ae224aefde4410e816b8
# Same digest-pinned image as the glm5 Flash and decision lanes (2026-10-11):
# this build carries the Nemotron-3.5-Lightning surface — NemotronH arch
# classes (models/registry.py), `nemotron_v3` reasoning parser
# (reasoning/__init__.py:123), `qwen3_coder` tool parser alias
# (tool_parsers/__init__.py:181), `method: dspark` spec decode
# (config/speculative.py + v1/spec_decode/llm_base_proposer.py), and
# `--moe-backend`. **BOOT-VERIFIED 2026-10-11** (TP=1, DSpark acceptance length
# 3.67 / 88.9% rate; measured C1 77.7 t/s; house battery 33/37).
container: vllm/vllm-openai:glm53-flash@sha256:819ec9c063412e5730d1b0e82046ba540d1bf991f3c4f661a849aae8a0c52374
runtime: vllm
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4 (Mamba-2 + MoE + attn hybrid,
    3B active) on ONE DGX Spark (TP=1) — the explore lane's rank-1 pick on the
    selection weighting (1 node, 93-96 tok/s third-party measured on GB10,
    20.8 GB weights leaving ~95 GB for KV/tenants). Serve line follows the
    card's official GB10 recipe with the community working point (util 0.8,
    262k context) instead of the card's 0.91/1M, which leaves ~1 GiB free and
    swaps. **BOOT-VERIFIED 2026-10-11**: measured C1 77.7 t/s @ d0 (sigma 9.8,
    n=5) with the DSpark draft engaged (acceptance length 3.67, 88.9% rate) and
    house battery 33/37 (18 easy + 15 hard). Below the third-party 93-96 t/s on
    this node, so quote ours. ~21 GB of weights + the DSpark draft to
    distribute.
  model_url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "30B"
  model_dtype: nvfp4
  kv_dtype: fp8
  draft_model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
  model_draft_dtype: bf16
  tags: explore, fast, large_context

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  max_model_len: 262144
  # Community working point (sfxnz recipe + chishiki37 comparison): the card's
  # 0.91 leaves ~1 GiB free and swaps on GB10.
  gpu_memory_utilization: 0.8
  max_num_seqs: 32
  moe_backend: marlin
  kv_cache_dtype: fp8
  num_speculative_tokens: 3
  speculative_draft_model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
  # The draft only gets DISTRIBUTED when the spec config lives in `defaults:`
  # under this key: sparkrun's vLLM draft binding reads config["speculative_config"]
  # and adds the draft repo to the distribution set (an inline literal in the
  # command is invisible to it, and the offline engine then dies resolving the
  # draft — measured 2026-10-11). It also injects the prepared revision here.
  speculative_config: '{"method": "dspark", "model": "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark", "num_speculative_tokens": 3}'

env:
  PYTHONUNBUFFERED: '1'
# vllm/vllm-openai declares ENTRYPOINT ["vllm","serve"]; clear it so the
# recipe's own serve line runs instead of being parsed as the image's flags.
executor_config:
  entrypoint: ""

command: >
  vllm serve
  /cache/huggingface/hub/models--nvidia--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4/snapshots/bee7596271d1495f6992ae224aefde4410e816b8
  --served-model-name nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
  --revision=bee7596271d1495f6992ae224aefde4410e816b8
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --gpu-memory-utilization {gpu_memory_utilization}
  --kv-cache-dtype {kv_cache_dtype}
  --moe-backend {moe_backend}
  # 2026-10-11: this line was accidentally dropped by an edit and the pin was
  # inert — the verified 77.7 t/s boot ran with moe_backend='auto' and vLLM
  # auto-selected marlin anyway, so the number stands, but the pin now actually
  # reaches the engine. sparkrun's validation stays silent for a flag-map key
  # the template omits (report_unmapped_config_keys counts known_config_keys as
  # "reaching something") — watch for that silent-drop class in other recipes.
  --mamba-backend flashinfer
  --mamba-cache-mode align
  --reasoning-parser nemotron_v3
  --tool-call-parser qwen3_coder
  --enable-auto-tool-choice
  --default-chat-template-kwargs '{"enable_thinking": false}'
  --speculative-config '{speculative_config}'
