recipe_version: "2"
model: XHToken/Spark-X2.6-4B-FP8
model_revision: 0318d6f6ab070c7b5b43052db571489b2508006c
  # Offline engine: --revision is required (a SHA-keyed download writes no refs/ entry).
container: lmsysorg/sglang:v0.5.22-cu130@sha256:e3a4f06001a29542fc4a8638536d9ffc5eb9c9942b08603c09b19a56eae4a1ae
runtime: sglang
min_nodes: 1
max_nodes: 1

description: >-
  XHToken/Spark-X2.6-4B-FP8 on ONE DGX Spark, 131,072 context — the FP8 tier A/B against
  recipes/explore/spark-x2.6-4b-bf16-sglang.yaml, whose C1 20.38 t/s is 61 % of the bf16
  weight-traffic roofline and therefore the number this tier has to beat. 4.47 GB of weights
  (W8A8: float-quantized, weights per-channel symmetric, activations dynamic per-token,
  targets q_k_v_proj / out_proj / the MLP gate-up-down regexes), so half of the bf16 tier's
  weight traffic. The headwise attention output gate (self_attn.g_proj) stays bf16 in the
  checkpoint's own `ignore` list, and the KV cache is bf16 on both tiers.
  No --quantization flag on purpose: the checkpoint ships a compressed-tensors
  `quantization_config` and the engine auto-detects it; forcing a name is how a hybrid-SWA
  arch gets a quant path it was never measured on. Compressed-tensors on a 9-full/27-sliding
  layer stack is NOT a given — if the engine refuses the checkpoint or the pooled KV falls,
  that is the result, and this file stays a zz- probe. Pre-registered bar: ship only if it
  loads AND house is >= 37/37 thinking-on AND C1 >= 20.38 ± 0.09; otherwise the bf16 control
  ships and this is the measured-rejected row.
  MEASURED 2026-10-22 on .33 (task sparkrun_9c8e0fffc3be638_80fa71eb085e, receipt
  ~/benchmarks/spark-x26-20261022/): it LOADS — quant=compressed-tensors auto-detected with no
  flag, weights 5.52 GB in 24.78 s, TTR 130.8 s port / 145.6 s HTTP including the 4.47 GB
  distribution, and the KV pools grow to 779,390 full + 623,512 sliding tokens (5.95x the
  window). Speed is the predicted 2x: ladder 40.80 ± 0.09 / 77.06 ± 2.04 / 146.63 ± 0.15 /
  217.58 ± 2.72 t/s at c1/2/5/10 (+100 / +66 / +48 / +39 % on the bf16 control), prefill
  8,986 -> 8,496 t/s (+71 %), TTFR 232 -> 1,664 ms (the ladder's 2,048-token-prefill first token,
  not a fixed per-request TTFT — see the TTFT note below).
  SHIPPED as the fast tier, and its one real risk is RATED. `trick-2` (the 5-machines/5-widgets
  item) runs away at a 4096 cap: at served defaults it came back empty with finish_reason=length on
  **4 of 6 reps** (.35, 2026-10-22) plus 2 of 3 (.33) and 0 of 3 (an earlier .35 pass) — **6 of 12
  empty** — while at 8192 it answered "5" 3/3 after 159 / 177 / 177 reasoning tokens, **0 of 3
  empty**. The 37-item battery at 4096 still scores 37/37 stable (111/111, no flaky), so no other
  item shows the behaviour.
  **Temperature 0 does not remove it** (n=5 @ 4096, greedy, .35): **1 of 5 empty** at the cap with
  4,096 reasoning tokens; the other four answered "5" after 84 reasoning tokens each. Greedy does
  remove the WRONG-ANSWER mode — **0 of 5 wrong** against **2 of 5** at served default sampling,
  which returned `0.25` twice (finish=stop, 3,482 and 394 reasoning tokens); the default run scored
  right/wrong/empty = 1/2/2 of 5. So the trigger is NOT sampling alone: the runaway survives greedy
  decoding, i.e. per-request nondeterminism in the engine/batch path, and default sampling
  additionally degrades this item's answer.
  RETRY GUIDANCE: serve temperature 0 for math/single-answer prompts (4/5 right, 1/5 empty here);
  on `finish_reason=length` with empty content retry once; the stronger mitigation is
  `max_tokens >= 8192`, where 3 of 3 measured attempts answered and none were empty.
  Roles: this file is the FAST tier (2x the control's C1 at every rung, 40.80 ± 0.09 at C1);
  spark-x2.6-4b-bf16-sglang.yaml is the accuracy control (20.38 ± 0.09, 3/3 on this item).
  TTFT, measured on its own instrument: a trivial-prompt streaming TTFT is **96 ms cold, then
  35–37 ms warm** (median 35.7 ms, n=5), so quote the 232-vs-1,664 ms ladder pair as a
  prefill-inclusive figure for a 2,048-token prompt, never as a 7x per-request regression.

env:
  PYTHONUNBUFFERED: '1'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot path.
  served_model_name: XHToken/Spark-X2.6-4B-FP8
  gpu_memory_utilization: 0.85
  max_model_len: 131072
  max_num_seqs: 32
  chunked_prefill_size: 8192

# Same engine line as the bf16 control, minus nothing: no --attention-backend, no
# --kv-cache-dtype, no --quantization (see the description). The chat template is in the
# snapshot, so no --chat-template.
command: >
  sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser spark25
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
