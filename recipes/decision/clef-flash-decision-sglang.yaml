recipe_version: "2"
model: Cloudflare/clef-flash
model_revision: 8b2e5fd17c09fd49bc2880b805d5323ec7ff4ff3
container: lmsysorg/sglang:dev-clef@sha256:73a6d2c9ff5f3c2a67a1e9bd46f6407387fe62d75fad8c30d2ddfb4194374c1c
runtime: sglang
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Cloudflare/clef-flash — a 9B open-weight decision model (Qwen3.5-9B backbone
    + a joint schema head), Apache-2.0. Deliberately Jev/SystemOne-compatible:
    POST /v1/systemone answers choice / noul / score questions with calibrated
    probabilities and no text generation. Vendor numbers (self-reported and not
    reproduced on the community board): median 38.8 ms, 41 GB VRAM at 64k ctx,
    BFCL 98.8 / MMMU 91.8 on the vendor's own suite. Serves multimodal (text,
    JSON, images, video). Lane research:
    attic/decision/DECISION-MODELS-RESEARCH.md.
  model_url: https://huggingface.co/Cloudflare/clef-flash
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "9B"
  model_dtype: bf16
  tags: decision, smol, classifier

# No chat endpoint: the default chat-completion probe can only time out, so port + /health readiness only (the pooling-lane convention).
readiness:
  inference: false

defaults:
  port: 8020
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot path, so the served id would be the cache path.
  served_model_name: Cloudflare/clef-flash

command: >
  taskset -c 0-4,10-14 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --host {host}
  --port {port}
  --tp {tensor_parallel}