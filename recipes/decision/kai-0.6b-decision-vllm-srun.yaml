recipe_version: "2"
model: vllm-sr/Decision-2.0-Kai-0.6B
model_revision: cd49ea3813fd8ba0928a9a23ef6c9a0f2f0cd764
container: ghcr.io/vllm-project/semantic-router/vllm-sr@sha256:2c30eeb36dca047929930770d276042584e3618fd62f67923403387e0dc2e9a1
# sparkrun has no vllm-srun runtime: `runtime: vllm` is the family whose distribution + launcher contract this command satisfies.
runtime: vllm
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    vllm-sr/Decision-2.0-Kai-0.6B — the smallest Decision 2.0 model (0.60B,
    Qwen3-0.6B-Base fine-tune, 8192 ctx), served by the vendor's own
    vllm-srun runtime on CPU. Prefill-only decision scorer: POST /v1/systemone
    (and the /v1/decisions superset) answers choice / noul / score questions
    with calibrated probabilities in one forward pass — no chat surface. The
    card's numbers (JevArena 48.6, 4.9 ms/question) are GPU numbers; this
    lane serves it on the unclaimed A725 cores at no GPU cost. Apache-2.0.
    Lane research: attic/decision/DECISION-MODELS-RESEARCH.md.
  model_url: https://huggingface.co/vllm-sr/Decision-2.0-Kai-0.6B
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "0.6B"
  model_dtype: bf16
  tags: decision, smol, cpu, classifier

# No chat endpoint: /v1/systemone is the surface; /health is the golden gate, not a plain liveness.
readiness:
  inference: false
  port_timeout_s: 1800
  health_timeout_s: 1800

defaults:
  port: 8000
  host: 0.0.0.0

# The vllm-sr image's ENTRYPOINT starts the router/gateway and would consume the appended command. Keep user: root — the kill shim below writes /usr/local/bin, and the image's own uid-1000 user owns no PATH dir.
executor_config:
  user: "root"
  entrypoint: ""

# Required, not incidental: sparkrun's detached-launch liveness check runs `docker exec <c> kill -0`, this python:*-slim image ships no kill binary, and without the shim the launch is declared failed while the serve comes up healthy seconds later.
command: >
  printf '#!/bin/bash\nbuiltin kill "$@"\n' > /usr/local/bin/kill
  && chmod 755 /usr/local/bin/kill
  && taskset -c 0-4,10-14 vllm-srun serve
  vllm-sr/Decision-2.0-Kai-0.6B
  --revision=cd49ea3813fd8ba0928a9a23ef6c9a0f2f0cd764
  --device cpu
  --host {host}
  --port {port}
  --cache-dir /cache/huggingface/hub
  --served-model-name vllm-sr/Decision-2.0-Kai-0.6B
