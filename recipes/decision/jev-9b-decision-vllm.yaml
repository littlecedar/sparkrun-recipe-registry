recipe_version: "2"
model: autotrust/JEV-9B
model_revision: 7ac669b8fb476ba926491e3d1c39f9330d68dbed
container: vllm/vllm-openai:glm53-flash@sha256:819ec9c063412e5730d1b0e82046ba540d1bf991f3c4f661a849aae8a0c52374
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  autotrust/JEV-9B decision model — a distilled student of TypeSafe Jev 1.13
  (KL ~0.019 to the teacher's output distributions, 25,376 held-out rows;
  ECE 0.0007, noul AUROC 0.996). Prefill-only decision scorer over
  /v1/chat/completions with logprobs + allowed_token_ids (SystemOne-shaped);
  System 2 generation is bit-identical to the frozen Qwen3.5-9B base.
  Serves in ~17 GiB of weights and co-locates with the shipped embed+rerank
  2B pair on one node (see attic/decision/DECISION-MODELS-RESEARCH.md §3).
  BOOT-VERIFIED 2026-10-11; scored 2000-decision on the Typed Decisions test
  split (see recipes/decision/README.md).
metadata:
  model_url: https://huggingface.co/autotrust/JEV-9B
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "9B"
  model_dtype: bf16
  tags: decision, smol, classifier

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Absolute cap: the co-tenant pair's measured hold leaves ~42 GiB (0.34); 0.16 profiles a NEGATIVE
  # KV cache (-1.66 GiB) and 0.35 is refused by the free-memory check, so 0.20 (0.75 cap sum) is
  # the working floor.
  gpu_memory_utilization: 0.20
  # Mamba cache blocks scale with the cap (57 at 0.16), so the engine default 256 max_num_seqs
  # cannot capture CUDA graphs; a decision scorer needs ~32 at most.
  max_num_seqs: 32
  max_model_len: 4096
  max_lora_rank: 32

env:
  PYTHONUNBUFFERED: '1'

# vllm/vllm-openai declares ENTRYPOINT ["vllm","serve"], which would consume the command sparkrun appends; clear it so the recipe's own serve line runs.
executor_config:
  entrypoint: ""

command: >
  vllm serve
  /cache/huggingface/hub/models--autotrust--JEV-9B/snapshots/7ac669b8fb476ba926491e3d1c39f9330d68dbed
  --served-model-name autotrust/JEV-9B
  --revision=7ac669b8fb476ba926491e3d1c39f9330d68dbed
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-num-seqs {max_num_seqs}
  --max-model-len {max_model_len}
  --enable-lora
  --max-lora-rank {max_lora_rank}
  --lora-modules jev-decision=/cache/huggingface/hub/models--autotrust--JEV-9B/snapshots/7ac669b8fb476ba926491e3d1c39f9330d68dbed/adapter_vllm
  --logprobs-mode processed_logprobs
  --enable-prefix-caching
  --mamba-cache-mode align
