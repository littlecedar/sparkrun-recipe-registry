recipe_version: "2"
model: autotrust/JEV-27B
model_revision: 14b425269ed24452e0a5ad5a8f3e51d139647a88
container: vllm/vllm-openai:glm53-flash@sha256:819ec9c063412e5730d1b0e82046ba540d1bf991f3c4f661a849aae8a0c52374
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  autotrust/JEV-27B — the 27B student of TypeSafe Jev 1.13: the frozen
  Qwen3.8-27B text tower (25.6B, vision tower and MTP head dropped) plus a
  rank-16 LoRA and a 24-slot decision head re-expressed as an lm_head LoRA,
  served by native vLLM. Prefill-only decision scorer over
  /v1/completions with logprobs + allowed_token_ids (SystemOne-shaped), like
  its 9B sibling; score on completions, not chat. SOLO ONLY: 52 GB of bf16
  weights plus ~65 KB of KV per token leave no room beside the shipped
  embed + rerank caps on one GB10, so this arm is one node for one model.
  The card's own numbers (KL ~0.019 to the teacher) are not a lane score —
  the instrument pass is a new measurement. Apache-2.0.
metadata:
  model_url: https://huggingface.co/autotrust/JEV-27B
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "27B"
  model_dtype: bf16
  tags: decision, classifier

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  max_model_len: 32768
  max_lora_rank: 32

env:
  PYTHONUNBUFFERED: '1'

# vllm/vllm-openai declares ENTRYPOINT ["vllm","serve"], which would consume the command sparkrun appends; clear it so the recipe's own serve line runs.
executor_config:
  entrypoint: ""

command: >
  vllm serve
  /cache/huggingface/hub/models--autotrust--JEV-27B/snapshots/14b425269ed24452e0a5ad5a8f3e51d139647a88
  --served-model-name autotrust/JEV-27B
  --revision=14b425269ed24452e0a5ad5a8f3e51d139647a88
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --max-model-len {max_model_len}
  --enable-lora
  --max-lora-rank {max_lora_rank}
  --lora-modules jev-decision=/cache/huggingface/hub/models--autotrust--JEV-27B/snapshots/14b425269ed24452e0a5ad5a8f3e51d139647a88/adapter_vllm
  --logprobs-mode processed_logprobs
  --enable-prefix-caching
  --mamba-cache-mode align
