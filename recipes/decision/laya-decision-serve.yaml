recipe_version: "2"
model: convaiinnovations/laya
model_revision: 7b928d828b7b0e022f929d9bd2e44165aa270148
container: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
# sparkrun has no runtime family for a third-party Python server: `runtime: vllm` is the launcher/distribution contract this command satisfies (the kai/sol precedent).
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  convaiinnovations/laya — the English checkpoint (ModernBERT-large, 421M,
  512 ctx) of a multilingual, non-autoregressive System 1 decision model,
  served by the package's own laya-serve on CPU. POST /v1/systemone speaks
  the TypeSafe Jev wire shape (choice / noul / score with calibrated
  probabilities, no generated tokens), so the lane's instrument drives it
  natively. Honest limit: the base checkpoint is near chance zero-shot on
  the typed-decisions suite (0.362 against a 0.461 majority baseline) — the
  0.766 in the card belongs to the separately fine-tuned
  laya-typed-decisions checkpoint, so expect a low instrument score, and
  read the arm as a CPU-cost/calibration datapoint rather than a quality
  contender. Apache-2.0. Lane research:
  attic/decision/DECISION-MODELS-RESEARCH.md.
metadata:
  model_url: https://huggingface.co/convaiinnovations/laya
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "421M"
  model_dtype: fp32
  tags: decision, smol, cpu, classifier

# No chat endpoint: /v1/systemone is the surface (plus GET /health), so port + /health readiness only.
readiness:
  inference: false

defaults:
  port: 8000
  host: 0.0.0.0
  # Empty on purpose: laya-serve's main() ignores argv and takes no --served-model-name, while any non-empty value makes sparkrun append one. Referenced below so the key is not inert.
  served_model_name: ""

# No upstream image is published (the project ships a Dockerfile that is exactly python:*-slim + pip), so this pins the base digest and installs the released package. user: root — the kill shim writes /usr/local/bin.
executor_config:
  user: "root"
  entrypoint: ""
# torch comes from PyPI, not the download.pytorch.org/whl/cpu index: that index carries no current aarch64 wheel, while PyPI's 2.8.0 aarch64 wheel is CPU-only on this architecture anyway.
# Required, not incidental: sparkrun's detached-launch liveness check runs `docker exec <c> kill -0`, and this python:*-slim tag ships no /bin/kill (verified in the image), so without the shim the launch is declared failed while the serve comes up healthy seconds later.
# LAYA_EXTRA_MODELS re-points the bundled `english` checkpoint at the staged snapshot: without it laya-serve re-resolves the Hub at startup and the {model_revision} pin would not decide the weights. Only `english` is preloaded — a non-Latin state would auto-route to `multilingual`, which is not staged.
#
# laya-serve's main() reads no argv (uvicorn is started from LAYA_* env only), so the staged path
# travels in an environment variable. That export is also the launch contract: sparkrun's
# validate_runtime_command (models/runtime.py) shlex-splits the rendered command and accepts the
# prepared snapshot path only as a whole token or a `key=<path>` token. With {model} inside the
# printf JSON the path arrived as `<path>)`, and sparkrun refused the launch with "serve command
# does not identify the validated model". Exporting it first keeps the token `LAYA_MODEL_PATH=<path>`
# and the JSON is then built from that variable, so the path the server loads is the same string.
command: >
  printf '#!/bin/bash\nbuiltin kill "$@"\n' > /usr/local/bin/kill
  && chmod 755 /usr/local/bin/kill
  && pip install --no-cache-dir --quiet 'torch==2.8.0'
  && pip install --no-cache-dir --quiet 'laya[serve]==0.4.11'
  && export LAYA_MODEL_PATH='{model}'
  && export LAYA_EXTRA_MODELS=$(printf '{"english":"%s"}' "$LAYA_MODEL_PATH")
  && LAYA_DEVICE=cpu LAYA_PRELOAD=1 LAYA_MODELS=english LAYA_DEFAULT_MODEL=english
  LAYA_MAX_LOADED=1 LAYA_THREADS=5 LAYA_HOST={host} LAYA_PORT={port}
  taskset -c 0-4,10-14 laya-serve {served_model_name}
