recipe_version: "2"
model: vllm-sr/Decision-2.0-Nox-4B
model_revision: 25e8f67d1b486c647222df3aac640d2d5d736bbe
container: ghcr.io/vllm-project/semantic-router/vllm-sr@sha256:2c30eeb36dca047929930770d276042584e3618fd62f67923403387e0dc2e9a1
# sparkrun has no vllm-srun runtime: `runtime: vllm` is the family whose distribution + launcher contract this command satisfies.
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  vllm-sr/Decision-2.0-Nox-4B — the 4B rung of the Decision 2.0 ladder (4.21B,
  Qwen3.5-4B-Base backbone, 16384 ctx), served by the vendor's own vllm-srun
  runtime on CPU. 9.03 GiB of weights on disk (9.695 GB: five backbone shards
  + a 10.5 MB decision head) — the param-count estimate of 7.8 GiB
  understates the pack. Prefill-only decision scorer: POST /v1/systemone (and the
  /v1/decisions superset) answers choice / noul / score questions with
  calibrated probabilities in one forward pass — no chat surface. Highest
  published quality of the CPU-servable rungs (JevArena 63.6, Jev Decision
  Index 43.8); the card's 12.9 ms/question is a GPU number. Pinned to the
  runtime's own built-in revision, not the Hub head: the golden gate attaches
  by content identity (manifest sha256 49771ea3…), and only the pinned
  revision is golden-vouched. Apache-2.0. Lane research:
  attic/decision/DECISION-MODELS-RESEARCH.md.
metadata:
  model_url: https://huggingface.co/vllm-sr/Decision-2.0-Nox-4B
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "4.2B"
  model_dtype: bf16
  tags: decision, smol, cpu, classifier

# No chat endpoint: /v1/systemone is the surface; /health is the golden gate, not a plain liveness.
readiness:
  inference: false
  port_timeout_s: 1800
  health_timeout_s: 1800

defaults:
  port: 8000
  host: 0.0.0.0

# The vllm-sr image's ENTRYPOINT starts the router/gateway and would consume the appended command. Keep user: root — the kill shim below writes /usr/local/bin, and the image's own uid-1000 user owns no PATH dir.
executor_config:
  user: "root"
  entrypoint: ""

# Required, not incidental, and MEASURED 2026-10-21: as sparkrun stages it (HF_HUB_OFFLINE=1), this
# loader still calls the Hub tree API and /health answers 503 `status: loading` with
# `OfflineModeIsEnabled` retries, then never reads the staged snapshot. HF_HUB_OFFLINE=0 is the
# documented d3-edge mitigation and it boots clean here in ~30 s.
env:
  HF_HUB_OFFLINE: '0'

# Required, not incidental: sparkrun's detached-launch liveness check runs `docker exec <c> kill -0`, this python:*-slim image ships no kill binary, and without the shim the launch is declared failed while the serve comes up healthy seconds later.
command: >
  printf '#!/bin/bash\nbuiltin kill "$@"\n' > /usr/local/bin/kill
  && chmod 755 /usr/local/bin/kill
  && taskset -c 0-4,10-14 vllm-srun serve
  vllm-sr/Decision-2.0-Nox-4B
  --revision=25e8f67d1b486c647222df3aac640d2d5d736bbe
  --device cpu
  --host {host}
  --port {port}
  --cache-dir /cache/huggingface/hub
  --served-model-name vllm-sr/Decision-2.0-Nox-4B
