recipe_version: "2"
model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
# (99 GB, 37 shard files).  Do NOT unpin: this repo's `main` changed contents under us
# once already (see caveats), and an unpinned pull can land on a weights-free snapshot.
model_revision: 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd
runtime: sglang
container: lmsysorg/sglang:dev-cu13-qwen38-next-local@sha256:9d2a843c706c74bc259c0d9abf360551eb2734e1e7d255ab012a6965f10480b6
min_nodes: 2

metadata:
  description: Qwen3.8-Flash-Next NVFP4 (local-inference-lab export) - MXFP8 attention/GDN + FP8 PLE, lower weight bytes/token
  model_url: https://huggingface.co/local-inference-lab/Qwen3.8-Flash-Next-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "180B"
  model_dtype: nvfp4
  model_mtp_dtype: fp8
  kv_dtype: bf16
  tags: lcg_favorite, fast
  caveats: >
    Checkpoint is more aggressively quantized than the RadixArk export in exactly
    the attention/GDN and PLE-n-gram paths. No accuracy evaluation exists on this
    cluster for this export; benchmark wins here are NOT evidence of equal quality.
    Run an eval before adopting for anything user-facing.
    Revision note, corrected 2026-10-04: the pin below is `7c4f1bc1a2d6...`, which the HF API
    confirms is a POPULATED 36-shard / ~105.9 GB snapshot (not the weights-free 45 MB state an
    earlier session saw on `main`). The 36-vs-37 shard discrepancy recorded in WORK section 17 was
    two different revisions (`7c4f1bc1` = 36, `ada4da32` = 37), not a contradiction. `main` has
    since moved AGAIN (2026-10-02 -> `6909a5bed089`), so the earlier comment here claiming `main`
    "now points at 7c4f1bc1" is stale in detail; the ADVICE is unchanged: do not unpin. Re-check
    against the node's cache before quoting a shard count as a disk fact (the API listing and the
    bytes a node holds can diverge).

mods:
  - "@eugr/mods/drop-caches"
  # Builds /cache/runtime/labq-patched: a symlink tree over the HF snapshot with one
  # patched config.json, so SGLang's modelopt_mixed loader will accept this checkpoint.
  - "mods/fix-labquant-modelopt-mixed-flat-schema"
  # Rewrites the 128 PLE n-gram shards in that same tree from packed NVFP4 to plain
  # fp8 e4m3 and sets text_config.ple_embedding_dtype=float8_e4m3fn, so the engine
  # uses its own tested fp8 PLE path.  Without it the server gets past config parse
  # ORDER MATTERS: this mod writes real files into the tree the config mod builds,
  # and the config mod only rebuilds (rm -rf) that tree when its revision stamp
  # changes.  Keep the config mod first.  Cold cost is 51.2 GB / ~50 s per node.
  # Requires --no-ple-offload-embedding, which is set in the command below.
  - "mods/unpack-labquant-ple-nvfp4-to-fp8"
  # DIAGNOSTIC ONLY -- removable once the shared-expert scale blocker is understood.
  - "mods/diag-qwen4-unplaced-scales"
  - "mods/fix-labquant-mxfp8-weight-scale-name"
  # REQUIRED for this export to boot at all. Its GDN `linear_attn.in_proj_a`/`in_proj_b`
  # are MXFP8 at 48 rows each; fused into in_proj_ba that is n=96 (48/rank at TP=2),
  # under CUTLASS's MXFP8 floor of 128, so the load dies with
  #   ValueError: MXFP8 requires n >= 128 and k >= 128 for CUTLASS MXFP8.
  # Must run LAST: it layers onto the tree the config mod builds and reads its
  # config.json. Cost: +0.14 MB of weights per node, ~6 s. RadixArk ships these same
  # two projections BF16, so this matches the reference export rather than diverging.
  - "mods/demote-labquant-narrow-mxfp8-to-bf16"
  # Marks the patched config `language_model_only: true`, so the engine sets
  # self.visual=None (qwen3_vl.py:1243) and skips the vision tensors at load
  # (qwen4_exp.py:2004).  REQUIRED: unlike RadixArk (which leaves the vision tower BF16
  # The CLI route is unavailable: --language-model-only is refused for this arch
  # (server_args.py:7724 allows only MuseGlimmerForConditionalGeneration), so the value
  # has to come from config.json, which model_config.py:331 reads directly.
  - "mods/skip-labquant-vision-tower"
  # NB: the two fastsafetensors mods are deliberately NOT listed here even though
  # the parent recipe lists them.  This recipe benchmarks with
  # load_format=safetensors, so they accomplish nothing -- and worse, they exec as
  # unlink it).  See mods/fix-fastsafetensors-tp2-sglang/run.sh for the mechanism
  # and the reown fix.  Add them back only if you actually set
  # load_format=fastsafetensors.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_seqs: 24
  kv_dtype: bf16
  quantization: modelopt_mixed
  fp4_gemm_backend: flashinfer_cutlass
  page_size: 64
  chunked_prefill_size: 4096
  mamba_radix_cache_strategy: extra_buffer_lazy
  mamba_ssm_dtype: bfloat16
  max_mamba_cache_size: 112
  load_format: safetensors
  # Serves the mod-built patched tree, NOT the raw HF snapshot. The mod
  # (mods/fix-labquant-modelopt-mixed-flat-schema) creates this in the
  # host-local runtime cache on every node, as a symlink farm over the snapshot with
  # one patched config.json. The raw snapshot is never modified. If you bypass the
  served_model_dir: /cache/runtime/labq-patched
  speculative_algorithm: NEXTN
  speculative_attention_mode: decode
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  # Escape hatch for one-off experimentation.  `sparkrun benchmark` silently drops
  # trailing EXTRA_ARGS (click nargs=-1 arg is accepted then discarded in
  # cli/_benchmark.py), so un-parameterised server flags cannot be injected from the
  # command line.  Empty string is the no-op default; quoted so YAML keeps it a str.
  # --moe-runner-backend flashinfer_cutlass is REQUIRED here, not tuning:
  #   With `auto` the NVFP4 MoE resolves to MoeRunnerBackend.FLASHINFER_TRTLLM and the
  #   server dies ~13 minutes in, during the draft-model warmup, at modelopt_quant.py:2912
  #   with "Unsupported moe_runner_backend for NVFP4 MoE: MoeRunnerBackend.FLASHINFER_TRTLLM".
  # --cuda-graph-backend-prefill disabled is MANDATORY for this checkpoint, not a tunable.
  #   So this is not "QSA capture is flaky" and not a mis-scaled checkpoint: a non-pinned
  #   host->device copy sits inside the Triton path that prefill capture traces, and capture may
  #   legally fail on it. Disabling the prefill graph avoids that path entirely.
  #   WHY IN `defaults` AND NOT AS AN OVERRIDE: every labquant coherence PASS on record carried
  #   this flag, but always via `measurement_overrides`, never in the file. A recipe that only
  #   works when someone remembers an override is a broken deliverable, and the override is
  #   invisible in the committed file. Do not delete this line to "test" it; that test has been
  #   run and the answer is no.
  extra_args: "--moe-runner-backend flashinfer_cutlass --cuda-graph-backend-prefill disabled"

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {served_model_dir}
  --mem-fraction-static {gpu_memory_utilization}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --max-running-requests {max_num_seqs}
  --quantization {quantization}
  --fp4-gemm-backend {fp4_gemm_backend}
  --page-size {page_size}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --kv-cache-dtype {kv_dtype}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --max-mamba-cache-size {max_mamba_cache_size}
  --load-format {load_format}
  --reasoning-parser auto
  --tool-call-parser auto
  --speculative-attention-mode {speculative_attention_mode} 
  --speculative-algorithm {speculative_algorithm}
  --speculative-num-steps {speculative_num_steps}
  --speculative-eagle-topk {speculative_eagle_topk}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  --no-ple-offload-embedding
  {extra_args}

