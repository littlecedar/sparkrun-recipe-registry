recipe_version: "2"
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
model_revision: 7b719225242aacd3dbd3f9407468c2ee9a9d2594
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x@sha256:cf5a2a5324af897e1b576eecb3018331d2df0fad2285d61d4b109743be6434d8
min_nodes: 2
max_nodes: 2

description: >-
  [probe, not shippable] W12 cross-runtime bench arm — RadixArk Qwen3.8-Flash-Next-NVFP4
  on vLLM, TP=2. Cloned from attic/qwen4/arms/qwen3.8-flash-next-nvfp4-vllm.yaml
  (never benchmarked) and made attributable: checkpoint pinned, image digest-pinned.
  The b12x digest is the arm's own engine family — the serve line carries
  --moe-backend b12x, which is that build's backend name.
metadata:
  model_url: https://huggingface.co/RadixArk/Qwen3.8-Flash-Next-NVFP4
  model_params: "180B"
  model_dtype: nvfp4
  model_mtp_dtype: fp8
  kv_dtype: fp8
  tags: lcg_favorite
  caveats: >
    Cross-runtime: compare against an SGLang arm only with the flag set and the engine
    version stated, never on raw tok/s alone. The pin is RadixArk `main` as published
    2026-08-26 (unchanged since), so pinning changes no bytes today — it only stops
    `main` from moving under a measured boot. `--load-format instanttensor` comes from
    @eugr/mods/instanttensor-hybrid-draft-loader, not from the image.

mods:
  - "@eugr/mods/drop-caches"
  - "@eugr/mods/instanttensor-hybrid-draft-loader"
  - "mods/fix-qwen3.8-flash-next-vllm"

env:
  SAFETENSORS_FAST_GPU: 1
  OMP_NUM_THREADS: 1
  CUTE_DSL_ARCH: sm_121a
  MAX_JOBS: 2
  FLASHINFER_NVCC_THREADS: 1
  FLASHINFER_DISABLE_VERSION_CHECK: 1
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_TARGET_DEVICE: cuda
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  VLLM_USE_FLASHINFER_MOE_FP4: 1
  VLLM_SLEEP_WHEN_IDLE: 0
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  VLLM_PLE_FP8_CHECKPOINT: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_batched_tokens: 8192
  max_num_seqs: 12
  dtype: bfloat16
  moe_backend: b12x
  # safetensors, not instanttensor: this image's instanttensor exposes no _determine_buffer_size
  # (weight_utils.py:1679), so the index-aware shard path dies at TP=2. TP=1 never takes that
  # path, which is why the solo arm boots on the same digest. Measured 2026-10-22 (W12, TP=2).
  load_format: safetensors
  quantization: modelopt
  speculative_tokens: 3

command: >
  taskset -c 5-9,15-19 vllm serve {model}
  --host {host}
  --port {port}
  --quantization {quantization}
  --load-format {load_format}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --dtype {dtype}
  --max-model-len {max_model_len}
  --moe-backend {moe_backend}
  --max-num-batched-tokens {max_num_batched_tokens}
  --max-num-seqs {max_num_seqs}
  --reasoning-parser qwen3
  --trust-remote-code
  --speculative-config '{"method":"mtp","num_speculative_tokens":{speculative_tokens}}'
