recipe_version: "2"
model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
model_revision: 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd
runtime: sglang
container: lmsysorg/sglang:dev-cu13-qwen38-next-local@sha256:9d2a843c706c74bc259c0d9abf360551eb2734e1e7d255ab012a6965f10480b6
min_nodes: 2

# LANE A of 2 — HIGH-CONCURRENCY (batch/aggregate throughput).
#
# Sibling: `qwen3.8-flash-next-nvfp4-labquant-longctx-sglang.yaml` (Lane B, long context).
# Base/control: `qwen3.8-flash-next-nvfp4-labquant-sglang.yaml` (the shipped balanced recipe).

metadata:
  description: Qwen3.8-Flash-Next NVFP4 (local-inference-lab export) - HIGH-CONCURRENCY lane; mamba pool 128 / max_num_seqs 32 for aggregate throughput
  model_url: https://huggingface.co/local-inference-lab/Qwen3.8-Flash-Next-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "180B"
  model_dtype: nvfp4
  model_mtp_dtype: fp8
  kv_dtype: bf16
  tags: lcg_favorite, fast
  caveats: >
    Same checkpoint as the base labquant recipe: more aggressively quantised than the RadixArk
    export in the attention/GDN and PLE-n-gram paths, and it SERVES TEXT ONLY (the vision tower is
    dropped by a required mod). No accuracy evaluation exists for this export, so a throughput win
    here is NOT evidence of equal quality. Use the RadixArk recipe as the quality reference until
    an eval lands. `max_num_seqs: 32` / `max_mamba_cache_size: 128` raise admission to k≈31, but
    aggregate throughput peaks near k=16 — serving past that trades per-request rate for little
    aggregate gain.

mods:
  - "@eugr/mods/drop-caches"
  - "mods/fix-labquant-modelopt-mixed-flat-schema"
  # Rewrites the 128 PLE n-gram shards in that tree from packed NVFP4 to plain fp8 e4m3 so the
  # engine uses its tested fp8 PLE path (else `copy_ple_rows_to_tp_embedding` raises a size
  # mismatch).  ORDER MATTERS: keep the config mod first; this mod writes into the tree it builds.
  - "mods/unpack-labquant-ple-nvfp4-to-fp8"
  # DIAGNOSTIC ONLY — a logging no-op once every `_scale` finds a destination; removable when the
  # shared-expert scale blocker is retired.  See mods/diag-qwen4-unplaced-scales/README.md.
  - "mods/diag-qwen4-unplaced-scales"
  - "mods/fix-labquant-mxfp8-weight-scale-name"
  # REQUIRED to boot: demotes the 72 narrow (n=96 at TP=2) GDN in_proj_a/b MXFP8 tensors to BF16 so
  # CUTLASS's MXFP8 n>=128 floor is not violated.  Must run LAST of the tree-writing mods.
  - "mods/demote-labquant-narrow-mxfp8-to-bf16"
  # REQUIRED: marks the patched config `language_model_only: true` so the engine skips the vision
  # tower, which this export QUANTISES (110 F8_E4M3 layers + scales) and which SGLang builds with
  # quant_config=None -> no destination for the scales.  Consequence: TEXT ONLY.
  - "mods/skip-labquant-vision-tower"
  # The two fastsafetensors mods are deliberately absent (same reason as the base recipe): this
  # recipe runs `load_format: safetensors`, so they do nothing except leave root-owned JIT logs in
  # the persisted runtime cache and break the first launch of a new model key as uid 1000.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  # LANE A knobs — see the header.  cap 32 keeps every served k <= 31 strictly below the flag; the
  # mamba pool 128 raises the admission ceiling to 32 and is associated with ~13% more k=24 tok/s.
  max_num_seqs: 32
  kv_dtype: bf16
  quantization: modelopt_mixed
  fp4_gemm_backend: flashinfer_cutlass
  page_size: 64
  chunked_prefill_size: 4096
  mamba_radix_cache_strategy: extra_buffer_lazy
  mamba_ssm_dtype: bfloat16
  max_mamba_cache_size: 128
  load_format: safetensors
  served_model_dir: /cache/runtime/labq-patched
  speculative_algorithm: NEXTN
  speculative_attention_mode: decode
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  # Both flags are MANDATORY for this checkpoint, not tunables (see the base recipe header):
  #   --moe-runner-backend flashinfer_cutlass  (else `auto` -> FLASHINFER_TRTLLM, dead on SM121)
  #   --cuda-graph-backend-prefill disabled     (else qsa/metadata.py:141 PREFILL_CUDA_GRAPH_CAPTURE_FAILED)
  extra_args: "--moe-runner-backend flashinfer_cutlass --cuda-graph-backend-prefill disabled"

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {served_model_dir}
  --mem-fraction-static {gpu_memory_utilization}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --max-running-requests {max_num_seqs}
  --quantization {quantization}
  --fp4-gemm-backend {fp4_gemm_backend}
  --page-size {page_size}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --kv-cache-dtype {kv_dtype}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --max-mamba-cache-size {max_mamba_cache_size}
  --load-format {load_format}
  --reasoning-parser auto
  --tool-call-parser auto
  --speculative-attention-mode {speculative_attention_mode} 
  --speculative-algorithm {speculative_algorithm}
  --speculative-num-steps {speculative_num_steps}
  --speculative-eagle-topk {speculative_eagle_topk}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  --no-ple-offload-embedding
  {extra_args}