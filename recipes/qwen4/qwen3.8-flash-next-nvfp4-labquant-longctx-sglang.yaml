recipe_version: "2"
model: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
model_revision: 7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd
runtime: sglang
container: lmsysorg/sglang:dev-cu13-qwen38-next-local@sha256:9d2a843c706c74bc259c0d9abf360551eb2734e1e7d255ab012a6965f10480b6
min_nodes: 2

# LANE B of 2 — LONG CONTEXT (up to 1M tokens).
#
# Sibling: `qwen3.8-flash-next-nvfp4-labquant-highcon-sglang.yaml` (Lane A, high concurrency).
# Base/control: `qwen3.8-flash-next-nvfp4-labquant-sglang.yaml` (the shipped balanced recipe).

metadata:
  description: Qwen3.8-Flash-Next NVFP4 (local-inference-lab export) - LONG-CONTEXT lane; 1M-token route with YaRN RoPE extrapolation (quality-verified only to ~262k)
  model_url: https://huggingface.co/local-inference-lab/Qwen3.8-Flash-Next-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "180B"
  model_dtype: nvfp4
  model_mtp_dtype: fp8
  kv_dtype: bf16
  tags: lcg_favorite, large-context
  caveats: >
    LONG-CONTEXT IS PARTIALLY UNVERIFIED. The 1M-token setting is the YaRN extrapolation route,
    not a trained capability: the checkpoint was trained to 262144 positions with no YaRN config,
    and a neighbouring needle test was exact at 240k but failed at 300k. Use `max_model_len:
    262144` for anything user-facing until a needle gate at 512k/768k/1M passes. Same checkpoint
    caveats as the base labquant recipe: aggressively quantised (MXFP8 attention/GDN, FP8 PLE) and
    TEXT ONLY (the vision tower is dropped by a required mod); no accuracy evaluation exists for
    this export, so throughput is not evidence of equal quality.

mods:
  - "@eugr/mods/drop-caches"
  # Builds /cache/runtime/labq-patched (config.json patched so modelopt_mixed loads this checkpoint).
  - "mods/fix-labquant-modelopt-mixed-flat-schema"
  # Rewrites the 128 PLE n-gram shards NVFP4 -> fp8 e4m3.  ORDER MATTERS: keep after the config mod.
  - "mods/unpack-labquant-ple-nvfp4-to-fp8"
  # Diagnostic no-op once every scale resolves; removable when the shared-expert blocker is retired.
  - "mods/diag-qwen4-unplaced-scales"
  - "mods/fix-labquant-mxfp8-weight-scale-name"
  # REQUIRED to boot (n>=128 MXFP8 floor); must run LAST of the tree-writing mods.
  - "mods/demote-labquant-narrow-mxfp8-to-bf16"
  # REQUIRED: forces language_model_only -> skips the quantised vision tower.  TEXT ONLY.
  - "mods/skip-labquant-vision-tower"

# REQUIRED, AND NOT OBVIOUS.  This build does NOT merely warn when `--context-length` exceeds the
# checkpoint's derived length — it RAISES (VERIFIED 2026-10-04, boot `11b2c8b941e89cb9_3510a5e0d37d`):
# With this gate OFF the server never reaches model load, so the env var is load-bearing for the
# lane and travels with `max_model_len`.  (WORK §15 said this build "accepts the request with only a
env:
  SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: '1'

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  # LANE B: 1M request ceiling (the "long (1M) context" lane).  See the banner above: the
  # verified-good point is 262144; 1M is the extrapolation route with an unmeasured quality gate.
  # Requires the env var above, or the boot raises before loading.
  max_model_len: 1000000
  max_num_seqs: 24
  kv_dtype: bf16
  quantization: modelopt_mixed
  fp4_gemm_backend: flashinfer_cutlass
  page_size: 64
  chunked_prefill_size: 4096
  mamba_radix_cache_strategy: extra_buffer_lazy
  mamba_ssm_dtype: bfloat16
  max_mamba_cache_size: 112
  load_format: safetensors
  served_model_dir: /cache/runtime/labq-patched
  speculative_algorithm: NEXTN
  speculative_attention_mode: decode
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  # THREE flags here, all load-bearing:
  #  * the two MANDATORY labquant flags (moe backend + prefill-graph disable) — see base recipe.
  #  * --json-model-override-args injects the YaRN RoPE that makes >262144 positions coherent at
  #    all.  **The override MUST be nested under `text_config.rope_parameters`.**  VERIFIED
  #    (tested: flat -> `rope_type: default`; nested -> `rope_type: yarn`).  Always verify by
  #    grepping the container serve log for a non-default `rope_type` before trusting a long-context
  #    number.  `factor` 3.815 = 1_000_000/262144.
  extra_args: >-
    --moe-runner-backend flashinfer_cutlass --cuda-graph-backend-prefill disabled
    --json-model-override-args '{"text_config": {"rope_parameters": {"rope_type": "yarn", "factor": 3.815, "original_max_position_embeddings": 262144, "rope_theta": 10000000, "partial_rotary_factor": 0.25, "mrope_section": [11, 11, 10], "mrope_interleaved": true}}}'

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {served_model_dir}
  --mem-fraction-static {gpu_memory_utilization}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --max-running-requests {max_num_seqs}
  --quantization {quantization}
  --fp4-gemm-backend {fp4_gemm_backend}
  --page-size {page_size}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --kv-cache-dtype {kv_dtype}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --max-mamba-cache-size {max_mamba_cache_size}
  --load-format {load_format}
  --reasoning-parser auto
  --tool-call-parser auto
  --speculative-attention-mode {speculative_attention_mode} 
  --speculative-algorithm {speculative_algorithm}
  --speculative-num-steps {speculative_num_steps}
  --speculative-eagle-topk {speculative_eagle_topk}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  --no-ple-offload-embedding
  {extra_args}