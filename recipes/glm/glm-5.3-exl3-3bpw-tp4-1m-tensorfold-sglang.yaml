recipe_version: "2"
model: bertholomus/GLM-5.3-EXL3-3.0bpw
model_revision: 7f0573836c44803030912ffe5d051ca7587edfd6
# runtime: sglang is the shim path: sparkrun renders command: and appends its
# per-node rendezvous flags (--dist-init-addr/--nnodes/--node-rank), and the
# launcher mod maps them onto `tensorfold serve`. See the mod's README.
runtime: sglang
container: littlecedar/dgx-spark-tensorfold-glm53-exl3-3bpw:0.6.0-ddfad35@sha256:366c2d4e0d0a066f909650c4aa8df49c4a467b47a082a3cd177bef59d2b7f076
min_nodes: 4
max_nodes: 4

metadata:
  description: >-
    The full GLM-5.3 753B at EXL3 3.0bpw (~273 GB) on 4x DGX Spark (GB10),
    TP=4, TensorFold 0.6.0 from the unreleased glm-dsa-tp4 fork, 1M window
    with decode context parallelism and the checkpoint's own MTP-3 head. The
    only full-753B line that fits four nodes (69.86 GiB of weights per rank);
    the trial measured 35.7 t/s single-stream and a needle found at 1,039,064
    tokens. The launcher mod owns the engine command; receipts and the
    runbook are in recipes/glm/README.md and attic/glm/. Booted as a sparkrun
    recipe 2026-10-18 on four nodes (ready in ~4 min, 31.7 t/s per-request
    decode on a 397-token prompt, 258 s TTFT at 100,559 prompt tokens);
    quality and the 1M-window rungs are still open.
  model_params: "753B"
  model_url: https://huggingface.co/bertholomus/GLM-5.3-EXL3-3.0bpw
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_dtype: exl3
  tags: large_context, reasoning, tools

mods:
  - "mods/tensorfold-glm53-3bpw-launcher"

# The image's ENTRYPOINT is /opt/nvidia/nvidia_entrypoint.sh; clear it so the
# recipe's own command runs instead of being parsed as the image's flags.
executor_config:
  entrypoint: ""

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  # The checkpoint's own max_position_embeddings (config.json: 1048576).
  max_model_len: 1048576
  # The id the boot-verified line advertised (`--name GLM-5.3-EXL3-3.0bpw`).
  # Never {model} here: a real launch renders that to the snapshot path.
  served_model_name: GLM-5.3-EXL3-3.0bpw
  parallel: 4
  mtp_drafts: 3
  # DCP must equal tensor_parallel; the launcher fails closed otherwise.
  kv_format: q5
  dcp: 4
  extents: 1

command: >
  python3 /workspace/mods/tensorfold-glm53-3bpw-launcher/launcher.py
  --boot
  --model {model}
  --served-model-name {served_model_name}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context {max_model_len}
  --parallel {parallel}
  --mtp-drafts {mtp_drafts}
  --kv {kv_format}
  --dcp {dcp}
  --extents {extents}

readiness:
  inference: true
  port_timeout_s: 7200
  health_timeout_s: 3600
