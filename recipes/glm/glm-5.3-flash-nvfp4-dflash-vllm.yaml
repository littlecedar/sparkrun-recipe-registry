recipe_version: "2"
model: RedHatAI/GLM-5.3-Flash-NVFP4
model_revision: 36c184c6cda000a481711306df5adde42f63321a
# Digest pin, not the floating tag (2026-10-11). This is the digest docker
# resolved for `vllm/vllm-openai:glm53-flash` on a runner node (manifest-list
# digest; the Hub API's amd64-image digest is sha256:0674a3ea… inside it).
# Engine inspected device-free in this build: vLLM 0.28.1rc1.dev580+g385dce36b;
# `--tool-call-parser glm47` / `--reasoning-parser glm45` both registered
# (tool_parsers/__init__.py:57-63, reasoning/__init__.py:55-60, both alias
# glm47_moe_*); spec-decode `method: dflash` native (v1/spec_decode/dflash.py);
# GLM-5.3 arch classes present (Glm5Next*/GlmMoeDsa* in models/registry.py);
# marlin MoE path present (quantization/moe_wna16.py).
container: vllm/vllm-openai:glm53-flash@sha256:819ec9c063412e5730d1b0e82046ba540d1bf991f3c4f661a849aae8a0c52374
runtime: vllm
min_nodes: 4
max_nodes: 4

metadata:
  description: >-
    GLM-5.3-Flash NVFP4 on vLLM TP=4, the lane the RECOMMENDATIONS doc calls the
    only GLM family that fits 4 nodes with real KV headroom. Serve line is repo
    B's independently validated formula (bertholomus/glm-5.3-flash-nvfp4-gb10-tp4,
    config/runtime-formula.json), qualified receipts at 24 GiB/rank KV. NOT
    BOOT-VERIFIED on our stack: needs 4 nodes and this session has 2 free; the
    image was inspected but the engine never ran here. The DFlash2 drafter is
    CC BY-NC-ND — acceptable for this non-commercial cluster (owner decision
    2026-10-11).
  model_params: "169B"
  model_url: https://huggingface.co/RedHatAI/GLM-5.3-Flash-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_dtype: nvfp4
  kv_dtype: fp8_e4m3
  draft_model: incoai/GLM-5.3-Flash-DFlash2
  model_draft_dtype: bf16
  # Licence trap recorded in RECOMMENDATIONS §Engines: DFlash2 = CC BY-NC-ND 4.0.
  tags: large_context, fast

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  # Repo B formula, machine-readable in its runtime-formula.json.
  max_model_len: 1048576
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  block_size: 2304
  kv_cache_dtype: fp8_e4m3
  gpu_memory_utilization: 0.85
  moe_backend: marlin
  # Must live here (not inline in command:): sparkrun's vLLM draft binding reads
  # config["speculative_config"] and only then adds the draft repo to the
  # distribution set + injects the prepared revision. Inline literals leave the
  # draft undistributed and the offline engine dies resolving it.
  # The draft repo id and token count are LITERALS because a nested {placeholder}
  # inside a defaults VALUE never renders (sparkrun masks braces once, over the
  # command template only — verified 2026-10-11 on the Nemotron recipe, where it
  # made sparkrun's own json.loads die at launch). Override the whole blob to
  # experiment: -o 'speculative_config={"method": "dflash", "model": "<repo>",
  # "num_speculative_tokens": N}'. A num_speculative_tokens/speculative_draft_model
  # defaults key would be inert here and is deliberately absent.
  speculative_config: '{"method": "dflash", "model": "incoai/GLM-5.3-Flash-DFlash2", "num_speculative_tokens": 7}'

# vllm/vllm-openai declares ENTRYPOINT ["vllm","serve"]; clear it so the
# recipe's own serve line runs instead of being parsed as the image's flags.
executor_config:
  entrypoint: ""

command: >
  vllm serve
  /cache/huggingface/hub/models--RedHatAI--GLM-5.3-Flash-NVFP4/snapshots/36c184c6cda000a481711306df5adde42f63321a
  --served-model-name RedHatAI/GLM-5.3-Flash-NVFP4
  --revision=36c184c6cda000a481711306df5adde42f63321a
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --block-size {block_size}
  --kv-cache-dtype {kv_cache_dtype}
  --gpu-memory-utilization {gpu_memory_utilization}
  --enforce-eager
  --moe-backend {moe_backend}
  --reasoning-parser glm45
  --tool-call-parser glm47
  --enable-auto-tool-choice
  --speculative-config '{speculative_config}'
