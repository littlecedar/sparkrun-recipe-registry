recipe_version: "2"
model: gonuit/Qwen3-VL-Embedding-8B-AWQ-4bit
runtime: vllm
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:latest

metadata:
  description: gonuit/Qwen3-VL-Embedding-8B-AWQ-4bit — 4-bit W4A16 quant of the 8B multimodal embedding encoder, for the quality tier that still fits one DGX Spark
  model_url: https://huggingface.co/gonuit/Qwen3-VL-Embedding-8B-AWQ-4bit
  model_params: "8B"
  model_dtype: awq4
  kv_dtype: bf16
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  # vision + embedding: multimodal Qwen3-VL pooling encoder (--runner pooling / --convert embed).
  tags: fast, lcg_favorite, vision, embedding

mods:
  - "@littlecedar/mods/pip-install-orjson"

# A pooling engine has no chat endpoint; the chat-completion probe can only time out
# (see the 2B embedding recipe and the lane README).
readiness:
  inference: false

defaults:
  # Third slot in the single-node port plan: 8010 embed-2B, 8011 rerank-2B, 8012 embed-8B.
  port: 8012
  host: 0.0.0.0
  tensor_parallel: 1
  # Whole fast cluster by default (solo). When colocating, drop to `-o cpu_mask=5-9` and
  # leave the reranker on 15-19 so the two engines do not share a core.
  cpu_mask: 5-9,15-19
  # Encoder-only tier, so a larger cap than the 2B's: no reranker shares this budget. Do
  # NOT size from `sparkrun recipe vram`'s "Model weights" line — it is wrong for awq4 (real
  # 6.01 GB on disk); see the lane README.
  gpu_memory_utilization: 0.30
  max_model_len: 32768
  max_num_batched_tokens: 16384
  max_num_seqs: 32
  dtype: bfloat16
  load_format: instanttensor
  attention_backend: b12x
  # b12x aborts on vLLM's default block size; 128 is _B12X_PREFERRED_PAGE_SIZE in b12x.py.
  block_size: 128
  # Pin the pooling/embed conversion instead of relying on vLLM's default detection.
  convert: embed
  # Cap multimodal inputs per prompt (vLLM's default is 999 images) to bound the profiled
  # peak on a shared-memory box. Folded style + embedded quotes keep the JSON as ONE shell
  # word; convert/limit_mm_per_prompt reach vLLM only through the placeholders below.
  limit_mm_per_prompt: >-
    '{"image": 4, "video": 1}'

command: >
  taskset -c {cpu_mask} vllm serve {model}
  --runner pooling
  --convert {convert}
  --limit-mm-per-prompt {limit_mm_per_prompt}
  --dtype {dtype}
  --gpu-memory-utilization {gpu_memory_utilization}
  -tp {tensor_parallel}
  --host {host}
  --port {port}
  --max-model-len {max_model_len}
  --max-num-batched-tokens {max_num_batched_tokens}
  --max-num-seqs {max_num_seqs}
  --attention-backend {attention_backend}
  --block-size {block_size}
  --load-format {load_format}
  --trust-remote-code

