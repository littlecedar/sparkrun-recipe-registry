# MEASURED — serves on one GB10 (2026-10-22, `.34`; two boots, TTR 437.0 s cold /
# 417.0 s compile-cache warm): warm single-stream RTF 0.848 ± 0.015 at ~4.6 s of audio
# and 0.813 at 28.7 s, streaming PCM TTFA 0.646 s, 44.1 kHz mono 16-bit out.
# Determinism: **pass `seed`** — seeded takes are byte-identical (10/10) and length
# scales with input (0.357 s/word at 13 words, 0.327 at 44); unseeded, one 13-word
# sentence returns 4.2–7.7 s of audio (σ 0.93, n=10), so never compare two unseeded
# takes. `temperature` is not a request field on this API (server default; only
# `seed`, `max_new_tokens`, `speed`, `response_format`, … are). Intelligibility is
# unmeasured — no ASR/speaker model on the node; the owner's ears are the open cell.
# `fishaudio/drama-3` is license-gated: the FISH AUDIO COMMUNITY LICENSE AGREEMENT
# v1.0 allows non-commercial and research use, and commercial use only below a
# USD 500,000 annual-revenue threshold; read LICENSE.md in the checkpoint before
# serving this to anyone. Weights stay in the HF cache, never in the image.
#
# History worth keeping: the first boot (same node) loaded the model in 242.84 s and
# was killed 2 s after torch.compile finished, because vllm-omni defaults
# `--stage-init-timeout 300` and cold load+compile was ~298 s. Hence 1800 below —
# boot with no override, and do not trust a port answer as readiness (`/v1/models`
# must name fishaudio/drama-3; a foreign listener once satisfied a port probe).
recipe_version: "2"
model: fishaudio/drama-3
model_revision: b2b5ee998034b2975720906c815e7fb0e9f007bd
container: vllm/vllm-omni:nightly-15bce345863c6e2db882534876b8977f5b1ae1e3@sha256:f3473cb3ee7577d4e2595aa6c33eebe6734f79df26cb76c1f03f35542cab5a45
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  fishaudio/drama-3 — 35B total / 3B active TTS with a 10-codebook audio
  decoder, served by vLLM-Omni (`vllm-omni serve --omni`) on ONE DGX Spark.
metadata:
  model_url: https://huggingface.co/fishaudio/drama-3
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "35B"
  model_dtype: fp8
  tags: media, tts, audio, single_user, license-gated

executor_config:
  entrypoint: ""
env:
  PYTHONUNBUFFERED: '1'
  MAX_JOBS: '4'

readiness:
  inference: false
  port_timeout_s: 3600
  health_timeout_s: 1800

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: fishaudio/drama-3
  max_model_len: 3072
  max_num_seqs: 8
  mamba_ssm_cache_dtype: bfloat16
  stage_init_timeout: 1800  # vllm-omni's 300 s default is a deadline for the load+compile budget, not a load time: 242.84 s of weights + 34.66 s of torch.compile overshot it by 2 s on 2026-10-22
  stage_overrides: '{"0": {"gpu_memory_utilization": 0.55}, "1": {"gpu_memory_utilization": 0.06}}'

command: >
  vllm-omni serve
  {model}
  --omni
  --served-model-name {served_model_name}
  --revision {model_revision}
  --host {host}
  --port {port}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --mamba-ssm-cache-dtype {mamba_ssm_cache_dtype}
  --stage-init-timeout {stage_init_timeout}
  --stage-overrides '{stage_overrides}'
