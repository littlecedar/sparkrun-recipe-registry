recipe_version: "2"
model: OpenMOSS-Team/MOSS-Image-SFT
model_revision: f972bd4b4b9e3852133cc5da954d87bc32cd8fb9
# No sglang/vLLM engine serves the checkpoint: `MOSSImagePipeline` ships inside
# it and loads via `custom_pipeline="pipeline_moss_image"` + `trust_remote_code`.
# `runtime: vllm` is the distribution + single-node launcher contract the
# sibling diffusers arms use; the engine is the kromoss launcher's staged venv.
container: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  OpenMOSS-Team/MOSS-Image-SFT — the vendor's 5.08B-param MOSS-Image
  text-to-image checkpoint (Qwen3.5-9B text encoder + FLUX.2-small VAE decoder,
  1024 px), served on ONE DGX Spark by the repo's own `MOSSImagePipeline` under
  the media lane's diffusers launcher. 27.23 GB of weights: transformer 10.16 +
  text encoder 16.79 + VAE 0.25; ~30-36 GiB peak expected. Sampling is the
  card's flow-matching control, not a distilled path: 50 steps at CFG 3 with
  `uncond_skip_layers=[22]`, i.e. ~100 DiT forwards per image, so the step
  count is the arm's latency lever. NOT booted: every cell is unmeasured.
  Apache-2.0 (weights and the bundled pipeline code) — no banner, no threshold.
metadata:
  model_url: https://huggingface.co/OpenMOSS-Team/MOSS-Image-SFT
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "5.08B"
  model_dtype: bf16
  tags: media, image, single_user

mods:
  - "mods/kromoss-launcher"

executor_config:
  # vllm/vllm-openai declares ENTRYPOINT ["vllm","serve"]; clear it so the
  # recipe's own server line runs instead of being parsed as vLLM flags.
  entrypoint: ""

# No chat surface: readiness is the port plus the server's own /health.
readiness:
  inference: false
  port_timeout_s: 2400
  health_timeout_s: 1200

defaults:
  port: 8000
  host: 0.0.0.0
  # Advertised id (never {model}, which renders the snapshot path on a launch).
  served_model_name: OpenMOSS-Team/MOSS-Image-SFT
  # `none` = the card's plain 50-step CFG-3 control; a kohya-key DMD/turbo LoRA
  # path applies unmerged through the launcher's forward-hook recipe.
  lora: none
  lora_strength: 1.0

command: >
  /cache/runtime/kromoss/venv/bin/python
  /workspace/mods/kromoss-launcher/server.py
  --model {model}
  --served-model-name {served_model_name}
  --host {host}
  --port {port}
  --sample-dir /cache/runtime/kromoss/samples
  --sample-prefix moss-image-sft
  --lora {lora}
  --lora-strength {lora_strength}
