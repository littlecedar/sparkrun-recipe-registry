recipe_version: "2"
model: MiniMaxAI/MiniMax-H3
model_revision: 42ed227ee7df40d41602854ae760620d6eb651fe
container: lmsysorg/sglang:v0.5.22-cu130@sha256:e3a4f06001a29542fc4a8638536d9ffc5eb9c9942b08603c09b19a56eae4a1ae
runtime: sglang
min_nodes: 1
max_nodes: 1

description: >-
  MiniMaxAI/MiniMax-H3 — joint video+stereo-audio diffusion model (33.1B DiT
  x50 layers + a 33.4B Qwen3-VL-32B text encoder + f16t4d24 visual VAE + a
  0.56 GiB audio VAE), served on ONE DGX Spark with SGLang v0.5.22's native
  diffusion pipeline. DRAFT, never booted. The shipped set is 134.1 GiB bf16
  against ~109 GB of usable unified memory, so this arm runs the
  AdaLN-pruned FP8 DiT (19.52 GiB) with an NVFP4-AWQ text encoder
  (14.61 GiB), the fp16 visual VAE and the fp32 audio VAE: 39.54 GiB / 42.5 GB
  resident, ~58 GB of headroom. INT8 ConvRot is deliberately absent — GB10 is
  sm_121 and has no int8 scaled GEMM ("No implemented int8_scaled_mm for
  current compute capability"), so every INT8/W6A8/W4A8 component in the Hub
  census is unavailable here, not untested. Task is `t2va`/`fl2va` (text or
  first/last frame -> video + 32 kHz stereo audio, 4-15 s, 768p, 24 fps).
  LICENSE: territorial — deployable at a NON-US site only; read the banner.
metadata:
  model_url: https://huggingface.co/MiniMaxAI/MiniMax-H3
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "33.1B"
  model_dtype: fp8
  quant_bits: "8"
  model_type: diffusion
  tags: media, video, audio, single_user

defaults:
  port: 30010
  host: 0.0.0.0
  model_variant: fl2va
  # Never {model}: on a real launch sparkrun rebinds it to the prepared
  # snapshot path, which is the repo root SGLang needs (it maps the variant
  # subdirectory itself; do not point --model-path at a subdirectory).
  served_model_name: MiniMaxAI/MiniMax-H3
  num_gpus: 1
  # `auto` is the model-aware residency policy (auto_tune.py
  # DEFAULT_KEEP_RESIDENT_MIN_AVAILABLE_GB = 120.0); `speed` keeps components
  # resident and OOMs if the workload does not fit, `memory` forces layerwise
  # offload that buys nothing when host and GPU memory are the same pool.
  performance_mode: auto
  # Component values are OWNER/REPO/path/FILE; SGLang reads each file header
  # for shape and dtype. Pre-quantized files must not be combined with
  # --quantization or --component-quantizations.*. The audio VAE (0.60 GB
  # fp32) is not overridden; the base repo supplies it.
  dit_weights: Comfy-Org/MiniMax-H3/diffusion_models/minimax_h3_fl2va_pruned_fp8_scaled.safetensors
  text_encoder_weights: Comfy-Org/MiniMax-H3/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  video_vae_weights: Comfy-Org/MiniMax-H3/vae/minimax_h3_video_vae_fp16.safetensors

readiness:
  # No chat surface: readiness is the port plus SGLang's /health, which only
  # answers once server_warmup_done is set (http_server.py:186-189). Expect a
  # multi-minute load and a first-use JIT compile on GB10.
  inference: false
  port_timeout_s: 3000
  health_timeout_s: 2400

# The pin has to reach the engine (sparkrun downloads by commit SHA, which
# writes no refs/ entry, under HF_HUB_OFFLINE=1), but SGLang hands that one
# revision to EVERY component load — `revision=server_args.revision` on
# get_hf_config and on all three from_pretrained paths in
# multimodal_gen/runtime/loader/component_loaders/component_loader.py — and the
# Comfy-Org repo carries no commit 42ed227e. First boot decides this; the fix
# is a mods/ stage that links the component files into the prepared snapshot
# and passes directory paths.
#
# FIRST-BOOT QUESTION: an AdaLN-pruned DiT may need
# `--minimax-h3-adaln-online` (which requires UNQUANTIZED weights) or a cache
# built from the unquantized checkpoint by tools/build_minimax_h3_adalcache
# (`--minimax-h3-adaln-cache-path`, server_args.py:2239-2245). Read the serve
# log for the pipeline's AdaLN decision before changing precision.
#
# WALL TIME. The published 12.1 s/step is a vendor figure on an RTX PRO 6000
# Blackwell at 480p; GB10 is a fraction of that GPU. Budget: ~10-12 min load,
# ~5.5 min for the Qwen3-VL encoder pass, then the denoise loop - so a warm
# 4-5 s 768p clip is expected in the 15-30 min band and the falsifier bar is
# 30 min. If wall time is what breaks the arm, the lever is Comfy's Turbo LoRA
# (loras/minimax_h3_fl2v_turbo_4step_v1.0_768p_comfyui_bf16, 4 or 8 steps
# instead of ~50); whether SGLang v0.5.22 can load a diffusion LoRA is
# unverified and is NOT part of this draft.
#
# No '#' inside the folded block below: folding joins every line into one shell
# word, so a comment there would swallow the flags that follow it.
command: >
  sglang serve
  --model-path {model}
  --revision {model_revision}
  --model-variant {model_variant}
  --served-model-name {served_model_name}
  --component-weights-paths.transformer {dit_weights}
  --component-weights-paths.text_encoder {text_encoder_weights}
  --component-weights-paths.video_vae {video_vae_weights}
  --num-gpus {num_gpus}
  --performance-mode {performance_mode}
  --host {host}
  --port {port}
