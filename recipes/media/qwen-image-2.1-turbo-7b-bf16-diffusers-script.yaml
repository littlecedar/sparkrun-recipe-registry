recipe_version: "2"
model: Qwen/Qwen-Image-2.1-Turbo
model_revision: fc13ba1986fcb905854dc8de2f52eee395f49b5b
# No sglang/vLLM engine exists for this checkpoint: `runtime: vllm` is the
# family whose distribution + single-node launcher contract this command
# satisfies (the engine is diffusers' QwenImage21Pipeline, venv staged by the mod).
container: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  Qwen/Qwen-Image-2.1-Turbo — text-to-image and image-editing checkpoint
  (7B visual-generation DiT + Qwen3-VL text encoder + VAE, ~32.5 GB bf16),
  8-step distilled schedule at CFG=1, served on ONE DGX Spark by diffusers'
  `QwenImage21Pipeline` under a script launcher (no sglang/vLLM engine
  exists for it). The checkpoint ships its own sampling schedule
  (`sample_sigmas` in model_index.json) and prefix-KV context caching is on
  by default. LICENSE: qwen-research — NON-COMMERCIAL ONLY (see the banner
  at the top of this file). The mod stages a diffusers>=0.41 /
  transformers>=5.17 venv on the image's torch and runs the HTTP server in
  recipes/explore/mods/qwen-image-2.1-turbo-launcher/server.py (POST /generate, GET /health).
metadata:
  model_url: https://huggingface.co/Qwen/Qwen-Image-2.1-Turbo
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "7B"
  model_dtype: bf16
  tags: explore, image, single_user

mods:
  - "mods/qwen-image-2.1-turbo-launcher"

executor_config:
  # vllm/vllm-openai declares ENTRYPOINT ["vllm","serve"]; clear it so the
  # recipe's own server line runs instead of being parsed as vLLM flags.
  entrypoint: ""
readiness:
  # No chat surface: readiness is the port plus the server's own /health, not
  # an inference probe (the Decision lane's classifier arms use the same
  # convention).
  inference: false
  port_timeout_s: 2400
  health_timeout_s: 1200

defaults:
  port: 8000
  host: 0.0.0.0
  # Declared so the server advertises the repo id, not the path sparkrun
  # rebinds `{model}` to on a real launch; naming the flag also stops the
  # runtime's own `--served-model-name` append.
  served_model_name: Qwen/Qwen-Image-2.1-Turbo

command: >
  /cache/runtime/qwen-image/venv/bin/python
  /workspace/mods/qwen-image-2.1-turbo-launcher/server.py
  --model {model}
  --revision {model_revision}
  --served-model-name {served_model_name}
  --host {host}
  --port {port}
  --sample-dir /cache/runtime/qwen-image/samples
