recipe_version: "2"
model: orcarouter/OrcaCyber-Nano-1.0:Mix-13G
model_revision: 1af1635aa22b97e965450c2d69525761d9bd463f
runtime: llama-cpp
# Same engine floor as the 15.7G arm: `qwen35` with the in-file MTP graph and
# the `qwen3vl_merger` projector.
container: littlecedar/dgx-spark-llama-cpp:upstream-a37cc46-cu130@sha256:ef2d4bc8983f1cfa5d097ec0c3d57e1a0214450ec7c2e2dd7bc454b5d6ca2d93
mmproj: mmproj-OrcaCyber-Nano-1.0-AI-Defense-F16.gguf
min_nodes: 1
max_nodes: 1

description: >-
  OrcaCyber Nano 1.0 "AI Defense" at the vendor's 13G tier — 12,993,304,352 B
  / 12.10 GiB, 3.80 bpw — on ONE DGX Spark through llama.cpp, with the F16
  vision projector and the checkpoint's own in-file MTP head as speculative
  decode. This is the A/B control of the shipped 15.7G arm
  (orcacyber-nano-1.0-15.7g-gguf-llamacpp.yaml, QUESTIONS.md #12), not a
  default: 63 tensors sit at IQ2_S/IQ3_XXS, a visible quality risk against the
  15.7G tier's imatrix mix. Same 27.32B dense body as the 15.7G arm — GGUF-only
  (`general.architecture = qwen35`, 48 gated-delta-net + 16 full-attention
  layers), so llama.cpp is the only engine and the arm is single-node by
  construction.
metadata:
  model_url: https://huggingface.co/orcarouter/OrcaCyber-Nano-1.0
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "27.32B"
  # No table entry covers a mixed tier; iq3_xxs is the packing-width estimator
  # key (0.375 B/weight), not a claim about the tensor mix (IQ3_S 122 ·
  # IQ3_XXS 39 · IQ2_S 24 · Q3_K 1 · IQ4_XS 199 · Q6_K 96 · Q5_K 17 · Q4_K 8).
  model_dtype: iq3_xxs
  kv_dtype: fp16
  tags: cybersec, vision, reasoning, speculative-decode, gguf
  caveats: >
    Gated (gated: auto; the card says license other / qwen and the repo ships no
    LICENSE file) — each node needs an HF_TOKEN with this repo's release
    accepted. The GGUF's own tags read abliterated, uncensored: it answers
    prompts its base refuses and the operator owns the guardrails. Control tier
    per QUESTIONS.md #12: run beside the 15.7G default for the tier A/B, never
    as the default serve. 27.32B dense at 3.80 bpw reads ~13 GB per token, so
    the GB10 roofline is ~20 t/s — expect the speed side of the trade and treat
    quality cells against the 15.7G arm's receipts.

executor_config:
  # ENTRYPOINT ["/usr/local/bin/llama-server"]: clear it or sparkrun's
  # appended `bash -c <cmd>` is parsed as llama-server's own flags.
  entrypoint: ""

defaults:
  port: 8000
  host: 0.0.0.0
  # Never {model}: on a real launch sparkrun rebinds it to the staged GGUF
  # file, so the served id would be the cache path (-n hides this).
  served_model_name: orcarouter/OrcaCyber-Nano-1.0
  ctx_size: 32768
  parallel: 4
  n_gpu_layers: 999
  flash_attn: auto
  reasoning_format: deepseek
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  # The MTP head is inside the main file; `draft-mtp` needs no `-md`.
  spec_type: draft-mtp
  spec_draft_n_max: 3
  # `--no-mmap` was removed at a37cc4610 (it is `--load-mode`, common/arg.cpp:2695);
  # a launch died on the old spelling.
  load_mode: none

command: >
  llama-server -hf {model}
  --alias {served_model_name}
  --host {host}
  --port {port}
  --ctx-size {ctx_size}
  --parallel {parallel}
  --kv-unified
  --n-gpu-layers {n_gpu_layers}
  --temp {temperature}
  --top-p {top_p}
  --top-k {top_k}
  --flash-attn {flash_attn}
  --reasoning-format {reasoning_format}
  --spec-type {spec_type}
  --spec-draft-n-max {spec_draft_n_max}
  --jinja
  --no-webui
  --load-mode {load_mode}
  --cont-batching
