recipe_version: "2"
model: orcarouter/Qwen3.8-27B-Uncensored-NVFP4
model_revision: f8489198f18fcd94b124541adaba3d9cb14a7ef4
runtime: sglang
container: lmsysorg/sglang:dev-cu13@sha256:0b3e39704480c423d8a00ca15ebee63154defc62944df2d4b11c594563bab457

description: Qwen3.8-27B-Uncensored-NVFP4 - abliterated mixed NVFP4+FP8 build, served with SGLang NEXTN spec decode on the checkpoint's own BF16 MTP head
metadata:
  model_url: https://huggingface.co/orcarouter/Qwen3.8-27B-Uncensored-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "27B"
  model_dtype: nvfp4
  model_mtp_dtype: bf16
  kv_dtype: fp8_e4m3
  tags: vision
  caveats: >
    Abliterated (refusal-direction removed, Arditi et al. 2024) and strict for legitimate
    red-team / interpretability research: it will comply with prompts the base refuses, and the
    operator owns the guardrails. Gated (gated: auto) — each node needs an HF_TOKEN with this
    repo's release accepted. Mixed-precision compressed-tensors (NVFP4 FFN + FP8 attention/GDN,
    static FP8 KV cache); capability numbers for THIS build are unmeasured by the uploader.
    This is the spec-decode sibling of qwen3.8-27b-uncensored-nvfp4-sglang (the plain-decode
    control, 10.2 t/s C1): NEXTN runs the checkpoint's 15 BF16 mtp.* tensors, so the only
    difference from the control is the speculative block. Ladder measured 2026-10-24, receipt
    ~/benchmarks/tp2-queue-20261024/REPORT.md.

mods:
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/pip-install-fastsafetensors"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: orcarouter/Qwen3.8-27B-Uncensored-NVFP4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 24
  mamba_full_memory_ratio: 3.51
  # The checkpoint declares float32; bfloat16 is deliberate (bit-identical on the state-read
  # path, ~2x the granted mamba-state concurrency). Do not "restore float32".
  mamba_ssm_dtype: bfloat16
  mamba_radix_cache_strategy: extra_buffer_lazy
  kv_cache_dtype: auto
  attention_backend: flashinfer
  chunked_prefill_size: 4096
  load_format: fastsafetensors
  # NEXTN is the engine's alias for EAGLE with the target's own MTP head: no
  # --speculative-draft-model-path, nothing extra for sparkrun to distribute.
  speculative_algorithm: NEXTN
  speculative_attention_mode: decode
  speculative_num_steps: 3
  # topk 1 (linear chain) forces num_draft_tokens == num_steps + 1; the engine
  # warns and overwrites any other width, so 4 is the only legal value here.
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  extra_args: ""

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --revision {model_revision}
  --load-format {load_format}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --mamba-full-memory-ratio {mamba_full_memory_ratio}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --kv-cache-dtype {kv_cache_dtype}
  --speculative-attention-mode {speculative_attention_mode}
  --speculative-algorithm {speculative_algorithm}
  --speculative-num-steps {speculative_num_steps}
  --speculative-eagle-topk {speculative_eagle_topk}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  {extra_args}
