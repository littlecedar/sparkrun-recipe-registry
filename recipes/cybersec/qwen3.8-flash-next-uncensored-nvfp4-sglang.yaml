recipe_version: "2"
model: orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
model_revision: cd56f6c148c6287cf26fa6618223ad046b9af27c
runtime: sglang
container: lmsysorg/sglang:dev-cu13-qwen38-next-local@sha256:9d2a843c706c74bc259c0d9abf360551eb2734e1e7d255ab012a6965f10480b6
min_nodes: 2

metadata:
  description: Qwen3.8-Flash-Next-Uncensored-NVFP4 - abliterated 180B MoE (qwen4_exp, NVFP4 experts / FP8 attention), 2x DGX Spark
  model_url: https://huggingface.co/orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "180B"
  model_dtype: nvfp4
  model_mtp_dtype: bf16
  kv_dtype: bf16
  tags: fast, vision
  caveats: >
    Abliterated (refusal-direction removed) build of Qwen/Qwen3.8-Flash-Next, released for
    red-team / safety research: it will comply with prompts the base refuses, and the operator
    owns the guardrails. Gated (gated: auto) - each node needs an HF_TOKEN with this repo's
    release accepted. Compressed-tensors NVFP4 experts + FP8 attention, weight-only (KV stays
    bf16); ~184 GB on disk sits close to the two-node 0.85 capacity ceiling, so util is 0.85.

mods:
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/pip-install-fastsafetensors"
  - "mods/fix-fastsafetensors-tp2-sglang"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 8
  kv_dtype: bf16
  quantization: compressed-tensors
  fp4_gemm_backend: flashinfer_cutlass
  page_size: 64
  chunked_prefill_size: 4096
  mamba_radix_cache_strategy: extra_buffer_lazy
  mamba_ssm_dtype: bfloat16
  max_mamba_cache_size: 112
  load_format: safetensors
  speculative_algorithm: NEXTN
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  extra_args: ""

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --mem-fraction-static {gpu_memory_utilization}
  --host {host}
  --revision {model_revision}
  --port {port}
  --tp {tensor_parallel}
  --max-running-requests {max_num_seqs}
  --quantization {quantization}
  --fp4-gemm-backend {fp4_gemm_backend}
  --page-size {page_size}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --kv-cache-dtype {kv_dtype}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --max-mamba-cache-size {max_mamba_cache_size}
  --load-format {load_format}
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --speculative-algorithm {speculative_algorithm}
  --speculative-num-steps {speculative_num_steps}
  --speculative-eagle-topk {speculative_eagle_topk}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  --no-ple-offload-embedding
  {extra_args}
