recipe_version: "2"
model: sakamakismile/Qwen3.8-27B-AEON-ULTIMATE-UNCENSORED-NVFP4
model_revision: 8d5a3317b4fcb6f278e1cde7fcae5ed88a27443a
runtime: sglang
container: lmsysorg/sglang:dev-cu13

metadata:
  description: >-
    Qwen3.8-27B abliterated "cyber unlock" on one DGX Spark - AEON-7 uncensored NVFP4 body
    + the drowzeys cybersecurity-unlock chat template + incoai DFlash2 spec decode
  model_url: https://huggingface.co/drowzeys/keys-Qwen3.8-27B-NVFP4-DFlash2-Ablit-Cybersecurity-Unlock-1M-Context-YARN-Single-DGXSpark
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "27B"
  model_dtype: nvfp4
  model_draft_dtype: bf16
  kv_dtype: fp8_e4m3
  tags: fast, vision
  caveats: >
    Community compile, not a new model: the overlay repo ships no weights. The body is AEON-7's
    abliterated (refusal-removed) NVFP4 pack and the served chat template is the overlay's
    cybersecurity-unlock template -- strictly for legitimate red-team / security research, and the
    operator owns the guardrails. Two gated components: the overlay (gated: auto) and the body
    repo; each node needs an HF_TOKEN with both releases accepted. The 1M YaRN seat in the
    overlay's own docs needs a rope override and no draft (see the lane README); this recipe ships
    the 262144-token native seat.

mods:
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/pip-install-fastsafetensors"
  - "mods/provide-uncensored-chat-template"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: sakamakismile/Qwen3.8-27B-AEON-ULTIMATE-UNCENSORED-NVFP4
  # Written by mods/provide-uncensored-chat-template into the managed runtime cache.
  chat_template_path: /cache/runtime/uncensored-template/chat_template.jinja
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  # The body is a dense 27B (48 GDN + 16 full-attention layers), so this is the same
  # mamba-state-pool clamp documented for the qwen3.8-27B NVFP4 recipe: the literal is
  # NOT the granted concurrency (read `capped to` in the serve log).
  max_num_seqs: 48
  mamba_full_memory_ratio: 3.51
  mamba_ssm_dtype: bfloat16
  mamba_radix_cache_strategy: extra_buffer_lazy
  kv_cache_dtype: auto
  attention_backend: flashinfer
  chunked_prefill_size: 4096
  load_format: fastsafetensors
  speculative_algorithm: DFLASH
  speculative_draft_model: incoai/Qwen3.8-27B-DFlash2
  # 8, the block size the incoai draft was trained for (the overlay's own seat used n=7).
  speculative_draft_tokens: 8
  extra_args: ""

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --trust-remote-code
  --chat-template {chat_template_path}
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --load-format {load_format}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --chunked-prefill-size {chunked_prefill_size}
  --revision {model_revision}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --mamba-full-memory-ratio {mamba_full_memory_ratio}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path {speculative_draft_model}
  --speculative-num-draft-tokens {speculative_draft_tokens}
  --kv-cache-dtype {kv_cache_dtype}
  {extra_args}
