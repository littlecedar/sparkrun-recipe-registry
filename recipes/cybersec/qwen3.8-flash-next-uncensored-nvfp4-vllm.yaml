recipe_version: "2"
model: orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
model_revision: cd56f6c148c6287cf26fa6618223ad046b9af27c
runtime: vllm
# b12x build, not the plain eugr nightly: the nightly's vLLM carries PR #59533 (merged 2026-10-05),
# which fuses the QSA indexer into qkv_proj and makes compressed-tensors refuse an ignored shard.
# This image's source predates it (three-shard mapping), and the qwen4 lane's solo arm already runs
# this exact digest with a full suite. Re-pin only when upstream PR #62318 lands.
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x@sha256:cf5a2a5324af897e1b576eecb3018331d2df0fad2285d61d4b109743be6434d8
min_nodes: 2

description: Qwen3.8-Flash-Next-Uncensored-NVFP4 - abliterated 180B MoE (qwen4_exp, NVFP4 experts / FP8 attention), 2x DGX Spark, on the vLLM route its card documents
metadata:
  model_url: https://huggingface.co/orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "180B"
  model_dtype: nvfp4
  model_mtp_dtype: bf16
  kv_dtype: bf16
  tags: vision
  caveats: >
    Abliterated (refusal-direction removed) build of Qwen/Qwen3.8-Flash-Next, released for
    red-team / safety research: it will comply with prompts the base refuses, and the operator
    owns the guardrails. Gated (gated: auto) - each node needs an HF_TOKEN with this repo's
    release accepted. ENGINE ROUTE: the sibling SGLang recipe dies at scheduler init because
    SGLang's compressed-tensors loader maps this export's `mixed-precision` config to
    CompressedTensorsW4A16Sparse24 and refuses it; this arm is the card's vLLM route, where the
    same config resolves per group to CompressedTensorsW8A16Fp8 (FP8 attention/GDN) and
    CompressedTensorsW4A4Fp4 (NVFP4 experts). The plain eugr nightly does NOT load it (measured
    2026-10-19, two launches): its vLLM carries PR #59533, which fuses the bf16 QSA indexer into
    qkv_proj's four-shard mapping and makes compressed-tensors refuse the mixed scheme, and
    --enable-lora swaps the mapping too late for the quantizer. The b12x build above predates that
    PR, and the qwen4 lane's solo arm already runs this digest with a full suite. ~183.5 GB of weights and ~184 GB residency at
    util 0.85 sit near the two-node ceiling.

mods:
  - "@eugr/mods/drop-caches"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  quantization: compressed-tensors
  # Weight-only quant (KV stays bf16; the export ships no kv_cache_scheme).
  kv_dtype: bfloat16
  extra_args: ""

command: >
  taskset -c 5-9,15-19 vllm serve {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --trust-remote-code
  --quantization {quantization}
  --kv-cache-dtype {kv_dtype}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --gpu-memory-utilization {gpu_memory_utilization}
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --enable-auto-tool-choice
  {extra_args}