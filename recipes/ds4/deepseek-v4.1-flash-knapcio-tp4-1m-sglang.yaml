recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash
# Serve this checkpoint. The image's boot.py bakes fb2764a5… (boot.py:24 REVISION)
# but never acts on it here: the launcher sets SKIP_PREPARE=1 and hands boot.py the
# sparkrun-distributed snapshot path rendered from {model}, so this pin -- not the
# image -- selects the weights. Pinned to `main`, 5254448103b6… (2026-10-12), which
# every node cache already holds. `main` differs from the image's baked fb2764a5…
# in nothing the engine reads except the added `chat_template.jinja`: config.json,
# tokenizer_config.json, the index, and all 48 weight shards are byte-identical, and
# the rest of the delta is the reference inference/ tree and docs, which this SGLang
# lane never loads. Every receipt in the lane docs was served from this revision (or
# its template-carrying ancestor 2cba9e42), never from fb2764a5…; pinning here keeps
# that and avoids a re-distribution. boot.py's launch.json still records the baked
# REVISION, so it is not evidence of what was served; the launcher's "MODEL_ID is an
# on-disk checkpoint dir; serving …/snapshots/<sha>" line is. Moving this pin
# invalidates every receipt in the lane docs, so re-bench if you change it.
model_revision: 5254448103b6254fc646dacbca1cbbf20e9216c1
runtime: sglang
container: littlecedar/dgx-spark-dsv41:canary-roce@sha256:4e5002ab58b5cca670e2624c6a0d0799642914f04487ea130c71e7f525fa9c05
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash on 4x DGX Spark (GB10), SGLang, native MXFP4/F8
    checkpoint with the Engram on NVMe, TP=4 EP=1, DSpark k=5, 1M context,
    RoCEnante RDMA transport. Adaptation of
    knapcio/DeepSeek-V4.1-Flash-4x-DGX-Spark-TP4 (downstream of
    MiaAI-Lab's recipe; the launcher, adapters, b12x kernels and measurement
    design are theirs, kept under the upstream licences). See AGENTS.md and
    README.md in this directory for provenance, boot gates and limits.
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: mxfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: official, large_context, lcg_favorite, vision

mods:
  - "@littlecedar/mods/dsv41-sglang-overlay"

executor_config:
  entrypoint: ""
  shm_size: 32gb

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 1048576

command: >
  python3 /workspace/mods/dsv41-sglang-overlay/launcher.py
  --boot
  --model {model}
  --port {port}
  --tp {tensor_parallel}
  --served-model-name {model}
  --context-length {max_model_len}

readiness:
  # inference must stay false: readiness would otherwise drive /chat/completions,
  # and the engine answers /health (with HTTP 200) from the moment the server binds.
  inference: false
  port_timeout_s: 7200
  health_timeout_s: 3600
