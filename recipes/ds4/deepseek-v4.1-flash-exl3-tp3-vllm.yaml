recipe_version: "2"
model: bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
runtime: vllm
container: littlecedar/dgx-spark-dsv41:exl3a
min_nodes: 3

metadata:
  description: >-
    DeepSeek-V4.1-Flash at TP=3 across three DGX Sparks, EXL3 3.5 bpw experts,
    Engram streamed from disk, NO DSpark (the drafter's 64 heads and 128 experts
    do not divide by 3; see AGENTS.md §7.3). TP=3 is only possible because the
    model's 64 attention heads are padded to 72 (virtual heads). Faster than the
    TP=4 lane at every concurrency upstream; it simply holds less context.
    Booted and serving on our cluster 2026-09-24 (no-spec KV 2,798,624 tokens,
    C1/C4/C8 15.8/47.1/69.1 t/s): see AGENTS.md §§7.3, 7.7.
  model_url: https://huggingface.co/bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: exl3
  model_mtp_dtype: mxfp4
  kv_dtype: fp4
  tags: research_preview

mods:
  # drop-caches is INERT in every mode (see AGENTS.md §7.8); listed for parity.
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/mount-dsv41-exl3-patches"

# The image declares ENTRYPOINT ["vllm","serve"]; clear it or sparkrun refuses
# to launch. See AGENTS.md §6.1.
executor_config:
  entrypoint: ""

# ---------------------------------------------------------------------------
# WHY TP=3 NEEDS --hf-overrides — see AGENTS.md §7.3.
# ---------------------------------------------------------------------------
# 64 heads / 8 groups do not divide by 3. tonyd2wild's "virtual heads" declare
# 72 heads / 9 groups (24 = 3 whole groups/rank); at load time wq_b/wo_a pad rows
# by repeating the last real group and wo_b pads cols with ZERO weights at scale
# 1.0, so no all-zero block reaches the FP8 quantizer. This recipe passes those
# fields via `--hf-overrides` (flat, not nested) instead of a ~48 GB model copy.
# Mechanism: mods/mount-dsv41-exl3-patches/files/virtual_heads.py.
#
# Everything else is the TP=4 recipe: same image, same mod, same Engram-on-disk
# requirement (WITHOUT THE MOD THIS OOMs), except --max-num-batched-tokens 4096
# (upstream's TP=3 value), NO DSpark, and 3 nodes.

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  # Upstream's TP3 lane adds garbage_collection_threshold to the alloc conf.
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,garbage_collection_threshold:0.6
  VLLM_USE_RUST_FRONTEND: "0"
  VLLM_HAS_FLASHINFER_CUBIN: "1"
  MAX_JOBS: "2"
  FLASHINFER_NVCC_THREADS: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  DSV41_ENGRAM_DISK: "1"
  DSV41_ENGRAM_DISK_THREADS: "32"
  DSV41_ENGRAM_DISK_CHUNK: "16"
  DSV41_ENGRAM_DIR: /engram-local
  # NCCL transport vars (NET/HCA/GID_INDEX/DISABLE/CROSS_NIC/MERGE_NICS/
  # IGNORE_CPU_AFFINITY) are deliberately NOT set: sparkrun's InfiniBand probe
  # fills them per cluster. See AGENTS.md §6.3.
  NCCL_MAX_NCHANNELS: "8"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_DEBUG: WARN

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 3
  gpu_memory_utilization: 0.80
  # Upstream's TP=3 lane serves 300K; TP=3 trades context for speed.
  max_model_len: 300000
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  block_size: 128
  # Flat, NOT nested under text_config: DeepseekV41Config flattens text_config
  # before vLLM applies hf_overrides. See AGENTS.md §7.3.
  hf_overrides: '{"num_attention_heads":72,"o_groups":9,"virtual_heads_from":{"num_attention_heads":64,"o_groups":8}}'
  # DSpark is OFF for TP=3: the drafter's own 64 heads fail SpeculativeConfig at
  # TP=3 (vllm/config/model.py:1420; 64 % 3 = 1) and its 128 experts don't divide
  # by 3 either. Our virtual-heads override pads the MAIN model, not the drafter.
  # No --speculative-config line. See AGENTS.md §§7.3, 10 (E7/E8).
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,10,12,15,18,20,24,25,30,35,36,40,42,48]}'
  mm_encoder_tp_mode: data
  extra_args: ""

command: >
  CUDA_EXL3_MODEL_PATH=/cache/huggingface/hub/models--bot-lab-21--DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard/snapshots/f129e31a81e1337aa33e129e2d847fc7e37c8733
  vllm serve {model}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --block-size {block_size}
  --hf-overrides '{hf_overrides}'
  --engram-config '{"cpu_offload": false}'
  --default-chat-template-kwargs '{"thinking": false}'
  --compilation-config '{compilation_config}'
  --limit-mm-per-prompt '{"image":4}'
  --mm-encoder-tp-mode {mm_encoder_tp_mode}
  --tool-call-parser deepseek_v41
  --enable-auto-tool-choice
  --reasoning-parser deepseek_v41
  --trust-remote-code
  {extra_args}

readiness:
  port_timeout_s: 7200
  health_timeout_s: 1800

# Deliberately NOT set: --quantization (config.json declares exl3; the plugin
# picks it up); --enable-expert-parallel (the drafter's 128 experts don't divide
# by 3 and upstream's fix only relaxes the check when EP is OFF).
#
# Boot-log checklist: as AGENTS.md §6.7, plus — the mod must wrap 3 params/layer
# (wq_b, wo_a, wo_b) with the virtual-head loaders, and per-rank Engram row
# ranges must DIFFER across the three ranks (8 hash columns each at TP=3).
