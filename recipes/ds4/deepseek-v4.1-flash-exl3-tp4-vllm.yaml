recipe_version: "2"
model: bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
runtime: vllm
container: littlecedar/dgx-spark-dsv41:exl3a
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash at TP=4 across four DGX Sparks, EXL3 3.5 bpw routed
    experts, Engram tables streamed from disk, DSpark k=3 (the measured optimum),
    300K context.
    Adaptation of tonyd2wild's measured 4x-Spark lane (MIT) onto sparkrun.
    Booted and serving on our cluster 2026-09-24 (KV 3,879,721 tokens; k=3 sweep
    C1/C4/C8 36.7/72.8/96.1 t/s warm): see AGENTS.md §§2.5, 7.1, 7.7.
  model_url: https://huggingface.co/bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: exl3
  model_mtp_dtype: mxfp4
  kv_dtype: fp4
  tags: large-context, research_preview

mods:
  # drop-caches is INERT in every launch mode -- rootless blocks the write and
  # the mod's own redirect order sends '3' to its log, not drop_caches. Listed
  # for parity only; a real cache drop must be host-level. See AGENTS.md §7.8.
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/mount-dsv41-exl3-patches"

# The image declares ENTRYPOINT ["vllm","serve"]; clear it or sparkrun refuses
# to launch. See AGENTS.md §6.1.
executor_config:
  entrypoint: ""

# CUDA_EXL3_MODEL_PATH: required by the spawned DSpark drafter to find the full
# quantization_config.json; a serve-line prefix, not an env: (sparkrun does not
# interpolate env:). Use the literal snapshot path. Do NOT solve this with
# cluster_config.resolved_model_path: an HF snapshot dir is a symlink tree into
# ../../blobs, so identity-mounting only the snapshot leaves config.json
# dangling. See AGENTS.md §6.1.

# ---------------------------------------------------------------------------
# READ AGENTS.md (same directory) BEFORE BURNING A BOOT.
# ---------------------------------------------------------------------------
# Port of tonyd2wild's measured 4x-Spark lane (MIT) onto sparkrun; upstream's
# numbers are theirs. Booted and serving on our cluster 2026-09-24.
#
# THE ENGRAM CANNOT LIVE IN RAM. The two Engram tensors are 202.76 GB of
# F8_E4M3; at TP=4 the non-Engram weights are ~64 GB/node, but the tables do not
# fit alongside them on a 128 GB unified part. mount-dsv41-exl3-patches replaces
# vLLM's engram.py with an O_DIRECT row reader (DSV41_ENGRAM_DIR below); WITHOUT
# THAT MOD THIS RECIPE OOMs ~25 min in. Bench discipline: AGENTS.md §11.

env:
  # HF_HOME is NOT set: the vllm-distributed runtime overwrites it. Point
  # sparkrun's cache_dir at another tree instead.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  # GNU malloc hysteresis; reduces the loader's retained anonymous memory on GB10.
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_USE_RUST_FRONTEND: "0"
  VLLM_HAS_FLASHINFER_CUBIN: "1"
  # JIT caps; without these a first-boot compile can OOM the box.
  MAX_JOBS: "2"
  FLASHINFER_NVCC_THREADS: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  # CUDA graphs are REQUIRED for throughput here; breakable graphs, not eager.
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"

  # --- Engram on disk (see header) ----------------------------------------
  # DSV41_ENGRAM_DIR is a per-node or NFS row copy (tools/engram_local.py
  # builds it, ~48 GB); absent, the reader falls back to the model files.
  DSV41_ENGRAM_DISK: "1"
  DSV41_ENGRAM_DISK_THREADS: "32"
  DSV41_ENGRAM_DISK_CHUNK: "16"
  DSV41_ENGRAM_DIR: /engram-local

  # --- NCCL over RoCE -----------------------------------------------------
  # sparkrun's IB probe fills NCCL_NET/HCA/GID_INDEX/DISABLE/CROSS_NIC/
  # MERGE_NICS/IGNORE_CPU_AFFINITY per cluster (a recipe value overrides that
  # detection), so those are deliberately unset. The vars below are the levers:
  # NCCL_MAX_NCHANNELS=8 (+11% C6), NCCL_CUMEM_ENABLE=0 (4.7 -> 0.14 GiB),
  # NCCL_NVLS_ENABLE=0 (not a 4-node RoCE topology). See AGENTS.md §6.3.
  NCCL_MAX_NCHANNELS: "8"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_DEBUG: WARN

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  # 0.80 is upstream's TP=4 value; the pool is sized from the tightest rank.
  gpu_memory_utilization: 0.80
  # 300K is what upstream serves; the 1M sibling is a separate recipe. Read the
  # pool from the boot log, never compute it (AGENTS.md §6.5).
  max_model_len: 300000
  max_num_seqs: 8
  # Multiple of the 128 block size (64x128); a non-multiple wastes budget.
  max_num_batched_tokens: 8192
  block_size: 128
  # DSpark k=3 = measured optimum (13-boot sweep; AGENTS.md §7.7). Use k=1 for
  # batch-serving; do NOT use k=4 or k=5. Adaptive verification MUST stay off.
  speculative_config: '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
  # Capture sizes are multiples of k and k+1; the ladder MUST match k
  # (guard: KCaptureSizes), so changing k is not a one-line edit.
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[3,4,6,8,9,12,15,16,18,20,21,24,28,32]}'
  mm_processor_cache_gb: 1
  extra_args: ""

command: >
  CUDA_EXL3_MODEL_PATH=/cache/huggingface/hub/models--bot-lab-21--DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard/snapshots/f129e31a81e1337aa33e129e2d847fc7e37c8733
  vllm serve {model}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --block-size {block_size}
  --engram-config '{"cpu_offload": false}'
  --default-chat-template-kwargs '{"thinking": false}'
  --speculative-config '{speculative_config}'
  --compilation-config '{compilation_config}'
  --limit-mm-per-prompt '{"image":4}'
  --mm-processor-cache-gb {mm_processor_cache_gb}
  --tool-call-parser deepseek_v41
  --enable-auto-tool-choice
  --reasoning-parser deepseek_v41
  --trust-remote-code
  {extra_args}

readiness:
  # 460 GB read over NFS, then draft weights, KV, graph capture. ~12 min warm.
  port_timeout_s: 7200
  health_timeout_s: 1800

# Deliberately NOT set: --quantization (config.json declares exl3; the plugin
# picks it up), --kv-cache-memory-bytes (a pin changes the pool; §6.5),
# --enforce-eager (4x penalty; graphs work on this stack), --enable-expert-parallel
# (EP over RoCE unmeasured for this model).
#
# Boot-log checklist and the full rationale: AGENTS.md §6.7.
