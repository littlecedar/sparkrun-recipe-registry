recipe_version: "2"
model: bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
runtime: vllm
container: littlecedar/dgx-spark-dsv41:exl3a
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash at TP=4 across four DGX Sparks, EXL3 3.5 bpw routed
    experts, Engram tables streamed from disk, DSpark k=5, 300K context.
    Adaptation of tonyd2wild's measured 4x-Spark lane (MIT) onto sparkrun.
    UNBOOTED on our cluster as of 2026-09-23: see
    DS4-MODEL-OPTIMIZATION-WORK.md sections 2.5, 4.5 and 7.5.
  model_url: https://huggingface.co/bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: exl3
  model_mtp_dtype: mxfp4
  kv_dtype: fp4
  tags: large-context, research_preview

mods:
  - "@littlecedar/mods/mount-dsv41-exl3-patches"

# The image declares ENTRYPOINT ["vllm","serve"], which would parse sparkrun's
# appended launcher as its own flags and never run the workload. sparkrun
# detects this and refuses to launch until it is cleared (verified on 10.0.4.32
# 2026-09-24: the same command runs once the entrypoint is empty). This is the
# durable place to declare it; `-o entrypoint=''` is the one-off equivalent.
executor_config:
  entrypoint: ""

# Serve the weights straight off the shared HF cache instead of re-staging 429 GB
# on the control machine. `cluster_config.resolved_model_path` is sparkrun's
# escape hatch for pre-placed weights: it repoints `model:` at the on-disk
# snapshot, identity-mounts it into the container at the SAME path, and skips
# download/distribution entirely. This ALSO makes `{model}` (and therefore
# CUDA_EXL3_MODEL_PATH in the command) resolve to a real path in the container --
# without it, cuda-exl3's spawned DSpark-drafter worker cannot find
# quantization_config.json and the boot dies at engine init with
# "EXL3: could not find tensor_storage". Verified 2026-09-24 (boot 1): see
# JOURNAL. The path is the node's HF cache directory, which every node of this
# cluster sees (the head exports it over NFS), so it is identical everywhere.
cluster_config:
  resolved_model_path: /home/red/.cache/huggingface/hub/models--bot-lab-21--DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard/snapshots/f129e31a81e1337aa33e129e2d847fc7e37c8733

# ---------------------------------------------------------------------------
# READ THIS BEFORE BURNING A BOOT
# ---------------------------------------------------------------------------
# This is a port of a third party's *measured* deployment, not our invention.
# tonyd2wild serves exactly this stack (4 Sparks, EXL3 checkpoint, this image,
# this patch set) at 300K context with a 3.3M-token KV pool; bot-lab-21 measured
# the checkpoint's quality (HumanEval+ 0.921) and 1M-context serving (3.41M
# tokens KV) on the same four nodes. Every number upstream is measured; nothing
# here is measured by us yet.
#
# The three things that decide whether it boots, in order:
#
#  1. THE ENGRAM CANNOT LIVE IN RAM. The two Engram tensors are 202.76 GB of
#     F8_E4M3. Non-Engram weights are ~257 GB (smaller than the release's 307.5
#     only because the routed experts are 3.5 bpw not 4.25). At TP=4 that is
#     ~64 GB/node of weights, but the tables still do not fit alongside them on
#     a 128 GB unified part. The `mount-dsv41-exl3-patches` mod replaces vLLM's
#     engram.py with an O_DIRECT row reader so rows are `preadv`'d from the
#     safetensors files on demand. WITHOUT THAT MOD THIS RECIPE OOMs ~25 min in.
#     Work doc sections 3.1, 6.5.
#  2. DSV41_ENGRAM_DIR must point at a per-node, or NFS, copy of the row files
#     (tools/engram_local.py in the upstream repo builds them; ~48 GB disk).
#     If the directory is absent the reader falls back to reading the model
#     files themselves, which is correct but slower and hammering the same NFS
#     export every rank is the documented bottleneck (upstream's 309/470 s
#     weight loads over NFS vs 129 s local). Provision it before the boot.
#  3. CUDA_EXL3_MODEL_PATH. bot-lab-21's `exl3_config.py` needs the checkpoint
#     directory to resolve the drafter's quantization. sparkrun does NOT
#     interpolate `env:` (work doc 7.3), so this cannot be written here as
#     `{model}`: set it on the cluster, or pass it via `-o extra_args=...`
#     once you know the mounted path. See "OPEN" below.
#
# OPEN / UNVERIFIED on our side, do not treat as done:
#   * Does the image's flashinfer/sparse-MLA JIT compile on first boot, or does
#     it need upstream's build_overlay3-5 prebuilds? Upstream wedged all four
#     nodes on a runtime `mxfp8_gemm_cutlass_sm120` compile (boot 3) and fixed
#     it by prebuilding. If our first boot stalls in a compile, that is why.
#   * CUDA_EXL3_MODEL_PATH as above.
#   * Quality: the checkpoint's numbers are its author's. No independent check.
#
# Bench discipline (work doc 10): measure decode as completion_tokens/elapsed on
# non-streaming requests (SSE chunk counting under-reports ~3.5x under DSpark);
# use unique prompts per context length; report the accepted length with any
# DSpark number.

env:
  # HF_HOME is NOT set here: the vllm-distributed runtime sets it after the
  # recipe's env is merged, to its own cache mount, and the recipe's value is
  # discarded (validate: warning `overridden-cache-env`). Point sparkrun's
  # cache_dir at a different tree instead; that is the lever, not this.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  # GNU malloc hysteresis; reduces the loader's retained anonymous memory on
  # GB10. Upstream ships it on both the TP4 and TP3 lanes.
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_USE_RUST_FRONTEND: "0"
  VLLM_HAS_FLASHINFER_CUBIN: "1"
  # The nodes' JIT caps; without these a first-boot compile can OOM the box.
  MAX_JOBS: "2"
  FLASHINFER_NVCC_THREADS: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  # CUDA graphs are REQUIRED for throughput here: upstream measured TP=4 EXL3
  # at C1 41.6 -> 57.1 tok/s aggregate between first-run and steady state, and
  # the release lane at 38 -> 73.8 on code. Breakable graphs, not eager.
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"

  # --- Engram on disk (see item 1 above) ----------------------------------
  DSV41_ENGRAM_DISK: "1"
  DSV41_ENGRAM_DISK_THREADS: "32"
  DSV41_ENGRAM_DISK_CHUNK: "16"
  DSV41_ENGRAM_DIR: /engram-local

  # --- NCCL over RoCE -----------------------------------------------------
  # sparkrun's own InfiniBand probe fills NCCL_NET / NCCL_IB_HCA /
  # NCCL_IB_GID_INDEX / NCCL_IB_DISABLE / NCCL_CROSS_NIC / NCCL_IB_MERGE_NICS /
  # NCCL_IGNORE_CPU_AFFINITY per cluster, and a recipe value would OVERRIDE that
  # detection -- pinning the recipe to one machine's adapter naming (validate:
  # warning `managed-comm-env`). They are deliberately NOT set here. Upstream
  # pins them (GID index 3, rocep1s0f0) and that is right for their fleet; if a
  # boot shows a TCP-transport fallback, compare sparkrun's DETECTED_HCA_LIST /
  # DETECTED_GID_INDEX against `NCCL_DEBUG=INFO` before blaming this file.
  # The vars below are NOT managed by sparkrun and ARE the levers:
  #   NCCL_MAX_NCHANNELS 8 — bot-lab-21's +11% C6 (tenaiaiai lineage)
  #   NCCL_CUMEM_ENABLE 0  — MiaAI's pinned-buffer lever (4.7 GiB -> 0.14 GiB)
  #   NCCL_NVLS_ENABLE 0   — not a 4-node RoCE topology
  NCCL_MAX_NCHANNELS: "8"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_DEBUG: WARN

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  # 0.80 is upstream's TP=4 value. The pool is sized from the tightest rank, so
  # gmu mainly decides how much context the wide-expert-slice ranks give away.
  gpu_memory_utilization: 0.80
  # 300K is what upstream serves day-to-day; the 1M sibling is a separate
  # recipe. Raising this changes the KV pool, which is read from the boot log,
  # not computed (work doc 6.4).
  max_model_len: 300000
  max_num_seqs: 8
  # Multiple of the 128 block size (64x128); a non-multiple wastes budget.
  max_num_batched_tokens: 8192
  block_size: 128
  # DSpark k=5 is the shipped default. Block size 5 costs context (the drafter
  # reserve) but 1.4-1.9x throughput; upstream's k=3 is -40% (tenaiaiai).
  # Adaptive verification MUST stay off: padded spec batches hang SM120 sparse
  # MLA (FlashInfer #5015).
  speculative_config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
  # Capture sizes are multiples of k=5 and k+1=6 up to max_num_seqs*(k+1)=48.
  # A truncated list (e.g. stopping at 40) cost upstream 12% at C=6.
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,10,12,15,18,20,24,25,30,35,36,40,42,48]}'
  mm_processor_cache_gb: 1
  extra_args: ""

command: >
  CUDA_EXL3_MODEL_PATH={model}
  vllm serve {model}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --block-size {block_size}
  --engram-config '{"cpu_offload": false}'
  --default-chat-template-kwargs '{"thinking": false}'
  --speculative-config '{speculative_config}'
  --compilation-config '{compilation_config}'
  --limit-mm-per-prompt '{"image":4}'
  --mm-processor-cache-gb {mm_processor_cache_gb}
  --tool-call-parser deepseek_v41
  --enable-auto-tool-choice
  --reasoning-parser deepseek_v41
  --trust-remote-code
  {extra_args}

readiness:
  # 460 GB checkpoint read over NFS, then draft weights, KV, graph capture.
  # Upstream sees ~12 min once the caches are warm, tens of minutes cold.
  port_timeout_s: 7200
  health_timeout_s: 1800

# Deliberately NOT set, and why:
#   --quantization: the checkpoint's config.json declares `quant_method: exl3`,
#     picked up by the cuda_exl3 plugin's Exl3Config. Passing a flag is wrong.
#   --kv-cache-memory-bytes: upstream dropped the KV pin in the served config;
#     the pool is sized from the tightest rank. A pin trades context for
#     headroom on the wide ranks (work doc 3.3).
#   --enforce-eager: measured 4x penalty; graphs work on this stack (§4.3 doubt
#     is resolved for vLLM here).
#   --enable-expert-parallel: upstream tried it on the NVFP4 lane, not here;
#     EP over 200 GbE RoCE is unmeasured for this model.
#
# Boot-log checklist, in order:
#   1. The mod installed 13 files and asserted DSV41_ENGRAM_DISK. If the mod
#      log does not say "verified: Engram-on-disk reader present", stop.
#   2. `Engram DISK mode ... rows [start,end)` per rank must DIFFER per rank;
#      identical ranges means the staging is wrong and lookups are wrong.
#   3. `GPU KV cache size` token count. Expect ~3.3M at 300K on the tightest
#      rank. Far less means the KV accounting is off (work doc 3.3 trap).
#   4. Resolved backends in the startup log, not assumed.
#   5. Accept length on Decode batch lines once serving. A DSpark number
#      without an accept length is not a number.
#   6. free -h per rank while serving. Upstream runs 7-12 GiB free on the wide
#      ranks; below ~4 GiB the memfree flusher (upstream) is needed.
