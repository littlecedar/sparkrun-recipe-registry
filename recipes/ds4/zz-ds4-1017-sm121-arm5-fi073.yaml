recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash-1017
# Same launcher contract as the shipped production recipe: SKIP_PREPARE=1 and
# the snapshot sparkrun renders from {model} decides the weights, so pin -- not
# the image's baked REVISION. 1017 ships no chat template; the mod stages the
# patched copy (a template-less checkpoint with no mod template is refused).
model_revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
runtime: sglang
# Local-only SM121 image, built 2026-11-11 for the FlashInfer 0.7.x sparse-MLA
# port (mad-science/SM121-SPARSE-MLA-PORT.md section Port A). Layers over
# dsv41-sm121-dg:0.2.1 (byte-identical arm-3 control digest below) are:
# flashinfer_python 0.7.3 + the jit-cache shim + the sm121a provider (ships
# jit_cache/sparse_mla_sm120/sparse_mla_sm120.so), then six tree deltas via
# recipes/ds4/patch_dsv41_fi073.py: backend="trtllm-gen" -> "auto", the split
# SWA/compressed sparse table call, the removed 0.7 counter-buffer WAR, the
# BF16 query (SM12x rejects FP8 Q) on both the target and the DSpark draft Q
# buffers, the 528-byte fp8_dsv41_inline KV pool, and the DSpark draft's
# combined window+block table passed whole as the SWA segment (0.7.x has no
# combined-length tail split), and (seventh, `:fi073d`) row-packed prefill
# index tables: 0.7.3 builds call metadata from the tensors' strides and
# refuses a column slice of the combined table as "no matching decode
# instantiation" (`_sparse_mla_sm120/_prepared.py:175`) -- measured on the GB10
# at 193 and 16,384 rows, packed admitted / sliced refused, on both the
# functional call and the wrapper's `run`. Built by
# recipes/ds4/Dockerfile.dsv41-fi073.
# Image ID (local, byte-identifies the artifact; nothing pushed), rebuild
# 2026-11-11 on .35. Predecessors: 3f33790c79… (six deltas; died on the prefill
# row envelope), the five-delta 1d47404119… (draft path still refused) and the
# three-delta 7752ccd68….
#   sha256:c684c90b41ee94b98cc263afbd4d5db2845984c9a6406023dfbd5123aadc112d
# It exists only on the build host; carry it with the command in
# recipes/ds4/README.md "SM121 survey arms" before a boot. distribution_config
# disables sparkrun's image distribution, which would try to pull this local
# tag from a registry.
container: dsv41-sm121-dg:0.2.1-fi073d
distribution_config:
  containers:
    enabled: false
min_nodes: 4
description: >-
  Port-A probe (`zz-` trial): FlashInfer 0.7.3 with the sm121a provider over the
  arm-5/arm-3 image, DeepSeek V4 attention still `--dsv4-attn-backend trtllm`.
  CONTROL IS ARM 3 ON `dsv41-sm121-dg:0.2.1` (same tree, replay off,
  `zz-ds4-1017-sm121-arm3-control.yaml`): this image's only delta is FlashInfer
  plus the adapter deltas, so a booted cell would compare against that
  digest, not against `:0.2.0`.
  STATUS (2026-11-11T07:05Z): rebuilt with seven deltas (id in the header).
  The six-delta image boot 3/4 story: after the fleet reboot sparkrun's own
  detected NCCL env is sufficient (`RoCEnante ready: world=4
  hcas=roceP2p1s0f0,rocep1s0f0 gid_index=3`, `Init parallel ends. elapsed=47.27
  s`), and both boots then died on the prefill row envelope
  (`num_tokens=193 ... no matching decode instantiation`) because the 0.7.x
  metadata check admits only row-packed index tables and the port passed
  column slices of the combined table. Delta 7 repacks them; measured on the
  GB10 in-image (packed admitted and executed at 193 and 16,384 rows, sliced
  refused, both entries). GPU-less build gates green (patch anchors applied
  once, fail-closed on a second run, `py_compile` of all six files, backend
  import). The canary answer comparison in
  mad-science/SM121-SPARSE-MLA-PORT.md section "Acceptance ladder" remains the
  only acceptance; the target decode call is byte-identical to the six-delta
  image. Batching: the served line stays at the launcher's
  `MAX_RUNNING_REQUESTS=16`, but verifying a 16-request line is 96 decode rows
  against the 64-row envelope, so it needs the verify route (register row
  `ds4-arm5-verify-route-batch-cap`), not a raised capture cap.
metadata:
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: mxfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: trial
mods:
  # Order is pre_exec order: the overlay launcher's hook runs as root against
  # the mounted runtime cache, so the reown runs after it (register row
  # `runtime-cache-flashinfer-root-owned-subtree`).
  - "mods/dsv41-sglang-overlay"
  - "mods/reown-runtime-cache"
executor_config:
  entrypoint: ""
  shm_size: 32gb
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 1048576
  dspark_block_size: 5
env:
  # Served revision; mirrors the top-level `model_revision`
  # (tests/test_ds4_model_revision_pin.py guards the pair). Required: the
  # overlay launcher is fail-closed on its pin and reads only this env.
  DSV41_MODEL_REVISION: 1bae0e1088993b9b82de08f59de5be5a34e42170
  # c3 adapter exclusions (see apply_recipe_env in the overlay launcher).
  DSV41_C3_EXCLUDES: "1"
  # The candidate tree floors sglang-kernel at 0.4.9, whose aarch64 wheel is ABI-
  # incompatible with the base's torch 2.13.0+cu130; this arm holds the shipped
  # kernel (0.4.7) and skips the gate.
  SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK: "1"
  # The treatment.
  EXTRA_SGLANG_ARGS: "--dsv4-attn-backend trtllm --enable-metrics --enable-cache-report"
  # The port's sparse-decode capture refuses more than 10 rows (10 x 6 = 60,
  # inside the 64-row envelope); the measured boots passed this as `-o env.…`.
  CUDA_GRAPH_MAX_BS_DECODE: "10"
  # Section 10.7's control design: replay OFF in both arms. The launcher turns
  # this into --no-enable-decoder-swa-bounded-replay, which wins because boot.py
  # appends its own --enable-... earlier in argv.
  SWA_BOUNDED_REPLAY: "0"
command: >
  python3 /workspace/mods/dsv41-sglang-overlay/launcher.py
  --boot
  --model {model}
  --port {port}
  --tp {tensor_parallel}
  --served-model-name {model}
  --context-length {max_model_len}
  --dspark-block-size {dspark_block_size}
  --fp8-gemm-backend flashinfer_cutlass
readiness:
  # inference must stay false: /health answers 200 the moment the server binds.
  inference: false
  port_timeout_s: 7200
  health_timeout_s: 3600
