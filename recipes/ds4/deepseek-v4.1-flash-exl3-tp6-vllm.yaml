recipe_version: "2"
model: bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
runtime: vllm
container: littlecedar/dgx-spark-dsv41:exl3a
min_nodes: 6

metadata:
  description: >-
    DeepSeek-V4.1-Flash at TP=6 across six DGX Sparks, EXL3 3.5 bpw experts,
    Engram streamed from disk, DSpark k=3 (the measured optimum), 300K context.
    TP=6 is mechanically the *cleanest* large split for this model --
    moe_intermediate_size 2304 / 6 = 384, which is 128-aligned, so the MoE needs
    NO uneven expert split (TP=4 needed 512/640/640/512 precisely because
    2304/4 = 576 is not a multiple of 128). The cost is attention: 8 output
    groups do not divide by 6, so heads pad 64->96 (8->12 groups) and 2 of the 6
    ranks carry pure-padding attention shards. DSpark runs here because the
    mount-dsv41-exl3-patches mod applies that same 96/12 declaration to the
    drafter, whose raw 64 heads would otherwise fail SpeculativeConfig
    validation. First boot ever of DSpark at TP=6 (any cluster) on 2026-09-27:
    KV 12,006,501 tokens (vs 12,783,985 no-spec), DSpark mean acceptance length
    2.43-2.50, C1/C4/C8 44.5/72.5/115.3 t/s (vs 29.4/63.8/108.0 no-spec).
    Retuned 2026-09-27 to max_num_seqs 16, gmu 0.85, capture ladder to 64.
    See AGENTS.md §§7.4, 7.7.
  model_url: https://huggingface.co/bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: exl3
  model_mtp_dtype: mxfp4
  kv_dtype: fp4
  tags: research_preview

tuning:
  vllm_tune_repo: https://github.com/SeraphimSerapis/vllm-tune.git
  vllm_tune_ref: main

mods:
  - "@littlecedar/mods/mount-dsv41-exl3-patches"
  # Bounds the Engram reader's host page cache (POSIX_FADV_DONTNEED per batch).
  # POST-PATCH: must come AFTER mount-dsv41-exl3-patches. Booted safe/neutral
  # 2026-09-27 (KV 4.11M vs 3.97M baseline, 27*43->1161). See AGENTS.md §7.8.1,
  # MEMORY-RECLAIM-PLAN.md §7.
  - "@littlecedar/mods/bound-engram-cache"

# The image declares ENTRYPOINT ["vllm","serve"]; clear it or sparkrun refuses
# to launch. See AGENTS.md §6.1.
executor_config:
  entrypoint: ""

# ---------------------------------------------------------------------------
# TP=6 — why it is interesting, and what it costs. See AGENTS.md §§7.4, 7.5.
# ---------------------------------------------------------------------------
# From THIS checkpoint's config.json: heads 64 | o_groups 8 | moe_intermediate
# 2304 | n_routed_experts 384 | dspark_n_routed_experts 128 | vocab 129280.
#   MoE experts:  384 / 6 = 64  exact;  MoE width 2304 / 6 = 384 = 128x3 ALIGNED
#     -> no uneven split (TP=4 needed 512/640/640/512: 2304/4 = 576).
#   heads/groups: not divisible by 6 -> virtual heads 64->96, 8->12.
#   DSpark: the drafter's 64 heads / 8 groups are declared as 96/12 by the mod's
#     config_speculative.py, and its 128 experts are kept all-local (no-EP path),
#     so speculative decoding is ON at k=3.
#   Engram: 24 hash columns / 6 = 4 per rank, exact.
#
# THE ATTENTION COST: only 8 of the 12 padded groups are real, so ranks 4-5 run
# attention that contributes nothing and still pay their all-reduce -- a 33%
# flop tax on a third of the fleet, the price of an even expert split. Whether
# the even split pays for it is the measured question (it does at C8). TP=8
# fails the MoE /128 check (2304/8 = 288); TP=6 is the only split that is *both*
# MoE-perfect and available on six nodes.

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,garbage_collection_threshold:0.6
  VLLM_USE_RUST_FRONTEND: "0"
  VLLM_HAS_FLASHINFER_CUBIN: "1"
  MAX_JOBS: "2"
  FLASHINFER_NVCC_THREADS: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  DSV41_ENGRAM_DISK: "1"
  DSV41_ENGRAM_DISK_THREADS: "32"
  DSV41_ENGRAM_DISK_CHUNK: "16"
  DSV41_ENGRAM_DIR: /engram-local
  # NCCL transport vars deliberately unset — sparkrun's IB probe fills them per
  # cluster (see AGENTS.md §6.3).
  NCCL_MAX_NCHANNELS: "8"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_DEBUG: WARN

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 6
  # 0.85 aligns with the registry's pinned recipes; the measured per-rank
  # footprint is the lightest of any split (weights+non-torch 47.1 GiB,
  # activation 2.8, graph 0.7 at gmu 0.80), so TP=6 has the most KV headroom.
  # Read the pool from the boot log, never compute it (AGENTS.md §6.5).
  gpu_memory_utilization: 0.85
  max_model_len: 300000
  # 16 = 2x the old default. The pool is replicated per rank and TP=6 has the
  # largest headroom of any split, so 16 slots cost nothing; max concurrency is
  # pool/ctx (AGENTS.md §6.5), not this number.
  max_num_seqs: 16
  max_num_batched_tokens: 4096
  block_size: 128
  # Flat, NOT nested under text_config; heads 96 = 12 groups x 8, 12 is the
  # MINIMAL working group count (g % 3 == 0). See AGENTS.md §7.4.
  hf_overrides: '{"num_attention_heads":96,"o_groups":12,"virtual_heads_from":{"num_attention_heads":64,"o_groups":8}}'
  # DSpark k=3 = measured optimum (13-boot sweep; AGENTS.md §7.7). k is legal
  # because 3 <= dspark_block_size (n_predict=5). Adaptive verification MUST stay
  # off (padded spec batches hang SM120 sparse MLA, FlashInfer #5015). The
  # drafter sees the 96/12 declaration through the mod's config_speculative.py.
  speculative_config: '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
  # Capture sizes are multiples of k and k+1 and must reach
  # max_num_seqs*(k+1) = 16*4 = 64 (guard: KCaptureSizes); a k change is not a
  # one-line edit.
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[3,4,6,8,9,12,15,16,18,20,21,24,28,32,36,40,44,48,52,56,60,64]}'
  mm_encoder_tp_mode: data
  extra_args: ""

command: >
  CUDA_EXL3_MODEL_PATH=/cache/huggingface/hub/models--bot-lab-21--DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard/snapshots/f129e31a81e1337aa33e129e2d847fc7e37c8733
  vllm serve {model}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --block-size {block_size}
  --hf-overrides '{hf_overrides}'
  --engram-config '{"cpu_offload": false}'
  --default-chat-template-kwargs '{"thinking": false}'
  --speculative-config '{speculative_config}'
  --compilation-config '{compilation_config}'
  --limit-mm-per-prompt '{"image":4}'
  --mm-encoder-tp-mode {mm_encoder_tp_mode}
  --tool-call-parser deepseek_v41
  --enable-auto-tool-choice
  --reasoning-parser deepseek_v41
  --trust-remote-code
  {extra_args}

readiness:
  port_timeout_s: 7200
  health_timeout_s: 1800

# Deliberately NOT set: --quantization (config.json declares exl3; the plugin
# picks it up); --enable-expert-parallel (the drafter's 128 experts are kept
# all-local by the mod's no-EP path; EP at TP=6 is unmeasured over RoCE).
#
# Boot-log checklist: as AGENTS.md §6.7, plus — the mod must report
# config_speculative.py installed AND the DSpark draft-model log line; the mod
# must wrap 3 params/layer with virtual-head loaders; per-rank Engram row ranges
# must DIFFER across the six ranks (4 hash columns each); the MoE must NOT hit
# the FlashInfer-Cutlass /128 error (width 384 = 128x3); `Capturing dspark CUDA
# graphs (FULL)` present; a `Mean acceptance length` > 1 on `Decode batch` lines
# (accepts nothing = the EAGLE-on-DSpark-head failure mode, not a win).
