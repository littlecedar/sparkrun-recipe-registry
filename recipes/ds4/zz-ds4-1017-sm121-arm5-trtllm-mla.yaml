recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash-1017
# Same launcher contract as the shipped production recipe: SKIP_PREPARE=1 and
# the snapshot sparkrun renders from {model} decides the weights, so pin -- not
# the image's baked REVISION. 1017 ships no chat template; the mod stages the
# patched copy (a template-less checkpoint with no mod template is refused).
model_revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
runtime: sglang
# Local-only SM121 image, rebuilt 2026-11-07 as the arm-5 unblock (same
# DeepGEMM v0.2.0 + SM120 paged-sparse MQA-logits port as 0.2.0, plus two tree
# patches recorded in the lane README: the trtllm backend's arch gate accepts
# capability major 12, and --enable-decoder-swa-bounded-replay gained
# BooleanOptionalAction). Built from ~/builds/deepgemm-sm121/ctx/Dockerfile.sm121
# (patch_sm121_tree.py + probe_replay_flag.py are RUN in the build).
# Image ID (local, byte-identifies the artifact; nothing pushed):
#   sha256:85c1ffc3e3a08742615307a94679af4f2c0a795dfd9bf4065c3a1c0009195dc7
# It exists only on the head; carry it with the command in recipes/ds4/README.md
# "SM121 survey arms" before a boot. distribution_config disables sparkrun's
# image distribution, which would try to pull this local tag from a registry.
container: dsv41-sm121-dg:0.2.1
distribution_config:
  containers:
    enabled: false
min_nodes: 4
description: >-
  Survey arm 5 (`zz-` trial, queue row w4-survey-arm5-trtllm-mla): the SM121
  DeepGEMM image with DeepSeek V4 attention switched to the TRT-LLM-GEN
  sparse-MLA backend (DEEPSEEK.md section 10.7: 2.26x kernel geomean at
  C5/C10/128K on GB10).
  CONTROL IS ARM 3 ON THE SAME DIGEST (`dsv41-sm121-dg:0.2.1`), replay off in
  both arms -- `zz-ds4-1017-sm121-arm3-control.yaml`. The earlier arm-3 run on
  `:0.2.0` (`zz-ds4-1017-sm121-indexer-scoring.yaml`) is indexer-scoring
  evidence, NOT this arm's control: an image delta must not be read as the
  backend delta.
  Image 0.2.1 carries the two gates this arm needed: the trtllm backend's
  arch assert accepts capability major 12 (GB10 is 12,1) and the replay flag
  parses `--no-enable-decoder-swa-bounded-replay`, which the launcher appends
  when `SWA_BOUNDED_REPLAY=0` (the shipped canary's arg has no --no- form, so
  the knob is unset everywhere else). Requires 0.2.1 carried to the four rank
  nodes.
metadata:
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: mxfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: trial
mods:
  - "mods/dsv41-sglang-overlay"
executor_config:
  entrypoint: ""
  shm_size: 32gb
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 1048576
  dspark_block_size: 5
env:
  # c3 adapter exclusions (see apply_recipe_env in the overlay launcher).
  DSV41_C3_EXCLUDES: "1"
  # The candidate tree floors sglang-kernel at 0.4.9, whose aarch64 wheel is ABI-
  # incompatible with the base's torch 2.13.0+cu130; this arm holds the shipped
  # kernel (0.4.7) and skips the gate.
  SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK: "1"
  # The treatment.
  EXTRA_SGLANG_ARGS: "--dsv4-attn-backend trtllm --enable-metrics"
  # Section 10.7's control design: replay OFF in both arms. The launcher turns
  # this into --no-enable-decoder-swa-bounded-replay, which wins because boot.py
  # appends its own --enable-... earlier in argv.
  SWA_BOUNDED_REPLAY: "0"
command: >
  python3 /workspace/mods/dsv41-sglang-overlay/launcher.py
  --boot
  --model {model}
  --port {port}
  --tp {tensor_parallel}
  --served-model-name {model}
  --context-length {max_model_len}
  --dspark-block-size {dspark_block_size}
  --fp8-gemm-backend flashinfer_cutlass
readiness:
  # inference must stay false: /health answers 200 the moment the server binds.
  inference: false
  port_timeout_s: 7200
  health_timeout_s: 3600
