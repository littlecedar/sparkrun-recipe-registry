recipe_version: "2"
model: bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
runtime: vllm
container: littlecedar/dgx-spark-dsv41:exl3a
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash at TP=4 across four DGX Sparks, EXL3 3.5 bpw experts,
    Engram streamed from disk, DSpark k=3 (the measured optimum),
    ONE MILLION token context. This is the context lane: upstream measured ~3.41M
    tokens at 1M on this stack, versus 1.07M for the release checkpoint on the
    same four nodes. Booted and serving on our cluster 2026-09-24 (KV 4,200,885
    tokens, needle correct at 799K prompt tokens); retuned 2026-09-27 to
    max_num_seqs 16, gmu 0.85, capture ladder to 64 (lockstep with the 300K
    twin). See AGENTS.md §§2.5, 7.2.
  model_url: https://huggingface.co/bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: exl3
  model_mtp_dtype: mxfp4
  kv_dtype: fp4
  tags: large-context, research_preview

mods:
  # drop-caches is INERT in every mode (see AGENTS.md §7.8); listed for parity.
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/mount-dsv41-exl3-patches"
  # Bounds the Engram reader's host page cache (POSIX_FADV_DONTNEED per batch).
  # POST-PATCH: must come AFTER mount-dsv41-exl3-patches. Booted safe/neutral
  # 2026-09-27 (KV 4.11M vs 3.97M baseline, 27*43->1161). See AGENTS.md §7.8.1,
  # MEMORY-RECLAIM-PLAN.md §7.
  - "@littlecedar/mods/bound-engram-cache"

# The image declares ENTRYPOINT ["vllm","serve"]; clear it or sparkrun refuses
# to launch. See AGENTS.md §6.1.
executor_config:
  entrypoint: ""

# ---------------------------------------------------------------------------
# 1M CONTEXT — see AGENTS.md §§7.2, 3.3.
# ---------------------------------------------------------------------------
# The only difference from the 300K twin is `--max-model-len 1000000` plus a
# graph ladder covering max_num_seqs*(k+1). The Engram-on-disk mod is still
# LOAD-BEARING: without its engram.py replacement the boot OOMs.
#
# READ THE KV POOL FROM THE BOOT LOG: `sparkrun recipe vram` cannot read the
# EXL3/Engram layout. Not shipped: a KV-grouping patch (DSV41_KV_GROUPING=fine,
# +63% pool for -6%/-8%) — a further patch, not part of the mod.

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_USE_RUST_FRONTEND: "0"
  VLLM_HAS_FLASHINFER_CUBIN: "1"
  MAX_JOBS: "2"
  FLASHINFER_NVCC_THREADS: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  DSV41_ENGRAM_DISK: "1"
  DSV41_ENGRAM_DISK_THREADS: "32"
  DSV41_ENGRAM_DISK_CHUNK: "16"
  DSV41_ENGRAM_DIR: /engram-local
  # NCCL transport vars (NET/HCA/GID_INDEX/DISABLE/CROSS_NIC/MERGE_NICS/
  # IGNORE_CPU_AFFINITY) are deliberately NOT set: sparkrun's InfiniBand probe
  # fills them per cluster. See AGENTS.md §6.3.
  NCCL_MAX_NCHANNELS: "8"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_DEBUG: WARN

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  # Kept in lockstep with the 300K twin (guard: the 1M copy may differ only in
  # max_model_len). 0.85 aligns with the registry's pinned recipes and the
  # measured per-rank usage (weights+non-torch 63.6 GiB, activation 5.4, graph
  # 0.7 at gmu 0.80). See AGENTS.md §6.5 — read the pool from the log.
  gpu_memory_utilization: 0.85
  # THE POINT OF THIS RECIPE.
  max_model_len: 1000000
  # 16, matching the 300K twin (guard-enforced lockstep). At 1M the pool is only
  # ~4-5x a full-length request, so the 16 slots QUEUE rather than run 16 full-1M
  # requests at once — max concurrency is pool/ctx (AGENTS.md §6.5), not this.
  # The extra slots still serve many medium-length 1M-context-era requests.
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  block_size: 128
  # k=3 = measured optimum (AGENTS.md §7.7); identical to the 300K twin, which
  # the 1M-vs-300K guard requires (differ in max_model_len ONLY).
  speculative_config: '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
  # Must reach max_num_seqs*(k+1) = 64 (guard: KCaptureSizes); lockstep with 300K.
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[3,4,6,8,9,12,15,16,18,20,21,24,28,32,36,40,44,48,52,56,60,64]}'
  mm_processor_cache_gb: 1
  extra_args: ""

command: >
  CUDA_EXL3_MODEL_PATH=/cache/huggingface/hub/models--bot-lab-21--DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard/snapshots/f129e31a81e1337aa33e129e2d847fc7e37c8733
  vllm serve {model}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --block-size {block_size}
  --engram-config '{"cpu_offload": false}'
  --default-chat-template-kwargs '{"thinking": false}'
  --speculative-config '{speculative_config}'
  --compilation-config '{compilation_config}'
  --limit-mm-per-prompt '{"image":4}'
  --mm-processor-cache-gb {mm_processor_cache_gb}
  --tool-call-parser deepseek_v41
  --enable-auto-tool-choice
  --reasoning-parser deepseek_v41
  --trust-remote-code
  {extra_args}

readiness:
  port_timeout_s: 7200
  health_timeout_s: 1800

# Deliberately NOT set: --kv-cache-memory-bytes (a pin changes the pool, §6.5);
# --enable-prefix-caching (on by default; a vLLM issue reports it collapsing
# DSpark acceptance, #47930 — A/B it). Long-context bench discipline: AGENTS.md
# §11 (unique prompts; drop the page cache between legs — Engram row reads push
# MemFree into the zone where the GB10 allocator stalls).
