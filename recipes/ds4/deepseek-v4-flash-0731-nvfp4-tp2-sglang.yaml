recipe_version: "2"
model: nvidia/DeepSeek-V4-Flash-0731-NVFP4
runtime: sglang
container: lmsysorg/sglang:dev-v4f-2dgx-v2
min_nodes: 2

metadata:
  description: >-
    DeepSeek-V4-Flash-0731 NVFP4 at TP=2 across two DGX Sparks. Port of the
    upstream-verified SGLang `dgx-spark | flash-official | nvfp4` cell.
  model_url: https://huggingface.co/nvidia/DeepSeek-V4-Flash-0731-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "284B"
  model_dtype: nvfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: large-context

# Upstream: this image is a DGX Spark-only preview build (2x GB10, TP=2 over
# ConnectX-7) baking the SM12x b12x MoE (W4A8) and compressed-MLA kernels
# (sgl-project/sglang#34878, #35899, #34018), the b12x image-prefill fix
# (#37253) and the NVFP4 MTP-layer dispatch fix. Do not run it on other
# hardware, and do not try to replace it with a stock image -- the b12x kernel
# package is what makes the dense projections 17 ms/step instead of 52.
#
# Docker mode is mandatory here for the same reason: the bare-Python path needs
# the b12x package this image ships.

env:
  # b12x attention + FP8 wo_a opt-in + MHC post/pre fusion are the GB10 tuning
  # knobs. SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK is needed because the image
  # pins a kernel wheel newer than the shipped sglang asserts.
  SGLANG_SM120_FLASHMLA_BACKEND: b12x
  B12X_MLA_SM120_DSV4_H16_NATIVE: "1"
  SGLANG_OPT_FUSE_MHC_POST_PRE: "1"
  SGLANG_OPT_FP8_WO_A_GEMM: "1"
  SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK: "1"
  # MUST equal --chunked-prefill-size below. NOTE: sparkrun does NOT interpolate
  # {placeholders} inside `env:` -- it passes the block through verbatim (checked
  # 2026-09-19 with `sparkrun recipe show`; no recipe in this registry
  # interpolates env either). So this value is duplicated by hand and the
  # tests/ guard is the only thing keeping the two in sync. If you change
  # chunked_prefill_size, change this number too.
  SGLANG_B12X_MAX_TOKENS: "8192"
  # Upstream ships this on the V4-Flash Spark cells ("avoids unified-memory
  # fragmentation OOMs on GB10") and the cell is verified, so it stays for
  # V4-Flash. It is deliberately ABSENT from the V4.1 recipes: the 4x-Spark
  # V4.1 deployment reports expandable_segments producing NaN logits on any
  # prefill over 64 query tokens there. Do not "harmonise" the two families.
  # See DS4-MODEL-OPTIMIZATION-WORK.md 6.3.
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # 0.80, not higher. On a unified-memory part this fraction over-promises by
  # roughly what the OS holds (~18 GB of the 128), and the 0.20 remainder is
  # what covers the prefill transient. Lowering it does not free RAM -- it only
  # starves KV. See DS4-MODEL-OPTIMIZATION-WORK.md 6.1.
  gpu_memory_utilization: 0.80
  max_model_len: 327680
  max_num_seqs: 32
  chunked_prefill_size: 8192
  # Global-layer SWA share. 0.2 is the verified Spark value.
  swa_full_tokens_ratio: 0.2
  # The three flags that make NVFP4 work on SM121, each load-bearing:
  #   - b12x's MoE is MXFP4-only and the trtllm-gen kernels are sm100-only, so
  #     the NVFP4 experts must go to cutlass.
  #   - The DSpark draft's MTP experts ship as MXFP4, so the draft keeps b12x.
  #   - HashTopK rejects fused shared experts under the cutlass runner.
  moe_runner_backend: flashinfer_cutlass
  speculative_moe_runner_backend: b12x
  speculative_algorithm: DSPARK
  speculative_dspark_block_size: 5
  cuda_graph_max_bs_decode: 32
  load_format: safetensors
  # Escape hatch for one-off experimentation. Empty string is the no-op default;
  # quoted so YAML keeps it a str.
  extra_args: ""

command: >
  sglang serve
  --trust-remote-code
  --model-path {model}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --moe-runner-backend {moe_runner_backend}
  --speculative-moe-runner-backend {speculative_moe_runner_backend}
  --disable-shared-experts-fusion
  --speculative-algorithm {speculative_algorithm}
  --speculative-dspark-block-size {speculative_dspark_block_size}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --mem-fraction-static {gpu_memory_utilization}
  --swa-full-tokens-ratio {swa_full_tokens_ratio}
  --cuda-graph-max-bs-decode {cuda_graph_max_bs_decode}
  --max-running-requests {max_num_seqs}
  --load-format {load_format}
  --reasoning-parser auto
  --tool-call-parser auto
  {extra_args}

readiness:
  # A cold boot reads ~160 GB over NFS (8 min), then draft weights, the KV pool
  # and CUDA-graph capture. Total is 12-13 min on our NFS; more on a cold cache.
  port_timeout_s: 3600

# Deliberately NOT set, and why:
#   --attention-backend / --fp8-gemm-backend / --moe-a2a-backend:
#     They auto-resolve. Overriding the MoE or FP8-GEMM backend drops the
#     32-wide ue8m0 blocks onto the Triton _w8a8_block_fp8_matmul fallback,
#     which dominates the decode step. Confirm the resolved backends in the
#     startup log instead of pinning them.
#   --quantization: the checkpoint carries its own quantization_config; passing
#     a method here would contradict it.
#   --disable-cuda-graph / --enforce-eager: costs ~4x decode. If graph capture
#     fails, that is a signal to read the log, not to silence it.
#
# Boot-log checklist (do not trust a run until these were read):
#   1. Did the DSA indexer come up on TileLang/DeepGEMM, or fall back to the
#      torch path? The fallback is a HARD ~13-18 t/s ceiling at any batch size
#      (deep_gemm hard-blocks SM121). This is the single biggest risk here.
#   2. `DSV4 memory calculation: bytes_per_full_token=... full_token=...` --
#      the KV pool the boot actually granted. On GB10 this is OS MemAvailable,
#      so page cache at load time moves it +/-0.5 GB between identical boots.
#   3. accept length from the Decode batch lines. A DSpark number without an
#      accept length is not a number.

# Proposed Changes:
#  --speculative-dspark-block-size sweep 1..6 (DS4 work doc 5.1 predicts the
#    optimum is nearer 4 than the default 5, because on an MoE the verify step
#    re-reads routed-expert weights per proposed token while only the latency
#    term amortises)
#  a `no-spec` sibling for a true target-only baseline
