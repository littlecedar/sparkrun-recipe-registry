recipe_version: "2"
model: Mia-AiLab/DeepSeek-V4.1-Flash-EXL3-2.9bpw
runtime: sglang
container: littlecedar/dgx-spark-dsv41@sha256:fabbe8615bb91c61fdde4a5f451f324a7449d7335fb85d453cc439985c525495
builder: docker-pull
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    DeepSeek-V4.1-Flash on 2x DGX Spark (GB10), TP=2, served by the TensorFold
    deepseek_v41 engine (bertholomus/TensorFold, branch deepseek-v41-tp2). The
    EXL3 2.9bpw checkpoint (~197 GB) plus the original FP8 Engram tables from
    DeepSeek shards 47/48 (~95 GB each), DSpark k=5, at the model's full 1M-token
    window. The recipe's `runtime: sglang` is the shim path: sparkrun renders the command
    and appends its per-node rendezvous flags, and mods/tensorfold-dsv41-launcher
    maps them onto `tensorfold serve`. See README.md and AGENTS.md.
  model_url: https://huggingface.co/Mia-AiLab/DeepSeek-V4.1-Flash-EXL3-2.9bpw
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: exl3
  model_mtp_dtype: exl3
  kv_dtype: fp8
  tags: fast, single_user

mods:
  # Supplies the Engram tables the EXL3 checkpoint omits. The official checkpoint
  # is not distributed by sparkrun; on a node without them this fetches them from
  # the online HF repo with ranged reads. ALWAYS detached: the fetch can run for
  # hours on a slow link, and sparkrun's pre-exec hook has a hard 600 s timeout,
  # so it never blocks the launch. The engine serves degraded until they land and
  # uses them next boot. Runs before the launcher so the shim's Engram status line
  # reflects reality.
  #
  # For a multi-node / slow-link deployment, prefer pre-warming or the distributed
  # repo (one download on the head, rsync to workers) over N independent fetches:
  # see distribution_config below and recipes/ds4/README.md.
  - "@littlecedar/mods/dsv41-engram-fetch"
  - "@littlecedar/mods/tensorfold-dsv41-launcher"

# Uncomment to let sparkrun distribute the Engram tables for the cost of one
# download on the head plus an rsync to the workers, instead of each node fetching
# 189 GiB itself. The launcher reads the tables from this repo's cache dir when the
# mod's own dir is empty. The repo must actually carry the tables (the standard
# `engram.embed.{weight,scale}` safetensors, at the snapshot root or under
# `source/`); pin a revision you have vetted -- an unvetted third-party checklist
# is a supply-chain risk for weights the engine reads on every token.
#
# distribution_config:
#   models:
#     entries:
#       - name: Mia-AiLab/DeepSeek-V4.1-Flash-EXL3-2.9bpw
#       - name: manateelazycat/DeepSeek-V4.1-Flash-TensorFold-Engram
#         revision: 99d8cfbca033cffa6318724f83a1614acdb1bc08

executor_config:
  entrypoint: ""
  shm_size: 32gb
  # The RDMA gather and NCCL over the CX7 fabric need registered (locked) memory.
  ulimit:
    - memlock=-1:-1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  max_model_len: 1048576

command: >
  python3 /workspace/mods/tensorfold-dsv41-launcher/launcher.py
  --boot
  --model {model}
  --port {port}
  --tp {tensor_parallel}
  --served-model-name {model}
  --context {max_model_len}

readiness:
  # inference true drives /v1/chat/completions; TensorFold serves the OpenAI API
  # and /health, so a real readiness answer is available.
  inference: true
  # A cold first boot compiles the CUDA extensions and writes the ~106 GiB/rank
  # weight cache before the serve port opens; later boots are much shorter.
  port_timeout_s: 3600
  health_timeout_s: 1800