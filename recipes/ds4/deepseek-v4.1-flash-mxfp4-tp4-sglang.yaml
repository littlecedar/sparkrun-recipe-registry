recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash
runtime: sglang
container: lmsysorg/sglang:dev-dsv41
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash (552B + 196B Engram) at TP=4 across four DGX Sparks,
    MXFP4 official checkpoint with the Engram on host RAM. NO UPSTREAM CELL
    EXISTS for V4.1-Flash on DGX Spark -- the SGLang cookbook lists
    supportedHardware h200/b200/b300/gb300/mi350x only. Everything here is
    unverified on this hardware and this recipe is a research_preview.
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: mxfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: official, large-context

# ---------------------------------------------------------------------------
# READ THIS BEFORE BURNING A BOOT
# ---------------------------------------------------------------------------
# There are THREE independent things that can stop this booting, and they are
# ordered by how likely each is to be the one. Work top to bottom; each is
# checkable in the first minutes of a log.
#
#  1. KERNELS. Upstream's DGX Spark kernels (b12x MoE, compressed-MLA) live in
#     the `dev-v4f-2dgx-v2` image, which is pinned to branch `b12x-vision` @
#     `452239a74f` -- a pre-V4.1 branch. `dev-dsv41` has V4.1 support. As far as
#     we can tell these are DIFFERENT IMAGES and we need one that is both.
#     If `dev-dsv41` has no b12x package, the dense FP8 projections fall back to
#     Triton at ~52 ms/step instead of ~17 and the whole exercise is moot.
#     Check before launching:  docker run --rm <img> python -c "import b12x"
#     See DS4-MODEL-OPTIMIZATION-WORK.md 8.2.
#
#  2. THE DEEPGEMM SM121 CLIFF. deep_gemm/_C.so allows SM100 and SM120 but NOT
#     SM121 (GB10), so the hot decode kernel fp8_paged_mqa_logits raises
#     "Unsupported architecture (attention.hpp:219)" and SGLang falls back to a
#     pure-torch dispatch OUTSIDE the CUDA graph at ~18 ms/step over the 20 DSA
#     layers. That is a HARD ~13-18 t/s ceiling independent of batch size, TP
#     degree and quantisation. Measured on 4x GB10 by an outside party: 13.5 t/s
#     at n=1 on the fallback, 18.7 t/s with the TileLang indexer. Set
#     SGLANG_OPT_USE_TILELANG_INDEXER=1 and SGLANG_DISABLE_DEEP_GEMM=1 below.
#     This recipe ships them ON by default; if your build's DeepGEMM does
#     support SM121, turn both off and measure -- it is likely faster.
#     See DS4-MODEL-OPTIMIZATION-WORK.md 4.3.
#
#  3. MEMORY. This is where the honest arithmetic differs from the naive guess,
#     so it is spelled out below rather than left to a comment.

# ---------------------------------------------------------------------------
# MEMORY BUDGET, stated so a failed boot is interpretable
# ---------------------------------------------------------------------------
# Checkpoint: 510.29 GB total.
#   routed experts 288.78 (I8 packed FP4 + F8_E8M0 ue8m0 scales)
#   Engram tables  202.76 (two F8_E4M3 tensors, [384M, 256], ~98.3 GB each)
#   everything else 18.75  (attn FP8, shared expert, embed/head, mHC, norms)
#
# At TP=4 the non-Engram weights are 76.9 GB/node. The 0.80 fraction advertises
# 0.80 x 121 = 96.8 GB, so ~19.9 GB remains for KV + activations + CUDA graphs.
# That is tight but it is the configuration the 4x-Spark deployment runs
# (~77 GiB resident, ~40 GB/rank free while serving).
#
# THE TRAP: putting the Engram on host RAM does NOT relieve anything on this
# box. Host RAM IS the same 128 GB. GPU-resident non-Engram (76.9) + a per-rank
# host Engram shard (202.76/4 = 50.7) = 127.6 GB/node, which is the identical
# total, merely relocated within one unified pool. The cluster bound is
# 510.3 GB of weights against 4 x (128 - ~18) = 440 GB of usable RAM, and that
# is exceeded whether the tables sit on the GPU or in host RAM.
#
# So `SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE=1` below is NOT what makes this fit.
# What it buys is the ~100 GB of HBM freed into the KV pool and (in the
# `shared` layout only) one dropped all-reduce. What makes this fit at all is
# either (a) the Engram living on NVMe via an out-of-tree O_DIRECT row store, or
# (b) a 4-bit Engram, which lands the whole checkpoint at ~408.9 GB and inside
# the 440 GB bound with ~31 GB of cluster headroom to spare. Neither is enabled
# here. Until one of them is, treat the memory question as OPEN, not as tuned.
# See DS4-MODEL-OPTIMIZATION-WORK.md 3.1 and 3.4.
#
# If this recipe OOMs during load, the fix is NOT to lower
# --mem-fraction-static: that does not free RAM on a unified-memory part, it
# only starves KV. The fix is to get the Engram off RAM (a) or smaller (b).

env:
  # --- Engram placement ---------------------------------------------------
  # Verified from python/sglang/srt/layers/engram.py on main, 2026-09-19.
  # SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT accepts exactly "shared" or
  # "per_rank" (anything else raises ValueError naming the variable).
  #
  #   shared   -- one COMPLETE host copy, n = num_embeddings (384M rows/rank!).
  #              Removes both per-layer all-reduces. But it hands every rank's
  #              memfd through /proc/<pid>/fd/<fd>, which hard-fails "the TP
  #              ranks must share a PID namespace" across four Sparks. Not
  #              available here. It is also 203 GB per node -- over the whole
  #              box's RAM -- so it would be impossible even if it worked.
  #   per_rank -- n = self.rows = num_embeddings // TP, so the host mapping is
  #              202.76/4 = ~50.7 GB/node: BYTE-IDENTICAL to the GPU-sharded
  #              default, relocated from device side to host side of the same
  #              unified pool. On a GB10 that relocation is worth exactly zero
  #              bytes of relief. It does NOT remove the all-reduce.
  #
  # So this flag does NOT make the recipe fit -- see MEMORY BUDGET above. It is
  # here to free HBM into the KV pool once the Engram is off RAM properly (NVMe
  # or a 4-bit table). Two further constraints from the same source:
  #   * cudaHostRegister(nbytes, 0) must succeed for a single ~50.7 GB
  #     contiguous anonymous mapping. If it returns non-zero the loader raises
  #     "cudaHostRegister(...) failed". Unknown on GB10; likely to fail at this
  #     size on a 128 GB unified part.
  #   * The mapping is MADV_HUGEPAGE-advise'd and, for per_rank, pre-faulted
  #     with the page cache dropped first so 512 MiB huge faults can be served.
  #     finish_load() logs "<N> MiB resident, <M> MiB in huge pages (P%)" and
  #     WARNS "No huge pages: expect ~10x slower lookups (one TLB miss per row)"
  #     if it gets none. READ THAT LINE. 10x-slower random row reads on a
  #     203 GB table is a throughput cliff as large as the DeepGEMM one.
  SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
  SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank

  # --- SM121 kernel survival (see item 2 above) ---------------------------
  SGLANG_DISABLE_DEEP_GEMM: "1"
  SGLANG_OPT_USE_TILELANG_INDEXER: "1"
  SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK: "1"

  # --- MoE gate/topk reordering across TP ranks: ~20% prefill, documented on
  # SM100/SM120, NOT stated for SM121, and it REORDERS expert summation. It is
  # documented as "not a quantisation or accuracy change", but a reordering
  # change under CUDA graphs on an untested arch is a correctness risk. Ship it
  # OFF; A/B it once the boot is trusted.
  SGLANG_OPT_USE_DSV41_GATHERED_TOPK: "0"

  # --- Atomic bf16 expert-output finalization makes greedy first-token
  # logprobs differ run-to-run by up to ~1 nat. Keep off; costs ~0.3 ms/step.
  SGLANG_FLASHINFER_MOE_FUSED_FINALIZE: "0"

  # --- Auto-resolve guard --------------------------------------------------
  # V4.1's backends auto-resolve to dsv4 / flashinfer_mxfp4 / flashinfer_cutedsl.
  # Do NOT set --attention-backend / --moe-runner-backend / --fp8-gemm-backend:
  # overriding drops the 32-wide ue8m0 blocks onto Triton _w8a8_block_fp8_matmul,
  # which "dominates the decode step and costs most of the model's bs=1
  # throughput". Confirm the resolved values in the startup log instead.
  #
  # PYTORCH_CUDA_ALLOC_CONF is deliberately ABSENT. The V4-Flash Spark cells ship
  # expandable_segments:True and are verified; the V4.1 4x-Spark deployment
  # reports that same setting producing NaN logits on any prefill over 64 query
  # tokens. V4.1 uses a different attention backend, so the two families
  # genuinely disagree. Do not "harmonise" them. Establish it here, empirically,
  # with a ~512-token greedy continuation compared against the same prompt with
  # the setting on. DS4-MODEL-OPTIMIZATION-WORK.md 6.3.

defaults:
  port: 8000
  host: 0.0.0.0
  # TP=4 is the floor. TP=2 is arithmetically impossible for this checkpoint
  # (307.5 GB of non-Engram weights vs 220 GB of usable RAM on a pair) and no
  # flag, quantisation or offload changes that. Do not "try" TP=2.
  tensor_parallel: 4
  # 0.80: keeps ~24 GiB/rank outside the static pool for the prefill transient.
  # The 4x-Spark deployment uses 0.80 at TP=4 and 0.95 at TP=3; that is not a
  # disagreement, it is two different context budgets.
  gpu_memory_utilization: 0.80
  # 1M context verified on a 4-rank Spark layout, but KV is replicated across
  # TP ranks (num_key_value_heads: 1), so 1M x 4 is paid in full. Start at 256K
  # and raise only after reading the granted KV pool from the boot log.
  max_model_len: 262144
  max_num_seqs: 8
  # Chunk size is a MEMORY control here, not a throughput one. Each chunk
  # allocates an indexer-logits buffer proportional to the prefix so far, so
  # peak is roughly 14 B x chunk x prefix: ~60 GB at 4096, ~15 GB at 1024.
  # With the native caching allocator a freed smaller block cannot serve the
  # next larger request and reserved memory grows with the SQUARE of prompt
  # length. 1024 is the long-context-safe default.
  chunked_prefill_size: 1024
  speculative_algorithm: DSPARK
  # Checkpoint default is 5. Work doc 5.1 predicts the optimum is nearer 4:
  # on an MoE a window-W verify step reads dense + experts*W, so the dominant
  # byte term inflates while only the latency term amortises. Sweep 1..6.
  speculative_dspark_block_size: 5
  cuda_graph_max_bs_decode: 32
  load_format: safetensors
  # Escape hatch for one-off experimentation. Empty string is the no-op default;
  # quoted so YAML keeps it a str.
  extra_args: ""

command: >
  sglang serve
  --trust-remote-code
  --model-path {model}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --speculative-algorithm {speculative_algorithm}
  --speculative-dspark-block-size {speculative_dspark_block_size}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --mem-fraction-static {gpu_memory_utilization}
  --cuda-graph-max-bs-decode {cuda_graph_max_bs_decode}
  --max-running-requests {max_num_seqs}
  --load-format {load_format}
  --reasoning-parser auto
  --tool-call-parser auto
  {extra_args}

readiness:
  # Cold boot reads 510 GB over NFS. The reference deployment's first attempt
  # died at 48% of the checkpoint read with a 2001 s host-SSH timeout during a
  # concurrent pull; the NFS cache needed two warm passes before the read was
  # stable. Two hours is not paranoia here.
  port_timeout_s: 7200
  health_timeout_s: 1800

# Deliberately NOT set, and why:
#   --ep-size: upstream runs --ep-size 4 on GB300 for V4.1. Expert parallelism
#     on a 4-node RoCE cluster over 200 GbE is a different bandwidth regime from
#     an NVLink domain, and nobody has measured it across Sparks. Start with
#     pure TP; add EP only against a measured baseline.
#   --enable-decoder-swa-bounded-replay: a real prefill win (runs late layers
#     over only the last 128 tokens) but NO shipped cell combines it with
#     DSPARK, it refuses prompt logprobs, and it is not numerically equivalent
#     to full prefill. Speculative that the combination is sound. Test alone.
#   --disable-shared-experts-fusion: only HashTopK under the cutlass runner
#     needs it (the NVFP4 V4-Flash sibling).
#   --mamba-* / --kv-canary: not applicable to this architecture.
#
# Boot-log checklist, in order -- do not trust a run until all were read:
#   1. Did `import b12x` work and did the dense GEMMs land on b12x rather than
#      Triton? If Triton, stop and fix the image.
#   2. DSA indexer on TileLang, or the torch fallback? Torch fallback = hard
#      ~13-18 t/s ceiling. Check BEFORE tuning anything else.
#   3. `DSV4 memory calculation: bytes_per_full_token=... full_token=...` -- the
#      KV pool actually granted. On GB10 this is OS MemAvailable, so page cache
#      at load time moves it +/-0.5 GB between identical boots. If it is
#      clamped, that is the Engram memory problem above, not a tuning issue.
#   4. Resolved backends (should be dsv4 / flashinfer_mxfp4 / flashinfer_cutedsl).
#   5. accept length from the Decode batch lines. Acceptance is workload
#      dependent -- highest on maths and code, lower on open chat. A DSpark
#      number without an accept length is not a number.
#   6. `nvidia-smi` free per node WHILE serving, and `docker exec sparkrun-<x>
#      free -h` for the head. The reference deployment got 0.2-0.8 GB free and
#      fixed it to ~6 GB almost entirely by shrinking NCCL's 512 x 9.19 MiB
#      connection buffers (4.7 GiB of pinned host RAM) to 139 MB. Those knobs
#      are NOT in this recipe yet because we do not have them -- enumerate them
#      from NCCL_DEBUG=INFO on our own nodes first.
#
# Proposed Changes:
#  NVMe-backed Engram row store as a mod (the only proven way to fit this on
#    Sparks; see DS4-MODEL-OPTIMIZATION-WORK.md 3.1)
#  4-bit Engram checkpoint -> puts the whole model inside the TP=4 RAM bound
#  --speculative-dspark-block-size sweep 1..6
#  a `no-spec` sibling for a true target-only baseline
#  --ep-size 4 as a measured experiment, not a default
