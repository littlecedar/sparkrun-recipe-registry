# ===========================================================================
# Probe arm (`zz-`) — the first arm booted in the production window: task
# `58cddf1c62ba6578_9aea1006d19f` (phase 1) and
# `58cddf1c62ba6578_b2aaddef7ada` (phase 2, `PICOM_OEA=4,12,9` added), both on
# this image digest, cells in `head:~/benchmarks/picom-prod-20261118/phase{1,2}/`.
# It raises the reply ceiling to 262,144 generated tokens, not 32,768:
# same image digest, same engine argv, one launcher env.
#
# Ceiling chain, Picom-code/pico-dgx-ds4@7c123ad4 (the pin this image is
# built from). dsfront's `--max-tokens` is the only grant: main.rs:126
# defaults it to 32,768 and server.rs:522-528 answers a request that omits
# `max_tokens`/`max_completion_tokens` *with* it and clamps any larger value
# to it — never refuses. So today a 256K request silently gets 32,768 tokens
# and `finish_reason: "length"`, indistinguishable from a real stop. Past the
# front-end there is no compile-time cap on a reply: the engine parses
# `max_new_tokens` (serve.cpp:891, 1160) and bounds each step by
# `min(slot_ctx, pos0 + max_new)` (cmd.cpp:172-175) in int32 positions.
# What binds next is slot geometry, not a constant: `--slots 16 --big-slots 4`
# gives 4 slots the full `--max-ctx` 1,048,576 positions and 12 at
# max_ctx/8 = 131,072 (main.cpp:296, model.cu:88), and serve.cpp:1195 admits
# a request only to a slot where `prompt + max_new` fits. A 262,144-token
# reply therefore needs a big slot (prompt <= 786,432); a 5th concurrent one
# queues in serve.cpp's `wait_` (no refusal, no timeout) until a big slot
# frees. The session store (12 GiB + 32 GiB disk tier) is untouched while a
# request is in flight — it only sees a session that pauses or loses its
# slot — and 262,144 ids is 1.6 % of the front-end's 16M-id table.
#
# Route: flag-only, no rebuild. The launcher grew `PICOM_MAX_TOKENS`
# (default 32,768, unchanged), so this arm's whole change is one env line.
# Client-visible consequence, accepted: a request that omits `max_tokens`
# now has a 262,144 budget, and prompt + 262,144 can never fit a 131,072
# slot — so every such request needs one of the four big slots, can hold it
# for up to ~35 min at ~125 tok/s, and a fifth one queues silently (a stream
# gets an SSE keep-alive every 5 s, a non-stream request just waits; there is
# no server-side timeout and no refusal). Separating the default from the cap
# costs a third tracked PR patch, a full CUDA-stage rebuild on a GB10 node and
# a digest repin, which a probe does not earn. Only on this arm.
#
# Retest cells (not run): (a) one request at `max_tokens: 262144` on a prompt
# that keeps generating — the granted budget is `usage.completion_tokens`
# against `finish_reason`; (b) ~65,536 generated tokens for the sustained
# decode rate and its trend with position; (c) the boundary the trade makes
# real: with four 262K requests generating, a fifth request that *omits*
# `max_tokens` produces no bytes until one ends — a default 262,144 reply no
# longer fits any of the twelve 131,072 slots, so it queues instead of
# running; an explicit `max_tokens: 130000` with a short prompt is now the
# only shape that still lands on a small slot. The cap is proven by
# `rank 0: starting dsfront ... max_tokens 262144` in `logs/front.log`:
# dsfront never prints it, so the response's own `finish_reason`/`usage` is
# the other half of the evidence.
#
# The engine is NOT SGLang/vLLM: from-scratch C++/CUDA TP=4, own Rust
# front-end (dsfront), own RDMA ring, one process per node, same argv but
# --rank. The recipe borrows the vLLM family as a *distribution contract
# only*: `runtime: vllm` resolves to `vllm-distributed` (no Ray hint;
# core/recipe.py:777) and tensor_parallel defaults to 1, so every node is an
# independent replica — no torch world, no rendezvous gate, no flags appended.
# ===========================================================================
recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash-1017
runtime: vllm
# Same pin as the lane's shipped arms. Upstream validated the engine at
# 1bae0e10; 08c8657f differs only in chat_template.jinja (all 48 shards
# byte-identical), which this engine never reads — dsfront tokenises and
# chats from its own encoding (--encoding 1017).
model_revision: 08c8657f02291e11b6f6b63e0e16014f8e748518
# Built from Picom-code/pico-dgx-ds4@7c123ad4 plus the two tracked PR
# patches (recipes/ds4/Dockerfile.picom-ds41f); the image carries dsgb10_rank,
# dsfront, the weight/Engram converters, the vision encoder and the
# draft-gate weights. Weights live in the HF cache, never in the image.
container: ghcr.io/littlecedar/dgx-picom-ds41f@sha256:1e529c67f268806bbf3468e176d39f6ee6907ca3ee118e96a10e7072200883a4
min_nodes: 4
max_nodes: 4
description: >-
  DeepSeek-V4.1-Flash-1017 served by the picom (dsgb10) from-scratch
  TP=4 engine on 4x DGX Spark (GB10) over a switched RoCE fabric,
  with the reply ceiling raised to 262,144 generated tokens
  (PICOM_MAX_TOKENS; 32,768 in the booted arm): 1M context, 16 slots
  (4 of them big, and a 262K reply needs one of those four), DSpark
  drafts with the stack4/stack5 levers, OpenAI chat/completions,
  streamed tool-call arguments and images (the checkpoint's own ViT
  as a supervised side encoder, upstream PR #15) through dsfront.
  Booted twice in the production window on this image digest (phases 1–2,
  cells in `head:~/benchmarks/picom-prod-20261118/phase{1,2}/`). Per-rank weight
  and Engram artifacts are built from the checkpoint on first boot
  (one-time, ~130 GB per node). Fabric inputs ride env:
  PICOM_RANK_TAILS is required.
metadata:
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: mxfp4
  kv_dtype: fp8
  tags: ds4, reasoning, agent, probe
mods:
  - "mods/picom-launcher"
executor_config:
# The image has no ENTRYPOINT; clear it so the recipe's command is the process.
  entrypoint: ""
env:
# Per-node, rendered by sparkrun from the launch host list:
# rank 0 runs the engine and dsfront; ranks 1-3 run the engine only.
  PICOM_NODE_RANK: "{launch.node_rank}"
  PICOM_NODE_HOST: "{launch.node_host}"
# REQUIRED at launch — no default is possible: cluster addresses are
# forbidden in tracked files (tests/test_tracked_address_hygiene.py).
# The four fabric address tails, rank 0-3, comma-separated; the
# launcher renders them into the engine's fleet file as
# <PICOM_FABRIC_A>.<tail> / <PICOM_FABRIC_B>.<tail>.
#   -o env.PICOM_RANK_TAILS=30,31,32,33
  PICOM_RANK_TAILS: ""
# The fabric's two /24s and the two f0 RDMA devices (both PCI domains).
# f1 is down on this fleet: a switched ring rides the same two devices in
# both directions, which the engine accepts (one QP per role).
  PICOM_FABRIC_A: "192.168.0"
  PICOM_FABRIC_B: "192.168.1"
  PICOM_DEV_A: "rocep1s0f0"
  PICOM_DEV_B: "roceP2p1s0f0"
  PICOM_GID_INDEX: "3"
# DSGB10_RING_DIRECT=2 is the switch mode: every rank writes to all three
# peers itself (no ring relay); bits-identical results, +1.3-1.8 % upstream.
  PICOM_RING_DIRECT: "2"
# Upstream's production engine line (README "run it", 2026-11-11) minus
# DSGB10_OEA, which is their lossy batch-aware MoE re-route: this arm stays
# strictly lossless by default (set PICOM_OEA=4,12,9 to opt in).
# The Launcher reads this as one space-separated argv list.
  PICOM_ENGINE_ARGS: >-
    --max-ctx 1048576 --slots 16 --big-slots 4
    --setenv DSGB10_BUDGET=1
    --setenv DSGB10_DRAFT1=6 --setenv DSGB10_WIDE=64
    --setenv DSGB10_WIDE_COST=24,2.2,57,1.1
    --draft-head4 --draft-markov8 --setenv DSGB10_HEAD4_C1=1
    --setenv DSGB10_CF_ALPHA=1.0 --setenv DSGB10_CERT=1
  PICOM_OEA: ""
# Upstream PR #15 (integrated in the image): the vision encoder as part of the
# serve. It runs the checkpoint's own ViT on rank 0 and costs ~1 GiB of its
# GPU; dsfront gets --vision-addr. 0 = off (image requests then answer 400).
  PICOM_VISION: "1"
  PICOM_VISION_PORT: "18950"
# Upstream PR #7 (integrated in the image): a stream carries each tool call's
# name when it parses and its arguments as they arrive, as OpenAI streams them.
# Upstream ships it opt-in; this arm turns it on for agent clients.
  PICOM_STREAM_TOOL_ARGS: "1"
# This arm's whole change: dsfront's `--max-tokens`, i.e. the ceiling *and*
# the default for a request that omits the field (header, "Ceiling chain").
  PICOM_MAX_TOKENS: "262144"
defaults:
  port: 8000
# One GPU per node; the engine's TP=4 is its own four processes, not a torch
# world. sparkrun's tensor_parallel default is 1, which is exactly what this
# arm needs — writing it here would only draw an inert-default finding.
  served_model_name: deepseek-ai/DeepSeek-V4.1-Flash-1017
command: >
  bash /workspace/mods/picom-launcher/launch.sh
  --model {model}
  --revision {model_revision}
  --served-model-name {served_model_name}
  --port {port}
readiness:
# No chat surface to probe before the engine's socket exists; the launcher
# binds dsfront only after the engine is up. First boot also converts this
# rank's 72.38 GiB weight file and packs its 50.7 GB Engram shards.
  inference: false
  port_timeout_s: 10800
  health_timeout_s: 3600
