recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash-1017
# Same launcher contract as the shipped production recipe: SKIP_PREPARE=1 and
# the snapshot sparkrun renders from {model} decides the weights, so pin -- not
# the image's baked REVISION. 1017 ships no chat template; the mod stages the
# patched copy (a template-less checkpoint with no mod template is refused).
model_revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
runtime: sglang
container: ghcr.io/littlecedar/dgx-spark-dsv41@sha256:7c3cb3947005e75afd8f8c10adf9dc1db4e5f96ea54c6411e960a4eeee073c5c
min_nodes: 4
description: >-
  glibc malloc-pin probe (`zz-` trial): the shipped
  `deepseek-v4.1-flash-knapcio-tp4-1m-sglang.yaml` canary serve line,
  byte-identical image pin, checkpoint revision, mods and command, with only
  `MALLOC_ARENA_MAX=2` and `MALLOC_MMAP_THRESHOLD_=1048576` added to container
  env. Those two upstream release-note pins bound glibc's per-thread arena
  growth on the shared 128 GB unified pool. A/B against the shipped canary's
  own receipts; nothing else differs, so any delta is the malloc pin.
metadata:
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: mxfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: trial
mods:
  - "mods/dsv41-sglang-overlay"
executor_config:
  entrypoint: ""
  shm_size: 32gb
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 1048576
  # DSpark verify-window gamma: the launcher's shipped default is the same 5;
  # the knob exists so a sweep can reach it (-o dspark_block_size=3).
  dspark_block_size: 5
env:
  # Served revision; mirrors the top-level `model_revision`
  # (tests/test_ds4_model_revision_pin.py guards the pair).
  DSV41_MODEL_REVISION: 1bae0e1088993b9b82de08f59de5be5a34e42170
  # glibc malloc pin: 2 arenas + 1 MiB mmap threshold bound arena growth on the
  # shared 128 GB pool; A/B control is the shipped canary's receipts.
  MALLOC_ARENA_MAX: "2"
  MALLOC_MMAP_THRESHOLD_: "1048576"
  # Metrics rollout 2026-11-08: /metrics on the API port (instrumented boot).
  EXTRA_SGLANG_ARGS: "--enable-metrics"
# The rest of the serve line is the canary's own. Keep --fp8-gemm-backend
# declared: boot.py's required_sglang_args() strips and re-stamps it last.
command: >
  python3 /workspace/mods/dsv41-sglang-overlay/launcher.py
  --boot
  --model {model}
  --port {port}
  --tp {tensor_parallel}
  --served-model-name {model}
  --context-length {max_model_len}
  --dspark-block-size {dspark_block_size}
  --fp8-gemm-backend flashinfer_cutlass
  --enable-cache-report
readiness:
  # inference must be false: readiness would otherwise drive /chat/completions,
  # and the engine answers /health (with HTTP 200) the moment the server binds.
  inference: false
  port_timeout_s: 7200
  health_timeout_s: 3600
