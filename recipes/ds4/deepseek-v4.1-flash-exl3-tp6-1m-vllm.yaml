recipe_version: "2"
model: bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
runtime: vllm
container: littlecedar/dgx-spark-dsv41:exl3a
min_nodes: 6

metadata:
  description: >-
    DeepSeek-V4.1-Flash at TP=6 across six DGX Sparks, EXL3 3.5 bpw experts,
    Engram streamed from disk, DSpark k=3 (the measured optimum), ONE MILLION
    token context. The 1M sibling of deepseek-v4.1-flash-exl3-tp6-vllm:
    identical except --max-model-len. TP=6 gives the largest KV pool of any
    measured topology, so it is the natural host for the longest context -- the
    measured TP=6 pool at 300K was 12.78M tokens vs 3.88M at TP=4. DSpark at
    TP=6 first booted 2026-09-27 (300K twin: KV 12.0M, accept length 2.4-2.5,
    C1/C4/C8 44.5/72.5/115.3 t/s); the mod applies the 96/12 virtual-heads
    declaration to the drafter so it validates. Retuned 2026-09-27 to
    max_num_seqs 16, gmu 0.85, capture ladder to 64 (lockstep with the 300K
    twin).
  model_url: https://huggingface.co/bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: exl3
  model_mtp_dtype: mxfp4
  kv_dtype: fp4
  tags: large-context, research_preview

mods:
  # drop-caches is INERT in every mode (see AGENTS.md §7.8); listed for parity.
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/mount-dsv41-exl3-patches"
  # Bounds the Engram reader's host page cache (POSIX_FADV_DONTNEED per batch).
  # POST-PATCH: must come AFTER mount-dsv41-exl3-patches. Booted safe/neutral
  # 2026-09-27 (KV 4.11M vs 3.97M baseline, 27*43->1161). See AGENTS.md §7.8.1,
  # MEMORY-RECLAIM-PLAN.md §7.
  - "@littlecedar/mods/bound-engram-cache"

# The image declares ENTRYPOINT ["vllm","serve"]; clear it or sparkrun refuses
# to launch. See AGENTS.md §6.1.
executor_config:
  entrypoint: ""

# ---------------------------------------------------------------------------
# TP=6 at 1M — see AGENTS.md §§7.4, 7.5, 11.
# ---------------------------------------------------------------------------
# The TP=6 300K recipe with exactly one intended difference: max_model_len
# 300000 -> 1000000 (guard-enforced; everything else identical). 1M is cheap
# because KV is REPLICATED across TP ranks, so the pool is set by the per-rank
# budget and TP=6 has the most headroom (weights only 41.98 GiB/rank). Read the
# granted pool from the boot log, never assume. Long-context bench discipline:
# unique prompts, non-streaming decode, drop the page cache between legs.

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,garbage_collection_threshold:0.6
  VLLM_USE_RUST_FRONTEND: "0"
  VLLM_HAS_FLASHINFER_CUBIN: "1"
  MAX_JOBS: "2"
  FLASHINFER_NVCC_THREADS: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  DSV41_ENGRAM_DISK: "1"
  DSV41_ENGRAM_DISK_THREADS: "32"
  DSV41_ENGRAM_DISK_CHUNK: "16"
  DSV41_ENGRAM_DIR: /engram-local
  # NCCL transport vars deliberately unset — sparkrun's IB probe fills them per
  # cluster (see AGENTS.md §6.3).
  NCCL_MAX_NCHANNELS: "8"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_DEBUG: WARN

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 6
  # Kept in lockstep with the 300K twin (guard: the 1M copy may differ only in
  # max_model_len). 0.85; measured per-rank footprint is the lightest of any
  # split (weights+non-torch 48.5 GiB, activation 2.6, graph 0.25 at gmu 0.80).
  gpu_memory_utilization: 0.85
  max_model_len: 1000000
  # 16, matching the 300K twin (guard-enforced lockstep). The 300K pool was
  # 12.0M tokens, so even at 1M the pool is ~13x a full-length request — 16 slots
  # run concurrently here, unlike the TP=4 1M arm. Context is the variable.
  max_num_seqs: 16
  max_num_batched_tokens: 4096
  block_size: 128
  # Flat, NOT nested under text_config; heads 96 = 12 groups x 8, 12 is the
  # MINIMAL working group count (g % 3 == 0). See AGENTS.md §7.4.
  hf_overrides: '{"num_attention_heads":96,"o_groups":12,"virtual_heads_from":{"num_attention_heads":64,"o_groups":8}}'
  # DSpark k=3 = measured optimum (13-boot sweep; AGENTS.md §7.7). k is legal
  # because 3 <= dspark_block_size (n_predict=5). Adaptive verification MUST stay
  # off (padded spec batches hang SM120 sparse MLA, FlashInfer #5015). The
  # drafter sees the 96/12 declaration through the mod's config_speculative.py.
  # Kept identical to the 300K twin (guard-enforced: context is the only variable).
  speculative_config: '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
  # Capture sizes are multiples of k and k+1 and must reach
  # max_num_seqs*(k+1) = 16*4 = 64 (guard: KCaptureSizes); lockstep with 300K.
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[3,4,6,8,9,12,15,16,18,20,21,24,28,32,36,40,44,48,52,56,60,64]}'
  mm_encoder_tp_mode: data
  extra_args: ""

command: >
  CUDA_EXL3_MODEL_PATH=/cache/huggingface/hub/models--bot-lab-21--DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard/snapshots/f129e31a81e1337aa33e129e2d847fc7e37c8733
  vllm serve {model}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --block-size {block_size}
  --hf-overrides '{hf_overrides}'
  --engram-config '{"cpu_offload": false}'
  --default-chat-template-kwargs '{"thinking": false}'
  --speculative-config '{speculative_config}'
  --compilation-config '{compilation_config}'
  --limit-mm-per-prompt '{"image":4}'
  --mm-encoder-tp-mode {mm_encoder_tp_mode}
  --tool-call-parser deepseek_v41
  --enable-auto-tool-choice
  --reasoning-parser deepseek_v41
  --trust-remote-code
  {extra_args}

readiness:
  port_timeout_s: 7200
  health_timeout_s: 1800

# Deliberately NOT set: --quantization (config.json declares exl3; the plugin
# picks it up); --enable-expert-parallel (the drafter's 128 experts are kept
# all-local by the mod's no-EP path; EP at TP=6 is unmeasured over RoCE);
# --kv-cache-memory-bytes (a pin changes the pool; §6.5).
#
# Boot-log checklist: as AGENTS.md §6.7, plus — max_model_len 1000000 must show
# on /v1/models; the granted pool should be multi-M-token (a pool below ~1M means
# one full-length request does not fit); the mod wrapped 3 params/layer, applied
# the 96/12 declaration to the drafter, and per-rank Engram ranges DIFFER across
# the six ranks; the MoE must not raise the FlashInfer-Cutlass /128 error; verify
# a 1M-scale needle; a `Mean acceptance length` > 1 on `Decode batch` lines.
