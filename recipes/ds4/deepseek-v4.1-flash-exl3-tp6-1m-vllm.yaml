recipe_version: "2"
model: bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
runtime: vllm
container: littlecedar/dgx-spark-dsv41:exl3a
min_nodes: 6

metadata:
  description: >-
    DeepSeek-V4.1-Flash at TP=6 across six DGX Sparks, EXL3 3.5 bpw experts,
    Engram streamed from disk, ONE MILLION token context. The 1M sibling of
    deepseek-v4.1-flash-exl3-tp6-vllm: identical except --max-model-len. TP=6
    gives the largest KV pool of any measured topology, so it is the natural
    host for the longest context -- the measured TP=6 pool at 300K was 12.78M
    tokens vs 3.88M at TP=4.
  model_url: https://huggingface.co/bot-lab-21/DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: exl3
  model_mtp_dtype: mxfp4
  kv_dtype: fp4
  tags: large-context, research_preview

mods:
  # See the TP=4 recipe header for why this is listed but inert under rootless.
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/mount-dsv41-exl3-patches"

# The image declares ENTRYPOINT ["vllm","serve"], which would swallow sparkrun's
# appended launcher. Clear it (see the TP=4 recipe header for the full note).
executor_config:
  entrypoint: ""

# ---------------------------------------------------------------------------
# TP=6 at 1M — what is inherited and what is specific to this file
# ---------------------------------------------------------------------------
# This recipe is the TP=6 300K recipe with exactly one intended difference:
#   max_model_len: 300000 -> 1000000
# Everything else (TP=6 attention padding 8->12 groups, no DSpark, MoE width
# 2304/6 = 384 = 128x3, the mod, the env block, the graph capture sizes) is
# deliberately identical, and the guard file asserts the two 1M recipes keep
# their 1M context anyway. Rationale for the pattern: the TP=4 lane already
# ships a 1M sibling that differs from its 300K twin by the same one line, and
# that difference is the ONLY variable in the 1M-vs-300K comparison.
#
# WHY 1M IS CHEAP HERE. The measured TP=6 KV pool at 300K was 12,783,985 tokens
# (42.61x concurrency). 1M x 6 ranks costs the same bytes per token as at 300K,
# and KV is REPLICATED across TP ranks (num_key_value_heads: 1), so the pool is
# not divided by 6 -- it is the per-rank KV budget that sets it, and TP=6 has
# the most headroom of any split (weights only 41.98 GiB/rank, measured). So 1M
# should leave a multi-M-token pool, i.e. several concurrent full-length
# requests. As always: READ the granted pool from the boot log; do not assume.
#
# THE TP=6 COST, restated (unchanged from the 300K sibling). 8 output groups do
# not divide by 6, so heads pad 64->96 (8->12 groups) and ranks 4-5 carry
# PURE-PADDING attention shards (wo_b zeroed). Measured: quality is identical to
# TP=4/TP=3 despite that, and C8 throughput is the fleet's best (108 t/s) -- but
# C1 is below TP=4's (29.4 vs 36.4), so this is a throughput/context topology,
# not a latency one. See work doc 7.5.8.
#
# LONG-CONTEXT BENCH DISCIPLINE (work doc 10), which matters more at 1M than
# anywhere else:
#   * UNIQUE prompts per context length -- radix-cache reuse produces absurd
#     TTFT and has already fooled this project once (~5 s at 32K that was really
#     ~145 s cold).
#   * Measure decode as completion_tokens/elapsed on NON-streaming requests
#     (SSE chunk counting under-reports ~3.5x under speculative decoding; here
#     there is no spec, but keep the habit).
#   * Drop the page cache between legs on these nodes: Engram row reads grow the
#     page cache and push MemFree into the zone where the GB10 allocator stalls
#     (upstream: MemFree 1.5-3.7 GiB).

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,garbage_collection_threshold:0.6
  VLLM_USE_RUST_FRONTEND: "0"
  VLLM_HAS_FLASHINFER_CUBIN: "1"
  MAX_JOBS: "2"
  FLASHINFER_NVCC_THREADS: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  DSV41_ENGRAM_DISK: "1"
  DSV41_ENGRAM_DISK_THREADS: "32"
  DSV41_ENGRAM_DISK_CHUNK: "16"
  DSV41_ENGRAM_DIR: /engram-local
  # NCCL transport vars deliberately unset — sparkrun's IB probe fills them per
  # cluster (see the TP=4 recipe header).
  NCCL_MAX_NCHANNELS: "8"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_DEBUG: WARN

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 6
  gpu_memory_utilization: 0.80
  # THE POINT OF THIS RECIPE.
  max_model_len: 1000000
  # Keep 8: the measured 300K pool was 12.78M tokens, so 8 concurrent 300K
  # requests fit several times over, and even 1M-length requests get multiple
  # slots. This is a context recipe, not a concurrency one.
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  block_size: 128
  # Flat, NOT nested under text_config: DeepseekV41Config flattens text_config
  # before vLLM applies hf_overrides (verified 2026-09-24). heads 96 = 12 groups
  # x 8 heads; 12 % 6 == 0 and 96 % 6 == 0. 12 is the MINIMAL group count that
  # works (g must be a multiple of 6 AND 8g a multiple of 6 => g % 3 == 0).
  hf_overrides: '{"num_attention_heads":96,"o_groups":12,"virtual_heads_from":{"num_attention_heads":64,"o_groups":8}}'
  # NO --speculative-config: DSpark cannot run at TP=6 (drafter 128 experts and
  # 64 heads do not divide by 6). Same wall as TP=3.
  compilation_config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8,16,24,32]}'
  mm_encoder_tp_mode: data
  extra_args: ""

command: >
  CUDA_EXL3_MODEL_PATH=/cache/huggingface/hub/models--bot-lab-21--DeepSeek-V4.1-Flash-EXL3-3.5bpw-Pollard/snapshots/f129e31a81e1337aa33e129e2d847fc7e37c8733
  vllm serve {model}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len {max_model_len}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --block-size {block_size}
  --hf-overrides '{hf_overrides}'
  --engram-config '{"cpu_offload": false}'
  --default-chat-template-kwargs '{"thinking": false}'
  --compilation-config '{compilation_config}'
  --limit-mm-per-prompt '{"image":4}'
  --mm-encoder-tp-mode {mm_encoder_tp_mode}
  --tool-call-parser deepseek_v41
  --enable-auto-tool-choice
  --reasoning-parser deepseek_v41
  --trust-remote-code
  {extra_args}

readiness:
  # Same generous window as every recipe in this lane: a 460 GB read over the
  # shared cache, then KV sizing for a 1M ceiling and graph capture. At 1M the
  # KV-sizing profile pass is a little longer than at 300K, so no reduction here.
  port_timeout_s: 7200
  health_timeout_s: 1800

# Deliberately NOT set, and why:
#   --quantization: config.json declares quant_method exl3; the cuda_exl3 plugin
#     picks it up. A flag is wrong.
#   --speculative-config: DSpark cannot run at TP=6 (see header).
#   --enable-expert-parallel: 384 experts divide by 6, so EP is possible in a
#     way it is not at TP=3 — but EP over RoCE is unmeasured here and the
#     drafter patch assumes EP off. Pure TP first.
#   --kv-cache-memory-bytes: a pin changes the pool, so it is a measurement
#     variable, not a default (work doc 3.3).
#
# Boot-log checklist:
#   * `max_model_len: 1000000` must show on /v1/models.
#   * `GPU KV cache size` -- the granted pool. Expect a multi-M-token number
#     given TP=6's 300K pool was 12.78M. A pool below ~1M would mean ONE
#     full-length request does not fit, which is the line this recipe exists to
#     clear.
#   * the mod wrapped 3 params/layer (virtual heads); per-rank Engram ranges must
#     DIFFER across the six ranks (4 hash columns each at TP=6).
#   * the MoE must NOT raise the FlashInfer-Cutlass /128 error (384 = 128x3).
#   * verify a 1M-scale needle, not just that the server started.
