recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash
runtime: sglang
container: lmsysorg/sglang:dev-dsv41
min_nodes: 8

metadata:
  description: >-
    DeepSeek-V4.1-Flash at TP=8 across eight DGX Sparks with the Engram in host
    RAM. This is the ONLY V4.1-Flash layout that fits entirely in RAM using
    upstream SGLang features alone -- no out-of-tree NVMe row store, no
    re-quantised checkpoint. It is NOT a latency recipe: TP=8 is
    collective-latency-bound and slower per-stream than TP=4. It is the boring,
    high-probability "make it run without custom kernels" configuration.
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: mxfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: official, large-context

# ---------------------------------------------------------------------------
# WHY EIGHT NODES
# ---------------------------------------------------------------------------
# V4.1-Flash is 510.29 GB: 288.78 routed experts (packed MXFP4), 202.76 Engram
# (two F8_E4M3 [384M, 256] tables), 18.75 everything else.
#
# The bound that matters on a unified-memory part is TOTAL CLUSTER RAM, because
# bytes move between GPU and host but nowhere else:
#     weights (510.3 GB)  <=  nodes x (128 - ~18 usable)
# TP=2 gives 220 GB -> 290 GB short. TP=4 gives 440 -> 70 GB short.
# TP=8 gives 880 GB -> fits with 370 GB to spare.
#
# At TP=8 the per-node split is 38.4 GB of weights on the GPU and ~25.4 GB of
# per-rank Engram shard in host RAM = ~63.8 GB against ~110 usable. Everything
# fits, including the KV pool, activations and CUDA graphs.
#
# THE COST, stated so nobody is surprised: decode does ~104 NCCL collectives per
# step. At TP=8 each all-reduce crosses one extra ring hop, and at bs=1 the step
# is latency-bound, not bandwidth-bound. Modelled at 100 us/collective plus 20 us
# per extra hop, t_comm is ~23-25 ms/step at TP=8 against ~6-7 ms of memory
# traffic -- i.e. the interconnect dominates and the GPUs are mostly waiting.
# Expect LOWER single-stream tok/s than the TP=4 recipe, at 2x the node count.
# Run this to have a working V4.1-Flash, not to win a benchmark.
# See DS4-MODEL-OPTIMIZATION-WORK.md 5 and 5.2.
#
# If you want V4.1-Flash fast on four Sparks, the lever is a 4-bit Engram
# (INCModel3/DeepSeek-V4.1-Flash-MXFP4-Engram-AutoRound, 412.2 GB), which lands
# at ~103 GB/node at TP=4 and clears both ceilings. Work doc 3.4.

env:
  # At TP=8 the per-rank Engram shard is only ~25 GB of host mapping, so the
  # cudaHostRegister() of a single contiguous anonymous mapping is far more
  # likely to succeed than at TP=4's ~51 GB. This is the configuration the
  # upstream feature was written for.
  SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
  # 'shared' would drop a per-layer all-reduce and is the faster layout, but it
  # hands every rank rank-0's memfd through /proc/<pid>/fd/<fd> and hard-fails
  # "the TP ranks must share a PID namespace" (engram.py:605-611). Eight separate
  # Sparks do not share one. per_rank keeps the all-reduce. Do not "optimise"
  # this to shared and then debug the PID-namespace error.
  SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: per_rank

  # --- SM121 kernel survival ------------------------------------------------
  # deep_gemm/_C.so allows SM100/SM120 but NOT SM121, so fp8_paged_mqa_logits
  # raises "Unsupported architecture (attention.hpp:219)" and falls back to a
  # pure-torch dispatch OUTSIDE the CUDA graph at ~18 ms/step over the 20 DSA
  # layers -> a hard ~13-18 t/s ceiling at ANY batch size. Measured 13.5 t/s on
  # the fallback vs 18.7 with the TileLang indexer on 4x GB10.
  # Ship the workaround ON. If this image's DeepGEMM does support SM121, turn
  # both off and measure -- it is probably faster.
  SGLANG_DISABLE_DEEP_GEMM: "1"
  SGLANG_OPT_USE_TILELANG_INDEXER: "1"
  SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK: "1"

  # ~20% prefill, documented on SM100/SM120, NOT stated for SM121, and it
  # REORDERS the expert summation. Ship off until the boot is trusted.
  SGLANG_OPT_USE_DSV41_GATHERED_TOPK: "0"

  # Atomic bf16 expert-output finalize makes greedy first-token logprobs differ
  # run-to-run by up to ~1 nat. Keep off; costs ~0.3 ms/step.
  SGLANG_FLASHINFER_MOE_FUSED_FINALIZE: "0"

  # PYTORCH_CUDA_ALLOC_CONF deliberately absent: the V4.1 4x-Spark deployment
  # reports expandable_segments:True producing NaN logits on any prefill over 64
  # query tokens, while the V4-Flash Spark cells ship it and are verified.
  # Different attention backend, genuinely different behaviour. Do not harmonise.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 8
  # 0.80. At TP=8 only 38.4 GB/node is weights, so this fraction leaves ~58 GB
  # for KV + activations + graphs -- the comfortable case. Raise it only if the
  # boot log shows the KV pool is the binding constraint, and re-read the log
  # afterwards: on GB10 SGLang's "avail mem" is OS MemAvailable, so page cache
  # at load time moves it +/-0.5 GB between identical boots.
  gpu_memory_utilization: 0.80
  # KV is REPLICATED across TP ranks (num_key_value_heads: 1), so a 1M context
  # costs 0.93 GB x 8 ranks = 7.5 GB cluster-wide. Cheap, but not free, and
  # raising TP does not shard it. Start at 256K.
  max_model_len: 262144
  # Deliberately small. At TP=8 the step is collective-bound, so extra streams
  # buy aggregate throughput while per-stream latency falls off a cliff (the 4x
  # reference measured 16 streams at 134 agg but ~22 t/s per stream and TTFT
  # 12.45 s -- a throughput point, not a latency point). 8 streams is the
  # "still feels interactive" operating point for a latency-bound layout.
  max_num_seqs: 8
  # Chunk size is a MEMORY control here, not a throughput one: each chunk
  # allocates an indexer-logits buffer proportional to the prefix so far, peak
  # ~14 B x chunk x prefix (~60 GB at 4096, ~15 GB at 1024), and with the native
  # caching allocator reserved memory grows with the SQUARE of prompt length.
  chunked_prefill_size: 1024
  speculative_algorithm: DSPARK
  # Checkpoint default 5. On an MoE a window-W verify reads dense + experts*W, so
  # the dominant byte term INFLATES with the window while only the latency term
  # amortises -- work doc 5.1 predicts the optimum is nearer 4. Sweep 1..6.
  speculative_dspark_block_size: 5
  cuda_graph_max_bs_decode: 32
  load_format: safetensors
  # Escape hatch for one-off experimentation. Empty string is the no-op default;
  # quoted so YAML keeps it a str.
  extra_args: ""

command: >
  sglang serve
  --trust-remote-code
  --model-path {model}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --speculative-algorithm {speculative_algorithm}
  --speculative-dspark-block-size {speculative_dspark_block_size}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --mem-fraction-static {gpu_memory_utilization}
  --cuda-graph-max-bs-decode {cuda_graph_max_bs_decode}
  --max-running-requests {max_num_seqs}
  --load-format {load_format}
  --reasoning-parser auto
  --tool-call-parser auto
  {extra_args}

readiness:
  # 510 GB over NFS. The reference deployment's first attempt died at 48% of the
  # read with a 2001 s host-SSH timeout during a concurrent pull; the NFS cache
  # needed two warm passes before the read was stable. Eight nodes reading the
  # same export at once makes that worse, not better.
  port_timeout_s: 7200
  health_timeout_s: 1800

# Deliberately NOT set, and why:
#   --attention-backend / --moe-runner-backend / --fp8-gemm-backend: V4.1
#     auto-resolves to dsv4 / flashinfer_mxfp4 / flashinfer_cutedsl. Overriding
#     drops the 32-wide ue8m0 blocks onto Triton _w8a8_block_fp8_matmul, which
#     dominates the decode step. Read the resolved values from the log.
#   --ep-size 8: upstream runs --ep-size on NVLink domains. Across eight Sparks
#     on 200 GbE, expert parallelism adds all-to-all traffic to a layout that is
#     ALREADY collective-latency-bound. Worst possible place to try it. Measure
#     pure TP first.
#   --enable-decoder-swa-bounded-replay: real prefill win, but no shipped cell
#     combines it with DSPARK, it refuses prompt logprobs, and it is not
#     numerically equivalent to full prefill. Test separately.
#
# Boot-log checklist, in order:
#   1. `import b12x` present and dense GEMMs on b12x, not Triton? If Triton,
#      stop: the image lacks the SM12x kernels and 17 ms/step becomes ~52.
#   2. DSA indexer on TileLang, or the torch fallback? Fallback = hard ceiling.
#   3. `engram host table ...: layout=per_rank, <N> MiB resident, <M> MiB in
#      huge pages (P%)`. If it warns "No huge pages: expect ~10x slower lookups
#      (one TLB miss per row)", STOP -- that is a cliff as large as the DeepGEMM
#      one, and it is a host THP configuration problem, not a server flag.
#      Check /sys/kernel/mm/transparent_hugepage/enabled on every node.
#   4. `DSV4 memory calculation: bytes_per_full_token=... full_token=...`.
#   5. Resolved backends (expect dsv4 / flashinfer_mxfp4 / flashinfer_cutedsl).
#   6. accept length from the Decode batch lines.
#   7. NCCL: `NCCL_DEBUG=INFO` and confirm the transport is NET/IB, not a TCP
#      fallback. At TP=8 this recipe is interconnect-bound, so a silent TCP
#      fallback would look like a model problem and be a wiring problem.
#
# Proposed Changes:
#  the 4-bit Engram checkpoint at TP=4, which is strictly better than this if
#    SGLang can load it (work doc 3.4) -- this recipe exists as the fallback that
#    needs no new code.
#  --speculative-dspark-block-size sweep 1..6
#  a `no-spec` sibling for a true target-only baseline
