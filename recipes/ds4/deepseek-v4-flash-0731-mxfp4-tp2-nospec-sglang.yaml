recipe_version: "2"
model: deepseek-ai/DeepSeek-V4-Flash-0731
runtime: sglang
container: lmsysorg/sglang:dev-v4f-2dgx-v2
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    No-speculation control for DeepSeek-V4-Flash-0731 at TP=2. Not a shipping
    recipe: it exists to supply the denominator the DSpark recipes cannot
    provide on their own. Without it every DSpark throughput number in this
    family is a ratio with a missing bottom term.
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "284B"
  model_dtype: mxfp4
  kv_dtype: fp8
  tags: control, measurement_only

# Byte-identical to deepseek-v4-flash-0731-mxfp4-tp2-sglang.yaml minus the three
# --speculative-* lines. Do NOT "tidy" anything else: every difference from that
# recipe is a confound in the one number this recipe exists to produce.
#
# The speculative flags are ABSENT, not set to a null-ish value.
# `speculative_algorithm: NONE` is a truthy *string* where None is falsy, which
# routes a no-spec server into spec-decode metrics and crashes it -- see
# mods/fix-sglang-spec-metrics-empty-verify and the same warning in
# recipes/qwen3/qwen3.8-27b-nvfp4-nospec-control-sglang.yaml. Omit them.

env:
  SGLANG_SM120_FLASHMLA_BACKEND: b12x
  B12X_MLA_SM120_DSV4_H16_NATIVE: "1"
  SGLANG_OPT_FUSE_MHC_POST_PRE: "1"
  SGLANG_OPT_FP8_WO_A_GEMM: "1"
  SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK: "1"
  # MUST equal --chunked-prefill-size below. sparkrun does NOT interpolate
  # {placeholders} inside `env:` (verified 2026-09-19 with `sparkrun recipe
  # show`), so this is duplicated by hand and kept honest by
  # tests/test_ds4_recipes.py::B12xPrefillGate.
  SGLANG_B12X_MAX_TOKENS: "8192"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  max_model_len: 327680
  # See the CONCOUND warning below: without a draft, granted concurrency is
  # higher than the DSpark arm at the same number here.
  max_num_seqs: 32
  chunked_prefill_size: 8192
  swa_full_tokens_ratio: 0.2
  moe_runner_backend: b12x
  cuda_graph_max_bs_decode: 32
  load_format: safetensors
  extra_args: ""

command: >
  sglang serve
  --trust-remote-code
  --model-path {model}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --moe-runner-backend {moe_runner_backend}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --mem-fraction-static {gpu_memory_utilization}
  --swa-full-tokens-ratio {swa_full_tokens_ratio}
  --cuda-graph-max-bs-decode {cuda_graph_max_bs_decode}
  --max-running-requests {max_num_seqs}
  --load-format {load_format}
  --reasoning-parser auto
  --tool-call-parser auto
  {extra_args}

readiness:
  # Same 167 GB cold NFS read as the arm it controls, so it must match. A short
  # timeout here would report a false regression against the DSpark arm.
  port_timeout_s: 1800
  health_timeout_s: 900

# WHY THIS EXISTS
#
# DeepSeek-V4-Flash is an MoE: 284B total, ~13B active, 6 routed experts per
# token across 43 layers plus one shared expert per layer. Bytes per token,
# computed from safetensors tensor shapes (not the model card's param count,
# which mixes precisions):
#
#     routed experts   3.449 GB   (6 of 256, per layer, MXFP4)
#     dense + attn     6.728 GB   (FP8, read in full every token)
#     lm_head          1.059 GB
#     ---------------- ---------
#     target step     11.236 GB/token
#
# At TP=2 that is 5.62 GB/rank/token. Against the 224.6 GB/s scattered-read
# figure measured on GB10 (recipes/qwen4, 10 of 512 slabs of a 63.34 MiB
# tensor), the pure-memory term is 25.0 ms/token, i.e. a ~40 tok/s ceiling.
#
# Our decode model (DS4-MODEL-OPTIMIZATION-WORK.md 5) predicts materially
# less -- roughly 26 t/s additive at TP=2 target-only -- because at batch 1 the
# step is dominated by ~104 NCCL collectives and ~2000 small kernels, not by
# bytes. Every DSpark number for this model is therefore a product of three
# unknowns, and a benchmark cannot separate them:
#
#     tok/s ~= accept_len * bytes_rate / (t_mem + t_comm + t_launch)
#
# This recipe supplies the plain-decode term, which turns the DSpark arm's
# speedup into a measured acceptance multiplier instead of an inferred one, and
# turns "DSpark is fast" into "DSpark is fast by A over a baseline whose
# bottleneck is X".
#
# Falsifiable predictions, stated before running:
#   P1  target-only at bs=1 lands near 20-26 t/s. If it lands materially
#       higher, the collectives are overlapping better than the additive model
#       assumes -- which would mean the additive form is wrong and the
#       calibrated agreement with the reference deployment's 82 ms step was
#       coincidence. That matters more than the throughput number.
#   P2  prefill is flat in context length beyond ~64K, because the sparse
#       indexer reads index_topk=512 blocks regardless of prefix length. If
#       prefill falls off with context, the indexer is NOT on the sparse path
#       and you are looking at a fallback kernel -- check before tuning.
#   P3  with no draft, --max-running-requests 32 should be granted in full. If
#       the boot logs a cap, the cap is coming from something other than the
#       (1+D) draft reservation and needs explaining.
#
# CONCOUND, and it is the one that will bite: with DSpark block_size 5 each
# running request reserves draft state for 6 tokens, so the DSpark arm and this
# arm do NOT grant the same concurrency at the same --max-running-requests.
# Read the granted `max_running_requests` and any "capped to" line from BOTH
# boot logs and report the pair. A spec-vs-nospec comparison run above the
# lower of the two granted values is not measuring the same thing. Same lesson
# the Qwen3.8 control learned the hard way (its comment block, lines 34-41).
#
# Report accept length for the DSpark arm alongside this number. A DSpark figure
# without an accept length is not a number: acceptance is strongly
# workload-dependent, highest on maths and code, lower on open chat.

# Proposed Changes:
#  a matching `no-spec` arm for deepseek-v4.1-flash-mxfp4-tp4-sglang once the
#    TP=4 image question is settled (work doc 8.1-8.2) -- it is the more
#    interesting denominator but currently the less likely to boot.
