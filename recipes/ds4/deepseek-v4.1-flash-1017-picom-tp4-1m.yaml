# Production picom (dsgb10) arm — the shipped serve, strictly lossless. The three
# `zz-ds4-1017-picom-*` arms (now `attic/ds4/`) are the experiment record; this pair
# supersedes them for serving. Boot receipt: `head:~/benchmarks/picom-prod-20261118/`.
recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash-1017
runtime: vllm
# Same pin as the lane's shipped arms: 08c8657f differs from the upstream-validated
# 1bae0e10 only in chat_template.jinja, which this engine never reads.
model_revision: 08c8657f02291e11b6f6b63e0e16014f8e748518
# Built from Picom-code/pico-dgx-ds4@7c123ad4 plus two tracked PR patches
# (recipes/ds4/Dockerfile.picom-ds41f): dsgb10_rank, dsfront, the weight/Engram
# converters, the vision encoder and the draft-gate weights. Weights stay in the HF cache.
container: ghcr.io/littlecedar/dgx-picom-ds41f@sha256:1e529c67f268806bbf3468e176d39f6ee6907ca3ee118e96a10e7072200883a4
min_nodes: 4
max_nodes: 4
description: >-
  DeepSeek-V4.1-Flash-1017 served by picom (dsgb10), a from-scratch C++/CUDA TP=4
  engine on 4x DGX Spark (GB10) over a switched RoCE fabric: 1M context, 16 slots
  (4 big), a 262,144-token reply ceiling, 16384-row prefill chunks, DSpark drafts,
  OpenAI chat/completions, streamed tool-call arguments and images (the checkpoint's
  own ViT as a supervised side encoder) through dsfront. Strictly lossless: OEA off.
  The ceiling is also the default, so an omitting request may generate up to 262,144
  tokens; a request's need is `prompt + max_new`, so only one of the four big slots
  admits it — twelve of sixteen become unusable for such a request and a fifth
  concurrent one queues silently rather than erroring — so always send `max_tokens`.
  The endpoint needs the bearer key rank 0 writes under
  `/cache/runtime/picom/run/api-key`; `/health` is keyless. See README.md, section
  "Production arms", for the boot contract and `PICOM-VS-KNAPCIO.md` for the comparison.
metadata:
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: mxfp4
  kv_dtype: fp8
  tags: ds4, reasoning, agent, fast, large_context, vision, tools
mods:
  - "mods/picom-launcher"
executor_config:
# The image has no ENTRYPOINT; clear it so the recipe's command is the process.
  entrypoint: ""
env:
# Per-node, rendered by sparkrun from the launch host list:
# rank 0 runs the engine and dsfront; ranks 1-3 run the engine only.
  PICOM_NODE_RANK: "{launch.node_rank}"
  PICOM_NODE_HOST: "{launch.node_host}"
# REQUIRED at launch — no default is possible: cluster addresses are
# forbidden in tracked files (tests/test_tracked_address_hygiene.py).
# The four fabric address tails, rank 0-3, comma-separated:
#   -o env.PICOM_RANK_TAILS=30,31,32,33
  PICOM_RANK_TAILS: ""
  PICOM_FABRIC_A: "192.168.0"
  PICOM_FABRIC_B: "192.168.1"
# f1 is down on this fleet: the switched ring rides the same two f0 devices in
# both directions, one QP per role.
  PICOM_DEV_A: "rocep1s0f0"
  PICOM_DEV_B: "roceP2p1s0f0"
  PICOM_GID_INDEX: "3"
  PICOM_RING_DIRECT: "2"
# One space-separated argv list; the launcher word-splits it positionally and
# silently drops a token it does not know. `--prefill-rows 16384` dies at startup
# without `--snap-every 2048` (serve.cpp:1572, kMaxSnaps 8) and costs ~2 GiB of
# prefill buffers a rank (6.92 GiB against 4.89) for 983,040-token prefill in 96.5 s.
  PICOM_ENGINE_ARGS: >-
    --max-ctx 1048576 --slots 16 --big-slots 4
    --setenv DSGB10_BUDGET=1
    --setenv DSGB10_DRAFT1=6 --setenv DSGB10_WIDE=64
    --setenv DSGB10_WIDE_COST=24,2.2,57,1.1
    --draft-head4 --draft-markov8 --setenv DSGB10_HEAD4_C1=1
    --setenv DSGB10_CF_ALPHA=1.0 --setenv DSGB10_CERT=1
    --prefill-rows 16384 --snap-every 2048
# Empty = OEA off. `4,12,9` is the lossy batch-aware MoE re-route (see the -oea arm).
  PICOM_OEA: ""
# The vision encoder as part of the serve: the checkpoint's own ViT on rank 0,
# ~1 GiB of its GPU; 0 = off and image requests then answer 400.
  PICOM_VISION: "1"
  PICOM_VISION_PORT: "18950"
  PICOM_STREAM_TOOL_ARGS: "1"
# dsfront's `--max-tokens`: the reply ceiling *and* the default for a request that
# omits the field. The old 32,768 clamped a larger request silently and reported
# `finish_reason: length`. A 262,144-token reply needs one of the four big slots
# (`prompt + max_new` ≤ 1,048,576); the other twelve hold 131,072.
  PICOM_MAX_TOKENS: "262144"
defaults:
  port: 8000
# One GPU per node: the engine's TP=4 is four processes, not a torch world, so
# sparkrun's default tensor_parallel of 1 is exactly right.
  served_model_name: deepseek-ai/DeepSeek-V4.1-Flash-1017
command: >
  bash /workspace/mods/picom-launcher/launch.sh
  --model {model}
  --revision {model_revision}
  --served-model-name {served_model_name}
  --port {port}
readiness:
# No chat surface exists before the engine's socket; the launcher binds dsfront
# only after it is up. First boot converts this rank's weights and packs Engram.
  inference: false
  port_timeout_s: 10800
  health_timeout_s: 3600
