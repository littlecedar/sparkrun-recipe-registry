recipe_version: "2"
model: deepseek-ai/DeepSeek-V4-Flash-0731
runtime: sglang
container: lmsysorg/sglang:dev-v4f-2dgx-v2
min_nodes: 2

metadata:
  description: >-
    DeepSeek-V4-Flash-0731 MXFP4 (official checkpoint) at TP=2 across two DGX
    Sparks. Port of the upstream-verified SGLang `dgx-spark | flash-official |
    fp4` cell. This is the SMALLER of the two V4.1-Flash-family checkpoints and
    the only DeepSeek V4 checkpoint that fits TP=2 at all.
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "284B"
  model_dtype: mxfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: official, large-context

# Why this checkpoint and not V4.1-Flash at TP=2: V4.1-Flash's non-Engram weights
# are 307.5 GB and a Spark pair has 220 GB of usable RAM total (2 x (128 - ~18)).
# It cannot be placed anywhere on a pair -- not on the GPU, not in host RAM, not
# split between the two -- regardless of flags or quantisation. See
# DS4-MODEL-OPTIMIZATION-WORK.md 3 and 3.4. This checkpoint is 166.9 GB, so at
# TP=2 it is ~83.5 GB/node: it fits.
#
# Image caveat: DGX Spark-only preview build (2x GB10, TP=2 over ConnectX-7). It
# bakes the SM12x b12x MoE (W4A8) + compressed-MLA kernels
# (sgl-project/sglang#34878, #35899, #34018) and the b12x image-prefill fix
# (#37253). Do not use on other hardware; Docker mode is mandatory because the
# bare-Python path needs the b12x package this image ships.
#
# Checkpoint format note (why no --quantization here): expert_dtype is "fp4" but
# it is MXFP4 -- I8 holding two E2M1 values per byte along K, with one ue8m0
# (F8_E8M0) scale per 32 K-elements. Verified against tensor shapes:
#   w1 logical [2048,4096] ships I8 [2048,2048] + F8_E8M0 [2048,128]
#   w2 logical [4096,2048] ships I8 [4096,1024] + F8_E8M0 [4096,64]
# i.e. packed along K by 2, scaled every 32. The official checkpoint is already
# FP4; the nvidia NVFP4 repo is a DIFFERENT quantisation, not a smaller one --
# it is 175.56 GB here vs this repo's 166.9 GB, because NVFP4 spends one E4M3
# scale per 16 elements where MXFP4 spends one ue8m0 scale per 32.

env:
  SGLANG_SM120_FLASHMLA_BACKEND: b12x
  B12X_MLA_SM120_DSV4_H16_NATIVE: "1"
  SGLANG_OPT_FUSE_MHC_POST_PRE: "1"
  SGLANG_OPT_FP8_WO_A_GEMM: "1"
  SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK: "1"
  # MUST equal --chunked-prefill-size below. sparkrun does NOT interpolate
  # {placeholders} inside `env:` (verified with `sparkrun recipe show`), so this
  # is duplicated by hand and kept honest by the tests/ guard.
  SGLANG_B12X_MAX_TOKENS: "8192"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # 0.80. On a unified-memory part this fraction over-promises by roughly what
  # the OS holds (~18 GB of the 128), and the remainder covers the prefill
  # transient. Lowering it does not free RAM -- it only starves KV.
  # DS4-MODEL-OPTIMIZATION-WORK.md 6.1.
  gpu_memory_utilization: 0.80
  max_model_len: 327680
  max_num_seqs: 32
  chunked_prefill_size: 8192
  swa_full_tokens_ratio: 0.2
  # b12x is the MXFP4 W4A8 runner, and this checkpoint IS MXFP4, so -- unlike the
  # NVFP4 sibling -- no runner override and no --disable-shared-experts-fusion.
  # Keep the draft on b12x too: the MTP experts are MXFP4 as well.
  moe_runner_backend: b12x
  speculative_moe_runner_backend: b12x
  speculative_algorithm: DSPARK
  speculative_dspark_block_size: 5
  cuda_graph_max_bs_decode: 32
  load_format: safetensors
  # Boot 1 (2026-09-24) died 5m07s into load while in the load-time FP8->FP4
  # shared-expert conversion; boot 2 with this raised to 3600 lived past that
  # (8+ min) and then died at the SAME step anyway. So the watchdog was NOT the
  # cause -- keep it generous (the default 300 s is too short for a 167 GB load
  # on GB10 regardless) but do not record it as the fix. No host OOM
  # (`OOMKilled=false`, 117 GB free, dmesg OOM entries predate the boot by
  # hours). This is an upstream load-path fault on the shared-expert quant; it
  # needs a debugging session, not another flag.
  watchdog_timeout: 3600
  extra_args: ""

command: >
  sglang serve
  --trust-remote-code
  --model-path {model}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --moe-runner-backend {moe_runner_backend}
  --speculative-moe-runner-backend {speculative_moe_runner_backend}
  --speculative-algorithm {speculative_algorithm}
  --speculative-dspark-block-size {speculative_dspark_block_size}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --mem-fraction-static {gpu_memory_utilization}
  --swa-full-tokens-ratio {swa_full_tokens_ratio}
  --cuda-graph-max-bs-decode {cuda_graph_max_bs_decode}
  --max-running-requests {max_num_seqs}
  --load-format {load_format}
  --watchdog-timeout {watchdog_timeout}
  --reasoning-parser auto
  --tool-call-parser auto
  {extra_args}

readiness:
  port_timeout_s: 3600
  health_timeout_s: 900

# Deliberately NOT set, and why:
#   --attention-backend / --fp8-gemm-backend / --moe-a2a-backend: they
#     auto-resolve, and overriding drops the 32-wide ue8m0 blocks onto the Triton
#     _w8a8_block_fp8_matmul fallback, which dominates the decode step. Read the
#     resolved backends from the startup log instead.
#   --disable-shared-experts-fusion: needed only under the cutlass runner (the
#     NVFP4 sibling). Here b12x accepts the fused shared expert.
#
# Boot-log checklist:
#   1. DSA indexer on TileLang/DeepGEMM, or the torch fallback? The fallback is a
#      HARD ~13-18 t/s ceiling at any batch size (deep_gemm hard-blocks SM121:
#      "Unsupported architecture (attention.hpp:219)"). Biggest single risk.
#      Workaround if it falls back: SGLANG_OPT_USE_TILELANG_INDEXER=1 and
#      SGLANG_DISABLE_DEEP_GEMM=1 (worth ~2.3x at concurrency).
#   2. `DSV4 memory calculation: bytes_per_full_token=... full_token=...` -- the
#      KV pool actually granted. On GB10 this is OS MemAvailable, so page cache
#      at load time moves it +/-0.5 GB between identical boots.
#   3. accept length from the Decode batch lines.
#
# `sparkrun recipe vram` under-reports V4 weight bytes by ~17%; take the HF
# usedStorage / TP as the truth (DS4-MODEL-OPTIMIZATION-WORK.md 3.3).
#
# Proposed Changes:
#  --speculative-dspark-block-size sweep 1..6 (work doc 5.1 predicts the optimum
#    is nearer 4 than 5: on an MoE the verify step re-reads routed-expert weights
#    per proposed token while only the latency term amortises)
#  a `no-spec` sibling for a true target-only baseline
