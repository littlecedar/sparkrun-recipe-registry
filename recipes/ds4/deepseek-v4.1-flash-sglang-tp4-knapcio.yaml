recipe_version: "2"
model: deepseek-ai/DeepSeek-V4.1-Flash
runtime: sglang
container: littlecedar/dgx-spark-dsv41:canary-roce@sha256:932dd8c2722b07d3f835cab0be3ce6a43e67fe987e904885876d97539e958825
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash on 4x DGX Spark (GB10), SGLang, native MXFP4/F8
    checkpoint with the Engram on NVMe, TP=4 EP=1, DSpark k=5, 1M context,
    RoCEnante RDMA transport. Adaptation of
    knapcio/DeepSeek-V4.1-Flash-4x-DGX-Spark-TP4 (downstream of
    MiaAI-Lab's recipe; the launcher, adapters, b12x kernels and measurement
    design are theirs, kept under the upstream licences). See
    KNAPCIO-SGLANG-INTEGRATION.md in this directory for provenance and limits.
  model_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "552B"
  model_dtype: mxfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: official, large-context

mods:
  # Copies launcher.py into /workspace/mods/dsv41-sglang-overlay and fails closed
  # unless the container really is the knapcio overlay image. The image already
  # bakes /opt/dsv41/adapter (on PYTHONPATH) and /opt/dsv41/boot.py.
  - "@littlecedar/mods/dsv41-sglang-overlay"

executor_config:
  # The image entrypoint is `python3 -u /opt/dsv41/boot.py`; clear it so the
  # recipe command (the launcher shim) is what runs.
  entrypoint: ""
  # Rootless defaults already give IPC_LOCK / memlock=-1 and /dev/infiniband.
  shm_size: 32gb
  # NO volumes:. Every cacheable artifact lives under sparkrun's managed runtime
  # cache, which sparkrun creates and chowns per node and mounts read-write:
  #   <host> ~/.cache/sparkrun/runtime-cache/sglang/<model_dir> -> /cache/runtime
  # (model_dir = deepseek-ai__DeepSeek-V4.1-Flash-9a74d993, keyed by model and
  # revision; sparkrun owns the name, the recipe never spells it). So this recipe
  # carries no machine-specific host path. The launcher shim materializes the
  # per-rank Engram shards under /cache/runtime/engram and the mod chowns the
  # subdirs; boot.py's launch.json / api-key go to /cache/runtime/state; the
  # b12x JIT caches go beside them. The model itself stays in the shared HF
  # cache mounted at /cache/huggingface. See KNAPCIO-SGLANG-INTEGRATION.md
  # ("Portability") and the mod README.

distribution_config:
  containers:
    # The image is published (littlecedar/dgx-spark-dsv41:canary-roce, pinned by
    # digest) so it can be vendored/pulled instead of built on every node. It is
    # arm64-only; set `enabled: false` only if you build it locally as
    # `dsv41-4x-spark:canary-roce`.
    enabled: true
  models:
    # The checkpoint is a shared HF cache, mounted at /cache/huggingface on every
    # node; never re-download or fan out.
    enabled: false

env:
  # The env: block is deliberately THIN. mods/dsv41-sglang-overlay/launcher.py
  # fills the production configuration (locations under /cache/runtime, engine
  # flags, the adapter enablement, RoCEnante and the NCCL transport tuning) with
  # setdefault, so a value here or in the container env still wins. Only the
  # external checkpoint path and the TP degree are recipe-owned, because the
  # launcher cannot derive them (it gets --nnodes, not the TP degree, and the
  # checkpoint is the one input that lives outside the image).
  #
  # Everything the launcher sets is inventoried in
  # .scratch/ds4/knapcio/ENV-MIGRATION.md; the mod README lists it too.
  #
  # NO NCCL_NET / NCCL_IB_HCA / NCCL_IB_GID_INDEX / NCCL_IB_DISABLE /
  # NCCL_CROSS_NIC and NO B12X_ROCE_HCA: sparkrun's InfiniBand probe fills them
  # per cluster from the live CX7 firmware (and b12x falls back to the detected
  # NCCL_IB_HCA), so naming a host device here would break portability.
  #
  # The HF cache is mounted by sparkrun at /cache/huggingface. Use the literal
  # snapshot path (a bare assignment does not glob). A shared cache re-resolves
  # when the upstream repo moves, so this literal is a PREFERENCE: if it is
  # absent/broken, the launcher switches MODEL_PATH/DSV41_SOURCE to the snapshot
  # the cache actually serves (refs/main, else any complete snapshot).
  MODEL_PATH: /cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4.1-Flash/snapshots/2cba9e42aa026125f3ed06c6d98c1db82f7ca027
  DSV41_SOURCE: /cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4.1-Flash/snapshots/2cba9e42aa026125f3ed06c6d98c1db82f7ca027
  TP_SIZE: "4"

defaults:
  port: 8888
  host: 0.0.0.0
  tensor_parallel: 4
  # Kept for sparkrun's topology/rendezvous bookkeeping; boot.py takes TP_SIZE
  # from the env above. Not emitted as a flag (the command is a template).
  max_model_len: 1048576
  served_model_name: deepseek-v4.1-flash

# The launcher shim consumes sparkrun's appended
# `--dist-init-addr H:P --nnodes N --node-rank R` and execs boot.py.
command: >
  python3 /workspace/mods/dsv41-sglang-overlay/launcher.py
  --boot
  --port {port}

readiness:
  # boot.py reads 476 GiB, builds the DSpark draft, sizes KV and captures graphs.
  # inference is off because readiness drives /chat/completions, and the engine
  # answers /health from the moment the HTTP server binds.
  inference: false
  port_timeout_s: 7200
  health_timeout_s: 3600

# Boot-log checklist (see KNAPCIO-SGLANG-INTEGRATION.md, "Boot gates"):
#   1. `[dsv41-sglang-overlay] overlay gate OK` and `launcher: boot.py run ...`
#      with NNODES=4 and the right NODE_RANK per node.
#   2. `Exact nvme Engram layer=... rank=... rows=[a,b)` must DIFFER per rank and
#      report packed=<the /cache/runtime/engram shard>. A "could not open" or an
#      identical range is a stop. `packed=False` on a cold cache is not an error
#      (the launcher packs in the background and the next boot picks it up).
#   3. `[moe_b12x_next] armed` and `RoCEnante ready: world=4 ...`.
#   4. `DSV4 memory calculation: ... full_token=<N>` -- the granted KV pool.
#   5. DSpark acceptance on Decode batch lines (>1; workload dependent).
