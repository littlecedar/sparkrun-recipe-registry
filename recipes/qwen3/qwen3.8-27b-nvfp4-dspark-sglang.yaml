recipe_version: "2"
model: RadixArk/Qwen3.8-27B-NVFP4
runtime: sglang
container: lmsysorg/sglang:dev-cu13

metadata:
  description: Qwen3.8-27B-NVFP4-DSpark (SpecForge v2 draft)
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "27B"
  model_dtype: nvfp4
  model_draft_dtype: bf16
  # KV dtype resolves exactly as in the DFlash2 sibling recipe: --kv-cache-dtype is
  # left at auto so the checkpoint keeps ownership; auto resolves to fp8_e4m3 because
  # this hf_quant_config ships kv_cache_quant_algo FP8 (read the server's allocation
  # line, not the --help text — see the sibling recipe's metadata comment).
  kv_dtype: fp8_e4m3
  tags: large-context, vision

mods:
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/pip-install-fastsafetensors"


defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  # Same memory-shape levers as the DFlash2 sibling, same rationale — read that
  # recipe's comments before touching these; the mamba pool, not max_num_seqs, is
  # the admission ceiling ("capped to 21" at D=8 on this hardware; D=7 verifies one
  # fewer token per step, so the grant can only improve).
  max_num_seqs: 48
  mamba_full_memory_ratio: 3.51
  mamba_ssm_dtype: bfloat16
  mamba_radix_cache_strategy: extra_buffer_lazy
  kv_cache_dtype: auto
  chunked_prefill_size: 4096
  attention_backend: flashinfer
  speculative_algorithm: DSPARK
  speculative_draft_model: RadixArk/Qwen3.8-27B-DSpark
  # 8, not 7: SGLang's DSpark hook requires speculative_num_draft_tokens ==
  # gamma + 1 (speculative_hook.py:650 raises otherwise; captured live on the
  # first boot 2026-10-10). The card's "gamma 7" is the window-minus-one, the
  # same gamma+1 semantics as ds4's DSPARK_BLOCK_SIZE.
  speculative_num_draft_tokens: 8
  speculative_num_steps: 1
  extra_args: ""

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --load-format fastsafetensors
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --mamba-full-memory-ratio {mamba_full_memory_ratio}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path {speculative_draft_model}
  --speculative-num-steps {speculative_num_steps}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  --kv-cache-dtype {kv_cache_dtype}
  {extra_args}
