recipe_version: "2"
model: RadixArk/Qwen3.8-27B-NVFP4
runtime: sglang
container: lmsysorg/sglang:dev-cu13

metadata:
  description: Qwen3.8-27B-NVFP4-DSpark (SpecForge v2 draft)
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "27B"
  model_dtype: nvfp4
  model_draft_dtype: bf16
  # KV dtype resolves exactly as in the DFlash2 sibling recipe: --kv-cache-dtype is
  # left at auto so the checkpoint keeps ownership; auto resolves to fp8_e4m3 because
  # this hf_quant_config ships kv_cache_quant_algo FP8 (read the server's allocation
  # line, not the --help text — see the sibling recipe's metadata comment).
  kv_dtype: fp8_e4m3
  tags: large-context, vision

mods:
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/pip-install-fastsafetensors"
# MEASURED, REJECTED (2026-10-10, decode-triage profile d=0/c=1 and d=8192/c=1,
# runs=5, nodes .31): 28.46 / 28.43 t/s vs the shipping DFlash2 arm's 33.76
# (same profile) — a ~16% LOSS. The card's 3.16x-over-AR / beats-EAGLE numbers
# were measured on GB300/H200 and do not transfer to SM121/GB10, the same
# pattern as the ds4 gamma finding. The DSPARK path DOES boot for this Qwen3_5
# hybrid on GB10 (the open question), but the draft is not a shipping upgrade.
# Receipts: ~/benchmarks/qwen3-dspark-20261010/decode-triage.{json,yaml}.
# Kept as an experimental arm; rollback = the DFlash2 sibling.

# WHY THIS RECIPE EXISTS (2026-10-10). The lane's own WORK doc concluded "the lever
# that remains is the draft model, not the flag" and "anything above ~32 tok/s needs
# a better draft" (the DFlash2 sibling ships 33.8 t/s at block 8). RadixArk/
# Qwen3.8-27B-DSpark is a SpecForge-trained DSpark speculative decoder (1.86B BF16,
# 5 full-attention layers) for EXACTLY this NVFP4 target. Its card (v2, updated
# 2026-08-29) publishes aggregate acceptance 3.43 (+26% over its v1), C=1 throughput
# 3.16x (GSM8K) / 2.25x (MT-Bench) over autoregressive, beating EAGLE — measured on
# GB300/H200, NOT SM121. The DSPARK path DOES boot for this Qwen3_5 hybrid on
# GB10 (answered 2026-10-10), but the arm measures ~16% SLOWER than the shipping
# DFlash2 lane — see the MEASURED, REJECTED block above. Rollback = the DFlash2
# sibling recipe, which stays the shipping lane.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  # Same memory-shape levers as the DFlash2 sibling, same rationale — read that
  # recipe's comments before touching these; the mamba pool, not max_num_seqs, is
  # the admission ceiling ("capped to 21" at D=8 on this hardware; D=7 verifies one
  # fewer token per step, so the grant can only improve).
  max_num_seqs: 48
  mamba_full_memory_ratio: 3.51
  mamba_ssm_dtype: bfloat16
  mamba_radix_cache_strategy: extra_buffer_lazy
  kv_cache_dtype: auto
  chunked_prefill_size: 4096
  attention_backend: flashinfer
  speculative_algorithm: DSPARK
  speculative_draft_model: RadixArk/Qwen3.8-27B-DSpark
  # 8, not 7: SGLang's DSpark hook requires speculative_num_draft_tokens ==
  # gamma + 1 (speculative_hook.py:650 raises otherwise; captured live on the
  # first boot 2026-10-10). The card's "gamma 7" is the window-minus-one, the
  # same gamma+1 semantics as ds4's DSPARK_BLOCK_SIZE.
  speculative_num_draft_tokens: 8
  speculative_num_steps: 1
  extra_args: ""

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --load-format fastsafetensors
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --mamba-full-memory-ratio {mamba_full_memory_ratio}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path {speculative_draft_model}
  --speculative-num-steps {speculative_num_steps}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  --kv-cache-dtype {kv_cache_dtype}
  {extra_args}
