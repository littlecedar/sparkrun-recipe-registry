recipe_version: "2"
model: RadixArk/Qwen3.8-27B-NVFP4
model_revision: 319f741cce68d7914884900c138a1fbb70a42f30
runtime: sglang
container: lmsysorg/sglang:dev-cu13@sha256:0a1ba33aa4e032b8c5bcebdc69c45664074c032074add4f7db01629ec1fcc381
  # Pin the build, not the branch: this tag is rebuilt upstream (nightly-dev-20261015-a6a8c560
  # was pushed hours before this pin) and the mod below anchor-checks the engine it patches.
cluster_only: false

metadata:
  description: Qwen3.8-27B-NVFP4-DFlash2
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "27B"
  model_dtype: nvfp4
  model_draft_dtype: bf16
  kv_dtype: fp8_e4m3
  tags: lcg_favorite, fast, vision

mods:
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/pip-install-fastsafetensors"
  - "@littlecedar/mods/fix-fastsafetensors-tp2-sglang"

# Seeds the pinned draft's refs/main: a SHA-keyed fetch writes no refs/ entry, and
# SGLang's offline draft-config lookup resolves only refs/main.
pre_exec:
  - >-
    set -e; R=/cache/huggingface/hub/models--z-lab--Qwen3.8-27B-DFlash2;
    S=$R/snapshots/{speculative_draft_model_revision};
    test -d "$S" || { echo "draft snapshot missing: $S" >&2; exit 1; };
    mkdir -p "$R/refs";
    printf %s {speculative_draft_model_revision} > "$R/refs/main"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: RadixArk/Qwen3.8-27B-NVFP4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  # Read the grant from the server log, never from this literal: the mamba state pool
  # clamps it while the loader strands its staging buffer (`capped to 21`, K=85 before
  # 2026-10-15; `capped to 40`, K=161-163 on current dev-cu13 without the fix). With the
  # shipped fastsafetensors buffer fix mounted there is NO clamp: K=252, 48 granted. Measured
  # 2026-10-15, receipt in the lane docs.
  max_num_seqs: 48
  # HIGH-LEVERAGE, context-length dependent: splits the leftover pool between GDN state
  # and tokens; the optimum is interior and MOVES with context length -- ask before changing.
  mamba_full_memory_ratio: 3.51
  # bfloat16 deliberately overrides the checkpoint's float32: it DOUBLES granted
  # concurrency (21 vs 10 slots) and is bit-identical on the state-read path. Do not "restore float32".
  mamba_ssm_dtype: bfloat16
  mamba_radix_cache_strategy: extra_buffer_lazy
  kv_cache_dtype: auto
  # Scheduler token budget per prefill batch -- NOT draft length (the draft's block size
  # is speculative_draft_tokens below).
  chunked_prefill_size: 4096
  attention_backend: flashinfer
  speculative_algorithm: DFLASH
  speculative_draft_model: z-lab/Qwen3.8-27B-DFlash2
  # Distribution-only: SGLang has no serve flag for the draft head, so this pin reaches
  # distribution; the pre_exec seed below writes the refs/ entry SGLang's lookup needs.
  speculative_draft_model_revision: 50307d4c4cde6860d4eee73e2547cd786fe8e8a4
  # Must stay 8 (the draft's trained dflash_config.block_size): any other value wins
  # silently, and raising past 8 trips DFLASH's block-size mismatch guard.
  speculative_draft_tokens: 8
  extra_args: ""

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --load-format fastsafetensors
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --mamba-full-memory-ratio {mamba_full_memory_ratio}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path {speculative_draft_model}
  --speculative-num-draft-tokens {speculative_draft_tokens}
  --kv-cache-dtype {kv_cache_dtype}
  {extra_args}

