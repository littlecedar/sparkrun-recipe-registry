recipe_version: '2'
model: Intel/Qwen3-Coder-Next-int4-AutoRound
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
min_nodes: 1

metadata:
  description: Qwen3-Coder-Next-int4-Autoround
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  tags: lcg_favorite, fast

mods:
  - "@eugr/mods/fix-qwen3-next-autoround"

env:
  VLLM_USE_FLASHINFER_MOE_FP8: 1
  VLLM_SLEEP_WHEN_IDLE: 0
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: 1

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_num_seqs: 48
  max_num_batched_tokens: 8192
  optimization_level: 3
  performance_mode: throughput
  max_model_len: 262144
  load_format: instanttensor

command: >
  taskset -c 5-9,15-19 vllm serve
  Intel/Qwen3-Coder-Next-int4-AutoRound
  --host {host}
  --port {port}
  --enable-auto-tool-choice
  --language-model-only
  --enable-prefix-caching
  --enable-chunked-prefill
  --mamba-cache-mode align
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --max-model-len {max_model_len}
  --gpu-memory-utilization {gpu_memory_utilization}
  --load-format {load_format}
  --max-num-batched-tokens {max_num_batched_tokens}
  --max-num-seqs {max_num_seqs}
  --optimization-level {optimization_level}
  --performance-mode {performance_mode}
