recipe_version: '2'
model: Intel/Qwen3-Coder-Next-int4-AutoRound
model_revision: 79c8a6bb73b7946095d7ece1f8fc68535f7c9ab8
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly@sha256:cc47adc1b210066dca421bdcd7ca6f16680b6579533f348c0d8c072da194cf98
min_nodes: 1

description: Qwen3-Coder-Next-int4-Autoround
metadata:
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  tags: lcg_favorite, fast

mods:
  - "@eugr/mods/fix-qwen3-next-autoround"

env:
  VLLM_USE_FLASHINFER_MOE_FP8: 1
  VLLM_SLEEP_WHEN_IDLE: 0
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: 1

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_num_seqs: 48
  max_num_batched_tokens: 8192
  optimization_level: 3
  performance_mode: throughput
  max_model_len: 262144
  load_format: instanttensor
  # Native thinking leaves short replies in the reasoning channel with `content: null`
  # (the qwen3 parser never sees a closing think tag), which clients that read
  # `content` see as an empty reply. Default OFF; opt back in per request with
  # chat_template_kwargs {"enable_thinking": true}.
  default_chat_template_kwargs: '{"enable_thinking": false}'

command: >
  taskset -c 5-9,15-19 vllm serve
  Intel/Qwen3-Coder-Next-int4-AutoRound
  --revision=79c8a6bb73b7946095d7ece1f8fc68535f7c9ab8
  --tensor-parallel-size {tensor_parallel}
  --host {host}
  --port {port}
  --enable-auto-tool-choice
  --language-model-only
  --enable-prefix-caching
  --enable-chunked-prefill
  --mamba-cache-mode align
  --reasoning-parser qwen3
  --default-chat-template-kwargs '{default_chat_template_kwargs}'
  --tool-call-parser qwen3_coder
  --max-model-len {max_model_len}
  --gpu-memory-utilization {gpu_memory_utilization}
  --load-format {load_format}
  --max-num-batched-tokens {max_num_batched_tokens}
  --max-num-seqs {max_num_seqs}
  --optimization-level {optimization_level}
  --performance-mode {performance_mode}
