recipe_version: "2"
model: TensorFold/Qwen3.8-27B-MLX-4bit
model_revision: 22d8d538154e0e5b6f8dcb1fcc74a60a0798104c
runtime: sglang
container: ghcr.io/miaai-lab/qwen3.8-27b-dgx-spark-tensorfold@sha256:043d192b9e1725f55c5439fc9672055de891433e5b31448ed8963918e3c460e9
min_nodes: 1

description: Qwen3.8-27B (MLX 4-bit) on one DGX Spark, served by TensorFold v0.6.0 + MiaAI-Lab patches
metadata:
  model_url: https://huggingface.co/TensorFold/Qwen3.8-27B-MLX-4bit
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "27B"
  model_dtype: int4
  model_draft_dtype: bf16
  kv_dtype: fp8
  tags: vision

executor_config:
  entrypoint: ""

env:
  TORCH_EXTENSIONS_DIR: /cache/runtime/tensorfold/torch-extensions
  TENSORFOLD_NO_UPDATE_CHECK: '1'
  TENSORFOLD_KV_DTYPE: fp8
  TENSORFOLD_MEMORY_RESERVE_GIB: '0'

defaults:
  port: 8000
  host: 0.0.0.0
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: Qwen3.8-27B
  max_model_len: 262144
  parallel: 8
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  speculative_draft_model: z-lab/Qwen3.8-27B-DFlash2
  speculative_draft_model_revision: 50307d4c4cde6860d4eee73e2547cd786fe8e8a4

command: >
  tensorfold serve {model}
  --name {served_model_name}
  --host {host}
  --port {port}
  --context {max_model_len}
  --parallel {parallel}
  --temperature {temperature}
  --top-p {top_p}
  --top-k {top_k}
  --drafter {speculative_draft_model}
  --prefill-fp8
  --vision
  --thinking
  # A REAL LAUNCH FAILURE, AND WHY THIS LINE IS HERE: sparkrun appends its own --served-model-name
  # to any command template that declares served_model_name
  # (runtimes/base.py::_augment_served_model_name), and this engine parses no such flag: the
  # first boot died with tensorfold: error: unrecognized arguments: --served-model-name Qwen3.8-27B.
  # That helper skips the append when the flag text is already in the rendered command, and the
  # serve command runs as a bash script, so naming the flag in this comment both skips the append
  # and would be swallowed by the shell if sparkrun ever appended anyway. The id reaches the
  # engine through --name above.

readiness:
  inference: true
  port_timeout_s: 3600
  health_timeout_s: 1800
