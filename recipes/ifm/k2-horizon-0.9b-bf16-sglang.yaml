recipe_version: "2"
model: IFM/K2-Horizon-0.9B
model_revision: 383cb66347be4d361138e8157c2f8779b7440752
runtime: sglang
container: lmsysorg/sglang:v0.5.20-cu130@sha256:06e4f2ed21afde4ff513cda65070124e727ba23ccaeff7712b8c40e1097d611f
min_nodes: 1
max_nodes: 1

metadata:
  description: IFM/K2-Horizon-0.9B - dense 0.9B-class reasoning model, 128K YaRN context, native SGLang
  model_url: https://huggingface.co/IFM/K2-Horizon-0.9B
  model_params: "1.08B"
  model_dtype: bf16
  kv_dtype: bf16
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  tags: official, fast, smol, reasoning, tools

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a launch sparkrun rebinds it to the prepared snapshot path, so the served id would be the cache path.
  served_model_name: IFM/K2-Horizon-0.9B
  # 0.85 is the GB10 SOLO ceiling: past ~0.85-0.90 a kernel or page-cache allocation OOM-panics on unified memory.
  gpu_memory_utilization: 0.85
  max_model_len: 131072
  max_num_seqs: 64
  # Spelled exactly as upstream validates it, NOT `auto`: config.json declares "dtype": "float32", so `auto` can load 6.5 GB where 2.16 GB was intended.
  dtype: bfloat16
  # flashinfer, NOT the fa3 the cards pass: FA3 requires SM 8/9 and GB10 reports (12,1), so fa3 cannot be constructed.
  attention_backend: flashinfer
  kv_cache_dtype: auto
  chunked_prefill_size: 4096
  extra_args: ""

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --dtype {dtype}
  --attention-backend {attention_backend}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --mem-fraction-static {gpu_memory_utilization}
  --chunked-prefill-size {chunked_prefill_size}
  --kv-cache-dtype {kv_cache_dtype}
  --reasoning-parser k2_horizon
  --tool-call-parser k2_horizon
  {extra_args}
