recipe_version: "2"
model: IFM/K2-Horizon-7B-FP8
model_revision: ea739ec816e0c9ed9896022056efa858aa8b87e7
runtime: sglang
container: lmsysorg/sglang:v0.5.22-cu130@sha256:e3a4f06001a29542fc4a8638536d9ffc5eb9c9942b08603c09b19a56eae4a1ae
min_nodes: 1
max_nodes: 1

# The Uno adapter is a SECOND artifact: not a `model:`, and sparkrun's model sync only fetches `model:` -- the mod below lands it at a fixed container path.
mods:
  # Bare `mods/NAME`, NOT the scoped `@littlecedar/mods/NAME` (that resolves against the published clone, which lacks these unpublished mods). Order matters: the provide mod must land the adapter before the server starts.
  - "mods/provide-uno-lora-k2-horizon-7b"
  - "mods/probe-uno-fa4-sm121"

description: IFM/K2-Horizon-7B-FP8 + K2-Horizon-7B-Uno (native UNO spec decode, LD draft) on GB10 - fastest arm in the lane (requires the fa4 gate mod)
metadata:
  model_url: https://huggingface.co/IFM/K2-Horizon-7B-FP8
  model_params: "9.0B"
  model_dtype: fp8_e4m3
  quantization: compressed-tensors
  kv_dtype: bf16
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  tags: experimental, smol, reasoning, tools, agent

defaults:
  port: 8000
  host: 0.0.0.0
  # Hard requirement, not a tuning choice: _handle_uno raises "UNO requires TP=PP=1."
  tensor_parallel: 1
  # Never {model}: on a launch sparkrun rebinds it to the prepared snapshot path, so the served id would be the cache path.
  served_model_name: IFM/K2-Horizon-7B-FP8
  # 0.82, three points under the GB10 ceiling: headroom for UNO's resident target+draft LoRA slots and the [batch, F, 250624] draft/verify logits.
  # In LINEAR mode UNO allocates NO second backend and NO second CUDA-graph pool (both gated on
  # tree_mode in uno_worker_v2.py) -- do not raise this to 0.85 on the theory that "UNO needs it".
  gpu_memory_utilization: 0.82
  max_model_len: 131072
  # *** max_num_seqs IS LOAD-BEARING FOR UNO. *** A scheduler admission cap, not a memory limit: at 8 the arm FLATLINES at c8; at 32 it scales to the best figure in the lane. Do not lower it.
  max_num_seqs: 32
  dtype: bfloat16
  # fa4: the mounted mod relaxes _handle_uno's literal ("fa3","fa3") gate to also accept ("fa4","fa4"); without it this fails at argument validation with "UNO requires FA3 ..." (intended stock behaviour).
  # fa3 is what the UNO gate and the HF card ask for but cannot be constructed on GB10. The mod's default also admits `triton`, so `-o attention_backend=triton` needs no env propagation.
  attention_backend: fa4
  kv_cache_dtype: auto
  fp8_gemm_backend: cutlass
  page_size: 1
  chunked_prefill_size: 4096
  # UNO is a builtin in this image; it reuses the TARGET model plus a conditional-LoRA draft, so there is NO --speculative-draft-model-path (passing one is an outright error).
  speculative_algorithm: UNO
  uno_lora_path: /cache/runtime/uno-lora/K2-Horizon-7B-Uno
  # LINEAR UNO (topk=1), not tree: topk=1 forces speculative_num_steps=1 and makes --speculative-num-draft-tokens the LINEAR DRAFT WIDTH; tree mode (topk>1) adds avoidable constraints and a second CUDA-graph backend.
  speculative_eagle_topk: 1
  # MANDATORY: _handle_uno raises unless speculative_num_draft_tokens is a positive integer. Draft width F = tokens proposed per UNO step; 8 is the measured best of {2,4,8} and SATURATES here.
  speculative_num_draft_tokens: 8
  extra_args: ""

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --dtype {dtype}
  --attention-backend {attention_backend}
  --fp8-gemm-backend {fp8_gemm_backend}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --mem-fraction-static {gpu_memory_utilization}
  --chunked-prefill-size {chunked_prefill_size}
  --kv-cache-dtype {kv_cache_dtype}
  --page-size {page_size}
  --reasoning-parser k2_horizon
  --tool-call-parser k2_horizon
  --speculative-algorithm {speculative_algorithm}
  --uno-lora-path {uno_lora_path}
  --speculative-eagle-topk {speculative_eagle_topk}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  {extra_args}
