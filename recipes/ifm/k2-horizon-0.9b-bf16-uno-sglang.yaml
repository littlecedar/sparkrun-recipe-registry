recipe_version: "2"
model: IFM/K2-Horizon-0.9B
model_revision: 383cb66347be4d361138e8157c2f8779b7440752
runtime: sglang
container: lmsysorg/sglang:v0.5.20-cu130@sha256:06e4f2ed21afde4ff513cda65070124e727ba23ccaeff7712b8c40e1097d611f
min_nodes: 1
max_nodes: 1

# The Uno adapter is a SECOND artifact: not a `model:`, and sparkrun's model sync only fetches `model:` -- the mod below lands it at a fixed container path.
mods:
  # Bare `mods/NAME`, NOT the scoped `@littlecedar/mods/NAME` (that resolves against the published clone, which lacks these unpublished mods). Order matters: the provide mod must land the adapter before the server starts.
  - "mods/provide-uno-lora-k2-horizon-0.9b"
  - "mods/probe-uno-fa4-sm121"

description: IFM/K2-Horizon-0.9B + K2-Horizon-0.9B-Uno (native UNO spec decode, linear draft) on GB10 - the 0.9B arm with a diffusion-style draft (requires the fa4 gate mod)
metadata:
  model_url: https://huggingface.co/IFM/K2-Horizon-0.9B
  model_params: "1.19B"
  model_dtype: bf16
  kv_dtype: bf16
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  tags: official, experimental, smol, reasoning, tools
  caveats: >
    Unmeasured arm: no boot, no ladder, no correctness receipt yet. UNO is
    verify-based speculative decoding, so a throughput number is not a result until
    the output distribution matches this same checkpoint without UNO. The adapter
    (IFM/K2-Horizon-0.9B-Uno, 223.9 MB) is staged by a lane mod at launch.

defaults:
  port: 8000
  host: 0.0.0.0
  # Hard requirement, not a tuning choice: _handle_uno raises "UNO requires TP=PP=1."
  tensor_parallel: 1
  # Never {model}: on a launch sparkrun rebinds it to the prepared snapshot path, so the served id would be the cache path.
  served_model_name: IFM/K2-Horizon-0.9B
  # Two points under the 0.85 SOLO ceiling (past ~0.85-0.90 a kernel or page-cache
  # allocation OOM-panics on unified memory), covering UNO's resident target+draft
  # LoRA slots and its [batch, 8, 64256] draft/verify logits. The plain 0.9B keeps
  # 0.85; do not "restore" it here on the theory that UNO is cheap at 0.9B.
  gpu_memory_utilization: 0.82
  max_model_len: 131072
  # Not lowered from the plain arm's 64: it is a scheduler admission cap, not a
  # memory limit, and this arm's scaling curve is unmeasured.
  max_num_seqs: 64
  # Spelled exactly as upstream validates it, NOT `auto`: config.json declares "dtype": "float32", so `auto` can load 6.5 GB where 2.16 GB was intended.
  dtype: bfloat16
  # fa4: GB10 reports (12,1), so the fa3 that UNO's stock gate demands cannot be
  # constructed; the mounted mod relaxes _handle_uno's literal ("fa3","fa3") to
  # also accept it.
  attention_backend: fa4
  kv_cache_dtype: auto
  page_size: 1
  chunked_prefill_size: 4096
  # UNO is a builtin in this image; it reuses the TARGET model plus a conditional-LoRA
  # draft, so there is NO --speculative-draft-model-path (passing one is an outright error).
  speculative_algorithm: UNO
  # Fixed container path written by mods/provide-uno-lora-k2-horizon-0.9b.
  uno_lora_path: /cache/runtime/uno-lora/K2-Horizon-0.9B-Uno
  # LINEAR UNO (topk=1), not tree: topk=1 forces speculative_num_steps=1 and makes
  # --speculative-num-draft-tokens the LINEAR DRAFT WIDTH.
  speculative_eagle_topk: 1
  # MANDATORY: _handle_uno raises unless this is a positive integer. 8 is the width
  # the 7B UNO arm measured as saturating; the 0.9B is untuned.
  speculative_num_draft_tokens: 8
  extra_args: ""

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --dtype {dtype}
  --attention-backend {attention_backend}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --mem-fraction-static {gpu_memory_utilization}
  --chunked-prefill-size {chunked_prefill_size}
  --kv-cache-dtype {kv_cache_dtype}
  --page-size {page_size}
  --reasoning-parser k2_horizon
  --tool-call-parser k2_horizon
  --speculative-algorithm {speculative_algorithm}
  --uno-lora-path {uno_lora_path}
  --speculative-eagle-topk {speculative_eagle_topk}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  {extra_args}
