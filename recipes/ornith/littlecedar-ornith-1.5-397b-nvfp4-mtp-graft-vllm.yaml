recipe_version: "2"
model: littlecedar/Ornith-1.5-397B-NVFP4-MTP-Graft
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly@sha256:b94ac8ac47603f9c3d14f88c12b90eacbc37c7a42f922631cb8c9ac80f7b37c3
runtime: vllm
min_nodes: 4

description: littlecedar/Ornith-1.5-397B-NVFP4-MTP-Graft Chirp Chirp! [🐦](https://ornith.ai/ornith_1_5.html).
metadata:
  model_url: https://huggingface.co/littlecedar/Ornith-1.5-397B-NVFP4-MTP-Graft
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "397B"
  model_dtype: nvfp4
  model_mtp_dtype: bfp16
  kv_dtype: fp8
  tags: lcg_favorite, vision, reasoning, agent, tools

mods:
  - "@eugr/mods/drop-caches"
  - "@eugr/mods/instanttensor-hybrid-draft-loader"

env:
  SAFETENSORS_FAST_GPU: 1
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  OMP_NUM_THREADS: 1
  VLLM_SLEEP_WHEN_IDLE: 0
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_batched_tokens: 8192
  max_num_seqs: 12
  performance_mode: throughput
  kv_cache_dtype: fp8_e4m3
  load_format: instanttensor
  attention_backend: flashinfer
  moe_backend: marlin
  linear_backend: flashinfer_cutlass
  # Keep as a declared default, not inline JSON: `-o speculative_config={...}` only reaches
  # a declared default, and sparkrun reads the draft out of here to distribute it.
  speculative_config: '{"method":"mtp","num_speculative_tokens":3,"max_model_len":262144,"attention_backend":"flashinfer","moe_backend":"flashinfer_cutlass"}'
  mm_encoder_tp_mode: data

command: >
  taskset -c 5-9,15-19 vllm serve {model}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len {max_model_len}
  --max-num-batched-tokens {max_num_batched_tokens}
  --max-num-seqs {max_num_seqs}
  --performance-mode {performance_mode}
  --kv-cache-dtype {kv_cache_dtype}
  --attention-backend {attention_backend}
  --moe-backend {moe_backend}
  --linear-backend {linear_backend}
  --load-format {load_format}
  --speculative-config '{speculative_config}'
  --enable-prefix-caching
  --enable-auto-tool-choice
  --tool-call-parser qwen3_xml
  --reasoning-parser qwen3
  --trust-remote-code
  --async-scheduling
  --enable-expert-parallel
