recipe_version: 2
model: ornith-ai/Ornith-1.5-9B-NVFP4
model_revision: 155f200d85ad58464571c77d5e1122ea5d419d7b
  # Offline engine: --revision is required (a SHA-keyed download writes no refs/ entry).
container: lmsysorg/sglang:dev-cu13@sha256:9a352a35c973a2357372e85f3bcb5388b6b3c46c1329165987260f3b089647dc
runtime: sglang
min_nodes: 1

metadata:
  description: ornith-ai/Ornith-1.5-9B-NVFP4 Chirp Chirp! [🐦](https://ornith.ai/ornith_1_5.html).
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_url: https://huggingface.co/ornith-ai/Ornith-1.5-9B-NVFP4
  draft_model: ornith-ai/Ornith-1.5-9B-DFlash
  model_params: "9B"
  model_dtype: nvfp4
  model_draft_dtype: bf16
  kv_dtype: fp8_e4m3
  tags: official, smol, vision, reasoning, agent, tools

mods:
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/pip-install-fastsafetensors"
  # NOT the 35B's ornith-honed-chat-template: this checkpoint ships its own multimodal chat_template.jinja.

env:
  PYTHONUNBUFFERED: '1'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: ornith-ai/Ornith-1.5-9B-NVFP4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 48
  kv_cache_dtype: fp8_e4m3
  chunked_prefill_size: 4096
  attention_backend: flashinfer
  # NO mamba_*/moe_runner_backend, unlike the 35B: this checkpoint is dense, and the mamba
  # trio is deliberately left to engine defaults — do not "fix" it by copying the 35B.
  speculative_algorithm: DFLASH
  # First-party plain DFlash draft — not the 35B's jzinno DFlash2.
  speculative_draft_model: ornith-ai/Ornith-1.5-9B-DFlash
  # Deliberately unpinned: a SHA-keyed fetch writes no refs/, and SGLang's offline draft
  # lookup resolves only refs/main — a pinned draft dies at startup.
  # The card's --speculative-dflash-block-size 8; upstream aliases it to this flag (sparkrun
  # has no key for the dflash spelling). Mismatch vs the draft's block_size=16 is warning-only.
  speculative_draft_tokens: 8

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --load-format fastsafetensors
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --kv-cache-dtype {kv_cache_dtype}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path {speculative_draft_model}
  --speculative-num-draft-tokens {speculative_draft_tokens}
  --model-loader-extra-config '{ "enable_gds": false }'
