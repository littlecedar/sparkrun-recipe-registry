recipe_version: 2
model: ornith-ai/Ornith-1.5-9B-NVFP4
model_revision: 155f200d85ad58464571c77d5e1122ea5d419d7b
  # 2026-10-14: pins the snapshot the runner caches hold. The offline engine
  # needs the explicit --revision: a SHA-keyed download writes no refs/ entry.
  # This is the 9B arm of the same family block as the 35B sibling recipe; the
  # two differ by engine knobs, not by model, so read that recipe's comments
  # too — but note the divergences called out below.
container: lmsysorg/sglang:dev-cu13@sha256:9a352a35c973a2357372e85f3bcb5388b6b3c46c1329165987260f3b089647dc
runtime: sglang
min_nodes: 1

metadata:
  description: ornith-ai/Ornith-1.5-9B-NVFP4 Chirp Chirp! [🐦](https://ornith.ai/ornith_1_5.html).
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_url: https://huggingface.co/ornith-ai/Ornith-1.5-9B-NVFP4
  draft_model: ornith-ai/Ornith-1.5-9B-DFlash
  model_params: "9B"
  model_dtype: nvfp4
  model_draft_dtype: bf16
  kv_dtype: fp8_e4m3
  # vision: the checkpoint is Qwen3.5 multimodal (image-text-to-text; config carries a
  # vision_config and image/video token ids), served with no --limit-mm-per-prompt cap.
  tags: official, smol, vision, reasoning, agent, tools

mods:
  # The drop-caches mod is inert under a default rootless launch (see the 35B
  # sibling's comment and mods/drop-caches/README.md); it is listed for lane
  # consistency, not because it clears the page cache for you.
  - "@eugr/mods/drop-caches"
  # Supplies --load-format fastsafetensors below.
  - "@littlecedar/mods/pip-install-fastsafetensors"
  # NOT the 35B's @littlecedar/mods/ornith-honed-chat-template: that template is
  # the 35B's honed artifact (qwen3.8-honed-v22.5.1). This checkpoint ships its
  # own multimodal chat_template.jinja (7,593 B, vision tokens + an
  # enable_thinking toggle) and is served with it, so no --chat-template flag.

env:
  PYTHONUNBUFFERED: '1'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: ornith-ai/Ornith-1.5-9B-NVFP4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  # Admission cap only. This checkpoint is a Qwen3.5 hybrid (GDN linear-attention
  # layers every 3rd of 4), so the effective ceiling can be the hybrid state pool,
  # not this literal — read the grant ("capped to N") from the serve log.
  max_num_seqs: 48
  # Safe to spell: this hf_quant_config ships kv_cache_quant_algo FP8, so the
  # literal and the checkpoint agree (unlike an `auto` whose resolution is silent).
  kv_cache_dtype: fp8_e4m3
  chunked_prefill_size: 4096
  attention_backend: flashinfer
  # NO mamba_*/moe_runner_backend keys, unlike the 35B arm. moe_runner_backend is
  # meaningless here (dense MLP, no experts). The mamba trio is deliberately
  # omitted rather than imported: the 35B's `mamba_full_memory_ratio: 3.51` is a
  # house value copied across lanes with no derivation, so the engine's own
  # defaults run. Measured 2026-10-14: the pool does not clamp the admission cap
  # (max_running_requests=48 with max_mamba_cache_size=273); see AGENTS.md §1.
  speculative_algorithm: DFLASH
  # First-party DFlash draft (plain DFlashDraftModel, taps 1/5/9/13/…/29 of the
  # 32-layer target) — NOT the third-party dflash2 draft the 35B sibling ships.
  speculative_draft_model: ornith-ai/Ornith-1.5-9B-DFlash
  # Left unpinned on purpose, like the 35B sibling's jzinno draft. A SHA pin
  # here is not a free reproducibility win: a SHA-keyed fetch writes no refs/
  # entry, and SGLang's offline draft-config lookup
  # (speculative_hook.py::_resolve_speculative_algorithm_alias → get_config,
  # HF_HUB_OFFLINE=1 in-container) resolves only refs/main — a pinned draft
  # dies at startup with LocalEntryNotFoundError. Boot receipt: AGENTS.md §1.
  # 8, the author card's value. The card spells it --speculative-dflash-block-size,
  # which upstream is an alias of --speculative-num-draft-tokens for DFLASH
  # (SGLang v0.5.18 server_args.py:2115-2117); sparkrun has no map key for the
  # dflash spelling, so this uses the alias the shipped 35B arm is boot-proven on.
  # The draft's own dflash_config.block_size is 16: 8 is <= it (the 35B runs 4
  # against a 16 block), and the DFLASH worker only warns on the mismatch.
  speculative_draft_tokens: 8

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --load-format fastsafetensors
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --kv-cache-dtype {kv_cache_dtype}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path {speculative_draft_model}
  --speculative-num-draft-tokens {speculative_draft_tokens}
  --model-loader-extra-config '{ "enable_gds": false }'
