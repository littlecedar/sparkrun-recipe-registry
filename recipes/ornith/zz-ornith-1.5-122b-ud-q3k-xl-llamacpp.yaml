description: >-
  DRAFT - unsloth/Ornith-1.5-122B-GGUF at the UD-Q3_K_XL dynamic tier (59.76 GB, 3.82 bit
  per weight over 3 shards): the 122B-A9B MoE (qwen3_5_moe, 256 experts top-8, 36 GDN +
