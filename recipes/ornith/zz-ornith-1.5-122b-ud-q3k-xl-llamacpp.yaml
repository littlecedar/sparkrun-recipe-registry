metadata:
  model_url: https://huggingface.co/unsloth/Ornith-1.5-122B-GGUF
  # Unsloth dynamic tier (3.82 bit/weight, mixed), labelled `int4` because the checker's
  # recognized set has no dynamic-GGUF label and `int4` is the honest bit class.
  model_dtype: int4
  model_params: "122B"
  kv_dtype: fp16
  tags: ornith, reasoning, agent, tools, vision

defaults:
  port: 8000
  host: 0.0.0.0
  # Never {model}: on a real launch sparkrun rebinds it to the staged GGUF shard, so the
  # served id would be the cache path (-n hides this). --alias carries the client-visible id.
  served_model_name: unsloth/Ornith-1.5-122B-GGUF
  ctx_size: 131072
  parallel: 8
  n_gpu_layers: 999
  flash_attn: auto
  reasoning_format: deepseek
  temperature: 0.6
  top_p: 0.95
  top_k: 20

command: >
  llama-server -hf {model}
  --alias {served_model_name}
  --host {host}
  --port {port}
  --ctx-size {ctx_size}
  --parallel {parallel}
  --kv-unified
  --n-gpu-layers {n_gpu_layers}
  --temp {temperature}
  --top-p {top_p}
  --top-k {top_k}
  --flash-attn {flash_attn}
  --reasoning-format {reasoning_format}
  --jinja
  --no-mmap
  --no-webui
  --cont-batching
