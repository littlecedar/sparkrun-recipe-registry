recipe_version: "2"
model: ornith-ai/Ornith-1.5-35B-A3B-NVFP4
executor: docker
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
runtime: vllm
min_nodes: 1

metadata:
  description: ornith-ai/Ornith-1.5-35B-A3B-NVFP4 Chirp Chirp! [🐦](https://ornith.ai/ornith_1_5.html).
  model_url: https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  tags: official, fast, lcg_favorite

mods:
  - "@official/mods/drop-caches"
  - "@official/mods/instanttensor-hybrid-draft-loader"

env:
  OMP_NUM_THREADS: 1
  CUTE_DSL_ARCH: sm_121a
  MAX_JOBS: 2
  FLASHINFER_NVCC_THREADS: 1
  FLASHINFER_DISABLE_VERSION_CHECK: 1
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_TARGET_DEVICE: cuda
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  VLLM_USE_FLASHINFER_MOE_FP4: 1
  VLLM_SLEEP_WHEN_IDLE: 0

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_batched_tokens: 8192
  max_num_seqs: 24
  performance_mode: throughput
#  kv_cache_dtype: fp8_e4m3
  load_format: instanttensor
#  attention_backend: flashinfer
  moe_backend: auto
#  linear_backend: flashinfer
  speculative_tokens: 1

command: >
  taskset -c 5-9,15-19 vllm serve {model}
  --host {host}
  --port {port}
  -tp {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len {max_model_len}
  --max-num-batched-tokens {max_num_batched_tokens}
  --max-num-seqs {max_num_seqs}
  --performance-mode {performance_mode}
  --moe-backend {moe_backend}
  --load-format {load_format}
  --enable-prefix-caching
  --enable-auto-tool-choice
  --tool-call-parser qwen3_xml
  --reasoning-parser qwen3
  --trust-remote-code
  --spec-method mtp 
  --spec-tokens {speculative_tokens}
  --async-scheduling
