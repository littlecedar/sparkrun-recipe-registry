recipe_version: "2"
# PROBE (2026-10-25, tplt4 round 2): the shipped 122B arm plus vLLM's MTP spec
# decode — the pre-registered cell 4 of the ornith item's plan (TODO §ornith,
# mad-science): same command as zz-ornith-1.5-122b-nvfp4-vllm.yaml with
# --speculative-config appended, driven by the {speculative_config} placeholder
# (the shipped arm's command template does not reference the key, so a bare
# `-o speculative_config=…` is consumed nowhere — measured: two boots rendered
# `speculative_config=None`). num_speculative_tokens is the one knob under test
# (3 first). MTP head ships unquantised in the NVFP4 export (`ignore: ["mtp*"]`)
# and is in-file — no second repo, unlike Mellum's. Gate: serve-log
# "Mean acceptance length > 1"; falsifier: best spec arm C1 < 17 t/s (the
# quartet's per-node C1). Mellum's MTP rejection curve is prior art; what
# differs here: 122B-A9B (8.85B active) vs 12B-A2.5B, vLLM engine (not
# llama.cpp), and the head is first-class in the checkpoint — a positive here
# buys back C1 headroom the gate failed on.
model: ornith-ai/Ornith-1.5-122B-NVFP4
model_revision: f049036f794622db10bb69855bf9819207334626
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly@sha256:cc47adc1b210066dca421bdcd7ca6f16680b6579533f348c0d8c072da194cf98
runtime: vllm
min_nodes: 1
max_nodes: 1

description: >-
  PROBE — zz-ornith-1.5-122b-nvfp4-mtp-vllm: the shipped 122B NVFP4 arm with
  vLLM MTP speculative decode (the checkpoint's own mtp_num_hidden_layers: 1
  head, kept out of the NVFP4 quantisation by the export's ignore list). A
  capability-arm speed probe, not an easy-traffic gate candidate; see the lane
  README's 122B section. MIT.
metadata:
  model_url: https://huggingface.co/ornith-ai/Ornith-1.5-122B-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "122B"
  model_dtype: nvfp4
  kv_dtype: fp8
  tags: ornith, official, reasoning, agent, tools, vision, probe, spec-decode

env:
  PYTHONUNBUFFERED: '1'

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  served_model_name: ornith-ai/Ornith-1.5-122B-NVFP4
  max_model_len: 262144
  gpu_memory_utilization: 0.85
  max_num_seqs: 32
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  moe_backend: marlin
  attention_backend: flashinfer
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'

command: >
  vllm serve {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --host {host}
  --port {port}
  --tensor-parallel-size {tensor_parallel}
  --max-model-len {max_model_len}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-num-seqs {max_num_seqs}
  --max-num-batched-tokens {max_num_batched_tokens}
  --kv-cache-dtype {kv_cache_dtype}
  --moe-backend {moe_backend}
  --attention-backend {attention_backend}
  --speculative-config '{speculative_config}'
  --enable-prefix-caching
  --enable-auto-tool-choice
  --tool-call-parser qwen3_xml
  --reasoning-parser qwen3
