recipe_version: "2"
# DRAFT (2026-11-03): authored from the Hub survey in README.md §"122B quantisation and
# finetune survey"; NEVER booted. Not in the root README index and not claimed to serve.
#
# The quant-family arm: every other 122B DFlash2 arm on this lane targets a modelopt NVFP4
# export. This one is a compressed-tensors int4 pack (4-bit, group 32, asymmetric, int8 zero
# points) over the routed experts with attention / linear-attention / shared-expert / lm_head
# left in high precision, so it asks a question NVFP4 cannot: does draft acceptance survive a
# different quantisation family at the same 48 x 3072 geometry?
model: cyankiwi/Ornith-1.5-122B-AWQ-INT4
model_revision: f37c82fdabf818ea4c8643aa63157b9f17f2ae0f
# Offline engine: --revision is required (a SHA-keyed download writes no refs/ entry).
container: lmsysorg/sglang:v0.5.22@sha256:e3a4f06001a29542fc4a8638536d9ffc5eb9c9942b08603c09b19a56eae4a1ae
runtime: sglang
min_nodes: 1
max_nodes: 1

description: >-
  DRAFT - `cyankiwi/Ornith-1.5-122B-AWQ-INT4` (85,287,104,992 B over 18 shards, 4-bit
  compressed-tensors pack, group 32, asymmetric; `lm_head` and the attention projections in
  the `ignore` list, so the head the drafter borrows stays high precision) with the published
  DFlash2 drafter on SGLang v0.5.22. 48 layers x 3072 hidden, vocab 248,320: the drafter's
  layer taps and width all resolve. The boot is the test - the loader has to resolve this
  mixed-precision layout on `qwen3_5_moe` and SM121 at all, and then acceptance tells us
  whether the quant family, not the bit count, is what the drafter cares about. MIT.
metadata:
  measured_rejected: "2026-11-07 — weight loader _load_w2 raises tensor a 384 vs tensor b 32 at dim 1 on the fused-MoE path; live docker log caught the traceback (recipes/ornith/README.md:1170)"
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_url: https://huggingface.co/cyankiwi/Ornith-1.5-122B-AWQ-INT4
  draft_model: incoai/Ornith-1.5-122B-DFlash2
  model_params: "122B"
  model_dtype: int4
  model_draft_dtype: bf16
  kv_dtype: fp8_e4m3
  license: mit
  tags: reasoning, agent, tools

mods:
  - "@eugr/mods/drop-caches"

env:
  PYTHONUNBUFFERED: '1'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

pre_exec:
  # SGLang resolves the draft through refs/main, and sparkrun's SHA-keyed fetch writes no
  # refs entry, so the pin alone never boots (measured on the 35B dflash2 arm).
  - >-
    set -e; R=/cache/huggingface/hub/models--incoai--Ornith-1.5-122B-DFlash2;
    S=$R/snapshots/{speculative_draft_model_revision};
    test -d "$S" || { echo "draft snapshot missing: $S" >&2; exit 1; };
    mkdir -p "$R/refs"; printf %s {speculative_draft_model_revision} > "$R/refs/main"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  served_model_name: cyankiwi/Ornith-1.5-122B-AWQ-INT4
  # 0.80 leaves ~17 GB for KV at 85.3 GB of weights; still ~1.7M tokens at 10,240 B/token.
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_seqs: 32
  kv_cache_dtype: fp8_e4m3
  chunked_prefill_size: 4096
  attention_backend: flashinfer
  moe_runner_backend: marlin
  mamba_radix_cache_strategy: extra_buffer
  speculative_algorithm: DFLASH
  speculative_draft_model: incoai/Ornith-1.5-122B-DFlash2
  # Distribution-only: SGLang has no serve flag for the draft head, so this pin reaches
  # distribution, not the serve line — paired with the pre_exec refs/main seed above.
  speculative_draft_model_revision: 9baefc1bec85c08193ab442e0ca5f7057669b61d
  # 4, not the card's 15: the lane measured this drafter at 15 draft tokens degrading C2-C10
  # with a prefill collapse and at 4 giving C1 37.7 against a 28.95 no-drafter control.
  # Receipt ~/benchmarks/tp12-20261030/zz-ornith-1.5-122b-nvfp4-dflash2-sglang-d4/REPORT.md.
  speculative_draft_tokens: 4

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --kv-cache-dtype {kv_cache_dtype}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --moe-runner-backend {moe_runner_backend}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path {speculative_draft_model}
  --speculative-num-draft-tokens {speculative_draft_tokens}