recipe_version: "2"
# DRAFT (2026-11-03): authored from the Hub survey in README.md §"122B quantisation and
# finetune survey"; NEVER booted. Not in the root README index and not claimed to serve.
#
# EVAL-ONLY, and not because of the licence. `dealignai/Ornith-1.5-122B-UNCENSORED-NVFP4`
# is the base 122B with its refusal direction projected out (HarmBench-320 reasoning-on:
# 309/320 comply). MIT is unmodified from `ornith-ai/Ornith-1.5-122B`, but serving it to
# anyone but an operator running an evaluation is out of bounds for this registry: it has
# no refusal behaviour, so the guardrail has to be yours. Do not promote this arm.
model: dealignai/Ornith-1.5-122B-UNCENSORED-NVFP4
model_revision: e6a1c1785949cc6e1ccd8af766f0a6148f575e6b
# Offline engine: --revision is required (a SHA-keyed download writes no refs/ entry).
container: lmsysorg/sglang:v0.5.22@sha256:e3a4f06001a29542fc4a8638536d9ffc5eb9c9942b08603c09b19a56eae4a1ae
runtime: sglang
min_nodes: 1
max_nodes: 1

description: >-
  DRAFT / EVAL-ONLY - the refusal-ablated 122B (`dealignai/Ornith-1.5-122B-UNCENSORED-NVFP4`)
  with the published DFlash2 drafter, on SGLang v0.5.22. The target is NVFP4 modelopt with
  the same 48 x 3072 geometry as `ornith-ai/Ornith-1.5-122B-NVFP4` (index total 75,647,330,784 B,
  50 shards), so the drafter's hard-coded `hidden_size: 3072` / `target_layer_ids:
  [1,7,14,20,26,32,39,45]` are satisfied by construction; what is NOT established is that an
  abliteration leaves draft acceptance intact. MIT, but eval-only by house policy: the model
  has no refusal behaviour. Uncensored safety framing in the lane README.
metadata:
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_url: https://huggingface.co/dealignai/Ornith-1.5-122B-UNCENSORED-NVFP4
  draft_model: incoai/Ornith-1.5-122B-DFlash2
  model_params: "122B"
  model_dtype: nvfp4
  model_draft_dtype: bf16
  kv_dtype: fp8_e4m3
  license: mit
  eval_only: "true"
  tags: uncensored, reasoning, agent, tools

mods:
  - "@eugr/mods/drop-caches"

env:
  PYTHONUNBUFFERED: '1'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

pre_exec:
  # SGLang resolves the draft through refs/main, and sparkrun's SHA-keyed fetch writes no
  # refs entry, so the pin alone never boots (measured on the 35B dflash2 arm).
  - >-
    set -e; R=/cache/huggingface/hub/models--incoai--Ornith-1.5-122B-DFlash2;
    S=$R/snapshots/{speculative_draft_model_revision};
    test -d "$S" || { echo "draft snapshot missing: $S" >&2; exit 1; };
    mkdir -p "$R/refs"; printf %s {speculative_draft_model_revision} > "$R/refs/main"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  served_model_name: dealignai/Ornith-1.5-122B-UNCENSORED-NVFP4
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_seqs: 32
  kv_cache_dtype: fp8_e4m3
  chunked_prefill_size: 4096
  attention_backend: flashinfer
  moe_runner_backend: marlin
  mamba_radix_cache_strategy: extra_buffer
  speculative_algorithm: DFLASH
  speculative_draft_model: incoai/Ornith-1.5-122B-DFlash2
  # Distribution-only: SGLang has no serve flag for the draft head, so this pin reaches
  # distribution, not the serve line — paired with the pre_exec refs/main seed above.
  speculative_draft_model_revision: 9baefc1bec85c08193ab442e0ca5f7057669b61d
  # 4, not the card's 15: the lane measured the same drafter at 15 draft tokens degrading
  # C2-C10 with prefill collapse (35.2/29.1/27.4/25.8 t/s) and at 4 giving C1 37.7 /
  # C10 48.9 against a 28.95/48.97 no-drafter control. Receipt
  # ~/benchmarks/tp12-20261030/zz-ornith-1.5-122b-nvfp4-dflash2-sglang-d4/REPORT.md.
  speculative_draft_tokens: 4

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --reasoning-parser qwen3
  --tool-call-parser qwen3_coder
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --kv-cache-dtype {kv_cache_dtype}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --moe-runner-backend {moe_runner_backend}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path {speculative_draft_model}
  --speculative-num-draft-tokens {speculative_draft_tokens}