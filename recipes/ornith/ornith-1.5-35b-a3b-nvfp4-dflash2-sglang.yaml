recipe_version: 2
model: ornith-ai/Ornith-1.5-35B-A3B-NVFP4
model_revision: 94e431d9cc47fa1986a7a1a4e9a80f7f118b03aa
  # Offline engine: --revision is required (a SHA-keyed download writes no refs/ entry).
container: lmsysorg/sglang:v0.5.21@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
runtime: sglang
min_nodes: 1

description: ornith-ai/Ornith-1.5-35B-A3B-NVFP4 Chirp Chirp! [🐦](https://ornith.ai/ornith_1_5.html).
metadata:
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_url: https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B-NVFP4
  draft_model: jzinno/Ornith-1.5-35B-A3B-DFlash2
  model_params: "35B"
  model_dtype: nvfp4
  model_draft_dtype: bf16
  kv_dtype: fp8_e4m3
  tags: official, fast, lcg_favorite, vision, reasoning, agent, tools

mods:
  - "@eugr/mods/drop-caches"
  - "@littlecedar/mods/pip-install-fastsafetensors"
  # LAST: stages the honed chat template the --chat-template flag reads.
  - "mods/ornith-honed-chat-template"

env:
  PYTHONUNBUFFERED: '1'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a

  # Seeds the pinned draft's refs/main: sparkrun's SHA-keyed fetch writes no refs/ entry and
  # SGLang's offline draft-config lookup resolves only refs/main, so the pin alone never boots.
pre_exec:
  - >-
    set -e; R=/cache/huggingface/hub/models--jzinno--Ornith-1.5-35B-A3B-DFlash2;
    S=$R/snapshots/{speculative_draft_model_revision};
    test -d "$S" || { echo "draft snapshot missing: $S" >&2; exit 1; };
    mkdir -p "$R/refs";
    printf %s {speculative_draft_model_revision} > "$R/refs/main"
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: ornith-ai/Ornith-1.5-35B-A3B-NVFP4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 48
  mamba_full_memory_ratio: 3.51
  mamba_ssm_dtype: bfloat16
  mamba_radix_cache_strategy: extra_buffer_lazy
  kv_cache_dtype: fp8_e4m3
  chunked_prefill_size: 4096
  attention_backend: flashinfer
  moe_runner_backend: flashinfer_cutlass
  speculative_algorithm: DFLASH
  speculative_draft_model: jzinno/Ornith-1.5-35B-A3B-DFlash2
  # Distribution-only: SGLang has no serve flag for the draft head, so this pin reaches
  # distribution, not the serve line — paired with the pre_exec refs/main seed above.
  speculative_draft_model_revision: 9b4852c05fd00b672b7434b1bb105bc03c8682b0
  speculative_draft_tokens: 4
  honed_chat_template: /cache/runtime/ornith-honed-chat-template/chat_template.jinja

command: >
  taskset -c 5-9,15-19 sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --reasoning-parser qwen3
  --chat-template {honed_chat_template}
  --tool-call-parser qwen3_coder
  --load-format fastsafetensors
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --kv-cache-dtype {kv_cache_dtype}
  --chunked-prefill-size {chunked_prefill_size}
  --mem-fraction-static {gpu_memory_utilization}
  --attention-backend {attention_backend}
  --moe-runner-backend {moe_runner_backend}
  --mamba-full-memory-ratio {mamba_full_memory_ratio}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path {speculative_draft_model}
  --speculative-num-draft-tokens {speculative_draft_tokens}
  --model-loader-extra-config '{ "enable_gds": false }'
