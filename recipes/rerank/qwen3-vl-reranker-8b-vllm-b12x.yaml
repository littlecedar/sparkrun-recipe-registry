recipe_version: "2"
model: Qwen/Qwen3-VL-Reranker-8B
runtime: vllm
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x@sha256:cf5a2a5324af897e1b576eecb3018331d2df0fad2285d61d4b109743be6434d8

metadata:
  description: "Qwen/Qwen3-VL-Reranker-8B - vision-language reranker, quality tier. Boots and serves colocated with the 8B AWQ encoder on one DGX Spark: 65.03 GiB of 121.69 total at the shipped caps."
  model_url: https://huggingface.co/Qwen/Qwen3-VL-Reranker-8B
  model_params: "8B"
  model_dtype: bf16
  kv_dtype: bf16
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  tags: lcg_favorite, vision, reranking, smol

mods:
  - "@littlecedar/mods/pip-install-orjson"
  - "mods/provide-qwen3-vl-rerank-template"

# A pooling engine has no chat endpoint, so the default chat-completion probe can only time
# out and `sparkrun run` exits 1 on a healthy server. Port + /health readiness only.
readiness:
  inference: false

defaults:
  port: 8015
  host: 0.0.0.0
  tensor_parallel: 1
  # Colocation: vLLM's --gpu-memory-utilization is an ABSOLUTE device cap, so the two
  # engines' caps must SUM (0.30 + encoder 0.25 = 0.55 of 121 GB); raising one alone can ValueError.
  gpu_memory_utilization: 0.30
  # Half the GB10 fast cluster (X925) so this engine never lands on an A725 and never
  # shares a core with the colocated encoder (5-9). Solo: -o cpu_mask=5-9,15-19.
  cpu_mask: 15-19
  max_model_len: 8192
  max_num_batched_tokens: 8192
  max_num_seqs: 32
  dtype: bfloat16
  load_format: auto
  attention_backend: b12x
  # b12x aborts at cache-config time unless --block-size is 64 or 128 (vLLM's default is 16).
  block_size: 128
  # --convert auto would serve this as a generic bi-encoder (wrong scores, HTTP 200, no
  # warning); the architectures rewrite + classifier_from_token softmax are load-bearing.
  # text_config is load-bearing: the 8B checkpoint's text_config omits tie_word_embeddings
  # (top level says false), and vLLM's seq_cls loader reads it off the text config ->
  # AttributeError at engine init. The 2B declares it inside text_config, hence 2B-only boot.
  # Folded style + embedded quotes keep the JSON as ONE shell word — do not delete.
  hf_overrides: >-
    '{"architectures": ["Qwen3VLForSequenceClassification"],
    "classifier_from_token": ["no", "yes"],
    "is_original_qwen3_reranker": true,
    "text_config": {"tie_word_embeddings": false}}'
  # Published by recipes/rerank/mods/provide-qwen3-vl-rerank-template before the serve line; must match the
  # mod's output dir (MOD_CACHEDIR) — the checkpoint's chat_template.jinja scores empty pairs.
  reranker_chat_template: ${XDG_CACHE_HOME:-/cache/runtime}/templates/qwen3-vl-reranker-query-document.jinja
  convert: classify
  limit_mm_per_prompt: >-
    '{"image": 4, "video": 1}'

command: >
  taskset -c {cpu_mask} vllm serve {model}
  --runner pooling
  --convert {convert}
  --hf-overrides {hf_overrides}
  --limit-mm-per-prompt {limit_mm_per_prompt}
  --chat-template {reranker_chat_template}
  --dtype {dtype}
  --gpu-memory-utilization {gpu_memory_utilization}
  -tp {tensor_parallel}
  --host {host}
  --port {port}
  --max-model-len {max_model_len}
  --max-num-batched-tokens {max_num_batched_tokens}
  --max-num-seqs {max_num_seqs}
  --attention-backend {attention_backend}
  --block-size {block_size}
  --load-format {load_format}
  --trust-remote-code

