recipe_version: "2"
model: LiquidAI/LFM3-1.7B
model_revision: 0dc4268b561499c648c7ba7c9466bf3d8d01517a
runtime: vllm
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x@sha256:cf5a2a5324af897e1b576eecb3018331d2df0fad2285d61d4b109743be6434d8
description: LiquidAI/LFM3-1.7B — 1.7B hybrid conv+attention chat model in bf16 on the lane's vLLM b12x image; whether that engine loads the `lfm3` custom-code architecture is what this arm's first boot decides
metadata:
  model_url: https://huggingface.co/LiquidAI/LFM3-1.7B
  model_params: "1.7B"
  model_dtype: bf16
  kv_dtype: bf16
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  tags: official, smol, license
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Repo id, not {model}: a launch rebinds {model} to the prepared snapshot path.
  served_model_name: LiquidAI/LFM3-1.7B
  # 3.46 GB of bf16 weights; the rest of the cap is 262,144-token KV plus the
  # per-layer conv state, which no KV-size heuristic accounts for — measure residency.
  gpu_memory_utilization: 0.30
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  dtype: bfloat16
# tokenizer_config.json carries no `chat_template` field; the template ships as a sidecar
# file in the snapshot, so name it explicitly rather than trust a loader default.
command: >
  taskset -c 5-9,15-19 vllm serve {model}
  --served-model-name {served_model_name}
  --revision {model_revision}
  --trust-remote-code
  --chat-template {model}/chat_template.jinja
  --dtype {dtype}
  --gpu-memory-utilization {gpu_memory_utilization}
  -tp {tensor_parallel}
  --host {host}
  --port {port}
  --max-model-len {max_model_len}
  --max-num-batched-tokens {max_num_batched_tokens}
  --max-num-seqs {max_num_seqs}