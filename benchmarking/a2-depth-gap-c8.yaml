framework: llama-benchy
metadata:
  description: >
    Item A2: is the ~25-32% per-stream depth cost at c=8 real, or is it noise?

    WHY THIS PROFILE EXISTS. Two independent measurements of the SAME cell report different
    numbers, and they disagree by more than either run's within-run cv: the phase-4 sweep
    measured a 25% depth penalty at c=8, and a later window read measured 32%. The spec-arm
    noise floor is +-15%, so a 25-vs-32 disagreement is not resolved by the existing data --
    and neither figure can be trusted as "the" value while they differ. The mechanism
    candidates (per-stream KV read cost, allocator/interference) have DIFFERENT signatures,
    so the number matters, not just the sign.

    THE DESIGN, and why it is interleaved
    -------------------------------------
    Depth is the only variable. The two depths are run ALTERNATING on the SAME booted server
    (d1024, d8192, d1024, d8192, ...), not blocked. Blocking would let any monotone drift in
    the container (cache warm-up, thermal state, allocator fragmentation) masquerade as a
    depth effect; alternating spreads that drift across both arms. A mirrored order across
    the two trial nodes turns any residual order effect into a visible node-vs-node
    disagreement rather than a silent inflation.

    JUDGE ON `tg_req_throughput` (per-stream), NOT the aggregate column and NOT the printed
    table's `t/s` (which is aggregate and interleaves prefill rows with no header -- see
    benchmarking/README.md rule 1). Read the runs/*.json files.

    ALSO READ, from the server log, per window: `#running-req` and `accept len`. Two reasons:
    (a) the depth comparison is only meaningful at MATCHED running-stream count, and offered
    concurrency does not clamp the server; (b) acceptance is a confound that has already
    produced one wrong conclusion in this project when windows of different depth were
    compared (see WORK.md section 9 item 3 -- a 20-deep vs 14-deep mismatch was reported as
    a 4% acceptance effect).

    PRE-REGISTERED PREDICTION, written before the run
    -------------------------------------------------
    At c=8 neither depth is pool-limited (8 x 1024 and 8 x 8192 both fit the 118,868-token
    pool), so this is NOT a capacity measurement. If the effect is real it should show up as a
    PERSISTENT per-stream gap at matched running counts, repeated in every alternating pair.
    If it is noise it should wander: expect pairs to scatter in BOTH directions around 1.0
    with a spread comparable to the +-15% floor.
      - gap consistent in sign across all pairs and > 15% -> real; then look at whether
        accept len or prefill t/s tracks it.
      - gap sign flips between pairs, or |gap| < 15% -> report A2 as NOT REAL and stop
        looking for a mechanism. That is a legitimate outcome and it is the cheaper one.

    AMENDMENT (2026-09-22), added before a re-run. The rule above is deliberately UNEDITED,
    because editing a pre-registered rule after seeing data destroys the thing it is for.
    -----------------------------------------------------------------------------------------
    This profile is being run again as BOOT #4 at the shipped ratio (existing boots: p31 on
    node-free-1 -> gap 0.785, p49 on node-free-2 -> 0.864, both ratio 3.51; p37 -> 0.796 at ratio
    1.2). Read this re-run as RETROSPECTIVE with respect to those three, not as a fresh
    pre-registered test: the outcome space is already known, so do not claim it confirms a
    prediction. Its legitimate value is that it adds a BOOT to a boot-level interval that is
    currently n = 3 and uncomfortably wide ([0.708, 0.921] -> depth cost 8% to 29%).

    The reporting rule added by this amendment, and it applies to every boot:
      - the unit of replication for a CONFIG-LEVEL claim is the boot, not the interleaved pair;
      - report this boot's gap and its within-boot CI separately from the pooled boot-level CI;
      - "> 15%" as written was applied to five pairs inside ONE container, which prices
        ordering noise (within-boot sd 0.028) but not boot-to-boot variation (sd 0.043).
        p49 landed at 13.6%, BELOW the threshold, so the threshold is not satisfied by the
        existing set even though 3/3 boots agree on the direction.
    Run `container_identity.py` on the new serve log against p31/p49 before calling anything an
    independent replication: three phases in this project were described as "different days"
    while sharing one container, because --skip-run reuses a live server and nested serve logs
    are proof of one boot.
args:
  # 1024 is the low-pressure reference that reproduces the earlier d0-like baseline; 8192 is
  # the arm whose penalty is disputed. Both at c=8 only -- higher c re-introduces the pool
  # wall, which is a DIFFERENT and already-explained effect (WORK.md 12.8) and would swamp
  # the thing being tested here.
  depth: [ 1024, 8192 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 8 ]
  prefix_caching: true
  # 7, not 3: the whole question is whether a 25-vs-32 discrepancy is real, and 3 runs
  # cannot separate a 7-point difference from noise.
  runs: 7
