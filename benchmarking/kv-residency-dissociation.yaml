# Dissociate `k` from KV residency: does the high-concurrency collapse track batch size or total context in memory?
#
# WHY THIS IS THE NEXT BOOT. §19a established the decline is prefill work, not batch size (at d=0 the
# batch curve is FLAT: 98.75/107.12/106.15, while the same boot at d=8192 falls -40.9%), and that the
# cap penalty's DECODE half also requires prefill work to exist (at d=0 the k==cap cell costs only
# -0.9% of decode). What §19a did NOT settle is why the d=8192 arm steps down specifically at k=24 while
# being flat at k=8 and k=16 -- because a pure prefill-demand-share model predicts no k-step at all.
# Demanded prefill and demanded decode BOTH scale with k, so their ratio is constant in k (0.55 at d=0,
# 2.74 at d=8192, at every k). A model that is constant in k cannot generate a step in k.
#
# THE CANDIDATE THE DECODE MODEL NEVER CONTAINED: absolute KV residency = k*(depth+pp) tokens.
#   d=8192 k= 8 ->  81,920 tokens ( 1.01 GB @ 12.3 KB/tok)  fine     79.27
#   d=8192 k=16 -> 163,840 tokens ( 2.02 GB)                fine     87.15
#   d=8192 k=24 -> 245,760 tokens ( 3.02 GB)                COLLAPSE 51.51
#   d=0    k=24 ->  49,152 tokens ( 0.60 GB)                fine     106.15
# §19 excluded KV by *per-step read bandwidth* (1.0% of the step gap; and structurally a term linear in
# k gives constant per-sequence cost so it cannot make that cost RISE). That exclusion is about
# BANDWIDTH and still holds. RESIDENCY is a different quantity -- pages allocated, block-allocation
# churn, cache pressure -- and has never been measured here. Caveat worth holding in mind: this is a
# HYBRID model (mamba state plus attention KV, `max_mamba_cache_size: 112`), so "residency" here means
# the attention-KV portion only, and the mamba state is per-sequence rather than per-token.
#
# WHY A DISSOCIATION AND NOT A SWEEP. Sweeping depth at fixed k=24 finds an onset but cannot separate
# "tokens in memory" from "sequences in flight", because at fixed depth the two rise together. So hold
# TOTAL TOKENS roughly constant and move k by a factor of three:
#     k=24, d=8192  -> 245,760 tokens   KNOWN COLLAPSE (tg 51.51)
#     k= 8, d=26624 -> 229,376 tokens   same residency, k/3, unmeasured
#   * if k=8/d=26624 ALSO collapses -> it is RESIDENCY; `k` was never the variable. The recipe lever
#     becomes cache sizing / max-total-tokens, and "serve at bs<=16" is the wrong instruction -- it
#     becomes "keep k*context under ~200k tokens".
#   * if k=8/d=26624 is HEALTHY -> residency is refuted as the trigger and something about the number of
#     concurrently ADVANCED sequences survives, which would rehabilitate the scheduler reading that
#     §19's cap sweep weakened but did not kill.
# d=4096 at both k values brackets the onset in tokens and gives each k arm its own in-boot reference.
#
# COST AND LIMITS. 6 cells x n=7. The DISSOCIATION (k=24/d=8192 vs k=8/d=26624) is WITHIN this boot,
# which is what makes it reportable; the reproduction check of 51.51 is cross-boot and so carries the
# 12.4% d=8192 inter-boot floor. max_model_len is 262144, so d=26624 + pp 2048 + tg 128 = 28,800 is
# well in range. Long-depth cells prefill slowly (28,672 tokens at ~2.2k t/s ~= 13 s per request), so
# expect this profile to run noticeably longer per cell than the d=8192 sweeps.
framework: llama-benchy
metadata:
  description: >
    Dissociates batch size from KV residency. k=8 at d=26624 (229k total context tokens) against k=24
    at d=8192 (246k), with d=4096 bracketing the onset at both k values. Answers whether the
    high-concurrency collapse tracks tokens resident in memory or sequences in flight.
args:
  depth: [ 4096, 8192, 26624 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 8, 24 ]
  prefix_caching: true
  runs: 7
