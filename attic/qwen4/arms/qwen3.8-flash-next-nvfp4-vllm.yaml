recipe_version: "2"
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
# Pinned 2026-10-22 (Hub `sha`, last write 2026-08-26). The arm shipped unpinned, which is the same
# class of defect as a floating image tag: the W12 number would not name the weights it measured.
model_revision: 7b719225242aacd3dbd3f9407468c2ee9a9d2594
runtime: vllm
# Pinned 2026-10-22 for the W12 measurement: `:latest` resolved to this digest that day
# (`docker buildx imagetools inspect`, config `sha256:e90182b5…`) — the same build the shipped TP=1
# solo arm pins, so the two vLLM qwen4 receipts describe one engine. W12's row requires the digest
# beside the number; a floating tag would make the token/s unquotable.
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x@sha256:cf5a2a5324af897e1b576eecb3018331d2df0fad2285d61d4b109743be6434d8
min_nodes: 2

metadata:
  description: Qwen3.8-Flash-Next-NVFP4 - mixed NVFP4/BF16/FP8 checkpoint with MTP
  model_url: https://huggingface.co/nvidia/Qwen3.8-Flash-Next-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "125B"
  model_dtype: nvfp4
  model_mtp_dtype: fp8
  kv_dtype: fp8
  tags: lcg_favorite

mods:
  - "@eugr/mods/drop-caches"
  - "@eugr/mods/instanttensor-hybrid-draft-loader"
  # House copy, not `@eugr/…`: the eugr registry no longer carries this mod (2026-10-22), and a
  # `mods:` entry resolves against THIS file's directory, so the path climbs to the repo root.
  - "../../../recipes/qwen4/mods/fix-qwen3.8-flash-next-vllm"

env:
  SAFETENSORS_FAST_GPU: 1
  OMP_NUM_THREADS: 1
  CUTE_DSL_ARCH: sm_121a
  MAX_JOBS: 2
  FLASHINFER_NVCC_THREADS: 1
  FLASHINFER_DISABLE_VERSION_CHECK: 1
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_TARGET_DEVICE: cuda
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  VLLM_USE_FLASHINFER_MOE_FP4: 1
  VLLM_SLEEP_WHEN_IDLE: 0
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  VLLM_PLE_FP8_CHECKPOINT: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_batched_tokens: 8192
  max_num_seqs: 12
  dtype: bfloat16
  moe_backend: b12x
  load_format: instanttensor
  quantization: modelopt
  speculative_tokens: 3

command: >
  taskset -c 5-9,15-19 vllm serve {model}
  --revision {model_revision}
  --host {host}
  --port {port}
  --quantization {quantization}
  --load-format {load_format}
  --tensor-parallel-size {tensor_parallel}
  --gpu-memory-utilization {gpu_memory_utilization}
  --dtype {dtype}
  --max-model-len {max_model_len}
  --moe-backend {moe_backend}
  --max-num-batched-tokens {max_num_batched_tokens}
  --max-num-seqs {max_num_seqs}
  --reasoning-parser qwen3
  --trust-remote-code
  --speculative-config '{"method":"mtp","num_speculative_tokens":{speculative_tokens}}'

# If you want to use long max model length, please uncomment the following line
# --hf-overrides '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}' --max-model-len 1000000
