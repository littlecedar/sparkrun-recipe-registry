recipe_version: "2"
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
runtime: sglang
# Distribution note (2026-10-10, CORRECTED 2026-10-14). The original warning was
# that sparkrun's model distribution FAILS to a node that does not already hold
# this checkpoint (the 418-shard RadixArk export's safetensors index over the
# 16 MiB inventory limit). A plain `sparkrun benchmark performance` to a node
# without it CONTRADICTS that: the 2026-10-14 re-measure copied 125.96 GiB in
# 244 s (2 streams) with no "file selection all" — distribution works.
container: lmsysorg/sglang:dev-cu13-qwen38-next-local@sha256:9d2a843c706c74bc259c0d9abf360551eb2734e1e7d255ab012a6965f10480b6
min_nodes: 1
max_nodes: 1

# Readiness unblock (2026-10-14, sixth-arm re-measure). The file-backed PLE table
# load opens the serve port far later than sparkrun's default: the 2026-10-14 boot
# reached port-open at TTR 3477 s on `.34` (>2x the default `port_timeout_s` of
# 1800 s, which is exactly what killed the first attempt with `TimeoutError: port`).
# The arm is not an architectural negative — it is a load-latency timeout — so raise
# the port window and keep the inference probe (a chat completion is the real gate).
readiness:
  inference: true
  port_timeout_s: 3600

metadata:
  description: >-
    Qwen3.8-Flash-Next-NVFP4 on ONE DGX Spark (TP=1), SGLang route: the PLE n-gram
    table streams from NVMe (--ple-offload-embedding --ple-offload-backend file) so
    weights + KV fit a single node's 128 GB pool. Flag set transcribed from the SGLang
    cookbook cell dgx-spark/nvfp4/single/low-latency (verified single-Spark cell for
    this exact export), which measured c=1 TTFT 649 ms / TPOT 33.6 ms / 137 tok/s,
    c=8 358 tok/s, GSM8K 97.1% on the cookbook's hardware. BOOT-VERIFIED on ours
    2026-10-10 (node that already held the checkpoint): /health 200, PLE table
    file-backed, chat completion answered correctly (17*23=391 with reasoning
    tokens). W3 battery (tools/qwen4-quality-eval.py, 38 tasks, n=1):
    **38/38 = 100%, stable-pass** — the best recorded result on this battery
    (history: labquant 37/38, RadixArk reference 35/36, both n=1; the battery
    drifted 36→38 between runs, so read cross-run comparisons with that caveat).
    The cookbook's speed figures are the cookbook's hardware, not ours. RE-MEASURED
    2026-10-14 (the sixth arm, bench_253dd84c9a78): C1 decode 19.82 ± 2.06 t/s d=0 /
    20.97 ± 1.02 d=8192 — ~42% below the shipped TP=1 vLLM arm, so this arm stays
    ARCHIVED. It carries readiness.port_timeout_s: 3600 now (the port opened at
    TTR 3477 s; the default 1800 s is what failed the first attempt).
  model_url: https://huggingface.co/RadixArk/Qwen3.8-Flash-Next-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: "180B"
  model_dtype: nvfp4
  model_mtp_dtype: bf16
  kv_dtype: bf16
  # vision: same checkpoint as the quality-reference recipe, tower intact.
  tags: lcg_favorite, vision

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Never {model}: on a real launch sparkrun rebinds it to the prepared snapshot
  # path, so the served model id would be the cache path (-n does not show this).
  served_model_name: RadixArk/Qwen3.8-Flash-Next-NVFP4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  page_size: 64
  chunked_prefill_size: 4096
  quantization: modelopt_fp4
  fp4_gemm_backend: flashinfer_cutlass
  # The cookbook low-latency cell: NEXTN k=4, MRR 8, mamba pool 40.
  speculative_algorithm: NEXTN
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  max_num_seqs: 8
  max_mamba_cache_size: 40
  extra_args: ""

command: >
  sglang serve
  --model-path {model}
  --served-model-name {served_model_name}
  --mem-fraction-static {gpu_memory_utilization}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --quantization {quantization}
  --fp4-gemm-backend {fp4_gemm_backend}
  --page-size {page_size}
  --chunked-prefill-size {chunked_prefill_size}
  --context-length {max_model_len}
  --max-running-requests {max_num_seqs}
  --max-mamba-cache-size {max_mamba_cache_size}
  --speculative-algorithm {speculative_algorithm}
  --speculative-num-steps {speculative_num_steps}
  --speculative-eagle-topk {speculative_eagle_topk}
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  --reasoning-parser qwen3
  --ple-offload-embedding
  --ple-offload-backend file
  {extra_args}
