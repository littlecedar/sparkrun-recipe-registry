recipe_version: '2'
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
runtime: sglang
container: lmsysorg/sglang:dev-cu13-qwen38-next-local@sha256:9d2a843c706c74bc259c0d9abf360551eb2734e1e7d255ab012a6965f10480b6
min_nodes: 2
metadata:
  description: Qwen3.8-Flash-Next-NVFP4 - mixed NVFP4/BF16/FP8 checkpoint with MTP
  model_url: https://huggingface.co/RadixArk/Qwen3.8-Flash-Next-NVFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: 180B
  model_dtype: nvfp4
  model_mtp_dtype: bf16
  # Kept in sync with defaults.kv_dtype ON PURPOSE. sparkrun's launch summary reads THIS field to
  # print "KV cache dtype: ...", while the process actually runs the `defaults` value; on 2026-09-20
  # a boot ran `--kv-cache-dtype fp8_e4m3` (verified from /proc/PID/cmdline on both nodes) while the
  # summary printed bfloat16, because this line was left stale at bf16. Advertising a config you are
  # not running is a trap for anyone who reads the header instead of the booted argv, so if you
  # change defaults.kv_dtype, change it here too.
  kv_dtype: fp8_e4m3
  tags: lcg_favorite, fast
mods:
- '@eugr/mods/drop-caches'
- '@littlecedar/mods/pip-install-fastsafetensors'
- '@littlecedar/mods/fix-fastsafetensors-tp2-sglang'
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_seqs: 24
  kv_dtype: fp8_e4m3
  quantization: modelopt_fp4
  fp4_gemm_backend: flashinfer_cutlass
  page_size: 64
  chunked_prefill_size: 4096
  mamba_radix_cache_strategy: extra_buffer_lazy
  mamba_ssm_dtype: bfloat16
  max_mamba_cache_size: 112
  load_format: safetensors
  speculative_algorithm: NEXTN
  speculative_attention_mode: decode
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  extra_args: ''
command: taskset -c 5-9,15-19 sglang serve --model-path {model} --mem-fraction-static {gpu_memory_utilization} --host {host} --port {port} --tp {tensor_parallel} --max-running-requests {max_num_seqs} --quantization {quantization} --fp4-gemm-backend {fp4_gemm_backend} --page-size {page_size} --chunked-prefill-size {chunked_prefill_size} --context-length {max_model_len} --kv-cache-dtype {kv_dtype} --mamba-radix-cache-strategy {mamba_radix_cache_strategy} --mamba-ssm-dtype {mamba_ssm_dtype} --max-mamba-cache-size {max_mamba_cache_size} --load-format {load_format} --reasoning-parser auto --tool-call-parser auto --speculative-attention-mode {speculative_attention_mode}  --speculative-algorithm {speculative_algorithm} --speculative-num-steps {speculative_num_steps} --speculative-eagle-topk {speculative_eagle_topk} --speculative-num-draft-tokens {speculative_num_draft_tokens} --no-ple-offload-embedding {extra_args}
