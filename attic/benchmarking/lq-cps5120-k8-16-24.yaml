# cps=5192? No -- cps=5120: the arm that separates "fewer chunks" from "wider chunks" for labquant.
#
# WHY THIS ONE. The labquant transfer test established that 4096 -> 8192 costs 6.2%/5.5% at k=8/16 and
# buys 23.6% at k=24, and the recommendation became "keep 4096". But that compares ONE alternative to the
# default, and it leaves two candidate explanations indistinguishable, because 4096 -> 8192 changes TWO
# things at once: the chunk WIDTH and the chunk COUNT. Per request the prefill is pp+depth = 2048+8192 =
# 10,240 tokens, so:
#     cps=4096 -> ceil(10240/4096) = 3 chunks per request
#     cps=8192 -> ceil(10240/8192) = 2 chunks per request
#     cps=5120 -> ceil(10240/5120) = 2 chunks per request   <-- the discriminator
# cps=5120 halves the chunk count exactly the way cps=8192 does, while being only 1.25x the default width
# instead of 2x. So:
#   * cps=5120 REGRESSES k=8/16 like cps=8192 did (~80 / ~85) -> the harm tracks CHUNK COUNT, and 4096 is
#     right for labquant because it is the widest setting that still takes 3 chunks. That is a mechanism,
#     and it predicts where else to look (any width in (3414, 5120] should behave like 4096, any width in
#     (5120, 10240] like 8192).
#   * cps=5120 looks like the DEFAULT (~86 / ~90) -> the harm tracks WIDTH, and labquant's optimum is a
#     width near 4096 for reasons unrelated to step count.
# Either way the recommendation stays 4096; what changes is whether we know WHY, which is the difference
# between a tuned constant and a claim someone else can apply to a different model.
#
# WHY 5120 AND NOT 5000 OR 6144: it must divide the prefill evenly to be a clean 2-chunk case.
# 10240 / 5120 = 2.0 exactly, so neither chunk is partial and the arm differs from cps=8192 in width only,
# not in remainder handling.
#
# Recipe note: this runs on the SHIPPING labquant recipe with NO extra_args override, i.e. with
# --cuda-graph-backend-prefill disabled, because §7f/§19c show that flag is mandatory (removing it dies in
# graph capture). So this is the configuration we actually ship, not a counterfactual.
framework: llama-benchy
metadata:
  description: >
    labquant at chunked_prefill_size=5120, k=8/16/24, d=8192, shipping recipe (graphs off). Discriminates
    whether labquant's regression at cps=8192 is caused by chunk count (5120 also gives 2 chunks/req, so it
    would regress) or by chunk width (5120 is near-default width, so it would not). Requires
    -o chunked_prefill_size=5120.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 8, 16, 24 ]
  prefix_caching: true
  runs: 7
