# labquant at `max_num_seqs = 32`, k=16 + k=24 — the claim whose "test" never applied the override.

# WHY THIS EXISTS, AND WHY IT IS THE HIGHEST-VALUE REMAINING BOOT FOR THE SHIPPING RECIPE.
# §8 carries a withdrawn row: "labquant's max_num_seqs = 24 is a misconfiguration; cap 32 raises its
# peak" was withdrawn because `bench_cacd14583017` was launched WITHOUT the `-o max_num_seqs=32` its own
# profile prose required. Its `state.yaml` read `measurement_overrides: {}`, so the bench ran at the
# shipped cap of 24 while its filename, its log, and my notes all said 32. **Whether cap 32 helps
# labquant is therefore genuinely open**, on the checkpoint we actually ship.
#
# Two independent reasons to expect something, both new since that failed arm:
#  1. §19l/§19n established `run = min(k, cap − 1)` on two checkpoints and two caps: at cap 24 the running
#     batch never exceeds 23, with one request permanently queued. So labquant serving k=24 today is
#     serving **23 sequences**, not 24 — and its worst cell (51.5–55.7) is the one that is short a
#     sequence. At cap 32, k=24 should admit 24. If the `k == cap` penalty is the cap-1 shortfall
#     expressing itself in throughput, removing the shortfall should recover part of it.
#  2. That penalty's measured size is ~6% of per-request decode (§19e corrected the published ~40%,
#     which was a window artefact), so **the honest expectation is small**, and it is written here before
#     the run so a +1% result is reported as a null rather than dressed up.
#
# PRE-REGISTERED PREDICTIONS, stated before any cell exists:
#   * k=24 (the `k == cap` cell today): improve. Predict +5–10% over 55.73 / 55.35 (the two shipped-cap
#     boots), and `num_running_reqs` should reach **24** for the first time in this project. The gauge
#     prediction is the sharper one: 24 is a discrete, unambiguous consequence of cap > k.
#   * k=16 (non-binding at either cap): **unchanged**, within the §4b floor (1.4% for this cell). If
#     k=16 MOVES, the boot is not comparable to the controls and the k=24 result is uninterpretable —
#     that is the control firing, and it must be reported as such rather than as an effect.
#   * TTFT at k=24 should *improve* (18.36 s control): admitting the 24th sequence rather than queueing it
#     shortens the last request's wait. TTFT is per-request and immune to the §19e window problem, so it
#     is the cleanest quantity in the arm.
# FALSIFICATION / WHAT EACH OUTCOME MEANS:
#   * k=24 unchanged (within the floor) → cap 32 is NOT a lever for labquant; the withdrawn row stays
#     withdrawn and `max_num_seqs: 24` is correct as shipped. That is a useful answer, because the row has
#     already misled once and a measured null retires it properly.
#   * k=24 improves but k=16 also moves → confounded boot; do not interpret, find what else differs.
#   * k=24 degrades → a larger cap costs something (pool pressure: `max_mamba_cache_size` is 112 and
#     §19n measured exactly 3.00 slots/sequence, so 32 sequences want 96 of 112 — near the wall where 24
#     want 72). That would make cap and the SSM pool interact, which is its own finding.
#
# WHY THIS ARM IS NOT LIKE THE FAILED ONE. `max_num_seqs` is a RECIPE KEY (`--max-running-requests
# {max_num_seqs}` is in the recipe's own command template), so `-o max_num_seqs=32` is substituted —
# unlike `max_prefill_tokens`, which `sparkrun` reports as not understood and then silently ignores.
# Verification here is three-deep: `cells.py` prints `cap:` read from `measurement_overrides`;
# `launch.sh --dry-run` prints the resolved overrides before booting; and `capture-serve-argv.sh`
# (fired by arm-harvest.sh while the server is up) snapshots the RENDERED argv, which is the check the
# original arm lacked. `state.yaml` alone is NOT sufficient — it stores the command template unrendered.
framework: llama-benchy
metadata:
  description: >
    labquant with max_num_seqs=32 (vs the shipped 24) at d=8192, k=16 and k=24, n=7. Tests the withdrawn
    cap-32 claim on the shipping checkpoint and, more sharply, whether the `run = min(k, cap-1)`
    admission rule of §19l costs throughput. k=16 is the internal non-binding control.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 16, 24 ]
  prefix_caching: true
  runs: 7
