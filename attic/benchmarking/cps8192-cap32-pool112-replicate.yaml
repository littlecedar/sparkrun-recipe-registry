framework: llama-benchy
metadata:
  description: >
    REPLICATION of cps=8192 + max_num_seqs=32 at the mamba pool's SHIPPED value (112), for the k=24
    cell only. Byte-equivalent args to cps8192-cap32-rerun-cleanhost.yaml (bench_3fc1eb736656) except
    the filename; it exists as a separate file because sparkrun derives the bench id from
    (recipe, profile, overrides, nodes), so re-running the original command would CLOBBER
    bench_3fc1eb736656 -- that run is archived at ~/bench_archive/bench_3fc1eb736656_0923 first, so a
    clobber would be recoverable, but a distinct id is cheaper than recovery.

    QUESTION (single number, and it changes how a published figure is quoted). §19c reports the
    cps=8192 cap 24 -> 32 gain at k=24 as +12.7% (80.48 vs a pooled cap-24 median of 71.42, n=21,
    p=0.0016). A second cps=8192/cap-32 boot exists -- bench_7364de5fcb64, the §19x pool-128 causal
    arm -- and its k=24 median is 87.78, i.e. 9.1% above the first. So the published gain is really a
    range, +12.7% to +22.9%, and the p-value describes scatter among seven repeats inside ONE boot of
    the treatment arm rather than reproducibility across boots.

    THE ONLY CONFIG DIFFERENCE BETWEEN THE TWO cap-32 BOOTS IS max_mamba_cache_size (112 vs 128), and
    at k=24 NEITHER can bind: eff = min(cap, pool // 4) = min(32, 28) = 28 and min(32, 32) = 32, both
    >= 24, and §19x confirms the pool-128 arm's k=24 cell reaches 24/24 with queue 0. So by the
    ceiling model the pool should be inert here and the 9.1% should be impossible.

    PRE-REGISTERED, written before this boot (three branches, and the third is the one that would
    embarrass the ceiling model):
      (a) k=24 lands in ~[79, 82]  -> consistent with bench_3fc1eb736656. Two pool-112 boots agree and
          the 87.78 is either pool-related after all (ceiling model incomplete) or that boot was
          biased. Quote the gain as +12.7% and flag 87.78 as an outlier needing explanation.
      (b) k=24 lands in ~[85, 89]  -> consistent with the pool-128 arm. Then pool is NOT the
          explanation and boot-to-boot scatter at this cell is ~9%, which is more than 3x the 2.6%
          matched-config floor of §4b. Consequence: §4b's floor does not transfer to cap-32 arms and
          MUST NOT be used to adjudicate sub-10% effects here; quote the gain as a range and drop the
          p-value as a claim about reproducibility.
      (c) k=24 lands outside both bands  -> all three cap-32 boots differ, something unmodelled moves
          this cell, and no range should be quoted until it is identified.
    Anchor: k=16 in the SAME boot must reproduce ~89.5 (the §19c cap-32 value, and the cps=8192 cap-24
    boots give 88.42/86.83/89.06). If k=16 is >3% off, the boot is not comparable and the k=24 value
    says nothing about either branch -- which is why k=16 is kept in the profile despite being
    irrelevant to the question.

    WHY `concurrency` IS [16, 20, 24] AND NOT [16, 24]. Dropping the k=20 cell would make this boot
    20 minutes shorter and is the obvious edit, and it was rejected for the reason §19t records: cells
    within one boot share the radix cache, so an arm whose *cell list* differs from the comparator's
    differs in the cache history that k=24 inherits, and the two become incomparable for a reason that
    no artifact reveals. The k=20 cell here is not a measurement of anything, it is a history-matching
    fixture. **A confound you cannot see in the output is worth 20 minutes; a clobber is worth an
    archive plus an md5, which is why the profile matches the original file-for-file and the original
    run is archived rather than protected by renaming.** If the bench id turns out to be content-derived
    rather than path-derived, this boot will reuse bench_3fc1eb736656's id -- recoverable from
    ~/bench_archive/bench_3fc1eb736656_0923, whose k=24 file md5 is 463b819a914163c03b28908af28dc4f9.
  requires_overrides: [chunked_prefill_size, max_num_seqs]
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 16, 20, 24 ]
  prefix_caching: true
  runs: 7
