framework: llama-benchy
metadata:
  description: >
    Same-BOOT aggregate-vs-offered-concurrency curve at depth 16384, with a repeated point to
    measure drift. Costs ZERO boots: run it with --skip-run against a container that is already
    up (phase 27 left both arms serving).

    WHY IT NEEDS A REPEATED POINT. Phases 26 and 27 measured, respectively, an aggregate decode
    ratio of 1.56 at c=12 and 1.33 at c=16. Those came from DIFFERENT boots, and the phase-27
    containers were already two hours old. Aggregate decode at this context length is sensitive
    to how much prefill interference the allocator is absorbing, which is not a fixed property of
    a config -- so "the ratio fell when we offered more load" and "the ratio fell because the
    container was older" are not separable across boots. They ARE separable within one boot.
    That is the entire purpose of this profile.

    DESIGN: sweep the offered concurrency, then come back down and repeat the low point.
    The two c=8 measurements sandwich the sweep, so their disagreement is the drift estimate for
    the whole session. If aggregate at c=8 differs by more than ~10% between the first and last
    block, the shape of the curve in the middle cannot be trusted and the whole run must be
    re-done with fresh boots rather than interpreted.

    JUDGE ON: aggregate tg t/s per offered c, and from the server log the peak #running-req per
    c (a timestamp/`Task` boundary separates the blocks -- one container logs every sweep it has
    ever served, so without a boundary these blocks are indistinguishable, which is exactly the
    error made once already in this project). Compare realised running count to the arm's
    ceiling: an arm cannot exceed min(grant, #tokens // 16384).

    WHAT A ANSWER LOOKS LIKE. If aggregate rises sublinearly with RUNNING streams and the
    sandwich agrees with itself, then adding streams at 16k genuinely buys diminishing aggregate
    throughput, and the capacity ratio (2.00x) must NOT be quoted as an expected throughput gain.
    If instead aggregate tracks running streams proportionally, phases 26/27 differed by drift
    and the throughput gain is closer to the capacity ratio than 1.33.
args:
  depth: [ 16384 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  # 8, 12, 16, 20 then back to 8: the repeat is the drift meter, not a duplicate.
  concurrency: [ 8, 12, 16, 20, 8 ]
  prefix_caching: true
  runs: 3
