framework: llama-benchy
metadata:
  description: >-
    Per-stream decode throughput as a function of CONTEXT LENGTH at FIXED batch (c = 8).
    This exists to turn an unexplained number into a shape.

    WORK.md 12.22 established that at c = 8, depth 8192 costs ~20% of per-stream decode
    throughput versus depth 1024 (three independent instruments: harness aggregate 0.794,
    harness per-stream 0.849, sglang's own gen throughput 0.757-0.774), and that the two
    obvious mechanisms are quantitatively excluded: acceptance moves <=1% (3.292 -> 3.273,
    depth-matched at B = 8), and pool pressure does nothing (the gap is 0.805 at ratio 3.51
    and 0.794 at ratio 1.2, which doubles the token pool). KV read bandwidth accounts for
    only ~3.4 pp of the ~20 pp. About 14 pp has no mechanism.

    Rather than guess at a mechanism, MEASURE THE SCALING. If the cost is proportional to
    resident KV bytes -- i.e. a bandwidth term -- throughput should fall roughly linearly in
    (depth + pp), and a fit gives the coefficient directly. If it is super-linear, suspect a
    walk/scan cost. If it saturates, suspect a cache/TLB effect. Each shape points at a
    different subsystem, and unlike the two-point comparison, a curve can discriminate.

    PREDICTION, written before the run (pp = 2048 held constant, c = 8, D = 8):
      per-stream tok/s at depth d   ~=  A / (1 + k * (d + 2048))
      from the two known points (d=1024 -> 11.41, d=8192 -> 9.68) the implied k is ~0.75
      per 10k tokens, i.e. a term LARGER than pure KV bandwidth (which needs ~0.23).
      So if the model is "bandwidth", the curve should bend toward the smaller k at low
      depth and the 20% gap should NOT be a straight line through the origin.
      FALSIFIER: if throughput at d=2048 is within noise of d=1024 (<=3%), the effect has a
      THRESHOLD, not a slope -- which would rule out bandwidth outright and point at
      something that switches on (chunk size 4096, or the 64-token mamba chunk floor).

    Zero boot: run against an ALREADY-BOOTED server with --skip-run. Same boot for every
    depth, so inter-boot drift cannot contaminate the curve -- this is the whole reason the
    sweep is worth doing free. But note the container has served ~4h of traffic: record
    'capped to' and '#tokens' from the live log before and after, because if the pool
    identity drifts mid-sweep the curve is a drift curve, not a depth curve.

    JUDGE ON per-stream = tg_throughput / c, and on tg_req_throughput if present. Depth is
    separated inside a container by #full token / #running-req - pp, NOT by wall clock
    (WORK.md 12.22 records a bucketing error that read depth 16384 as depth 8192 this way).
    Keep pp constant at 2048 so depth is the only thing moving.

args:
  depth: [ 1024, 2048, 4096, 8192, 12288 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 8 ]
  prefix_caching: true
  runs: 2
