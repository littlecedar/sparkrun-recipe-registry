# Matched RadixArk + flashinfer_cutlass past bs=8: closes the checkpoint-only comparison.
#
# Why this is owed rather than optional. §3c's matched row (RadixArk+cutlass vs labquant+cutlass,
# both with `--cuda-graph-backend-prefill disabled`) only ever reached bs=8, where the advantage is
# +1.0% and the doc's conclusion is "erodes to ~0 by bs=8". The labquant bs>8 sweep
# (`bench_69e6119fbdce`) then measured labquant to bs=24, but its comparator in that window was
# RadixArk with the DEFAULT MoE backend -- two variables at once (checkpoint AND backend), which is
# exactly the confound §3c spent a paragraph warning about. So the numbers in §19 that compare
# labquant to RadixArk above bs=8 are deployment numbers, and the checkpoint-only question is
# unanswered.
#
# This run supplies the missing arm: the RadixArk checkpoint with the SAME extra_args as labquant's
# shipping recipe, at the SAME cells, in a window adjacent to the labquant sweep. Then
# labquant-vs-RadixArk at bs=12/16/24 is one variable.
#
# What it predicts, and both outcomes matter:
#   * If matched RadixArk lands near labquant (91.38 at bs=16), the +5-9% seen in §19 was the MoE
#     backend, not the checkpoint, and §3c's "erodes to ~0" extends to bs=16.
#   * If matched RadixArk lands well below, the checkpoint's advantage survives past bs=8 and the
#     byte model's story about the leaner checkpoint needs revisiting at bs>8.
# It also independently tests the bs=24 collapse on a third configuration of the same checkpoint.
#
# Note `-o extra_args=...` carries the flags (there is no --moe-runner-backend CLI passthrough for
# benchmark; sparkrun drops trailing EXTRA_ARGS, §16). Both flags are required: the prefill one is
# MANDATORY for labquant and is the shared flag that makes the pair matched (§7f).
framework: llama-benchy
metadata:
  description: >
    RadixArk + flashinfer_cutlass + prefill-graph-disabled, bs 8/12/16/24 — the matched comparator
    for the labquant bs>8 sweep. Requires -o extra_args="--moe-runner-backend flashinfer_cutlass
    --cuda-graph-backend-prefill disabled".
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 8, 12, 16, 24 ]
  prefix_caching: true
  runs: 7
