# Is the bs>16 decline PREFILL CONTENTION? Test d=0 (no prefill) against d=8192 in one boot.
#
# WHY THIS IS THE NEXT EXPERIMENT AND NOT ANOTHER CAP OR ANOTHER ARMS SWEEP.
# §19 has excluded hardware, prefill *admission*, KV bytes by magnitude, and the scheduler cap in
# both directions. Today the acceptance-length probe closed the last alternative that was framed as a
# mechanism: NEXTN's A is FLAT above bs=16 (2.202 at k=16 -> 2.243 at k=24, +1.9%, sd <= 0.07), so
# the decline is not a speculation collapse. What is left is that per-sequence step cost rises (+65%
# from k=16 to k=24) and `t_step ~ k^2.18` past the peak, which is contention -- but "contention" is a
# class, not an explanation, and no term in §3's decode model grows that way (weights-read is
# constant per step, fixed cost is constant, KV read is proportional to k -> constant per sequence).
#
# THE OBSERVATION THAT MAKES THIS TESTABLE. A load driver holding a genuinely full batch of 24
# (num_running_reqs 22-24 conditioned) sustains **223 tok/s of pure decode**. The benchmark measures
# **54.23** at k=24, d=8192. Those are not the same experiment -- the driver reuses 24 prompts so the
# radix cache keeps them warm and prefill is nearly free, while benchy issues cold 8192-token prompts
# and each new request must be prefilled. But the pair bounds something real: **the decode path is
# not the limiter at k=24.** So the missing cost must be the thing that differs: prefill work
# interleaved into the step loop.
#
# THE TEST. Same boot, both depths:
#   d=0    -> no meaningful prefill. If throughput at k=24 stays near k=16, the decline is prefill
#             contention (chunked prefill eating step budget), NOT a decode-side batch cost.
#   d=8192 -> must reproduce 87.66 / 65.34 / 54.23 as the in-boot control, and it is the arm the
#             whole §19 curve is stated on.
# Both depths in ONE boot, because §18 forbids cross-window comparison at this noise floor and the
# d=8192 cells are the control that licenses the d=0 reading.
#
# WHAT EACH OUTCOME MEANS:
#   * d=0 flat across k=8/16/24, d=8192 declining -> the collapse is PREFILL CONTENTION. That is a
#     concrete, checkable mechanism (chunked-prefill-size 2048 vs 24 cold 8192-token requests), and
#     it makes `--chunked-prefill-size` and `--max-prefill-tokens` real levers rather than §19's
#     "no knob removes it".
#   * d=0 also declining at k=24 -> prefill is exonerated too, and the contention is inside decode
#     batching itself (scheduler/kernel at large running batch) despite the driver's 223 tok/s.
#
# k=8 and k=16 are included so the SHAPE is measured, not inferred from two points -- the lesson
# behind the retracted "cliff" (§19): a 4-wide gap is not a step function.
framework: llama-benchy
metadata:
  description: >
    d=0 (no prefill) vs d=8192 at k=8/16/24, same boot, to test whether the bs>16 decline is prefill
    contention. d=8192 is the in-boot control and must reproduce 87.66 / 65.34 / 54.23.
args:
  depth: [ 0, 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 8, 16, 24 ]
  prefix_caching: true
  runs: 7
