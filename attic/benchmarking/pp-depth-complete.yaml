framework: llama-benchy
metadata:
  description: >-
    Completes the p66/p67 grid and replicates p67 across a NODE, in ONE boot.

    p66 measured (1024,1024) (4096,1024) (1024,4096) (4096,4096) and p67 added (8192,1024), both
    on node-free-1. The cell that would test the saturation claim in DEPTH-COST.md section 12.44 is
    still missing: (8192, 4096). Section 12.44 finds two costs -- one in pp (about -19 % at fixed
    depth) and one appearing only between depth 4096 and 8192 (about -13.5 % at pp = 1024) -- and
    claims they SATURATE near 128 t/s rather than adding. That claim rests on two cells at
    pp = 4096 with depth <= 4096 both measuring ~129.6/129.8. (8192, 4096) is where the two costs
    would have to combine:
      * if it lands near 128-132, the saturation reading holds and the costs do not add;
      * if it lands materially below 128 (say 110 or less), they DO add and section 12.44's
        "two saturating costs" is wrong -- it would be one cost in some other variable, which is
        the alternative the section explicitly says it cannot distinguish;
      * near 118-125 would be consistent with partial addition, which no four-cell design can
        resolve and which would make the saturation claim premature.

    IT ALSO REPLICATES THREE CELLS ON A DIFFERENT NODE. Section 12.44's reproducibility bound
    (worst 3.6 %) is SAME-CONTAINER, and its p67 result is n = 5 on one container. Repeating
    (4096,1024), (4096,4096) and (8192,1024) on node-free-2 puts a cross-node bound on the same
    statistic, which is what the p value in section 12.44 actually needs to be trustworthy.

    CAPACITY, checked before interpreting: the largest cell is 8 x (8192 + 4096) = 98,304 token
    slots against a ~117.5k pool (84 %), with the grant at 21 and c = 8 well below it. That cell
    is close enough to the pool that `#running-req` and `full token usage` must be read per cell
    from the serve log -- `concurrency` is an OFFER, and a capacity-limited cell silently turns a
    throughput number into a capacity number. If (8192,4096) shows `#running-req` < 8, it is
    measuring the pool and must not be used to adjudicate saturation.

    `--fresh` is mandatory: sparkrun keys resume state on (profile, recipe, hosts) and IGNORES
    --output, re-writing the prior JSON byte-identically with rc = 0. Verify distinct md5s.
    Judge on `peak_throughput` from the DECODE-PHASE row only.

args:
  depth: [ 4096, 8192 ]
  pp: [ 1024, 4096 ]
  tg: [ 256 ]
  concurrency: [ 8 ]
  prefix_caching: true
  runs: 5
