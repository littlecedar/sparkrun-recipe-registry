framework: llama-benchy
metadata:
  description: >-
    Q0 (WORK.md 12.23): is the depth-2048 throughput bump real, or blocked-run drift?
    Phase 38 measured per-stream decode at c=8 on ONE boot, depths run in ascending
    order (blocked), and got 1024 -> 93.5, 2048 -> 103.9 t/s: a +11 % bump. A blocked
    design cannot separate that from monotone in-container drift, and the depth story
    (bandwidth, state walk) predicts monotone decay, so the bump is load-bearing for
    rejecting those mechanisms. This is the same cell run with the ORDER randomised.

    PRE-REGISTERED, written before the run:
      depth 2048 vs depth 1024, c = 8, same boot, randomised order, n >= 5 blocks.
      REAL  if mean ratio > 1.05 AND the sign is the same in >= 4 of 5 blocks.
      NOT REAL otherwise -> report depth as monotone-decreasing and DELETE the bump
      from 12.23; the mechanism question then reopens with bandwidth back in play.
    Also reported either way: regression of each depth's value on block index. If a
    depth's own values trend with index, drift is present and the randomised design is
    what saves the comparison -- say so rather than trusting the mean.

    WHY RANDOMISED ORDER MATTERS AND --fresh MATTERS TOO
    ----------------------------------------------------
    Order is randomised per block, so any monotone drift is shared equally by both
    depths instead of being attributed to the later-run depth. And sparkrun caches
    benchmark state keyed on (profile, recipe, hosts) and IGNORES --output, so a
    repeat of an identical config silently returns the FIRST result with rc=0 and no
    warning (WORK.md 7: this voided a 10-artifact "5 independent pairs" run, 2 distinct
    md5s). Every invocation here therefore passes --fresh, and the driver hash-checks
    the artifacts and refuses to analyse identical ones.
  skip_run: true
args:
  depth: [ 1024 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 8 ]
  prefix_caching: true
  runs: 1
