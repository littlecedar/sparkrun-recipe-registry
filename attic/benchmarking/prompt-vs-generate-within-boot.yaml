framework: llama-benchy
metadata:
  description: >-
    WITHIN-BOOT test of whether speculative acceptance depends on PROMPT length or on GENERATED
    length, at matched batch AND matched pool occupancy. Zero boots: `depth`, `pp` and `tg` are all
    llama-benchy harness parameters, so every cell runs against one already-serving container.

    WHY A SECOND TEST WAS NEEDED. Section 12.35 reaches "acceptance tracks the prompt, not the
    resident token count" by comparing this container's pp=16384 cell (accept len 3.41) against
    phase 56's depth=16384 cell (2.93). That comparison crosses BOOTS, and phase 56 sits ~5 % lower
    at the same batch than this one -- the exact confound section 12.22 established for throughput.
    So 12.35 is directional only and says so. This profile removes the confound by putting both arms
    in ONE boot.

    THE DESIGN. `c` = 4 and the three cells C/P/G below. HOW SPARKRUN EXPANDS THESE ARGS, because
    the obvious reading is wrong and I got it wrong once already (see the correction at the foot of
    this description): `build_task_list` (llama_benchy.py:455-473) builds scheduler tasks from
    **depth x concurrency only**, labelling each `d=N c=M`; `pp` and `tg` are NOT scheduler axes and
    never appear in a task label. The full arg lists are handed to llama-benchy, which runs the
    **cartesian product of pp x tg x depth x concurrency** (stated at llama_benchy.py:395 and
    computed that way in `estimate_test_count`, :409). So `--dry-run` printing "2 tasks" says
    nothing about how many CELLS will run, and a cell count must be read from
    `Estimated test iterations`, which is the product x runs.

    Consequence for this profile: listing three depths and three `pp` values produces **9** cells
    (3 x 3), not the 3 arms intended. That includes (16384, 16384), which at 4 x 32,768 = 131,072
    slots is 111 % of the pool and cannot hold 4 sequences. It is NOT a bug that voids the run --
    P and G are both present and comparable -- but that over-capacity cell must be identified and
    excluded from the acceptance comparison rather than averaged in, and `#running-req` for it must
    be checked (it should fall below 4; if it does not, the capacity arithmetic in section 12.34 is
    wrong and every capacity caveat in DEPTH-COST.md needs re-examining).

    **Correction, 2026-09-22.** This description previously asserted that "sparkrun zips `depth` and
    `pp` by index -- it does NOT take their cross product (verified with --dry-run)". That is FALSE,
    and the --dry-run output I cited as proof does not test the claim at all: task labels omit `pp`,
    so a crossed grid and a zipped one look identical there. The real behaviour is a cross product
    performed by benchy, one layer below the scheduler that prints the labels. The lesson is about
    the *form* of verification: **a check only counts if it can distinguish the outcomes it claims to
    distinguish.** Reading "2 tasks" and concluding "2 cells" was reading a label, not a count.
      C  short/short     depth  1024, pp  1024  ->  4 x  2048 =   8,192 slots  (  7 % of pool)
      P  LONG PROMPT     depth 16384, pp  1024  ->  4 x 17408 =  69,632 slots  ( 59 %)
      G  LONG GENERATED  depth  1024, pp 16384  ->  4 x 17408 =  69,632 slots  ( 59 %)
    P and G are IDENTICAL in batch, in total resident token slots, and in `depth + pp`. They differ
    only in which phase supplies the tokens. That exactness is why the comparison needs no
    cross-phase anchor and no cross-boot anchor.
    A both-long cell (16384, 16384) is deliberately EXCLUDED: 4 x 32,768 = 131,072 slots against the
    117,752-token pool (111 %) means it cannot hold four sequences, so it would measure the pool
    ceiling rather than acceptance. It would have been a nice control on the capacity guard -- it
    must show `#running-req` < 4 if section 12.34's arithmetic holds -- but interleaving it risks the
    container, and the guard is already exercised by p56/p58.

    PREDICTION, written before running.
      * PROMPT-driven: P falls and G does not, so accept len(P) < accept len(G) within this boot, by
        roughly the ~13 % section 12.33 measured across 1k -> 16k.
      * RESIDENT-TOKEN-driven: P and G are equal -- they are equal here by construction -- and both
        fall below C.
      * DECODE-PROGRESSION-driven (a draft-context effect tied to how far generation has run rather
        than to the prompt): G falls and P does not.
    These three are mutually exclusive on this grid and pairwise distinguishable, which is what the
    earlier designs lacked. Expected CI half-width ~ +/-0.15 at n ~ 20 lines per cell, so an effect
    below ~10 % is not resolvable and must be reported as unresolved, not absent.

    AN ASSUMPTION THAT COULD BREAK THE READING. `pp` tokens are produced by the prefill phase, so G
    reaches its long context by prefilling it while P reaches it by being given it. If acceptance
    depends on the ROUTE by which context was built -- chunked-prefill state writes versus prompt
    encoding -- a P/G gap here is partly about the route, not purely about promptness. Nothing in
    this project has separated those. Report a gap as "prompt-associated", not "prompt-caused",
    unless something else isolates the mechanism.

    VERIFY BEFORE BELIEVING ANYTHING. `concurrency` is an OFFER: check `#running-req` == 4 and note
    `full token usage` per cell -- a cell admitting fewer than 4 sequences measures the pool, not
    acceptance. P and G have IDENTICAL `#full token`, so that field cannot tell them apart;
    attribution must use harness task order from the benchlog, cross-checked against
    `context_size`/`prompt_size` in the JSON, and any disagreement must be reported rather than
    silently resolved. Use `--fresh`: sparkrun keys resume state on (profile, recipe, hosts) and
    IGNORES `--output`, re-writing the prior JSON byte-identically with rc = 0. Confirm distinct md5s
    per cell before analysing.
args:
  depth: [ 1024, 16384, 1024 ]
  pp: [ 1024, 1024, 16384 ]
  tg: [ 1024 ]
  concurrency: [ 4 ]
  prefix_caching: true
  runs: 3
