framework: llama-benchy
metadata:
  description: >-
    WIDE 2x2 to separate the three composition models that DEPTH-COST.md section 12.45 could not
    tell apart. Zero boots: run with --skip-run --no-stop against the container already serving
    the shipped recipe on node-free-1 (verified: mamba_full_memory_ratio 3.51,
    speculative_num_draft_tokens 8, capped to 21, #tokens 117,568).

    WHY p68 COULD NOT SEPARATE THEM. It varied pp over 1024..4096 and depth over 4096..8192 at
    c = 8, spanning per-batch cost c*(depth+pp) from 40,960 to 98,304 -- only 2.4x. Three
    composition rules (multiplicative, additive-in-levels, additive-in-time) then predicted
    116.0 / 118.2 / 120.0, a 3.4 % spread against ~4 % cell noise. Consistent-set output was the
    honest result, and naming a winner would have been an overclaim.

    THE LEVER. Separation improves with the SIZE of the cost effect, not with the number of runs,
    so widen the cost range rather than replicate the narrow one. Dropping to c = 4 is what buys
    the range: pool demand is c*(depth+pp) = 4*(12288+12288) = 98,304, which fits inside the
    117,568-token pool, so depth and pp can BOTH go to 12288 -- a per-batch cost range of
    8,192 -> 98,304, i.e. 12x instead of 2.4x.

    PRE-REGISTERED PREDICTIONS, extrapolated from p68's fitted linear-in-cost step time
    (t = 0.00492 + 3.82e-8 * cost, c held constant so peak is proportional to 1/t):

      cell                    cost      predicted peak
      (depth 1024, pp 1024)    8,192    191
      (depth 1024, pp 12288)  53,248    144
      (depth 12288, pp 1024)   53,248    144
      (depth 12288, pp 12288)  98,304    115

    and the three models then predict the corner as:
      additive-in-time   115.6   <- exact, because linear-in-cost t IS additive-time
      multiplicative     108.6   (-6.2 % vs additive-time)
      additive-in-levels  97.0   (-16.1 %)
    SPREAD. Corrected 2026-09-23 after the run launched: the first version of this block said
    "SPREAD 12.1 %, roughly 3 sigma" and that figure was wrong. The gap is 115.3 - 96.6 = 18.7
    and **18.7 / 115.3 = 16.2 %**, not 12.1 %. The origin of 12.1 % is now identified rather than
    guessed: **18.7 / 154.0 = 12.1 %**, and 154.0 is `base` in the *p68* grid at c = 8 -- the old
    grid's denominator was carried into the new grid's prediction. A stale denominator, not a
    slip of the finger, which is why it survived review: the numerator was right. Separation is
    *larger* than pre-registered, so the experiment is better-powered than claimed and the
    pre-registration's arithmetic was worse. Both facts are recorded because only the first is
    flattering. The sigma claim is now made by `.scratch/qwen3-27b/analyze_p70.py` from the
    boot's own within-cell run spread rather than asserted here, because the free control (slow
    and disc have identical cost by construction) is the only honest noise estimate for one boot.

    TWO FREE CONTROLS BUILT IN. (1) slow and disc have IDENTICAL cost 53,248 by construction
    (symmetric design), so they must agree; if they do not, the disagreement is a pure
    measurement-noise estimate for this boot and calibrates the whole comparison without any
    assumption. (2) The c = 4 choice makes the grant (21) and the token pool both slack at three
    of four cells, so three cells are unambiguously not capacity-limited.

    CAVEATS, in the order they could bite.
      * The high cell sits at 84 % of pool. With prefix_caching on, cached prefixes compete for
        those tokens. CHECK per cell: #running-req must equal 4 and full token usage must stay
        below ~0.9. If the corner cell admits fewer than 4, it measures the pool ceiling and the
        model comparison is VOID for that cell -- report it as void rather than folding it in.
      * c = 4 changes per-sequence overhead relative to c = 8, so ABSOLUTE predicted peaks above
        are unreliable; only the RATIO structure matters, and the test is model-vs-model at the
        same cells, not measurement-vs-prediction.
      * depth is the GENERATED length and pp the PROMPT length (section 12.43). pp = 12288 makes
        each request's prefill very long, so wall-clock per cell grows; budget ~5-6 min/cell.
      * --fresh is mandatory: sparkrun keys resume state on (profile, recipe, hosts) and IGNORES
        --output, silently re-writing the prior JSON byte-identically with rc = 0. Verify distinct
        md5s before analysing (section 12.13).
args:
  depth: [ 1024, 12288 ]
  pp: [ 1024, 12288 ]
  tg: [ 256 ]
  concurrency: [ 4 ]
  prefix_caching: true
  runs: 5
