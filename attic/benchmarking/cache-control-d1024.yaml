framework: llama-benchy
metadata:
  description: >-
    VALID prefix-cache eviction control. The previous attempt
    (same-boot-concurrency-d0.yaml, depth 0) was INERT and its result must not be quoted:
    llama-benchy warms the radix cache only when `depth > 0` (runner.py:127), and at depth 0
    prompts.py:38 draws a fresh unseeded random slice per request, so a ~0% hit rate there is
    structural and says nothing about eviction or pool pressure.

    THIS ARM REMOVES THE EVICTION PRESSURE INSTEAD OF REMOVING THE CACHE. Sizing, for a
    ~117.7k-token KV pool (the shipped `mamba_full_memory_ratio: 3.51` grant):

      cache working set (must survive between the two phases) = c x depth
      resident during the inference phase                     = c x (depth + pp + tg)

    at depth 2048 the c=20 cell needs 20 x (2048+2048+256) = 87,040 resident, which is 74% of
    the pool — leaving less room than the 40,960-token cache working set needs, so eviction
    could still be FORCED and the control would be contaminated. At depth 1024:

      c=8   resident 26,624 (0.23 of pool)   cache WS  8,192 (0.07)   free 91,043  -> ample
      c=20  resident 66,560 (0.57 of pool)   cache WS 20,480 (0.17)   free 51,107  -> ample

    so NO cell needs to evict at any c. That is what makes it a control: capacity cannot be
    the binding constraint here, by construction and with >2x margin.

    PREDICTION (written before the run). `cached/req` should sit at roughly the full depth
    (~1024 tokens) and stay FLAT across c = 8..20, because the working set always fits.
    Compare the same formula against the phase-28 depth-16384 arm, where c x depth / pool runs
    1.11 -> 2.78 (never fits) and cached/req falls 8.6x. If reuse here also collapses with c
    despite fitting comfortably, capacity is NOT the driver and the next place to look is
    queueing/scheduling — and the phase-28 reading would need rewriting again.

    Companion arm: reuse-vs-depth8192.yaml on the same node and boot, where the same ratio
    crosses 1.0 mid-sweep (0.56 at c=8 -> 1.39 at c=20). Two depths, one boot, so depth is the
    only variable and the dose-response is measurable without any cross-node comparison.
args:
  depth: [ 1024 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 8, 12, 16, 20, 8 ]
  prefix_caching: true
  runs: 3
