framework: llama-benchy
metadata:
  description: >-
    HOLD depth+pp CONSTANT AND VARY THE SPLIT: separates "total resident sequence drives the
    prefill-admission queue" from "prompt length drives it" from "context length drives it".
    Zero boots -- run against the container already serving the shipped config on node-free-1
    (verified via GET /get_server_info: speculative_num_draft_tokens 8, mamba_full_memory_ratio
    3.51, mamba_ssm_dtype bfloat16, max_prefill_tokens 16384, chunked_prefill_size 4096).

    WHY THIS EXISTS. Section 12.29 named prefill admission as one of two UNVERIFIED candidates for
    the depth cost and said its own grid could not test it, because no arm held prompt length fixed
    while varying chunk count. Section 12.55 then measured the queue directly and found it rises
    with depth at c = 8 -- but with the depth contrast confounded by run order, and with depth and
    prompt length moving together (depth+pp = 6,144 vs 10,240, i.e. 1.5 vs 2.5 chunks), so it could
    not say WHICH quantity admission tracks. This profile says.

    THE THREE CELLS, all with depth + pp = 10,240 and therefore constant resident length and, if
    prompt = depth + pp, constant chunk count too:
        (depth 8192, pp 2048)  -> the shipped shape, 2.5 chunks
        (depth 6144, pp 4096)  -> same sum, different split
        (depth 4096, pp 6144)  -> same sum, most prompt-weighted
    Reading the outcome:
      * queue EQUAL across all three -> admission tracks the SUM. Then depth has no admission
        effect of its own, section 12.55's c = 8 depth rise is a sum effect (and its order
        confound stops mattering for the mechanism, though not for the magnitude), and the
        candidate that survives is total prefill work, not "long context".
      * queue tracks pp -> PROMPT length drives admission, as the chunk-count story predicts,
        and depth is innocent. This is section 12.29's first candidate confirmed.
      * queue tracks depth -> the sum story is wrong and something context-shaped is queueing,
        which would be surprising and would need a mechanism.
    All three are informative; none is the "probably nothing" outcome that most of this file's
    depth experiments have returned.

    SPARKRUN ZIPS THESE LISTS, IT DOES NOT TAKE THEIR CROSS PRODUCT. `depth: [8192, 6144, 4096]`
    with `pp: [2048, 4096, 6144]` yields the three paired cells above, NOT nine. This is the
    behaviour that silently turned a "2x2" design into a 2-cell design once already (see the
    profile-audit note in section 7 of WORK.md), so the pairing is written as an explicit
    positional correspondence and the three intended cells are listed above so a reader can check
    the dry-run against it. VERIFY WITH --dry-run BEFORE THE RUN: it prints the cells that will
    actually execute, and it costs three seconds against ~20 minutes of benchmarking.

    NOT CAPACITY-LIMITED, and this had to be checked rather than assumed because the same
    calculation has voided cells here before. Resident L = depth + pp = 10,240 in every cell; the
    shipped ratio 3.51 pool is ~118k tokens with cap 21, so usable = min(21, 118000 // 10240) = 11,
    which is above the offered c = 8. Peak full token usage should land near 8 x 10,240 / 118,000
    = 0.69 -- comfortably below the wall, which is what makes the queue attributable to admission
    rather than to the pool (section 12.55's discriminator). If usage comes back near 1.0, the
    cells are pool-capped and the queue is not an admission signal; stop and re-run at a lower ratio.

    RANDOMISED ORDER IS THE POINT OF THIS RUN, not an optional refinement. Section 12.55's depth
    rise sits on a confounded contrast because the deeper cell necessarily ran later in a fixed-order
    sweep; three cells in a fixed order re-create that confound exactly. Randomise per block and
    interleave several blocks so the split-vs-queue contrast is not a time-in-container effect.

    METRIC WARNINGS THAT WILL VOID THIS RUN IF IGNORED (both are section 7 entries, and both bit
    the analysis this profile extends):
      * `#queue-req` must be read from **Prefill batch** lines. From Decode batch lines it is zero
        on every line and the analysis silently concludes "no queueing" -- a null indistinguishable
        from a real one. Assert it with a bare re.findall over the file before believing any zero.
      * Do NOT apply a steady-state `#running-req >= 0.75*c` filter to the queue: the lines that
        carry a queue are exactly those where the running set has not yet filled.
      * `--fresh` is mandatory: sparkrun keys resume state on (profile, recipe, hosts) and IGNORES
        --output, re-writing the prior JSON byte-identically with rc = 0. Verify distinct md5s.
args:
  depth: [ 8192, 6144, 4096 ]
  pp: [ 2048, 4096, 6144 ]
  tg: [ 256 ]
  concurrency: [ 8 ]
  prefix_caching: true
  runs: 3
