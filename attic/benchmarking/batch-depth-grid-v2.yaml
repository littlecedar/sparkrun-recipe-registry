framework: llama-benchy
metadata:
  description: >-
    Non-degenerate (batch, depth) grid for qwen3.8-27b, designed to fix the two specific
    weaknesses in phase 44's grid. One boot, then 15 cells at zero additional boot cost via
    --skip-run. Judge on peak_throughput from the DECODE-PHASE row only.

    WHY THIS SHAPE, AND WHAT PHASE 44 COULD NOT DO. Phase 44 fitted
        A   1/peak = a/c + b + g*depth       (KV bytes;      cost ~ c*depth)
        B   1/peak = a/c + b + g*c*depth     (superlinear;   cost ~ c^2*depth)
    on 2 depths x 4 batch sizes. Two structural problems followed from that:

      1. **Depth linearity was untestable.** A slope through two depths is defined for any
         curved relationship, so "is the depth term linear" could not be answered -- and the
         whole KV-bytes mechanism *predicts* linearity in depth, since bytes read per step are
         proportional to c*depth. Three depths make curvature testable, which is also the only
         way to detect a second mechanism masquerading as a linear one.
      2. **The weight coefficient `a` had one data point of leverage.** The design column is
         1/c, spanning 0.50 -> 0.025 over c = 2..40, so nearly all leverage on `a` sat at the
         smallest c. Leave-one-out on archived depth-0 cells: dropping c = 2 moves `a` +27 %,
         adding c = 1 moves it +64 %, and dropping any of c = 8..40 moves it <= 1 %. Phase 44
         had exactly one such point (c = 2). This grid uses THREE small batch sizes
         (c = 1, 2, 4), so `a` is no longer a one-point estimate and its leave-one-out
         sensitivity becomes reportable.

    ALL CELLS ARE BELOW BOTH CEILINGS, by construction. Shipped config on a fresh container
    grants `capped to 21` with #tokens 118,376. Max cell load here is c=16 x depth 4096 =
    65,536 token slots < 118,376 (55 % of pool), and c <= 16 < 21. So no cell is pool-limited
    or cap-limited and every cell measures steady decode rather than a queue -- the
    c x depth <= 65,536 constraint is deliberate, and depth 8192 is EXCLUDED for exactly this
    reason (16 x 8192 = 131,072 > pool, so it would silently measure the pool wall). If the
    serve log shows #running-req below the offered c in any cell, that cell is void, not a
    data point: check 'full token usage' and #running-req per cell before pooling.

    PREDICTIONS, committed before running (WORK.md section 12.27):
      * model A fits better than B at every depth (phase 44: 96 % of bootstrap resamples)
      * the depth term is LINEAR in depth: a quadratic term in depth is not needed, so
        adding depth^2 should not reduce SSR enough to matter (report the F test either way)
      * a * TPS lands within a factor ~1.5 of 79.7 ms (weights 17,608 MB at 221 GB/s), and
        with three small-c points a should now have a real CI rather than one point's luck
      * g implies an effective KV read bandwidth in the 50-150 GB/s band, CI wide

    OPERATIONAL, all learned expensively in this repo: use --fresh on EVERY cell (sparkrun
    keys resume state on profile+recipe+hosts and IGNORES --output, so a repeated config
    silently resumes and re-writes byte-identical JSON with rc=0); verify distinct md5s after
    each block; idle-gate every cell (wait for no new 'Decode batch' line for >= 75 s, then
    20 s more) so no cell's window overlaps its predecessor's; derive the log date rather than
    hardcoding it (a hardcoded date breaks at midnight UTC); pull /tmp/sparkrun_serve.log out
    of the container before teardown, because it lives inside and dies with it.
args:
  depth: [ 1024, 2048, 4096 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 1, 2, 4, 8, 16 ]
  prefix_caching: true
  runs: 3
