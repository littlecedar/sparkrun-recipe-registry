# Third independent boot of cps=8192 — the replication gate on the one surviving recipe candidate.
#
# Why this file exists as a THIRD file rather than a re-run of `prefill-chunk-8192-rep.yaml`.
# §16 established on 2026-09-21 that a sparkrun bench ID is a **deterministic hash of the
# configuration**, not random: the same command re-resolves to the same `bench_*` id and the same
# state directory. Re-running an existing profile would therefore resume/overwrite a previous boot's
# cell files instead of producing an independent measurement — which is precisely what a replication
# boot must not do. A distinct profile path changes the hash and yields a distinct id. The cps=8192
# pair got its independence this way (`prefill-chunk-8192.yaml` -> bench_8ec5167a318b,
# `prefill-chunk-8192-rep.yaml` -> bench_7a5a879308b7).
#
# What is being gated. §19c's single surviving recipe candidate is `chunked_prefill_size: 8192`,
# which lifts the d=8192/k=24 cell from 51.51 to **71.25** and **73.11** in two boots (+36–42%,
# p = 0.0005, zero distribution overlap in both). Two boots against ONE control boot is the weakest
# replication in this document relative to the size of the claim, and it is the only thing standing
# between "candidate" and "change the shipping recipe". So:
#   * k=24 is the treatment, and the number to beat is the control's 51.51 (bench_371a7bd533cb).
#   * k=16 is an in-boot anchor. It is NOT expected to move — cps=8192 gained +1.5% / −0.4% there in
#     the two prior boots — so it exists to validate the window (must land 85–89) and to catch a boot
#     that is globally slow or fast. §19's lesson: a control that is *asserted* rather than measured is
#     not a control.
#   * k=8 is included because that is where this change has a COST (+37% median TTFT for +3.8%
#     throughput). Adoption requires the cost to replicate too, not just the gain; a candidate whose
#     downside is seen once and whose upside is seen twice is not characterized.
#
# What decides adoption, stated in advance:
#   * k=24 in the 66–82 band with no repeat below the control's best (58.59) -> third independent
#     confirmation, disjoint again; adopt-with-gates becomes defensible.
#   * k=24 anywhere near 51-60 -> the two prior boots were not representative and the candidate is
#     dead. This is a real possibility: the two boots agree to 2.6% but they are two boots, and the
#     d=8192 inter-boot floor is 12.4%.
#   * k=8 TTFT NOT reproducing ~8.3 s -> the cost estimate was luck and the trade-off is unquantified.
framework: llama-benchy
metadata:
  description: >
    Third independent boot of chunked_prefill_size=8192 (k=8/16/24) to gate the only recipe candidate
    that survived falsification. Own profile file so the deterministic bench id differs from the two
    prior boots. Requires -o chunked_prefill_size=8192.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 8, 16, 24 ]
  prefix_caching: true
  runs: 7
