framework: llama-benchy
metadata:
  description: >-
    VALID prefix-cache eviction control. The previous attempt (same-boot-concurrency-d0.yaml)
    was inert: llama-benchy only warms the radix cache when `depth > 0` (runner.py:127), and
    at depth 0 prompts.py:38 draws a fresh unseeded random slice per request, so a ~0% hit
    rate there is structural and proves nothing about eviction.

    This sweep fixes that by keeping depth > 0 and removing the eviction pressure instead.
    At depth 2048 the harness loads c contexts of 2048 tokens each in its context-load phase,
    so the cache working set is c x 2048 = 16k..41k tokens against a ~117k-token KV pool:
    every cell FITS (fit <= 0.35). If the phase-28 depth-16384 collapse is cache-capacity
    eviction, reuse here must stay HIGH and roughly FLAT across c = 8..20. If it still
    collapses, capacity is not the driver and queueing/scheduling is.

    PREDICTION (fit = c x depth / #tokens, written before the run):
      c=8  fit 0.14 -> cached/req ~= depth (full reuse)
      c=20 fit 0.35 -> cached/req ~= depth (still full reuse; nothing needs evicting)
    The dose-response companion is reuse-vs-depth8192.yaml, same node, same boot, where the
    same formula crosses 1.0 mid-sweep (0.56 at c=8 -> 1.39 at c=20), so it should start high
    and fall. Two arms on one node so the only difference between them is depth.
args:
  depth: [ 2048 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 8, 12, 16, 20, 8 ]
  prefix_caching: true
  runs: 3
