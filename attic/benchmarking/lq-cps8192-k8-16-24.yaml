# Does the cps=8192 recovery transfer to labquant? The transfer test for the only surviving change.
#
# Why this is the most valuable boot available right now. §19c's `chunked_prefill_size` 4096 -> 8192
# recovery at k=24 (+36-42%, two independent boots, zero distribution overlap) is the ONLY recipe
# change this session produced that survived its own falsification attempt -- and it was measured
# entirely on the **RadixArk** checkpoint. labquant ships the same `chunked_prefill_size: 4096`
# default (line 114 of qwen3.8-flash-next-nvfp4-labquant-sglang.yaml), so the same question applies
# to the checkpoint we would actually ship, and nobody has asked it.
#
# It is not a formality, for two reasons:
#   1. **labquant's prefill path is deliberately different.** Its recipe carries
#      `--cuda-graph-backend-prefill disabled` (line 177), which RadixArk does not. If any part of the
#      cps sensitivity comes from how prefill graphs are captured/replayed, this arm will show no
#      recovery -- and "no recovery on labquant" would be evidence that the mechanism touches the
#      graph path, which §19c cannot currently distinguish from "chunk scheduling cost".
#   2. **labquant reads fewer bytes per sequence**, and §19's cap sweep established that byte counts
#      per se do not drive the high-k collapse. So there is no strong prior either way, which is what
#      makes this a test rather than a confirmation.
#
# The control already exists: `bench_69e6119fbdce` swept labquant at the shipped cps=4096 over the
# same cells (8/12/16/24, n=7), giving 86.17 / 87.43 / 91.38 / 55.73. So this arm needs no paired
# control boot -- but it MUST carry its own k=16 anchor to bound boot drift, exactly as the RadixArk
# replications did (the control's k=16 was 91.38; if this boot's k=16 is far off, the k=24 number is
# uninterpretable and that is the whole point of the anchor).
#
# HOW TO OVERRIDE, AND THE TRAP. Use `-o chunked_prefill_size=8192` (a real `defaults:` key).
# Do NOT use `-o extra_args=...` on this recipe: `extra_args` already carries the mandatory
# `--moe-runner-backend flashinfer_cutlass --cuda-graph-backend-prefill disabled` (line 177), and the
# `-o` form REPLACES the value rather than appending -- so overriding extra_args would silently drop
# the prefill-graph flag that §7f records as mandatory for labquant to boot correctly. The override
# that looks harmless is the one that changes two things at once.
framework: llama-benchy
metadata:
  description: >
    labquant at chunked_prefill_size=8192, k=8/16/24, d=8192. Transfer test for §19c's only surviving
    recipe change, on the checkpoint we would actually ship, whose prefill graph path differs.
    Control is bench_69e6119fbdce (labquant, cps=4096, same cells). Requires -o chunked_prefill_size=8192.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 8, 16, 24 ]
  prefix_caching: true
  runs: 7
