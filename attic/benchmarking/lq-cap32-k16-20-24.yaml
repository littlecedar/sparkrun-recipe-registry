# labquant under a cap of 32: does raising `max_num_seqs` buy anything past the bs=16 peak?
#
# Why this is the remaining recipe question rather than a curiosity. §19's cap sweep on RadixArk
# showed the cap is inert there (cap 24 vs 32 moves nothing at bs=8/12/16), so the RadixArk recipe
# default of 24 is not costing anything. But labquant has only ever been swept at cap 24, and it is
# the checkpoint that ships a recipe and is ~3-9% faster. If a higher cap lets labquant serve more
# concurrency at the peak rate, then `max_num_seqs: 32` is a one-line recipe change worth making.
#
# The two effects from §19 constrain what to expect, and they point in opposite directions:
#   * The `k == max_num_seqs` penalty says a cell AT the cap is depressed, so k=32 would be a bad
#     cell to compare — this profile therefore uses k=16 and k=20, both strictly below a cap of 32,
#     plus k=24 which was the collapse cell at cap 24.
#   * The intrinsic collapse says k=24 falls to ~55 regardless of cap, so k=24 here is a
#     reproduction test, not a candidate.
#
# The question is therefore narrow and falsifiable: **is labquant's k=20 (or k=24) rate under cap 32
# above its k=16 rate under cap 24 (91.38)?** If yes, the recipe should raise the cap. If k=20 lands
# near 80 as it did for RadixArk at cap 24, the peak is a property of the model at ~16 sequences and
# the recipe default stays.
#
# Also fills a genuine hole in the RadixArk picture for free if it reproduces: k=20 at cap 32 was
# never measured, so this is the only way to see whether k=20 is "healthy but lower" (like RadixArk
# at cap 24: 80.66) or climbs.
framework: llama-benchy
metadata:
  description: >
    labquant under max_num_seqs=32, concurrency 16/20/24. Tests whether raising the cap lets the
    faster checkpoint exceed its 91.38 peak at bs=16 — a candidate one-line recipe change.
    Requires -o max_num_seqs=32.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 16, 20, 24 ]
  prefix_caching: true
  runs: 7
