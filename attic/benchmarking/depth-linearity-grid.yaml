framework: llama-benchy
metadata:
  description: >-
    Depth-linearity grid: enough DISTINCT DEPTHS, each with enough batch sizes, to test whether
    the depth penalty is linear in `c x depth`. This is the test phase 44 and phase 48 both
    failed to run, and they failed for the same reason -- they had plenty of ROWS and almost no
    DEPTH SUPPORT (phase 44: 2 distinct depths; phase 48: 3). Three points on a depth axis can
    always be fit by a parabola, so a quadratic term added to a linear depth model is not
    testable against it: the first attempt at this printed F(1,7)=43.7, "quadratic significant",
    and that was pure collinearity, not curvature. See selftest_fit_phase48.py and the guard in
    fit_phase48.py, which now refuses to opine below 4 distinct depths with >=2 batch sizes each.

    WHAT IS BEING DECIDED. Section 12.27 fits decode-step time as t_step = a + g*(c*depth)
    (+ a per-sequence term), where the `g` term reads as KV bytes moved per step -- the mechanism
    section 9 item 3 had declared dead on a byte count done at c=1, the one operating point where
    that term is negligible. `g` is only a *bandwidth* if the depth dependence is actually
    linear. If it curves, `g` is a fitted constant and the bandwidth reading, and the 45-97 GB/s
    figures derived from it, lose their physical meaning. Nothing measured so far separates those.

    DESIGN CONSTRAINT, and how it was violated once already. Every cell must be INSIDE the pool,
    because a pool-limited cell measures the pool ceiling rather than the decode step. The live
    container here is the shipped config: 118,376 tokens, granted cap 21 (WORK.md 12.8, 12.21).
    So the constraint is c x depth <= 118,376 with headroom; this grid caps at
    8 x 8192 = 65,536 (56 % of pool) and c <= 8 (38 % of cap), leaving no cell near either
    ceiling. The first draft of this file included depth 16384 at c=8, which is 131,072 tokens --
    11 % OVER the pool, and the shipped config can run only 7 such streams, not 8. It would have
    silently produced a pool-limited cell that the gate does not catch (see below). 16k belongs in
    a dedicated profile at c <= 4, not in a linearity grid.

    GATE HOLE, worth knowing even though this grid avoids triggering it. cell_gate.py enforces
    #running-req <= offered c, which catches FOREIGN LOAD but not POOL LIMITING: a cell that can
    only fit 7 of 8 offered streams passes that test. The discriminator is usage -- a pool-limited
    cell shows full token usage near 1.0 with running BELOW offered, while a clean cell sits well
    under both. Read both numbers from the serve log; do not rely on the gate's rc alone.

    ZERO BOOTS. Run with --skip-run against the already-serving container; one container serves
    all 12 cells. Requires --fresh: sparkrun keys resume state on (profile, recipe, hosts) and
    IGNORES --output, so a repeated config silently resumes and re-writes the prior JSON
    byte-identically with rc=0 (phases 37, 40 and 42 each lost data this way). Verify distinct
    md5s before analysing.

    EXPECTED, written before running: aggregate peak should grow sub-linearly in c at a rate that
    is IDENTICAL at every depth once plotted against c*depth rather than against c. If depth 8192
    falls below the line implied by 1024/2048/4096, the depth term is super-linear and section
    12.27's bandwidth reading is refuted. If all four depths lie on one line in c*depth, the
    bandwidth reading survives and `g` keeps its GB/s interpretation.
args:
  depth: [ 1024, 2048, 4096, 8192 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 2, 4, 8 ]
  prefix_caching: true
  runs: 3
