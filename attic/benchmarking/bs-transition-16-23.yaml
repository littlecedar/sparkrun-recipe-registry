# Localising the bs=24 transition: is it a step or a decline, and where does it start?
#
# Why this is the right next measurement. §19 has the two endpoints and one interior point:
#   k=16 -> 86.86    k=20 -> 80.66    k=24 -> 54.23        (RadixArk, cap 24, d=8192, n=7)
# The drop from 16 to 20 is −7%; from 20 to 24 it is −33%. That asymmetry is the only structural
# clue about the mechanism that exists, and it is currently a two-point inference across a
# four-sequence gap. Every earlier sweep in this project jumped 16->24 directly, which is how a
# 4-wide unmeasured interval became the word "cliff" (§19's correction).
#
# This profile fills it at 1-wide resolution: k = 20, 21, 22, 23, with k=16 as an in-boot anchor so
# the window is checkable against the 86.86 already on record.
#
# What each outcome would mean, stated in advance so the reading is not chosen afterwards:
#   * A SHARP transition (e.g. 22 -> 80, 23 -> 55) says a discrete resource or code path is crossed
#     at a specific concurrency. That points at a bucket, a chunk boundary, or an admission rule --
#     and is the more useful answer because it is a specific thing to go and look at.
#   * A GRADUAL decline (86, 84, 78, 68, 55) says the cost is continuous in k, which points at a
#     resource that degrades smoothly (contention, cache pressure, KV read growth). Note §19 already
#     excluded KV bytes as quantitatively sufficient for the 16->24 gap, so a smooth curve would put
#     pressure back on that exclusion.
#
# Why not also vary the cap here: §19 showed the cap is inert at bs>=8 (cap 24 vs 32 vs 16 all leave
# k=24 at ~54, and cap 32 leaves k=16 at ~90). Adding cap arms would triple the boot for no
# discriminating power. One variable, and it is the one with a live hypothesis.
#
# k=16 first, deliberately: if the anchor does NOT reproduce ~86.86 the whole boot is void (the
# `k == cap` effect taught that lesson the hard way -- a control that was asserted non-binding was
# not). Cap 24 > 16 so the anchor is genuinely non-binding.
framework: llama-benchy
metadata:
  description: >
    Fills the unmeasured k=17..23 interval for the RadixArk bs curve. k=16 is an in-boot anchor
    (must reproduce 86.86) and k=20/21/22/23 localise whether the transition to the ~54 collapse is
    a step or a decline. Same profile, depth and image as the §19 sweeps.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 16, 20, 21, 22, 23 ]
  prefix_caching: true
  runs: 7
