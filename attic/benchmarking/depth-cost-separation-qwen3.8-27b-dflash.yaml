framework: llama-benchy
metadata:
  description: >-
    SEPARATES THE TWO DEPTH COSTS for the qwen3.8-27b DFlash recipe: prefill work admitted
    per unit of generated output (section 12.23) and KV bytes read per decode step
    (section 12.27). Both are real and additive; neither archived experiment separates
    them, because every existing cell varies depth and concurrency together.

    NOT THE SAME TEST AS benchmarking/prefill-contention-d0-vs-d8192.yaml. That file is a
    qwen4 profile -- its rationale is qwen4's batch-size sweep past bs=8, its in-boot
    control is "must reproduce 87.66 / 65.34 / 54.23", and it assumes NEXTN acceptance and
    k = 24. This recipe caps at `capped to 21` (fresh container, D = 8), so k = 24 would
    measure the scheduler cap and not prefill contention, and those three control numbers
    can never be reproduced here. It was cited in qwen3's section 12.23 as this recipe's
    pending test, which was wrong; this file replaces that citation.

    THE TEST. depth 0 is the prefill-free baseline at matched concurrency: pp = 128 so
    admission work is nearly zero, and c is held at 8 and 16 -- both comfortably under the
    granted 21, so no cell is cap-limited and `#running-req` should equal the offered c.
      * If the d=0 cells are FLAT between c=8 and c=16 while d=8192 falls, the depth penalty
        at fixed batch is NOT an intrinsic decode-batch cost: it is the two depth-coupled
        terms (prefill admission + KV read) doing the work.
      * If d=0 ALSO falls from c=8 to c=16, there is a per-sequence decode-batch cost that
        neither model prices, and section 12.27's two-term form is incomplete in a way its
        R^2 = 0.938 did not reveal.
    d=8192 is the in-boot control at the same c values and is the arm section 12.27 fits on,
    so a single boot yields both the control and the dissociation.

    WHY c = 16 AND NOT HIGHER. usable concurrency at depth 8192 on the fresh container here
    is min(capped 21, #tokens 118,376 // 8192 = 14) = **14**, so a c = 16 cell at depth 8192
    is ALREADY pool-limited. That is deliberate for the pool-pressure read but it means the
    c = 16 / d = 8192 cell must be read against `full token usage` and `#running-req` in the
    serve log -- if `#running-req` sits at 14 rather than 16, that cell is measuring the pool
    ceiling, not concurrency, and must be reported as such rather than folded into a fit.
    c = 8 is the one cell that is unambiguously below every ceiling.

    ZERO-BOOT BY DESIGN. Run with --skip-run against a container already serving this recipe
    (node-free-1 carries the shipped D = 8 / ratio 3.51 config). Requires --fresh: sparkrun
    keys resume state on (profile, recipe, hosts) and IGNORES --output, so repeating a
    configuration silently resumes and re-writes the prior JSON byte-identically with rc = 0.
    Verify distinct md5s before analysing.

    CAVEAT THAT OUTLIVES THIS PROFILE. depth 0 does not remove prefill entirely (pp = 128
    still prefills) and it changes what is being measured: at d = 0 there is no long context
    to attend over, so it is a baseline for the *admission* term only, not a clean isolation
    of decode. Combined with section 12.27's single-boot grid this narrows the two-term
    story; it does not complete it, and the prefill/decode timing split still needs
    harness-side instrumentation rather than a depth-0 proxy.
args:
  depth: [ 0, 8192 ]
  pp: [ 128, 2048 ]
  tg: [ 256 ]
  concurrency: [ 8, 16 ]
  prefix_caching: true
  runs: 5
