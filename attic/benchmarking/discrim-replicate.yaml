framework: llama-benchy
metadata:
  description: >-
    Third replicate of the single cell d=8192 / pp=1024 / c=8, the discriminator cell of
    DEPTH-COST.md section 12.45. Zero boots: run with --skip-run --no-stop against a container
    already serving the shipped recipe.

    WHY THIS ONE CELL. It is the only number in the p68 composition test that is not
    replicated within its own boot, and section 12.45's sensitivity table shows the reported
    composition ratio moves from 0.973 to 0.932 depending on which reading is used
    (139.0 from p68 itself, 140.0 from p67, 142.5 pooled, 145.0 from p67b). The rejection of
    saturation survives every choice -- it sits 16 points out -- but "the discriminator is
    139" is currently asserted from n=5 on one boot, and the same cell has varied by 4.3 %
    across boots on the same node.

    WHY ON node-free-2 SPECIFICALLY. p68 ran on .35 and produced the 139.0 that the within-boot
    prediction uses. A replicate on the SAME node tests the number that the out-of-sample test
    actually depends on. A replicate on .34 would test a different quantity, because p67 and
    p67b were both .34 measurements and already disagree with each other (140.0 vs 145.0).

    WHAT WOULD CHANGE THE CONCLUSION. If this reads near 139 again, the within-boot value is
    confirmed and the cross-boot spread is a node effect rather than a cell effect, which is a
    cleaner story than the one section 12.45 currently has to tell. If it reads near 145, then
    .35 is also drifting between boots and EVERY within-boot figure in this file needs a
    same-node replicate before it can be quoted -- a much larger consequence than the
    composition ratio. Judge on the median of 5 runs and report the spread; a single run of
    this cell has already been seen at 127 and 152 inside lists whose medians are 139.
args:
  depth: [ 8192 ]
  pp: [ 1024 ]
  tg: [ 256 ]
  concurrency: [ 8 ]
  prefix_caching: true
  runs: 5
