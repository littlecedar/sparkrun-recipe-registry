framework: llama-benchy
metadata:
  description: >-
    Tests whether only the min() matters, or whether WHICH constraint binds also matters.
    Two configs reach the same 8k capacity by opposite routes:
      shipped 3.51 -- cap 20, tokens 117,571 -> min(20, 14) = 14 usable, POOL binds
      ratio  1.2   -- cap 14, tokens 239,346 -> min(14, 29) = 14 usable, SLOTS bind
    Pre-registered before the run. If aggregate at c=16 matches the shipped arm's 55.8 t/s
    within noise, then capacity is capacity and the min() oracle is the whole story. If the
    slot-bound arm is FASTER, then headroom matters independently of min() -- the pool being
    half-full would reduce eviction/thrash, which is the mechanism section 12.16 could not
    settle. Either answer is useful; both are falsifiable. Read from the server log, not the
    profile field: max_concurrency does not clamp the server, so c=16 on a cap-14 config must
    show #running-req topping out at 14 -- if it shows 16, the cap is not what we think.
  skip_run: true
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 16 ]
  prefix_caching: true
  runs: 4
