framework: llama-benchy
metadata:
  description: >-
    Ranks the (D, ratio) capacity ladder at depth 8192 against the shipped config, in ONE
    concurrency point that separates all three rungs. Concurrency was chosen from the
    ceiling arithmetic, not by taste, and an earlier draft of this profile (c=[8,16]) was
    wrong: usable concurrent 8k contexts is min(granted_slots, #tokens // depth), and at
    offered c=16 the shipped arm (14) is limited while both challengers - r=2.3 (18-19)
    and D=4/r=1.2 (22) - are NOT, so c=16 separates "limited vs not limited" but cannot
    rank the two unconstrained arms against each other. c=20 was rejected too: it lands
    one stream above r=2.3's grant, which is inside the noise. c=24 sits above both
    challengers' grants, so the expected ladder is 14 / 19 / 22 - gaps of 5, with the
    running counts themselves as the evidence.

    LADDER (usable concurrent 8k contexts at measured T ~25.2 GiB):
      D=8 r=3.51 shipped    14   token pool binds; ~7 slots sit idle
      D=8 r=2.3             18-19  measured (phase 10/31: cap 19, #tokens 155,133)
      D=4 r=1.2             22   UNBOOTED; cap 22 modelled, #tokens//8192 = 28

    c=8 is the null: no arm is capacity-limited at 8, so a genuine capacity effect must
    read "equal at c=8, ordered at c=24". A c=24 difference without that null is
    indistinguishable from one arm simply booting faster.

    PRIMARY EVIDENCE is #running-req, 'full token usage', and the per-boot 'capped to N' /
    '#tokens' lines from the SERVER LOG - never the profile's concurrency field, because
    max_concurrency does not clamp the server. Throughput is the PAYOFF question, not the
    capacity proof, and it may well be negative: inside a single arm at this depth
    aggregate already FALLS with offered concurrency (83.5 t/s at c=8 vs 55.8 at c=16),
    because prefill crowd-out grows faster than the batch. So report both, and do not
    describe a running-count ladder as a throughput win. That conflation is exactly the
    error §12.24 had to retract.

    runs=3 with a same-node interleaved design, not runs=5: the ladder evidence
    (#running-req against a hard pool/slot ceiling) is near-deterministic, and the
    interleave removes the cross-node confound that §12.10 had to carry.

args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 8, 24 ]
  prefix_caching: true
  runs: 3
