# Decisive test of the `run = min(k, cap - 1)` rule from §19l, with an internal control.
#
# WHAT IS BEING TESTED, and why it is worth a boot. §19l found, from gauges already on disk, that at
# concurrency 24 with max_num_seqs=24 the running batch saturates at **23** with one request permanently
# queued, while the SAME boot at concurrency 16 fills **16/16** with an empty queue. Two observations,
# both consistent with one rule:
#
#     run = min(k, cap - 1)          (cap = max_num_seqs)
#
# Point 1: k=16, cap=24 -> run 16.   min(16,23)=16 ✓   (a generic off-by-one would predict 15, so that
#                                                    candidate is already dead)
# Point 2: k=24, cap=24 -> run 23.   min(24,23)=23 ✓
#
# Neither point distinguishes "the cap reserves one slot" from "the queued request counts against
# max_running_requests" — and §19's `k == cap` penalty (a real ~6% per-request decode effect, largest
# exactly at k == cap) has had no mechanism attached to it after eight eliminations. This is the first
# handle on it, so it is worth one instrumented boot rather than another extrapolation.
#
# THE NEW CELL, AND THE PREDICTIONS. cap=20 (an override; the recipe default is 24) with concurrency
# [16, 20] in one boot:
#   k=16, cap=20  ->  run = 16    CONTROL. k < cap, so the rule says the batch fills completely. If this
#                               cell does NOT reach 16, either the rule is wrong or the recorder is
#                               sampling the wrong server, and the k=20 cell is uninterpretable. (This is
#                               also a third independent point on the rule.)
#   k=20, cap=20  ->  run = 19    TREATMENT. k == cap, so the rule predicts the same one-slot shortfall
#                               seen at 24/24 — and it predicts it at a DIFFERENT cap, which is the whole
#                               point: it separates "cap 24 is special" from "k == cap is the condition".
#
# Both outcomes are decisive and neither is a null:
#   * k=20 gives 19  -> the rule holds at two caps. The effective concurrency ceiling is cap-1, and the
#                      `k == cap` penalty finally has a concrete scheduler behaviour to be attributed to.
#   * k=20 gives 20  -> the rule is a coincidence at cap=24, and §19l's finding stays descriptive. The
#                      queued-request-counting mechanism (candidate (a) in §19l) is then the leading
#                      survivor, since it also predicts 20 when the queue is empty at the sample time.
#   * k=16 gives 15  -> the rule is wrong in the other direction and the whole framing needs redoing.
#
# WHY cap=20 AND NOT cap=25. cap must EXCEED the concurrency for the control to be non-binding, and
# cap=20 with k=20 is the smallest `k == cap` pair that is also a genuinely different cap from 24, keeping
# the boot short. cap=25 with k=25 would double the prefill cost for the same information.
#
# THROUGHPUT IS NOT THE POINT. This runs zz-lq-metrics, which carries --enable-metrics; §6 item 0 forbids
# quoting tok/s from such a boot. The product is the gauge distribution, nothing else.
framework: llama-benchy
metadata:
  description: >
    Test of `run = min(k, cap-1)` at a second cap. cap=20 (override) with concurrency [16, 20]: k=16 is a
    non-binding internal control predicted to reach 16/16, k=20 is the treatment predicted to saturate at
    19. Requires -o max_num_seqs=20. Throughput discarded (metrics-enabled boot).
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 16, 20 ]
  prefix_caching: true
  runs: 5
