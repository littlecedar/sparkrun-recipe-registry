framework: llama-benchy
metadata:
  description: >-
    REPLICATE §12.46's free control in isolation, with the sweep order REVERSED. Zero boots:
    run with --skip-run --no-stop against the container already serving the shipped recipe on
    node-free-1 (verify identity from its own server_args echo before trusting any result).

    WHY THIS EXISTS. §12.46's whole result is that (depth 1024, pp 12288) and (depth 12288,
    pp 1024) measure 65.0 and 87.0 despite having IDENTICAL c*(depth+pp) = 53,248, against 4.7 %
    within-cell cv and disjoint run ranges. That is a strong result from ONE boot in ONE order:
    task 1 ran depth 1024 (so `slow` early) and task 2 ran depth 12288 (so `disc` late). In this
    container later cells are slower (§12.23), and `disc` is the later AND faster cell, so drift
    works against the finding rather than for it -- but "drift is conservative" is an argument,
    not a replication.

    THIS PROFILE IS THE CONTROL ALONE. **CORRECTION, written after launching: it is not.** The
    description below claimed sparkrun's index-zipping would yield "exactly two cells". It does
    not. sparkrun creates one task per `depth` value and sweeps `pp` **inside** each task, so
    depth [1024, 12288] with pp [12288, 1024] produces **four** cells -- the full 2x2, identical
    to `wide-compose-c4.yaml` -- and the run's own `Estimated test iterations: 20` (= 4 cells x
    5 runs) said so before the first cell had finished. The mistake was avoidable and specifically
    the one §7's instrumentation notes say to prevent: **the pre-flight `--dry-run` was skipped**,
    so what should have cost three seconds cost it the ability to describe itself accurately. It is
    still worth running -- it is the full grid with the `pp` sweep order REVERSED, which is the
    actual point -- but it is a different experiment than described, and the description is
    corrected rather than the result reinterpreted to fit the description.
    (`runs: 5` so the within-cell cv is estimable; the `pp` order is reversed relative to p70.)

    PRE-REGISTERED, BEFORE THE RUN
      * PREDICTED ratio slow/disc = 0.747 (p70's medians 65.0/87.0).
      * The endpoint-resident model c*(depth+pp), which §12.46 refutes, has NO free parameter for
        this pair: it must predict 1.000. So the test is 0.747 vs 1.000 and needs no fit.
      * PASS: ratio in [0.62, 0.87] and the two cells' 5 run values are disjoint.
      * FAIL, informative: ratio in [0.90, 1.10] -> the asymmetry was boot-specific and §12.46
        must be rewritten as a non-replication, not softened.
      * Anything in between -> report the number and the ranges; do not average with p70 to get
        "a" value (§12.45: averaging measurements from different boots manufactures discrepancies).
      * Also report the per-cell cv. If cv here is >10 %, the container is not in the same state
        as p70's and the comparison is not clean -- say so rather than interpreting the ratio.

    CAVEATS. --fresh is MANDATORY: sparkrun keys resume state on (profile, recipe, hosts) and
    IGNORES --output, re-writing the prior JSON byte-identically with rc = 0 (§12.13). Verify
    distinct md5s. `--skip-run` does NOT copy the serve log out of the container, so fetch
    /tmp/sparkrun_serve.log before it disappears or the capacity gate cannot be filled -- a
    zero-boot run is not a zero-instrumentation run. Both cells sit at 45.3 % of the 117,568-token
    pool, comfortably slack, but `#running-req` must still equal the offered 4 in both.
args:
  depth: [ 1024, 12288 ]
  pp: [ 12288, 1024 ]
  tg: [ 256 ]
  concurrency: [ 4 ]
  prefix_caching: true
  runs: 5
