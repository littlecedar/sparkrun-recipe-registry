# Instrumented k-ladder: is the SSM/mamba pool the thing that scales with concurrency?
#
# WHY THIS PROFILE EXISTS, AND WHAT IT IS NOT.
# §19 has eliminated seven candidate mechanisms for the post-bs=16 decode cost. The last standing
# candidate came from §19k-1: on this hybrid model `token_usage` = max(full, swa, mamba) reaches 0.62 at
# k=23 while the KV pool (`full_token_usage`) only reaches 0.116, so the SSM pool runs ~5.4x hotter than
# KV and is the first thing a concurrency increase consumes. That inference is by ELIMINATION from two
# other gauges, NOT by measurement -- `mamba_usage` itself has never been recorded in any boot because it
# was never in instrument_host.py's watch list (names added 2026-09-22).
#
# THIS IS NOT A THROUGHPUT EXPERIMENT. Per §6 item 0, throughput from an `--enable-metrics` boot is
# discarded; the metrics path is not free and the numbers are not comparable to the shipping recipe. The
# gauge file is the result. `--enable-metrics` comes from the RECIPE (zz-lq-metrics), not from here --
# putting it in a profile override is how §7f's silently-dropped-flag trap starts.
#
# PRE-REGISTERED PREDICTION, written before this boots and before any gauge is read.
# SSM state is a FIXED-SIZE allocation PER SEQUENCE (the recipe sets max_mamba_cache_size: 112), unlike
# KV which grows per token. So `mamba_usage` should be LINEAR IN k with a slope of roughly 1/112 per
# sequence (~0.0089/seq), reaching ~0.14 at k=16 and ~0.21 at k=24 if usage is expressed against the slot
# pool -- and, unlike KV, INDEPENDENT of context length. Three outcomes:
#   * mamba_usage ~= k/112, monotone in k         -> arithmetic reading confirmed. The pool scales with k
#                                                    but is NOT saturated, so it stays a candidate only via
#                                                    contention, not exhaustion, and §19 keeps "mechanism
#                                                    open". Recipe unchanged.
#   * mamba_usage rises far faster than k/112, or
#     approaches 1.0 anywhere on the ladder       -> EXHAUSTION becomes live, this becomes the leading
#                                                    mechanism, and `max_mamba_cache_size` becomes a real
#                                                    knob worth a follow-up arm.
#   * mamba_usage flat, or 0.0 throughout          -> the gauge is DEGENERATE on this branch, exactly like
#                                                    swa_token_usage (identically 0.0000) and cache_hit_rate
#                                                    (hardcoded 0.0 on the decode path). Then §19k-1 is
#                                                    UNSUPPORTED rather than refuted, and must be downgraded
#                                                    from "the SSM pool is the binding pool" to "unmeasurable
#                                                    with this build".
# The third branch is the one most likely to be quietly reported as the first, because in this JSONL an
# absent gauge and a gauge that measured zero render identically. Run pos_ctrl_check.py / the reader
# control BEFORE interpreting anything (§19k's rule, applied to my own instrument).
framework: llama-benchy
metadata:
  description: >
    Gauge-only concurrency ladder (k = 1,4,8,12,16,20,24) at d=8192 on zz-lq-metrics, to record
    mamba_usage directly for the first time. Decides whether the SSM pool scales linearly with k as the
    per-sequence fixed-allocation model predicts, saturates, or is degenerate. Throughput discarded per
    §6 item 0; the gauge archive is the artifact.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  # Ascending, not shuffled: for gauges the quantity of interest is a monotone series in k, and an
  # ascending ladder makes the k=1..4 low-k end (where the cache-hit stratification of §19k-1 lives)
  # easy to isolate by time window. Order effects are a known confound for throughput here (§3c), which
  # is another reason these cells are not used for tok/s.
  concurrency: [ 1, 4, 8, 12, 16, 20, 24 ]
  prefix_caching: true
  # n=2. For a gauge series the informative quantity is the number of full-batch SAMPLES, and k=24 at
  # d=8192 spends ~4 min of prefill per repeat; two repeats give thousands of gauge rows while keeping
  # the boot inside one window. Stated explicitly rather than defaulted so the divergence from the
  # n=7 throughput convention is visible and nobody reads these cells as throughput evidence.
  runs: 2
