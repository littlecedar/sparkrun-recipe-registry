# Does the labquant "cps trough" survive being measured outside the 02:45-05:16 window?
#
# WHY THIS EXISTS, and it is the highest-value boot currently known in this recipe.
# §19h-§19i established that labquant's throughput as a function of `chunked_prefill_size` is a TROUGH:
# cps 4096 ~90, cps 5120 ~65, cps 6144 ~63, cps 8192 ~85. That finding, and the "phase A vs phase B"
# structural argument §19i builds on it, all rest on four depressed arms (cps 2048/5120/5120r2/6144) that
# **all finished inside one 90-minute window on 2026-09-22**, while every un-depressed arm (4096/8192)
# finished outside it. Wall-clock and the knob are **perfectly collinear** in the quotable dataset.
#
# Why it is collinear in the quotable set but not obviously so overall: the one boot that would break the
# collinearity -- cps=2048 at 07:13, still depressed at 71.94 -- is `instr-cps2048`, which carries
# `--enable-metrics`, and §6 item 0 forbids quoting throughput from a metrics-enabled boot. So the
# refutation I first wrote had to be downgraded to "cannot be excluded from the quotable data" (§19i).
# **This profile exists to make that sentence decidable with admissible evidence.**
#
# BLAST RADIUS, stated so nobody under-prices the boot:
#   * If cps=5120 measured ~2.5 h after the window lands near 65 -> the trough is a property of the knob.
#     §19h/§19i stand, and the phase-A/phase-B argument stands.
#   * If it lands near 90 -> the trough is ENVIRONMENTAL. Then §19h's whole table, §19i's
#     "43.6% spread within one chunk count" structural finding, and the four-arm falsification of the
#     step-count model are all artefacts of having run the bad arms consecutively in one 90-minute span.
#     That is several sections and the single largest retraction risk in the document.
# Either way the answer changes what the recipe should say, which is what makes it worth a boot rather than
# another re-cut of existing data. (I have already re-cut existing data four times today; the reason it
# cannot settle this is that no quotable boot exists on both sides of the boundary. The gap is a RUN, not a
# label -- the opposite of §19l/§19o/§19p, and worth noting so "check the artifacts first" does not become
# a reflex that skips the case where it genuinely does not help.)
#
# CHOICE OF cps=5120 over cps=2048: 5120 has two boots inside the window agreeing to 1.1% at k=16
# (65.37 / 66.10), so it is the arm with the tightest in-window characterisation, which makes an
# out-of-window shift unambiguous. It is also the arm §19i calls the only clean one (phase-A chunk count
# held while width varies).
#
# PREDICTIONS, fixed before launch:
#   trough real   -> k=16 in [63, 69], i.e. within ~4.5% of the two in-window boots.
#   environmental -> k=16 >= 85, i.e. within the cps=4096 control band (90.24-91.38, matched-config spread
#                    1.4%, §4b). Anything in [70, 84] is a THIRD outcome the model does not predict; report
#                    it as an anomaly rather than averaging it into either branch.
# Control on the same boot: none is built in, because this profile deliberately runs ONE arm. The control
# is external and already exists (`lq-cap32-retry_0922_1638`, cps=4096, k=16 = 91.03, metrics-free, also
# outside the window). A cross-boot comparison is therefore being made knowingly -- acceptable here because
# the question is "65 or 90", a 28% gap, against a 1.4% matched-config spread; it would NOT be acceptable
# for anything finer.
#
# MUST BE METRICS-FREE. If this boot carries `--enable-metrics` it answers nothing, because it would be
# exactly as unquotable as the boot it is replacing. Verify by grepping THIS boot's own output YAML for
# `enable-metrics` (not the launch log -- that returns 0 even when the flag is set) before quoting anything.
framework: llama-benchy
metadata:
  description: >
    labquant, cps=5120, k=16 only, metrics-FREE, run at least two hours away from the 2026-09-22
    02:45-05:16 window. Settles whether the §19h/§19i cps trough is a property of chunked_prefill_size or
    an artefact of all four depressed arms being booted inside one 90-minute span. Predict ~65 if the
    trough is real, >=85 if it is environmental.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 16 ]
  prefix_caching: true
  runs: 7
