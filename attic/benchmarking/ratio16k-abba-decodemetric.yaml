framework: llama-benchy
metadata:
  description: >-
    SAME-NODE ABBA replication of the 16k ratio comparison, using the harness's own
    decode-phase metric instead of a hand-rolled load generator. This replaces the p76/p77
    approach for the throughput question.

    WHY THE HARNESS AND NOT A LOAD GENERATOR. p76 and p77 both built a custom /generate
    driver and then had to *derive* decode time by subtracting an estimated prefill time from
    measured wall time. That residual is where both runs lost their verdict: p77's
    pre-registered 60 % decode-share gate failed (decode 14-35 % of wall), and a burst-based
    attempt to split the time gave a decode ratio anywhere from 1.00 to 2.05 depending on the
    burst-gap threshold (DEPTH-COST 12.53). The reason it was avoidable: llama-benchy already
    runs a SEPARATE prefill phase and decode phase per cell and reports `tg_throughput` for
    decode only. Using it, decode throughput is a reported measurement rather than a residual
    of a ~100 s quantity, so there is no convention to sweep and nothing for the scheduler's
    interleaving to confound.

    WHAT THIS DOES NOT CHANGE. The workload shape follows 12.43, which MEASURED it and corrected
    both readings this document previously carried: each cell runs two phases, and in the DECODE
    phase the prompt is `depth + pp` with `tg` generated -- so `depth: 16384, pp: 2048, tg: 256`
    decodes an 18,432-token context generating 256 tokens. That is the same shape phase 26 used,
    so the numbers are comparable with it. It is NOT a long-prompt serving measurement in the p77
    sense (p77 prefilled 15.5k and generated 768); the two answer different questions and must
    not be merged into one claim.

    KNOWN LIMITATION OF `tg: 256`. The decode phase generates only 256 tokens per request, so the
    measured window is short and its median carries acceptance-length noise -- the same effect
    that made 12.19 distrust short-generation cells. Raising `tg` to 1024+ would lengthen the
    window without changing the resident context under test, at the cost of runtime; run that
    variant if the ABBA margin comes out ambiguous.

    ARMS. `ship` (mamba_full_memory_ratio 3.51, admitted 7 at this depth) versus `r12` (1.2,
    admitted 12-14). Offered c = 12 sits BELOW r12's ceiling of 14 so r12 is not clipped the way
    phase 26's c = 12 clipped it, while ship remains pool-limited at 7 -- which is the whole
    comparison. CHECK `#running-req` per cell in the serve log before analysing: if an arm's
    running count is below its offer, that cell measures the pool ceiling rather than
    throughput, and the ratio must be reported as capacity, not speed.

    DESIGN. Four boots on ONE node in ABBA order (ship, r12, r12, ship) driven by the shell
    driver, NOT by putting both arms in one profile -- sparkrun resolves overrides once per
    invocation, so per-arm ratio has to be passed per invocation. `--fresh` is mandatory
    (sparkrun keys resume state on profile+recipe+hosts and IGNORES --output, re-writing the
    prior JSON byte-identically with rc = 0); verify distinct md5s before analysing.

    PRE-REGISTERED, committed here before the run. Judge on the DECODE-PHASE row only, using
    `tg_throughput.mean`. Expected direction from phase 26: r12 higher, magnitude 1.2-1.6x.
    NULL: concurrency 1 is a second cell per boot precisely because a null has to be MEASURED
    in the same run to be worth anything -- at c = 1 both arms have slack in slots and pool, so
    they must agree within ~5 %. If they do not, the arms differ by more than capacity and the
    c = 12 comparison is uninterpretable; the analyzer then refuses to report a ratio. Report the paired
    within-node ABBA estimate and the boot-level spread, and quote the smaller of the paired
    and pooled estimates. A ratio whose ABBA pair spread exceeds its own margin over 1.0 is
    reported as unresolved, not as a gain.
args:
  depth: [ 16384 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 1, 12 ]
  prefix_caching: true
  runs: 4
