framework: llama-benchy
metadata:
  description: >-
    ONE cell, chosen to break the confound that p66 left open: is the ~25 % decode-speed step
    driven by PROMPT length (`pp`) or by the number of tokens resident per sequence?

    p66 ran the cross product of depth {1024, 4096} x pp {1024, 4096} at c = 8 in one boot, in
    both sweep orders. Its decode-phase peaks were:
        (1024,1024) 160.0   (4096,1024) 161.8   (1024,4096) 129.6   (4096,4096) 129.8
    Two tests on those four cells, and the second is the one that matters:
      * TIED on endpoint resident tokens (pp + depth = 5120): (4096,1024) at 161.8 against
        (1024,4096) at 129.6 -- 25 % apart, well beyond the 0.9-3.6 % within-cell spread. So the
        ENDPOINT size of the KV set per sequence does not price the cost.
      * TIED on `pp` (1024): 160.0 and 161.8, agreeing to 1.1 %. TIED on `pp` (4096): 129.6 and
        129.8, agreeing to 0.2 %. The `pp` groups are also cleanly separated with NO OVERLAP.
    But `pp` and MEAN resident tokens (pp + depth/2) are perfectly confounded across those four
    cells -- every fast cell has pp = 1024 and every slow cell pp = 4096 -- so p66 cannot choose
    between them. That is a limitation of the grid, not of the measurement.

    THE DISCRIMINATOR. (depth 8192, pp 1024) has LOW `pp` (1024) but HIGH mean resident (5120),
    and endpoint 9216. Fast -> `pp` is doing it. Slow -> resident tokens are doing it. It is a
    single cell and it needs no new boot: the decode-phase prompt is depth + pp = 9216, which
    fits the ~118k-token pool at c = 8 with room to spare (8 x 9216 = 73,728 = 62 %), so the cell
    is not capacity-limited and `#running-req` should reach 8.

    JUDGE ON `peak_throughput` from the DECODE-PHASE row only, and check `#running-req` == 8 in
    the serve log first -- a capacity-limited cell silently turns a throughput number into a
    capacity number. Reference points to compare against, both from p66 at the same boot config:
    the pp = 1024 group at 160-162, the pp = 4096 group at 128-132.
    NOTE the direction p66 found is the counter-intuitive one: LONGER `pp` was SLOWER, so a slow
    result here is consistent with resident tokens and a fast result with `pp`. Neither outcome
    yet explains the mechanism; this only picks which axis to investigate.

args:
  depth: [ 8192 ]
  pp: [ 1024 ]
  tg: [ 256 ]
  concurrency: [ 8 ]
  prefix_caching: true
  runs: 5
