framework: llama-benchy
metadata:
  description: >-
    Dose-response arm paired with cache-control-d1024.yaml. Same node, same booted server,
    same c sequence; only `depth` differs. At depth 8192 with the shipped ~117.7k-token pool
    the cache working set c x depth crosses the pool mid-sweep:

      c=8   c*depth =  65,536  (0.56 of pool)  resident c*(8192+2048+256) =  83,968 (0.71)
      c=12  c*depth =  98,304  (0.84)          resident = 125,952 (1.07)
      c=16  c*depth = 131,072  (1.11)          resident = 167,936 (1.43)
      c=20  c*depth = 163,840  (1.39)          resident = 209,920 (1.78)

    so this arm should show reuse DEGRADING as c rises, and the pairing with d1024 (where the
    ratio never exceeds 0.17) turns the phase-28 single-point observation into a two-point
    dose-response. Note `#running-req` will also be capped by the pool here (~11 at this
    depth), so read `cached/req` rather than hit% and check `#running-req` per cell.

    PREDICTION (written before the run): cached/req starts near the full depth at c=8 and
    falls through the sweep, with the fall beginning once c x depth / pool approaches 1.0 —
    i.e. between c=8 and c=16. If instead it is flat, then depth is not acting through cache
    capacity and the phase-28 eviction reading is wrong.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 8, 12, 16, 20, 8 ]
  prefix_caching: true
  runs: 3
