# `max_prefill_tokens`: the second prefill-scheduling lever, and the other half of §19c's claim.
#
# Why this arm and not another cps replication. §19c established that high-concurrency cost tracks
# prefill STEP COUNT (`k·(depth+pp)/cps`) rather than prefill work, and the evidence is asymmetric in
# a way that should make a single-lever story suspect: cutting steps 4x (4096 -> 1024) costs 64%, but
# cutting them 1.5x (4096 -> 8192) buys ~38% *only at the collapsing k=24 cell* and nothing at k=8/16.
# A pure per-step fixed cost should pay back more symmetrically. So the remaining gap may not be about
# `cps` at all but about **how much prefill the scheduler advances per step**, which is a different
# knob: `max_prefill_tokens` (SGLang default 16384) caps prefill tokens per forward batch, while
# `chunked_prefill_size` (shipping 4096) chunks each *request*. At cps=4096 with 10,240-token prompts
# (pp 2048 + depth 8192), the budget of 16384 admits 4 chunks per step; raising it to 32768 should
# admit 8, halving the number of scheduler steps needed to drain the same prefill demand.
#
# That is the prediction, stated before running: **k=24 improves further, and this time k=8/16 may
# also move**, because a larger prefill budget changes admission at every concurrency, not only where
# chunks per request happen to drop. If k=24 is unchanged while cps=8192 helped, then the cps result
# was about chunk boundaries specifically and `max_prefill_tokens` is the wrong knob -- also useful,
# because it would mean only ONE of the two knobs matters and the recipe should stop treating both as
# tunable.
#
# THE COST SIDE IS THE POINT, NOT AN AFTERTHOUGHT. A bigger prefill batch means longer individual
# steps, and a long step is a step in which no decoding request advances. So a throughput win here
# could be bought entirely with tail latency, which §17 forbids reporting as a win. Every cell prints
# TTFT median and max, and the comparison must be read as throughput-for-latency, not throughput.
#
# Cells mirror the cps arms exactly (8/16/24 at d=8192, pp 2048, tg 128, n=7) so this stays
# cell-for-cell comparable with bench_371a7bd533cb (cps 4096 control), bench_8ec5167a318b and
# bench_7a5a879308b7 (cps 8192), and bench_5e7b5eacbdfd (cps 1024).
framework: llama-benchy
metadata:
  description: >
    max_prefill_tokens=32768 (vs the SGLang default 16384) at d=8192, k=8/16/24. Tests whether the
    scheduler's prefill budget per step -- as opposed to the per-request chunk size -- is the quantity
    behind the high-concurrency cost. Read TTFT beside throughput: a longer prefill batch means longer
    steps in which no decode advances.
    *** PASS IT AS extra_args, NOT -o max_prefill_tokens= ***. `sparkrun benchmark -o key=value`
    substitutes only keys the runtime understands, and `max_prefill_tokens` is not one of them for
    this recipe. PROVEN, not inferred, with `sparkrun benchmark ... -n` (dry-run, costs seconds and no
    GPU): `-o max_prefill_tokens=32768` prints
    `Override(s) -o max_prefill_tokens have no effect: the 'sglang' runtime does not understand it, so
    nothing is added to the serve command.` and continues. **It does not abort** -- so a benchmark
    launched that way completes, writes JSONs, and reports numbers for a configuration that was never
    applied. The warning is the saving grace but only if it is read; `--dry-run` before every new
    override is the cheap version of that habit.
    The recipe carries `{extra_args}` (line 76), which is the working escape hatch. Correct form:
    -o 'extra_args=--max-prefill-tokens 32768'
    Verified against live serve argv on 2026-09-21 that `--max-prefill-tokens` is ABSENT from the
    shipping command, i.e. SGLang's default **16384** is in force. That matters for the cps=16384 arm
    now running: with 10,240-token prompts (pp 2048 + depth 8192) and a 16384-token prefill budget,
    only ONE such prompt fits per prefill step (2 x 10,240 = 20,480 > 16,384), so cps=16384 may
    serialise admission at k=24. A regression in that arm is therefore evidence about the
    cps x max_prefill_tokens **interaction**, not against the step-count model.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 8, 16, 24 ]
  prefix_caching: true
  runs: 7
