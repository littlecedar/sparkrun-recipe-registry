framework: llama-benchy
metadata:
  description: >-
    THE DOCUMENTED FIRST-PRIORITY UNTESTED CAPACITY CELL: `speculative_draft_tokens = 4` with
    `mamba_full_memory_ratio = 1.2`, measured against the shipped `D = 8 / 3.51` on ONE node,
    interleaved. This is the cell §12.24 names as "the most interesting untested cell" and §12.26
    re-confirms as the standing recommendation.

    WHY CAPACITY AND NOT ACCEPTANCE. DEPTH-COST.md §12.39 measured the instrument: repeated readings
    of the SAME cell inside one boot differ by sd 0.117 in `accept len`, while the headline
    acceptance-vs-depth contrast is only 0.325 wide. So an acceptance experiment runs at its own
    noise floor, and the previously-named next experiment here (draft tokens at depth 16384, c = 6)
    was dropped for that reason. **Everything judged here is read off `#running-req` and the server's
    own grant, which are counts, not averages of a noisy per-step statistic.**

    THE PREDICTION, computed from `.scratch/qwen3-27b/predict_capacity.py` at the measured node
    state `T = 25.15` BEFORE this run. **It is stated in the resident-token units this profile
    actually uses, which is NOT how §12.24 states it** — see the correction below.
        D = 8, ratio 3.51  -> K 86,  cap 21, #tokens 119,688
        D = 4, ratio 1.2   -> K 91,  cap 22, #tokens 236,073
    A request in the DECODE phase of this profile holds `depth + pp + tg/2` = 8192 + 2048 + 128 =
    **10,368** tokens, not `depth` = 8192, because `#running-req` counts requests resident with
    their prompt AND their generated tokens (§12.30; `context_size` is the generated length,
    `prompt_size` is the prompt, and neither alone is the occupancy). So:
        shipped: min(cap 21, 119,688 / 10,368 = 11) = **11  <- POOL-LIMITED, grant 21 idle**
        d4r12:   min(cap 22, 236,073 / 10,368 = 22) = **22  <- GRANT-LIMITED, pool slack**
    which is a **2.0x** contrast in peak `#running-req`, and the shape is the interesting part:
    the shipped config leaves 10 of its 21 granted slots idle because the token pool binds first,
    while the d4/r1.2 cell has the pool to spare and is stopped only by its grant.

    **CORRECTION TO THE DOCUMENTED PREDICTION.** §12.24/§12.26 quote this cell as "22 usable vs 14
    shipped" (+57 %). That arithmetic used `#tokens // depth` = `#tokens // 8192`, i.e. it ignored
    the prompt. At `pp = 2048` the correct divisor is 10,368, giving **11 not 14** for the shipped
    arm — so the shipped figure was overstated and the true ratio is **2.0x, not 1.57x**. Nothing
    about the recommendation changes (the cell is still the best untested one) but a pre-registered
    number has to be the number the profile's own parameters imply, or a miss means nothing.

    Aggregate is pre-registered separately, because capacity is not throughput. With the measured
    acceptance lengths (phase 25: 2.795 at D = 4, 3.581 at D = 8), accepted tokens per step give
    (16 x 2.795) / (11 x 3.581) = **1.14** at `c` = 16 and (22 x 2.795) / (11 x 3.581) = **1.56** at
    `c` = 24. **The 2.0x is a slot count, not a speed prediction** — quoting it as throughput would
    repeat the recurring error of presenting a capacity bound as a measurement.

    `c` = 24 is included specifically because the shipped arm is capped at 11 there while d4r12 can
    still rise to its grant of 22; at `c` = 16 both arms could plausibly reach 11 and 16, and the
    gap is easier to mistake for noise. c = 1 is the null.

    DESIGN, and the two traps it is built to avoid. **Repetition is deliberately NOT the
    `runs: 5` this file originally specified** — see the args block for the measured-duration
    arithmetic behind cutting it. The consequence is stated so it cannot be forgotten: any
    THROUGHPUT number from this run is n = 2 and carries the archive's 7-25 % cross-boot caveat,
    so it cannot resolve the ~14 % aggregate effect predicted above. **What this run CAN settle
    is the capacity count**, which needs no repetition beyond reaching steady state. If the count
    comes back as predicted and the throughput is ambiguous, that is the expected outcome, not a
    failure — and the follow-up is more runs, not a different question. **Interleaved A/B/A/B on ONE node
    with `--fresh` on every arm**: cross-boot noise for byte-identical boots here is 7-25 %, larger
    than the effect, so a control must share the boot or the comparison is not credible (see
    `benchmarking/README.md`). `--fresh` is mandatory and not optional cosmetics: sparkrun keys
    resume state on (profile, recipe, hosts) and IGNORES `--output`, so a repeated config silently
    resumes and re-writes the prior JSON byte-identically with rc = 0. Verify distinct md5s per arm
    before analysing anything. c = 1 is the null arm: the two configurations must agree there, and
    disagreement at c = 1 invalidates every c = 16 number in the run.

    `prefix_caching: true` because that is how the recipe ships; note it makes `#full token` track
    `c x (depth + pp + generated)` per §12.30, so the pool arithmetic above is the binding term.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  # RUNGS TRIMMED AFTER WRITING THIS, and the reason is a scale error I would otherwise have
  # made twice. `depth` here is the GENERATED length (8192 tokens per request), so each extra
  # concurrency rung costs ~17-25 min PER RUN, not per sweep: c=8 and c=24 would have added
  # roughly 4 hours per arm for information the other rungs already supply.
  #   c = 1  -> the null. The two configurations must agree; if they do not, every c=16 number
  #             in the run is void. This rung stays because a null is not optional.
  #   c = 16 -> the discriminator. Shipped is POOL-limited at 11 (grant 21 idle); d4r12 reaches
  #             its offer of 16 (grant 22 idle). Predicted 11 vs 16 = 1.45x in peak
  #             `#running-req`, which is a count and needs no acceptance statistic.
  #   c = 24 -> DROPPED. It would separate "pool-limited" from "grant-limited" more sharply
  #             (11 vs 22) but c = 16 already distinguishes "capacity binds" from "capacity does
  #             not bind", which is the actual question; c = 24 refines a conclusion that c = 16
  #             either establishes or refutes. Run it only if c = 16 is ambiguous.
  #   c = 8  -> DROPPED: shipped is capped at 11 there too, so it nearly duplicates c = 16.
  # runs: 2 rather than 5. Sized from MEASURED task durations in the archive, not guessed:
  # p59's `depth` 16384 cell at c=4/runs=3 took 1414.7s per task, and c=16 does more work per
  # step, so a 3-run cell here was on track for ~1.5 h and a 4-arm interleaved run ~6 h. The
  # load-bearing read is peak `#running-req`, a COUNT reached within the first minute of the
  # cell, and even 2 runs leave hundreds of decode lines behind it. Throughput from n=2 carries
  # the archive's 7-25 % cross-boot caveat and is explicitly secondary to the count. Throughput claims from n=3 carry the archive's usual
  # 7-25 % cross-boot caveat and are secondary to the count here.
  concurrency: [ 1, 16 ]
  prefix_caching: true
  runs: 2
