framework: llama-benchy
metadata:
  description: >
    Item A2 high-pressure half. c=8 only, 8192 context. Run it ALTERNATING with
    a2-d1024.yaml on one already-booted server (--skip-run, zero boots). Full design and
    pre-registered prediction are in a2-depth-gap-c8.yaml; this pair exists because a single
    profile with `depth: [1024, 8192]` would run them BLOCKED (depth-major cartesian order),
    which is exactly the confound the interleaving is meant to remove.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 8 ]
  prefix_caching: true
  runs: 2
