framework: llama-benchy
metadata:
  description: >
    Item A2 low-pressure half of the interleaved pair. c=8 only, 8k-class prompt. Run it
    ALTERNATING with a2-d8192.yaml on one already-booted server (--skip-run, zero boots);
    do not run the two depths blocked, or any monotone drift inside the container becomes a
    "depth effect". See a2-d8192.yaml for the full design and the pre-registered prediction.
args:
  depth: [ 1024 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 8 ]
  prefix_caching: true
  runs: 2
