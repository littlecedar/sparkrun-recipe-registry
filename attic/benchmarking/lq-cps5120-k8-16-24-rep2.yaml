# REPLICATION of cps=5120 on labquant. Separate file on purpose -- see the note at the bottom.
#
# WHY. §19h established cps=5120 as the worst value tested at k=8 (-14.9%) and k=16 (-28.0%) against a
# control that agrees to 1.3% between its two boots, and k=24 as 53.28 (within 3.5% of the control). The
# k=16 gap is ~5x the largest same-configuration inter-boot spread measured in this project (2.6%, §19g-1),
# so it is unlikely to be noise -- but it is ONE BOOT of one arm, and this project has repeatedly been
# wrong about exactly that (the "+9% inter-boot bias" that was not a bias; labquant bs=4's phantom peak;
# the fabricated A(k) table). This run either establishes "cps=5120 is a bad value" or demotes it.
#
# WHY IT MATTERS BEYOND THE NUMBER. cps=5120 is the *only clean single-variable contrast* in the whole
# chunked_prefill_size investigation: phase-B chunks/req is 1 at 4096/5120/8192 and phase-A chunks/req is
# 2 at both 4096 and 5120, so 4096 -> 5120 varies phase-A admission (4 -> 3) and nothing else the current
# models can name. Four candidate mechanisms have already died on this data (work, phase-B step count,
# prefill-token budget, phase-A admission), and a second clean replication of the one contrast that
# survives is the only measurement that can tell the next reader whether a fifth attempt is worth a boot.
#
# CELLS match bench_d91021cb067c exactly (k=8/16/24, d=8192, n=7) so the two boots are poolable by
# poolmany.py as replicates of the SAME condition. Pooling two different conditions under one "treatment"
# is a separate error this project has already made once; pooling replicates is what makes a p meaningful.
#
# WHY A NEW FILE AND NOT AN EDIT. `benchmark_id` hashes (recipe, nodes, overrides, PROFILE PATH) -- not
# the file's contents -- so re-running the identical config under the identical path reuses
# bench_d91021cb067c and sparkrun CLEARS its runs/ at step 1, destroying the first boot (§19c). A new
# filename is the cheapest way to make the ids differ. Do not "clean up" by deleting the -rep2 file.
framework: llama-benchy
metadata:
  description: >
    Replication of cps=5120 on labquant, k=8/16/24 at d=8192, n=7. Second boot of the same condition as
    bench_d91021cb067c, poolable with it. Requires -o chunked_prefill_size=5120.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 128 ]
  concurrency: [ 8, 16, 24 ]
  prefix_caching: true
  runs: 7
