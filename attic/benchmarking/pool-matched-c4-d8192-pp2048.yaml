framework: llama-benchy
metadata:
  description: >-
    Cell 1 of 2 of the pool-matched pair (see pool-matched-pair.yaml for the full rationale and
    the pre-registered predictions). One cell per profile ON PURPOSE: sparkrun expands a profile
    whose args are lists into the crossed grid -- a 2x2x2 list set here produced 18 cells in
    --dry-run, not the 2 that zipping would give -- so a two-cell comparison cannot be expressed
    as one profile with paired lists. Two single-cell profiles run against ONE live container with
    --skip-run instead, which keeps the comparison same-boot (the whole point) without relying on
    grid semantics that this tool does not implement the way one would assume.

    This cell: c=4, depth=8192, pp=2048 -> c*depth = 32768, pool = c*(depth+pp) = 40960 tokens.
    Bytes read per decode step and pool demand are BOTH matched with the sibling cell by
    construction; batch and prompt length differ 2x. Judge on the DECODE-phase JSON row only.
    Verify #running-req reaches 4 in the serve log -- concurrency is an OFFER, and a cell capped
    below its offer measures the pool ceiling rather than concurrency, which would corrupt the
    ratio silently.
args:
  depth: [ 8192 ]
  pp: [ 2048 ]
  tg: [ 256 ]
  concurrency: [ 4 ]
  prefix_caching: true
  runs: 5
