recipe_version: 2
model: ornith-ai/Ornith-1.5-35B-A3B-NVFP4
#revision: 0f0b1b59b879ccde1353e6ebd0fb10c204d4c544
container: lmsysorg/sglang:nightly-dev-20260901-07c8f729 # pinned for stability only
runtime: sglang
cluster_only: false

metadata:
  description: ornith-ai/Ornith-1.5-35B-A3B-NVFP4 Chirp Chirp! [🐦](https://ornith.ai/ornith_1_5.html).
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_url: https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B-NVFP4
  draft_model: jzinno/Ornith-1.5-35B-A3B-DFlash2

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.5
  max_model_len: 262144
  attention_backend: flashinfer
  moe_runner_backend: marlin
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  revision: 52d1adc5f38aa5ebf099c29ed7025ba34cfbb854
  speculative_algorithm: DFLASH
  speculative_draft_snapshot_path: /cache/huggingface/hub/models--jzinno--Ornith-1.5-35B-A3B-DFlash2/snapshots/9b4852c05fd00b672b7434b1bb105bc03c8682b0
  speculative_num_draft_tokens: 10
  speculative_draft_attention_backend: flashinfer
  chunked_prefill_size: 8192
  max_mamba_cache_size: 96
  max_running_requests: 8
  cuda_graph_max_bs: 8
  torch_compile_max_bs: 4
  num_continuous_decode_steps: 2
  mamba_radix_cache_strategy: extra_buffer
  mamba_ssm_dtype: float32
  kv_cache_dtype: fp8_e4m3
#  additional_args: >
#    --json-model-override-args '{"rope_scaling": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 262144}}'

env:
  SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN=1

command: >
  taskset -c 5-9,15-19 sglang serve
  --trust-remote-code
  --model-path {model}
  --host {host}
  --port {port}
  --tp {tensor_parallel}
  --mem-fraction-static {gpu_memory_utilization}
  --context-length {max_model_len}
  --kv-cache-dtype {kv_cache_dtype}
  --tool-call-parser qwen3_coder
  --reasoning-parser qwen3
  --attention-backend {attention_backend}
  --moe-runner-backend {moe_runner_backend}
  --speculative-algorithm {speculative_algorithm}
  --speculative-draft-model-path jzinno/Ornith-1.5-35B-A3B-DFlash2
  --speculative-num-draft-tokens {speculative_num_draft_tokens}
  --speculative-draft-attention-backend {speculative_draft_attention_backend}
  --mamba-radix-cache-strategy {mamba_radix_cache_strategy}
  --mamba-ssm-dtype {mamba_ssm_dtype}
  {additional_args}
#
#

#  --revision 0f0b1b59b879ccde1353e6ebd0fb10c204d4c544
