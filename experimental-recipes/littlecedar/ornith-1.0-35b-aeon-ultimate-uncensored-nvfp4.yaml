recipe_version: "2"
model: AEON-7/Ornith-1.0-35B-AEON-Ultimate-Uncensored-NVFP4
model_url: https://huggingface.co/AEON-7/Ornith-1.0-35B-AEON-Ultimate-Uncensored-NVFP4
runtime: vllm
min_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: AEON-7/Ornith-1.0-35B-AEON-Ultimate-Uncensored-NVFP4
  maintainer: Little Cedar Group <ai@littlecedar.net>
  model_params: 35B
  model_dtype: nvfp4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.3
  max_model_len: 262144
  served_model_name: ornith-35b-uncensored
  tool_call_parser: qwen3_xml
  kv_cache_dtype: auto
  load_format: fastsafetensors
  attention_backend: flashinfer
  reasoning_parser: qwen3
  quantization: compressed-tensors
  max_batched_tokens: 16384
  mamba_cache_dtype: float32
  media_limit_video_count: 2
  media_limit_video_frames: 2
  media_limit_video_width: 1920
  media_limit_video_height: 1080
  media_limit_image_count: 4
  media_limit_image_width: 1920
  media_limit_image_height: 1080
  media_encoder_tp_mode: data
  top_p: 0.95
  top_k: 20
  temperature: 0.6

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"  # memory calc may cause crashes

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --quantization {quantization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --host {host} \
    --port {port} \
    --kv-cache-dtype {kv_cache_dtype} \
    --mamba-cache-dtype {mamba_cache_dtype} \
    --mamba-cache-mode align \
    --max-num-batched-tokens {max_batched_tokens} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-model-len {max_model_len} \
    --reasoning-parser {reasoning_parser} \
    --limit-mm-per-prompt.video.count {media_limit_video_count} \
    --limit-mm-per-prompt.video.num_frames {media_limit_video_frames} \
    --limit-mm-per-prompt.video.width {media_limit_video_width} \
    --limit-mm-per-prompt.video.height {media_limit_video_height} \  
    --limit-mm-per-prompt.image.count {media_limit_image_count} \
    --limit-mm-per-prompt.image.width {media_limit_image_width} \
    --limit-mm-per-prompt.image.height {media_limit_image_height} \
    --mm-encoder-tp-mode {media_encoder_tp_mode} \
    --trust-remote-code \
    -tp {tensor_parallel} \
    --generation-config auto
