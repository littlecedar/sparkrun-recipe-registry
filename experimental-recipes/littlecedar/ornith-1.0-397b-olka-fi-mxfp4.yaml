recipe_version: "2"
model: olka-fi/Ornith-1.0-397B-MXFP4
model_url: https://huggingface.co/olka-fi/Ornith-1.0-397B-MXFP4
runtime: vllm
min_nodes: 4
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: Ornith-1.0-397B-MXFP4
  maintainer: Little Cedar Group <sparkrun@littlecedar.net>
  model_params: 397B
  model_dtype: nvfp4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  served_model_name: olka-fi/Ornith-1.0-397B-MXFP4
  tool_call_parser: qwen3_xml
  load_format: fastsafetensors
  attention_backend: flashinfer
  reasoning_parser: qwen3
  quantization: compressed-tensors
  max_batched_tokens: 16384
  media_encoder_tp_mode: data

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_USE_FLASHINFER_MOE_FP4: "0"
  VLLM_NVFP4_GEMM_BACKEND: marlin

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --quantization {quantization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --host {host} \
    --port {port} \
    --max-num-batched-tokens {max_batched_tokens} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-model-len {max_model_len} \
    --reasoning-parser {reasoning_parser} \
    --mm-encoder-tp-mode {media_encoder_tp_mode} \  
    --trust-remote-code \
    -tp {tensor_parallel}
