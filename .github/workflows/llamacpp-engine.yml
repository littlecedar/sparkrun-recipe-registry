# llama.cpp engine freshness + the arm64 GB10 image build.
#
# Why this exists: every llama.cpp arm in this tree runs a third-party or fork build, and the
# publisher of the stock pin (`scitrera/dgx-spark-llama-cpp`) stopped — its newest tag is still
# `b10549-cu131` (2026-08-21, llama.cpp `b2e5e9b`) while upstream has since absorbed what the forks
# existed for. See attic/explore/AGENTS.md.
#
# report: never fails the run. `.github/scripts/llamacpp-engine-report.py` prints our pinned refs
#         against upstream head (with `behind_by`), upstream releases, and the four source-level
#         feature gates `recipes/explore/Dockerfile.llamacpp-upstream` builds for. Every probe is
#         wrapped: a rate-limited or error-shaped API payload is printed as an `ERROR:` line and the
#         report continues, so an API hiccup cannot mail the owner. Editorially it is a report, not
#         a gate — drift here never turns the run red.
# build:  workflow_dispatch ONLY, on GitHub's own arm64 runner (`ubuntu-24.04-arm`, hosted and free
#         to this public repository) — nothing has to be registered and no repository variable
#         gates the job. Hosted hardware is enough because a GPU is not needed at build time:
#         `nvidia/cuda:13.0.1-devel-ubuntu24.04` carries nvcc, and the sm_121 gate is `cuobjdump`
#         reading the linked binary. The binary links libcuda.so.1 but a build stage never loads
#         it, so the absence of a driver changes nothing. arm64 is still mandatory (the Dockerfile
#         refuses any other architecture and builds sm_121 device code), and a hosted arm64 runner
#         starts with only ~14 GB free on `/` — the CUDA devel stage plus a full llama.cpp compile
#         is tight there, so one step prunes toolchains a Docker build cannot use and fails with a
#         clear error under 20 GB instead of letting `docker build` die mid-link.
name: llamacpp-engine

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp commit to build (40-hex). Required by the build job; the report job ignores it."
        required: false
        type: string

permissions:
  contents: read

jobs:
  report:
    # Report only: no engine is booted, nothing is pushed, and a failed probe is printed as an
    # ERROR line rather than failing the run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refs, releases and upstream feature gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B .github/scripts/llamacpp-engine-report.py

  build:
    # arm64 required (the Dockerfile refuses any other architecture and builds sm_121 device code),
    # but no GPU is needed to build: nvcc compiles and cuobjdump verifies. `ubuntu-24.04-arm` is a
    # GitHub-hosted arm64 runner, so there is no runner to register and no variable to set.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and check headroom
        # Hosted runners start with ~14 GB free on `/`; the CUDA devel stage plus a full llama.cpp
        # CUDA compile exceeds that, and an ENOSPC mid-link reads like a compiler bug. Prune what a
        # Docker build cannot use, then refuse to start under the floor.
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/lib/android-sdk /usr/local/lib/android \
            /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache
          df -h /
          FREE_GB=$(( $(df -B1 --output=avail / | tail -1) / 1073741824 ))
          if [ "$FREE_GB" -lt 20 ]; then
            echo "::error::only ${FREE_GB} GB free on / after pruning; the CUDA devel build stage needs 20 GB"
            exit 1
          fi

      - name: Check ref and credentials
        env:
          LLAMA_REF: ${{ inputs.llama_ref }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          if [ -z "$LLAMA_REF" ]; then
            echo "::error::llama_ref is required for the build job (a 40-hex llama.cpp commit; a tag can move)"
            exit 1
          fi
          if ! printf '%s' "$LLAMA_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::llama_ref must be a full 40-hex commit, got '$LLAMA_REF'"
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::set secrets.DOCKERHUB_USERNAME and secrets.DOCKERHUB_TOKEN on this repository before dispatching the build"
            exit 1
          fi

      - name: Build and push the pinned upstream image
        env:
          LLAMA_REF: ${{ inputs.llama_ref }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          SHORT="${LLAMA_REF:0:7}"
          IMAGE="littlecedar/dgx-spark-llama-cpp:upstream-$SHORT"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker build -f recipes/explore/Dockerfile.llamacpp-upstream \
            --build-arg LLAMA_REF="$LLAMA_REF" -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          {
            echo "## llama.cpp upstream image built"
            echo
            echo "- llama.cpp ref: \`$LLAMA_REF\`"
            echo "- image: \`$IMAGE\`"
            echo "- digest: \`$DIGEST\`"
            echo
            echo "Nothing was committed: a recipe adopting this image is boot-gated by lane policy."
          } >> "$GITHUB_STEP_SUMMARY"
