# Scheduled pin/recipe drift sweep: the report is the signal, and NO run goes red for drift.
#
# Drift is this registry's normal state — a frozen digest or a publisher that stopped is a decision,
# not an outage — so the sweep job always exits 0. Where the daily signal lands, in order:
#   1. the run summary's first line, a stable marker: `pin-drift: <n> rows (<m> accepted) | exit …`
#      (grep it with `grep '^pin-drift:'`);
#   2. the artifact `refresh-sweep` (sweep.md + sweep.json, 90 days), fetched with
#      `gh run download <run-id> --name refresh-sweep`;
#   3. the single open issue labelled `pin-drift`, updated in place — only when the repository has
#      Issues enabled. **This repository does not today** (`has_issues: false`), so the step checks
#      `hasIssuesEnabled`, prints `SKIPPED: repository issues are disabled` and stops. Exit 2 (could
#      not run) is not paged either; it adds the `sweep-broken` label when the tracker is on.
# `exit_code_on_drift: true` on a manual dispatch re-arms the hard failure.
#
# tools/refresh-sweep.py exit-code contract: 0 = clean, 1 = drift found, 2 = could not run
# (network, parse, missing tool).
#
# This workflow never edits recipes unless `apply` is true, and even then it only prints the
# per-arm boot checklist and stops: no commit, no push. Recipe and pin changes stay boot-gated by
# lane policy (AGENTS.md), which a hosted x86 runner cannot satisfy.
name: refresh-sweep

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      exit_code_on_drift:
        description: "Fail this run when the sweep reports drift or could-not-run (off by default: the pin-drift issue is the signal, not a red X)"
        type: boolean
        default: false
      apply:
        description: "Write pin updates into the runner's working tree, print the per-arm boot checklist and stop (no commit, no push)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Without a Hub token the sweep compares pins anonymously, and any repo
      # that answers 401 to an anonymous compare becomes `model-unresolvable`,
      # which the tool escalates to exit 2 ("could not run") and labels
      # `sweep-broken`. Eight pins sat in that class on 2026-10-29.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      APPLY: ${{ inputs.apply }}
      FAIL_ON_DRIFT: ${{ inputs.exit_code_on_drift }}
    steps:
      - uses: actions/checkout@v4

      - name: Sweep (report only)
        id: sweep
        if: env.APPLY != 'true'
        run: |
          set +e
          python3 -B tools/refresh-sweep.py --json sweep.json --markdown sweep.md --exit-code \
            --accept-file tools/refresh-sweep-accepted.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "sweep exit code: $code (0 clean, 1 drift, 2 could not run) — reported, not fatal"
          exit 0

      - name: Sweep and apply pin updates locally
        id: sweep_apply
        if: env.APPLY == 'true'
        run: |
          set +e
          python3 -B tools/refresh-sweep.py --json sweep.json --markdown sweep.md --exit-code --apply \
            --accept-file tools/refresh-sweep-accepted.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "sweep --apply exit code: $code (0 clean, 1 drift, 2 could not run)"
          exit 0

      - name: Run summary (counts and drift table)
        if: always()
        run: |
          code="${{ steps.sweep.outputs.code }}"
          [ -n "$code" ] || code="${{ steps.sweep_apply.outputs.code }}"
          case "$code" in
            0) verdict="clean" ;;
            1) verdict="drift reported (the pin-drift issue opens only when the tracker is enabled)" ;;
            2) verdict="the sweep could not run (labelled sweep-broken when the tracker is enabled)" ;;
            *) verdict="the sweep produced no exit code" ;;
          esac
          marker=$(python3 -B .github/scripts/sweep-marker.py sweep.json)
          echo "$marker"      # stdout too, so `gh run view <id> --log` shows the marker
          {
            echo "$marker"
            echo
            echo "## refresh-sweep"
            echo
            echo "Exit code \`$code\`: $verdict."
            echo
            echo "Delivery: \`$marker\` is the stable line (\`grep '^pin-drift:'\`); the full report "
            echo "is this summary and the artifact \`refresh-sweep\` (sweep.md + sweep.json, 90 days)."
            echo
            if [ -f sweep.md ]; then cat sweep.md; else echo "_no markdown report was produced_"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-sweep
          path: |
            sweep.json
            sweep.md
          retention-days: 90
          if-no-files-found: warn

      - name: Per-arm boot checklist (apply mode stops here)
        if: env.APPLY == 'true'
        run: |
          echo "## apply: what changed is now uncommitted in the runner's tree — and that is all"
          echo
          if [ -f sweep.md ]; then cat sweep.md; else echo "(no report produced)"; fi
          echo
          echo "### Per-arm boot checklist — run on the cluster, not here"
          arms=$(grep -oE 'recipes/[A-Za-z0-9_./-]+\.yaml' sweep.md 2>/dev/null | sort -u)
          if [ -z "$arms" ]; then echo "(no arm named in the report)"; fi
          for arm in $arms; do
            echo "- arm: $arm"
            echo "    HOME=\$PWD/.local/sparkrun-home sparkrun recipe validate $arm"
            echo "    HOME=\$PWD/.local/sparkrun-home sparkrun run $arm -H <free-node> -n   # render first"
            echo "    then boot-test on that node, measure per lane policy, record the receipt"
            echo "    then commit the pin with an explicit pathspec — CI does not commit for you"
          done

      - name: Open or update the pin-drift issue
        if: env.APPLY != 'true' && steps.sweep.outputs.code != '0'
        run: |
          set -e
          code="${{ steps.sweep.outputs.code }}"
          case "$code" in
            1) title="Pin drift found by refresh-sweep" ;;
            2) title="Refresh sweep could not run" ;;
            *) echo "unexpected exit code $code"; exit 1 ;;
          esac
          # This repository ships with Issues disabled, and `gh issue create` then fails the job even
          # though the sweep itself succeeded. The run summary is the fallback signal; never red.
          if [ "$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]; then
            echo "SKIPPED: repository issues are disabled — the report is in this run's summary (enable the tracker with: gh api -X PATCH repos/$GITHUB_REPOSITORY -f has_issues=true)"
            exit 0
          fi
          gh label create pin-drift --description "Refresh sweep: pinned refs drifted from upstream" \
            --color B60205 --force >/dev/null 2>&1 || true
          gh label create sweep-broken --description "Refresh sweep exited 2: it could not run" \
            --color 5319E7 --force >/dev/null 2>&1 || true
          {
            echo "Sweep exit code: \`$code\` (0 clean, 1 drift, 2 could not run)"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -f sweep.md ]; then cat sweep.md; else echo "_no markdown report was produced_"; fi
          } > issue-body.md
          number=$(gh issue list --label pin-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file issue-body.md
            echo "updated issue #$number: $title"
          else
            gh issue create --title "$title" --body-file issue-body.md --label pin-drift
            number=$(gh issue list --label pin-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          fi
          # The label is the page: a broken sweep stands out in the issue list, not in an inbox.
          if [ "$code" = "2" ]; then
            gh issue edit "$number" --add-label sweep-broken
          else
            gh issue edit "$number" --remove-label sweep-broken 2>/dev/null || true
          fi

      - name: Fail on drift (opt-in only)
        if: env.APPLY != 'true' && env.FAIL_ON_DRIFT == 'true' && steps.sweep.outputs.code != '0'
        run: |
          echo "::error::refresh-sweep exited ${{ steps.sweep.outputs.code }} (1 = drift, 2 = could not run); see the pin-drift issue"
          exit 1
