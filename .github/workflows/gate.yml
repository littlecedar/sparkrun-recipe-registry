# The repository gate (AGENTS.md §Development Commands), on push to main, on every PR, and
# manually (`workflow_dispatch`, so a fix can be proved with `gh workflow run gate.yml`).
#
# x86 only, on purpose: GitHub-hosted ubuntu-latest does text validation and the stdlib suite.
# Nothing here boots an engine, pulls a model, or builds an arm64 image — the GB10 (sm_121) build
# lives in llamacpp-engine.yml and runs on GitHub's own arm64 runner (`ubuntu-24.04-arm`), never
# here: it is a separate, dispatch-only job and nothing in it boots an engine either.
# CI never bumps a model pin: a pin change stays boot-gated by lane policy.
#
# Which checks cannot run here, and how they degrade (each prints a `SKIPPED:` line):
#   * `uv sync` — netifaces has no wheel and builds from its sdist, so the runner needs a C
#     toolchain and Python headers. If that build fails anyway, the sync step is allowed to fail
#     and the suite/py_compile run on the runner's own python3: the suite is stdlib-only, so this
#     is a substitution, not a gap.
#   * `sparkrun recipe validate` — sparkrun is not a PyPI-guaranteed package here.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # `runner` is NOT a legal context in a job-level env — using it made this workflow fail to
      # compile (seven runs, zero jobs, no check-run) before it ever reached a step. `github` is
      # legal, and every sparkrun call needs the override because ~/.config/sparkrun is absent in CI.
      SPARKRUN_HOME: ${{ github.workspace }}/.local/sparkrun-home
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: uv sync
        id: sync
        # Tolerated, not required: the next steps pick a fallback interpreter when this fails.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev
          uv sync --frozen

      - name: Suite (stdlib unittest)
        if: steps.sync.outcome == 'success'
        run: uv run python -B -m unittest discover -s tests

      - name: Suite on the runner's python3
        if: steps.sync.outcome != 'success'
        run: |
          echo "SKIPPED: uv sync (netifaces sdist / toolchain) — running the stdlib suite on the runner's python3 instead"
          python3 -B -m unittest discover -s tests

      - name: Validate recipes (degrades honestly)
        # sparkrun is not a guaranteed PyPI package here. Attempt to install it; if that fails,
        # say so and do not fail the job — a skipped check must be visible, not silently green.
        run: |
          set -e
          mkdir -p "$SPARKRUN_HOME"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v sparkrun >/dev/null 2>&1; then
            uv tool install sparkrun >/dev/null 2>&1 \
              || python3 -m pip install --user sparkrun >/dev/null 2>&1 \
              || true
            export PATH="$HOME/.local/bin:$PATH"
          fi
          if ! command -v sparkrun >/dev/null 2>&1; then
            echo "SKIPPED: sparkrun not installable in CI"
            exit 0
          fi
          sparkrun --version
          for f in recipes/*/*.yaml; do
            HOME="$SPARKRUN_HOME" sparkrun recipe validate "$f" >/dev/null
          done
          echo "plain validate passed for every recipes/*/*.yaml"

      - name: bash -n over every mod script
        run: |
          set -e
          for s in mods/*/*.sh recipes/*/mods/*/*.sh; do bash -n "$s"; done

      - name: py_compile over tools, plugins and mod Python
        run: |
          set -e
          PY="python3"
          if [ "${{ steps.sync.outcome }}" = "success" ]; then PY="uv run python"; fi
          for p in mods/*/*.py recipes/*/mods/*/*.py tools/*.py plugins/*.py; do
            $PY -m py_compile "$p"
          done

      - name: Clean up __pycache__
        # py_compile leaves __pycache__; the suite's child processes may recreate it under -B.
        run: find mods recipes tools tests plugins -name __pycache__ -type d -exec rm -rf {} +
